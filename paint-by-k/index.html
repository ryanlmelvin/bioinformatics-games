<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paint by k</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1f2328; --muted:#6b7078; --line:#d9d4c7;
  --accent:#c2410c; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b4541a; --chip:#e3f0f3;
  /* the shop is an illustration: one palette in both themes */
  --paper:#fbf8f1; --paper-edge:#d8cfbb; --wood:#8a5a32; --wood2:#c08a55; --steel:#5d6670; --gold:#f2a900;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --muted:#9aa0a8; --line:#343a42;
    --accent:#ff9b5e; --accent-ink:#2b1200; --good:#6fcf97; --warn:#f0a36b; --chip:#1d3a44;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:40px;height:40px}
h1 a{color:inherit;text-decoration:none}
.count{font-size:.9rem;color:var(--muted);margin-left:auto}
.count b{color:var(--ink)}
h2{font-size:1.1rem;margin:18px 0 4px}
h3{font-size:1rem;margin:10px 0 4px}
p{margin:4px 0 12px}
.mono,svg text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.advance{display:block;width:fit-content;max-width:100%;min-height:44px;margin-top:14px;padding:10px 18px;text-align:left}
a{color:var(--accent)}
input[type=number]{font:inherit;width:4.6em;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input.ok{border-color:var(--good);background:#e4f4ea;color:#14532d}
input.bad{border-color:var(--warn)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pips button{width:32px;height:32px;padding:0;border-radius:50%}
.pips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vocabhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;position:relative}
.badge{font-size:.8rem;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:2px 10px}
.badge.got{border:1px solid var(--good);color:var(--good);font-weight:600}
.term{cursor:help;position:relative}
span.term:not(.badge){border-bottom:1px dotted currentColor;font-weight:600}
.tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(360px,84vw);padding:9px 11px;border-radius:8px;
  background:var(--ink);color:var(--bg);font:400 .82rem/1.45 system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px;color:inherit}
.term:hover>.tip,.term:focus>.tip{display:block}
.badges .term{position:static}
.rule{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);margin-bottom:8px}
.stage{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.fig{flex:1 1 200px;min-width:0;max-width:320px}
.fig.map{flex:1 1 260px;max-width:360px}
.fig svg{width:100%;height:auto;display:block;touch-action:manipulation}
.cap{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 3px}
.hoverinfo{font-size:.85rem;color:var(--muted);min-height:1.4em;margin-top:6px}
.meter{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0 0;font-weight:600}
.gauge{flex:1 1 220px;max-width:420px;color:var(--ink)}
.gauge svg{width:100%;height:auto;display:block}
.status{min-height:1.6em;margin:10px 2px 0;font-weight:500}
.status.warn{color:var(--warn)} .status.good{color:var(--good)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#go:not([hidden]) + .controls{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.work{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.work table{border-collapse:collapse;font-size:.92rem}
.work td,.work th{padding:3px 7px;text-align:center;border-bottom:1px solid var(--line)}
.work th{font-weight:600;color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto;max-width:100%}
.swatch{display:inline-block;width:1.1em;height:1.1em;border-radius:3px;vertical-align:-3px;border:1px solid rgba(0,0,0,.25)}
.rowbtns{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
.rowbtns button{height:44px;padding:0;border-radius:4px;border:1px solid #8b8475;min-width:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* cards */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.gcard{padding:4px 4px 2px;border:2px solid var(--paper-edge);border-radius:8px;background:var(--paper);cursor:pointer;color:#2a2416;text-align:left}
.gcard svg{width:100%;height:auto;display:block}
.gcard .nm{font-size:.75rem;font-weight:700;color:#5b5240}
.gcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.gcard.ctr{border-style:double;border-width:4px}
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.pile{border:2px dashed var(--line);border-radius:10px;padding:6px;min-height:90px;background:transparent;text-align:left;cursor:pointer}
.pile h4{margin:0 0 4px;font-size:.85rem}
.pile .deck{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.matrix button{min-width:2.6em;padding:3px 6px;font-family:ui-monospace,Menlo,monospace}
.matrix button.min{outline:3px solid var(--gold)}
.matrix th{font-family:ui-monospace,Menlo,monospace}
/* reveals, sources, field guide */
.reveal{border:1px solid var(--good);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel)}
.reveal h3{margin:0 0 8px;font-size:1.05rem}
.called{margin:10px 0 4px;padding-left:12px;border-left:3px solid var(--good)}
.called p{margin:0}
.src{margin:4px 0 10px 15px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:.9rem}
.src .tag{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.src a{font-weight:600}
.illus{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:0 6px;margin-left:6px}
.guide{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
.guide summary{cursor:pointer;font-weight:600}
.gentry{padding:8px 0;border-top:1px solid var(--line)}
.gentry h4{margin:0;font-size:1rem}
.gentry p{margin:2px 0;font-size:.92rem}
.gmeta{color:var(--muted);font-size:.9rem}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
footer input{font:inherit;width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
/* artwork */
.px{shape-rendering:crispEdges}
.px.hand{cursor:pointer}
.sheet{fill:var(--paper);stroke:var(--paper-edge);stroke-width:2}
.pin{fill:#b83a4b;stroke:#6e1f2a;stroke-width:.8}
.grid{stroke:#e6e0d2;stroke-width:1}
.axis{stroke:#8b8475;stroke-width:1.4}
.axl{font-size:10px;fill:#6b6455}
.dot{stroke:#2a2416;stroke-width:.8;cursor:pointer}
.spot{fill:transparent;cursor:crosshair}
.spot:hover{fill:rgba(0,0,0,.06)}
.pot{cursor:pointer}
.pot .can{fill:#c9ced4;stroke:#3d444c;stroke-width:1.2}
.pot .band{fill:#9aa3ad}
.pot .lid{stroke:#3d444c;stroke-width:1.2}
.pot .num{font-size:10px;font-weight:700;fill:#1f2328;text-anchor:middle}
.pot.sel .can{stroke:var(--accent);stroke-width:2.6}
.pot.locked{cursor:default}
.ruler{stroke:#2a2416;stroke-width:2.2;stroke-dasharray:5 3}
.ruler.best{stroke:#2e7d4f;stroke-width:3;stroke-dasharray:none}
.rlab{font-size:11px;font-weight:700;fill:#2a2416;paint-order:stroke;stroke:#fbf8f1;stroke-width:4px;text-anchor:middle}
.worst{fill:none;stroke:var(--gold);stroke-width:3;animation:glow 1.1s ease-in-out infinite}
.mark{fill:none;stroke:#1f2328;stroke-width:2}
.stripbox{fill:none;stroke:#1f2328;stroke-width:2;stroke-dasharray:4 3}
.curpx{fill:none;stroke:var(--accent);stroke-width:3}
@keyframes glow{50%{stroke-opacity:.2}}
.try{fill:none;stroke:#6b6455;stroke-width:1.2;stroke-dasharray:2 2}
.tlab{font-size:9px;fill:#6b6455}
.cline{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart-axis{stroke:#cfc6b0;stroke-width:1}
.press{animation:press .5s ease-out}
@keyframes press{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){
  .fig,.fig.map{flex:1 1 100%;max-width:none}
  .row.two .fig{flex:1 1 calc(50% - 7px)}
  .row.two .fig.map{flex:1 1 100%}
  .row.two .fig.act{flex:1 1 100%}
  .deck{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .piles{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#guide){display:none!important}
  .guide{border:0;padding:0;margin:0}
  .guide summary,#printGuide{display:none}
}
.pips button.fin{position:relative;border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.pips button.fin::after{content:'✓';position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--good);color:var(--bg);font-size:10px;line-height:14px;font-weight:700;text-align:center}
.linknote{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0 0;padding:8px 12px;border:1px solid var(--good);border-radius:8px;background:var(--panel);font-size:.92rem}
.savebar{margin-top:26px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.92rem}
.savebar p{margin:0 0 8px}
.savebar .saverow{display:flex;flex-wrap:wrap;gap:8px}
.savebar input{flex:1 1 16em;min-width:0;font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.savebar .savenote{margin:8px 0 0;color:var(--muted)}
.savebar .savenote:empty{display:none}
.linknote[hidden]{display:none}
@media print{.savebar,.linknote{display:none}}

<script id="engine">
/* Pure puzzle logic: no DOM. Every puzzle is a function of (puzzle code, level). */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(n,rand){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const clampInk=x=>Math.max(0,Math.min(10,x));

/* ---------- geometry of points in any number of dimensions ---------- */
function dist2(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return s;}
function dist(a,b){return Math.sqrt(dist2(a,b));}
/* index of the nearest center; ties go to the lowest index */
function nearest(p,centers){let best=0,bd=Infinity;centers.forEach((c,j)=>{const d=dist2(p,c);if(d<bd-1e-12){bd=d;best=j;}});return best;}
function assign(data,centers){return data.map(p=>nearest(p,centers));}
function maxDistance(data,centers){let m=0;data.forEach(p=>{m=Math.max(m,dist(p,centers[nearest(p,centers)]));});return m;}
function worstIndex(data,centers){let w=0,m=-1;data.forEach((p,i)=>{const d=dist2(p,centers[nearest(p,centers)]);if(d>m+1e-12){m=d;w=i;}});return w;}
/* Squared error distortion: the mean squared distance from each point to its nearest center. */
function distortion(data,centers){let s=0;data.forEach(p=>{s+=dist2(p,centers[nearest(p,centers)]);});return s/data.length;}
/* The same mean, but with each point charged to the center it is assigned to (between Lloyd's half-steps). */
function labelError(data,centers,labels){let s=0;data.forEach((p,i)=>{s+=dist2(p,centers[labels[i]]);});return s/data.length;}
function centroid(points){const m=points[0].length,c=Array(m).fill(0);points.forEach(p=>{for(let i=0;i<m;i++)c[i]+=p[i];});return c.map(x=>x/points.length);}
/* Farthest-first traversal (Gonzalez 1985): start from data[first]; each new center is the point farthest from all centers so far. */
function farthestFirst(data,k,first){
  const idx=[first||0];
  while(idx.length<k){const cs=idx.map(i=>data[i]);idx.push(worstIndex(data,cs));}
  return {idx,centers:idx.map(i=>data[i].slice())};
}
/* One Lloyd half-step each way. A center with no points stays where it is. */
function moveCenters(data,centers,labels){
  return centers.map((c,j)=>{const mine=data.filter((_,i)=>labels[i]===j);return mine.length?centroid(mine):c.slice();});
}
/* The Lloyd algorithm (Lloyd 1982). Returns every half-step so a screen or a test can replay it.
   A round = repaint (assign) then re-average (move). It has converged when a repaint changes nothing. */
function lloyd(data,start,maxRounds){
  maxRounds=maxRounds||100;
  let centers=start.map(c=>c.slice()),labels=null;const steps=[];let rounds=0;
  while(rounds<maxRounds){
    const nl=assign(data,centers);
    const changed=!labels||nl.some((l,i)=>l!==labels[i]);
    if(!changed){steps.push({kind:'assign',labels:nl,centers,err:labelError(data,centers,nl),changed:false});break;}
    labels=nl;steps.push({kind:'assign',labels,centers,err:labelError(data,centers,labels),changed:true});
    centers=moveCenters(data,centers,labels);
    steps.push({kind:'move',labels,centers,err:labelError(data,centers,labels),changed:true});
    rounds++;
  }
  return {centers,labels,steps,rounds,err:labelError(data,centers,labels)};
}
/* Hierarchical clustering with the average distance between groups, D_avg.
   Hollow Mountain (the tree unit) builds UPGMA the same way; this is its own copy of that merge-the-closest loop,
   because each game is one self-contained file. Returns merges in order: {a,b (member lists), d, members}. */
function groupDist(D,A,B){let s=0;A.forEach(i=>B.forEach(j=>{s+=D[i][j];}));return s/(A.length*B.length);}
function hierarchical(D){
  let groups=D.map((_,i)=>[i]);const merges=[];
  while(groups.length>1){
    let bi=0,bj=1,bd=Infinity,second=Infinity;
    for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
      const d=groupDist(D,groups[i],groups[j]);
      if(d<bd-1e-9){second=bd;bd=d;bi=i;bj=j;}else if(d<second)second=d;
    }
    const merged=groups[bi].concat(groups[bj]);
    merges.push({a:groups[bi],b:groups[bj],d:bd,gap:second-bd,members:merged});
    groups=groups.filter((_,i)=>i!==bi&&i!==bj).concat([merged]);
  }
  return merges;
}
/* Cut the tree of merges to leave k groups. */
function cutTree(n,merges,k){let groups=Array.from({length:n},(_,i)=>[i]);for(const m of merges.slice(0,n-k)){groups=groups.filter(g=>!m.members.includes(g[0]));groups.push(m.members.slice());}return groups;}

/* ---------- the ink of a pixel, as a screen colour ----------
   Red ink absorbs green and blue light; blue ink absorbs red and green. Paper is white. */
function inkRGB(r,b){
  const c=x=>Math.max(18,Math.min(255,Math.round(x)));
  return 'rgb('+c(255-19*b-2*r)+','+c(255-21*r-18*b)+','+c(255-19*r-3*b)+')';
}

/* ---------- pictures: designed 12 x 12 pixel art, three ink regions, seeded jitter ---------- */
const PICTURES={
  tulip:{name:'tulip',base:{a:[8,1],b:[6,6],c:[1,1]},rows:[
    'cccccccccccc','ccccaccacccc','cccaacaaaccc','cccaaaaaaccc','cccaaaaaaccc','ccccaaaacccc',
    'cccccbbccccc','ccbccbbccccc','ccbbcbbccbcc','cccbbbbcbbcc','cccccbbbbccc','cccccbbccccc']},
  fish:{name:'fish',base:{a:[9,1],b:[6,7],c:[1,5]},rows:[
    'cccccccccccc','cccccccccccc','ccccbbbccccc','cccaaaaaccbc','ccaaaaaaacbb','caacaaaaabbb',
    'caaaaaaaabbb','ccaaaaaaacbb','cccaaaaaccbc','ccccbbcccccc','cccccccccccc','cccccccccccc']},
  mushroom:{name:'mushroom',base:{a:[9,1],b:[1,1],c:[2,8]},stray:[1,10],strayInk:[10,10],rows:[
    'cccccccccccc','ccccaaaacccc','ccaaaaaaaacc','caaaaaaaaaac','caaaaaaaaaac','cccbbbbbbccc',
    'ccccbbbbcccc','ccccbbbbcccc','ccccbbbbcccc','ccccbbbbcccc','cccbbbbbbccc','cccccccccccc']},
  heart:{name:'heart',base:{a:[8,2],b:[1,1],c:[2,7]},rows:[
    'cccccccccccc','ccaaccccaacc','caaaaccaaaac','aabaaaaaaaaa','abbaaaaaaaaa','aabaaaaaaaaa',
    'caaaaaaaaaac','ccaaaaaaaacc','cccaaaaaaccc','ccccaaaacccc','cccccaaccccc','cccccccccccc']},

function makePicture(key,name){
  const P=PICTURES[name],rand=rng(hashStr(key+'|pic|'+name)),W=12,H=12,px=[],region=[];
  const j=()=>rand()<.5?0:rand()<.5?-1:1;   // half the inks are exact, the rest one unit off

    const r=P.rows[y][x];region.push(r);const b=P.base[r];

  if(P.stray){const i=P.stray[0]*W+P.stray[1];px[i]=P.strayInk.slice();region[i]='x';}

/* Nudge the jitter of the listed pixels, one unit at a time and never beyond base +- 1 or 0..10,

function fixMean(pic,ids){

    const n=ids.length,s=ids.reduce((t,i)=>t+pic.px[i][ch],0);
    let diff=Math.round(s/n)*n-s;

      if(!diff)break;

      if(nv>=0&&nv<=10&&Math.abs(nv-base)<=1){pic.px[i][ch]=nv;diff-=step;}

const GEN={};
/* Level 1 and 8: twelve cards, four of each of three patterns, two of them hybrids of two patterns. */
GEN.cards=function(key){

    const rand=rng(hashStr(key+'|cards|'+t)),cards=[];
    names.forEach((nm,g)=>{for(let i=0;i<4;i++)cards.push({v:noisy(PATTERNS[nm],rand),group:g,hybrid:null});});
    // two hybrids: the last card of two groups is pulled halfway toward another pattern
    [[0,2],[1,2]].forEach(([g,h])=>{const c=cards[g*4+3];const mix=PATTERNS[names[g]].map((v,i)=>Math.round((v+PATTERNS[names[h]][i])/2));c.v=noisy(mix,rand);c.hybrid=h;});

    const pileOf=g=>new Set(deck.map((c,i)=>c.group===g&&c.hybrid===null?L.labels[i]:-1).filter(x=>x>=0));
    const piles=[0,1,2].map(pileOf);

    if(hand.some(i=>{const d=C.map(c=>dist2(data[i],c)).sort((a,b)=>a-b);return d[1]-d[0]<3;}))continue;

/* The second sorting shown in level 1: the given piles with each hybrid moved to the pile of its other parent. */
function otherSorting(deck,piles){
  const p=piles.slice();
  deck.forEach((c,i)=>{
    if(c.hybrid===null)return;
    const votes=[0,0,0];deck.forEach((d,j)=>{if(d.group===c.hybrid&&d.hybrid===null&&p[j]!=null)votes[p[j]]++;});

  const pic=makePicture(key,'tulip'),pots=['a','b','c'].map(r=>pic.base[r].slice());

  const rand=rng(hashStr(key+'|pots2'));pots.forEach(p=>{p[0]=clampInk(p[0]+(rand()<.5?1:-1));});

/* Level 3: fish. Pots are mixed to match pixels; the first is pixel 0. */
GEN[3]=function(key){

    // decoy 1: the three commonest inks; decoy 2: the first pot and two pixels chosen at random
    const cnt={};D.forEach(p=>{const s=p.join(',');cnt[s]=(cnt[s]||0)+1;});
    const common=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||(a<b?-1:1)).slice(0,3).map(s=>s.split(',').map(Number));
    const rand=rng(hashStr(key+'|decoy|'+t));let r1,r2;do{r1=1+Math.floor(rand()*143);r2=1+Math.floor(rand()*143);}while(r1===r2);
    const decoys=[{name:'the three commonest inks',centers:common},{name:'the first pot and two pixels picked at random',centers:[D[0],D[r1],D[r2]]}];
    decoys.forEach(d=>d.max=maxDistance(D,d.centers));

/* Level 4: mushroom with one stray pixel. */
GEN[4]=function(key){
  for(let t=0;t<200;t++){
    const pic=makePicture(key+'|'+t,'mushroom'),D=pic.px,ff=farthestFirst(D,3,0);

/* Level 5: heart. The red region's average and the four-pixel highlight's average are whole numbers. */
GEN[5]=function(key){

/* Level 6: sailboat, scripted start. */

    const wall=pic.base.b,bad=[[roof[0],roof[1]],[roof[0]-1,roof[1]+Math.floor(rand()*2)],[sky[0],Math.round((sky[1]+wall[1])/2)+Math.floor(rand()*2)]];

/* Level 9: eight cards, a whole-number distance matrix, no tied merge. */
GEN[9]=function(key){
  for(let t=0;t<2000;t++){

GEN[10]=function(key){

    const rand=rng(hashStr(key+'|shift|'+t)),genes=[];
    ['on','off','flat'].forEach((nm,g)=>{for(let i=0;i<8;i++)genes.push({v:noisy(PATTERNS[nm],rand),group:g});});

function parsePoints(text){
  return text.split(/\n/).map(l=>l.trim()).filter(l=>l&&!/^-+$/.test(l)).map(l=>l.split(/[\s,]+/).filter(Boolean).map(Number)).filter(p=>p.length&&p.every(Number.isFinite));

/* ---------- saved state ---------- */
const params=new URLSearchParams(location.search),urlSeed=params.get('seed');
const requestedLevel=Number(params.get('level'));
const previewLevel=Number.isInteger(requestedLevel)&&requestedLevel>=1&&requestedLevel<=LEVELS.length?requestedLevel:0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(){if(previewLevel)return;if(S&&S.done)S.link=encodeProgress(S);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}writeLink();}
function freshState(seed){return {seed,unlocked:1,done:[],badges:[],earnedAt:{},variants:{},piles1:null,log:[]};}
function randomCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
/* ---------- progress link ----------
   Every level is open; only the vocabulary is earned. The progress link is this page's address plus
   #save=1.<terms>.<levels>.<check>.<puzzle code>; opening it restores the earned terms and finished levels in any browser.
   The page's own address stays clean, so that sharing the address of the game never hands over someone's progress.
   <terms> has one character per VOCAB entry, in VOCAB order: 0 for not earned, otherwise the level it was earned in (base 36).
   <levels> has one 0 or 1 per level. Old links depend on those orders: add new terms and levels at the end. */
const TRANSIENT=!!(previewLevel||params.get('bench'));
function linkCheck(body){const s=KEY+'|'+body;let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function encodeProgress(st){
  const body='1.'+VOCAB.map(v=>st.badges.includes(v.id)?Math.min(35,Math.max(1,st.earnedAt[v.id]|0)).toString(36):'0').join('')+
    '.'+LEVELS.map(l=>st.done.includes(l.id)?'1':'0').join('');
  return body+'.'+linkCheck(body+'.'+st.seed)+'.'+encodeURIComponent(st.seed);
}
function decodeProgress(text){
  const m=/^1\.([0-9a-z]+)\.([01]+)\.([0-9a-z]+)\.(.+)$/.exec(text||'');
  if(!m||m[1].length>VOCAB.length||m[2].length>LEVELS.length)return null;
  let seed;try{seed=decodeURIComponent(m[4]);}catch(e){return null;}
  if(linkCheck('1.'+m[1]+'.'+m[2]+'.'+seed)!==m[3])return null;
  const earnedAt={},done=[];
  for(let i=0;i<m[1].length;i++){const l=parseInt(m[1][i],36);if(l>LEVELS.length)return null;if(l)earnedAt[VOCAB[i].id]=l;}
  for(let i=0;i<m[2].length;i++)if(m[2][i]==='1')done.push(LEVELS[i].id);
  return {seed,earnedAt,done};
}
/* saves from before every level was open have no list of finished levels: rebuild it */
function withDone(st){
  if(!Array.isArray(st.badges))st.badges=[];
  if(!st.earnedAt)st.earnedAt={};
  if(!Array.isArray(st.log))st.log=[];
  if(!Array.isArray(st.done)){
    st.done=[];
    for(let i=1;i<(st.unlocked||1)&&i<=LEVELS.length;i++)st.done.push(i);
    st.log.forEach(e=>{if(e&&e.ev==='complete'&&e.lvl>=1&&e.lvl<=LEVELS.length&&!st.done.includes(e.lvl))st.done.push(e.lvl);});
    st.done.sort((a,b)=>a-b);
  }
  return st;
}
/* add a link's terms and levels to a save; nothing is ever taken away */
function absorb(st,p){
  const terms=[],levels=[];
  VOCAB.forEach(v=>{if(p.earnedAt[v.id]&&!st.badges.includes(v.id)){st.badges.push(v.id);st.earnedAt[v.id]=p.earnedAt[v.id];terms.push(v.id);}});
  p.done.forEach(id=>{if(!st.done.includes(id)){st.done.push(id);levels.push(id);}});
  st.done.sort((a,b)=>a-b);
  if(st.done.length)st.unlocked=Math.max(st.unlocked||1,Math.min(LEVELS.length,st.done[st.done.length-1]+1));
  return {terms,levels};
}
function markDone(){if(!S.done.includes(cur.L.id)){S.done.push(cur.L.id);S.done.sort((a,b)=>a-b);}}
/* The last level names any term an earlier level failed to name, but only for a student who has finished every other level:
   with all levels open, the finale must not hand out the vocabulary on its own. */
function sweepTerms(){return LEVELS.every(l=>l.id===cur.L.id||S.done.includes(l.id))?VOCAB.map(v=>v.id):[];}
const linkText=TRANSIENT?'':((String(location.hash||'').match(/^#save=(.+)$/)||[])[1]||'');
let linkNote='',lastLink=null,linkLive=false;
function progressLink(){
  const q=new URLSearchParams(location.search);q.delete('seed');const qs=q.toString();
  return location.pathname+(qs?'?'+qs:'')+'#save='+encodeProgress(S);
}
function writeLink(){
  if(TRANSIENT||!S||!S.done)return;
  const rel=progressLink();if(rel===lastLink)return;lastLink=rel;
  const box=$('#saveLink');if(box)box.value=(location.origin||'')+rel;
  if(linkLive)topNote('Your progress link has changed. Copy it again before you leave.',true);
}
function topNote(text,withButton){$('#linkNoteText').textContent=text;$('#copyLinkTop').hidden=!withButton;$('#linkNote').hidden=false;}
/* where to pick up: the first level not yet finished */
function resumeLevel(){const l=LEVELS.find(l=>!S.done.includes(l.id));return l?l.id:LEVELS.length;}
function useLink(){
  if(TRANSIENT||!linkText)return;
  const p=decodeProgress(linkText);
  if(!p){linkNote='That progress link is incomplete or was altered, so nothing was restored. Copy the whole link and open it again.';return;}
  if(p.seed!==S.seed){
    const mine=S.badges.length+S.done.length;
    if(!mine||typeof confirm!=='function'||confirm('This link carries progress for puzzle code '+p.seed+' ('+Object.keys(p.earnedAt).length+' terms).\n\nThis browser already has progress for puzzle code '+S.seed+' ('+S.badges.length+' terms).\n\nOK: switch to the link. This browser’s progress for '+S.seed+' is replaced.\nCancel: keep this browser’s progress.'))S=withDone(freshState(p.seed));
    else{linkNote='Kept the progress saved in this browser (puzzle code '+S.seed+'). The link you opened was for puzzle code '+p.seed+'.';return;}
  }
  const got=absorb(S,p);
  if(got.terms.length||got.levels.length){
    S.log.push({t:Date.now(),lvl:0,variant:0,ev:'restore',terms:got.terms,levels:got.levels});
    linkNote='Restored from your progress link: '+got.terms.length+' vocabulary term'+(got.terms.length===1?'':'s')+' and '+got.levels.length+' finished level'+(got.levels.length===1?'':'s')+'.';
  }
}
let S=previewLevel?freshState(urlSeed||randomCode()):load();
if(urlSeed&&urlSeed!==S.seed)S=freshState(urlSeed);
if(!S.seed)S=freshState(randomCode());
withDone(S);
useLink();
save();

 act:{

/* ===== level 2: the ruler ===== */

/* ===== level 3: the worst pixel ===== */
function worstView(c,extra){
 const st=c.st,pic=c.pic,P=pic.px,w=worstIndex(P,st.pots),wp=P[w],j=nearest(wp,st.pots),m=maxDistance(P,st.pots);
 return trio(sheetSvg(pic,own(pic),{act:'mix',worst:w}),sheetSvg(pic,printFill(st),{worst:w,label:'the print'}),
  mapSvg({points:P,pots:potsOf(st),potAct:'pour',dotAct:'mixink',worst:wp,rulers:[{a:wp,b:st.pots[j]}]}))+
  '<div class="meter">'+gaugeSvg('Worst pixel, distance to its nearest pot',m,12,extra.mark,extra.mark!=null&&m<=extra.mark+1e-9)+'</div>';
}
function mixAt(i,onlyWorst){
 const st=cur.st,P=cur.pic.px;i=+i;
 if(st.pots.length>=cur.k){say('All '+cur.k+' pots are mixed. Click a pot on the map to pour it out.','warn');return false;}
 const w=worstIndex(P,st.pots);
 if(onlyWorst&&dist2(P[i],P[w])>0){say('The meter is pointing at the ringed pixel.','warn');return false;}
 st.picks.push({px:i,wasWorst:dist2(P[i],P[w])===0});st.pots.push(P[i].slice());liveLab();log('mix',{px:i,ink:P[i],wasWorst:dist2(P[i],P[w])===0});return true;
}
MODES.worst={
 init(c){c.inst=makeLevel(lseed(3),3);c.pic=c.inst.pic;c.k=3;c.st={pots:[c.pic.px[0].slice()],locked:[0],picks:[]};liveLab();
  say('Click a pixel to mix pot 2 to match it.');},
 rule:()=>'Every pixel is printed from its nearest pot · a pot matches a pixel',
 stage:c=>worstView(c,{mark:c.inst.best}),
 act:{
  mix(i){if(!mixAt(i))return;MODES.worst.settle();},
  mixink(k){const P=cur.pic.px,i=P.findIndex(p=>p.join(',')===k);if(i>=0)MODES.worst.act.mix(i);},
  pour(j){j=+j;const st=cur.st;if(j===0){say('Pot 1 stays.','warn');return;}st.pots.splice(j,1);liveLab();log('pour',{pot:j});say('Poured out. '+plural(cur.k-st.pots.length,'pot')+' to mix.');}
 },
 settle(){
  const st=cur.st,m=maxDistance(cur.pic.px,st.pots);
  if(st.pots.length<cur.k){say('Worst pixel now '+f1(m)+' from its pot. '+plural(cur.k-st.pots.length,'pot')+' left to mix.');return;}
  if(m<=cur.inst.best+1e-9){say('The worst pixel is only '+f1(m)+' from its pot. That reaches the mark.','good');
   complete(['kcenter','fft'],'L3',{allWorst:st.picks.every(p=>p.wasWorst)});}
  else say('The worst pixel is still '+f1(m)+' from its pot; the mark is '+f1(cur.inst.best)+'. Pour out a pot and try another pixel.','warn');
 }
};

/* ===== level 4: the stray pixel ===== */
MODES.stray={
 init(c){c.inst=makeLevel(lseed(4),4);c.pic=c.inst.pic;c.k=3;c.st={pots:[c.pic.px[0].slice()],locked:[0],picks:[],phase:'move',sel:null};liveLab();

 stage(c){

     return '<tr><td>row '+(Math.floor(i/12)+1)+', col '+(i%12+1)+'</td><td><span class="swatch" style="background:'+inkOf(P[i])+'"></span> ('+P[i].join(', ')+')</td><td>'+(j+1)+'</td><td><span class="swatch" style="background:'+inkOf(q)+'"></span> ('+q.join(', ')+')</td>'+
      '<td><input type="number" min="0" id="sq'+k+'" value="'+(a==null?'':a)+'" class="'+(st.checked&&a!=null?(+a===c.inst.sq[k]?'ok':'bad'):'')+'" aria-label="squared length for pixel '+(k+1)+'"></td></tr>';}).join('')+
    '</table></div><div class="btnrow"><button data-act="checksq">Check</button></div>'+
    (st.handDone?'<p><b>Average of these six: '+c.inst.sq.join(' + ')+' = '+c.inst.sq.reduce((a,b)=>a+b,0)+', divided by 6 = '+f2(c.inst.sq.reduce((a,b)=>a+b,0)/6)+'.</b> Over all 144 pixels the average is '+f2(err)+'.</p>':'')+'</div>';
  }
  if(st.phase==='place'||st.phase==='hand')h+='<div class="meter">'+gaugeSvg('Average squared ruler length, over all 144 pixels',err,20,st.phase==='place'?c.inst.target:null,st.phase==='place'&&err<=c.inst.target+1e-9)+'</div>';
  return h;
 },
 act:{
  mix(i){if(cur.st.phase!=='move'||!mixAt(i,true))return;MODES.stray.settle();},
  mixink(k){const P=cur.pic.px,i=P.findIndex(p=>p.join(',')===k);if(i>=0)MODES.stray.act.mix(i);},
  pour(){say('These pots stay for now.','warn');},
  checksq(){const st=cur.st;st.ans=cur.inst.six.map((_,k)=>{const el=$('#sq'+k);return el&&el.value!==''?+el.value:null;});st.checked=true;
   const ok=st.ans.every((a,k)=>a===cur.inst.sq[k]);log('check_sq',{ans:st.ans,ok});
   if(ok){st.handDone=true;say('All six right.','good');}else {const n=st.ans.filter((a,k)=>a!==cur.inst.sq[k]).length;say(n+(n===1?' entry is':' entries are')+' not right yet.','warn');}},
  sel(j){const st=cur.st;if(st.phase!=='place')return;st.sel=st.sel===+j?null:+j;say(st.sel===null?'Click a pot.':POTNAME[st.sel]+' picked up. Click a spot on the map to mix it there.');},
  spot(k){const st=cur.st;if(st.phase!=='place')return;if(st.sel===null){say('Click a pot first, then the spot to move it to.','warn');return;}
   st.pots[st.sel]=k.split(',').map(Number);log('place',{pot:st.sel,ink:st.pots[st.sel]});st.sel=null;liveLab();
   const e=distortion(cur.pic.px,st.pots);
   if(e<=cur.inst.target+1e-9){say('Average '+f2(e)+': under the mark, and the print looks like a mushroom again.','good');complete(['distortion','kmeans'],'L4');}

 settle(){const st=cur.st,m=maxDistance(cur.pic.px,st.pots);
  if(st.pots.length<3){say('Mix pot '+(st.pots.length+1)+'.');return;}
  st.phase='look';log('stray_spent',{stray:st.pots.some(p=>dist2(p,cur.pic.px[cur.inst.stray])===0)});
  say('The meter is satisfied: no pixel is more than '+f1(m)+' from its pot. Now look at the print.','good');},
 go:c=>c.st.phase==='look'?'The print looks wrong. Measure it another way':c.st.phase==='hand'&&c.st.handDone?'Now mix the pots yourself':null,
 goAct(c){const st=c.st;if(st.phase==='look'){st.phase='hand';st.ans=[null,null,null,null,null,null];say('A meter that counts every pixel, not just the worst.');}
  else{st.phase='place';st.locked=[];say('Click a pot, then the spot on the map where you want its ink. Get the average under the mark.');}}
};

/* ===== level 5: where should a pot sit? ===== */

/* ===== level 6: repaint, re-average ===== */

/* ===== level 7: a bad start ===== */

 init(c){c.inst=makeLevel(lseed(7),7);c.pic=c.inst.pic;c.k=3;c.st={pots:c.inst.bad.map(p=>p.slice()),lab:null,phase:'bad',hist:[],next:'assign',rounds:0,picks:[]};say('Press the buttons in turn.');},
 rule:c=>c.st.phase==='ff'?'A pot matches a pixel · each new pot on the worst pixel':'A print takes each pixel’s nearest pot · pots move only when you move them',
 stage(c){
  const st=c.st,pic=c.pic;
  if(st.phase==='ff')return worstView(c,{mark:null})+(c.badPrint?MODES.bad.badCard(c):'');
  let h=trio(sheetSvg(pic,own(pic)),sheetSvg(pic,printFill(st),{anim:cur.justPrinted,label:'the print'}),mapSvg({points:pic.px,pots:potsOf(st)}));
  if(st.phase==='bad'||st.phase==='good')h+=loopButtons(st);
  if(c.badPrint)h+=MODES.bad.badCard(c);
  return h;
 },
 badCard(c){const b=c.badPrint;return '<div class="work"><div class="row two"><div class="fig"><p class="cap">From the bad start: error '+f2(b.err)+'</p>'+sheetSvg(c.pic,i=>inkOf(b.pots[b.lab[i]]),{label:'print from the bad start'})+'</div>'+
  (c.goodPrint?'<div class="fig"><p class="cap">From the level 3 move: error '+f2(c.goodPrint.err)+'</p>'+sheetSvg(c.pic,i=>inkOf(c.goodPrint.pots[c.goodPrint.lab[i]]),{label:'print from the level 3 start'})+'</div>':'')+'</div></div>';},
 act:{
  repaint(){const st=cur.st,c=cur;doRepaint(c.pic.px,()=>{
   const rec={pots:st.pots.map(p=>p.slice()),lab:st.lab.slice(),err:labelError(c.pic.px,st.pots,st.lab)};
   if(st.phase==='bad'){c.badPrint=rec;st.phase='ff';st.pots=[c.pic.px[0].slice()];st.locked=[0];liveLab();
    say('Stopped, at error '+f2(rec.err)+'. Try again: pot 1 matches the top-left pixel, and each new pot goes where level 3 taught you.');}
   else{c.goodPrint=rec;say('Stopped, at error '+f2(rec.err)+', against '+f2(c.badPrint.err)+' from the bad start.','good');complete([],'L7',{bad:c.badPrint.err,good:rec.err});}
  });},
  reavg(){doReavg(cur.pic.px);},
  mix(i){const st=cur.st;if(st.phase!=='ff'||!mixAt(i,true))return;
   if(st.pots.length===3){st.phase='good';st.lab=null;st.hist=[];st.next='assign';st.rounds=0;delete st.locked;say('Three pots, spread out. Run the buttons again.');}},
  mixink(k){const P=cur.pic.px,i=P.findIndex(p=>p.join(',')===k);if(i>=0)MODES.bad.act.mix(i);},
  pour(){say('These pots stay.','warn');}
 }
};

/* ===== level 8: seven numbers a gene ===== */
MODES.cards={
 init(c){c.inst=makeLevel(lseed(8),8);const I=c.inst;c.st={pots:I.start.map(i=>I.data[i].slice()),lab:null,phase:'sq',hist:[],next:'assign',rounds:0,ans:Array(6).fill(null),picked:[null,null]};
  say('Fill in the six sums.');},
 rule:()=>'A card goes to its nearest pot · seven directions, no map',
 stage(c){
  const st=c.st,I=c.inst,D=I.data;
  let h='<p class="cap">The three pots</p><div class="deck">'+st.pots.map((p,j)=>cardHtml(p,POTNAME[j],{ctr:true,border:PILECOL[j],color:PILECOL[j],dashed:st.phase!=='sq'&&st.phase!=='near'})).join('')+'</div>'+
   '<p class="cap" style="margin-top:10px">The twelve cards</p><div class="deck">'+D.map((v,i)=>cardHtml(v,CARDN[i],{border:st.lab?PILECOL[st.lab[i]]:(I.hand.includes(i)?'#1f2328':null),tag:I.start.includes(i)?'pot '+(I.start.indexOf(i)+1)+'’s start':I.hand.includes(i)?'by hand':''})).join('')+'</div>';
  if(st.phase==='sq'||st.phase==='near'){
   h+='<div class="work"><p>For a card and a pot: take the seven differences in height, square each, add them up. The ruler’s length is the square root of that sum.</p><div class="scroll"><table><tr><th></th>'+[0,1,2,3,4,5,6].map(t=>'<th>'+(t*2-6>0?'+':'')+(t*2-6)+' h</th>').join('')+'<th>sum of squares</th><th>ruler</th></tr>';
   I.hand.forEach((ci,a)=>{
    h+='<tr><th>card '+CARDN[ci]+'</th>'+D[ci].map(x=>'<td><b>'+x+'</b></td>').join('')+'<td></td><td></td></tr>';
    st.pots.forEach((p,j)=>{const k=a*3+j,v=st.ans[k],right=dist2(D[ci],p);
     h+='<tr><td style="color:'+PILECOL[j]+'">'+POTNAME[j]+'</td>'+p.map(x=>'<td>'+x+'</td>').join('')+
      '<td><input type="number" min="0" id="sq'+k+'" value="'+(v==null?'':v)+'" class="'+(st.checked&&v!=null?(v===right?'ok':'bad'):'')+'" aria-label="sum of squares, card '+CARDN[ci]+' to '+POTNAME[j]+'"></td>'+
      '<td>'+(st.phase==='near'?f1(Math.sqrt(right)):'')+'</td></tr>';});
   });
   h+='</table></div>';
   if(st.phase==='sq')h+='<div class="btnrow"><button data-act="checksq">Check</button></div>';
   else h+=I.hand.map((ci,a)=>'<p>Card '+CARDN[ci]+' prints from: '+[0,1,2].map(j=>'<button data-act="near" data-arg="'+a+','+j+'"'+(st.picked[a]===j?' class="primary"':'')+'>'+POTNAME[j]+'</button>').join(' ')+'</p>').join('');
   h+='</div>';
  }
  if(st.phase==='coord'){const j=I.coord.center,h0=I.coord.hour,mine=D.map((v,i)=>st.lab[i]===j?i:-1).filter(i=>i>=0);
   h+='<div class="work"><p>'+POTNAME[j]+' printed '+plural(mine.length,'card')+': '+mine.map(i=>CARDN[i]).join(', ')+'. Its new height at hour '+(h0*2-6)+' is the average of their heights at that hour. Read them off the cards.</p>'+
    '<label>Height at hour '+(h0*2-6)+' <input type="number" min="0" max="10" id="coord"></label> <button data-act="checkcoord">Check</button></div>';}
  if(st.phase==='free'||st.phase==='end')h+=loopButtons(st,'card');
  if(st.phase==='end')h+=MODES.cards.compare(c);
  return h;
 },
 compare(c){
  const D=c.inst.data,loopErr=labelError(D,c.st.pots,c.st.lab);
  const mine=S.piles1&&S.piles1.length===12?S.piles1:null,alt=S.alt1&&S.alt1.length===12?S.alt1:null;
  return '<div class="work"><h3>Level 1, settled</h3><table><tr><th>sorting</th><th>average squared error</th></tr>'+
   (mine?'<tr><td>Your piles from level 1</td><td>'+f2(pileError(D,mine,3))+'</td></tr>':'<tr><td colspan="2">You have not sorted these cards in this session, so there are no piles of yours to score.</td></tr>')+
   (alt?'<tr><td>The other student’s piles</td><td>'+f2(pileError(D,alt,3))+'</td></tr>':'')+
   '<tr><td><b>The loop’s piles</b></td><td><b>'+f2(loopErr)+'</b></td></tr></table></div>';
 },
 act:{
  checksq(){const st=cur.st,I=cur.inst;st.ans=st.ans.map((_,k)=>{const el=$('#sq'+k);return el&&el.value!==''?+el.value:null;});st.checked=true;
   const right=k=>dist2(I.data[I.hand[Math.floor(k/3)]],st.pots[k%3]),bad=st.ans.filter((v,k)=>v!==right(k)).length;log('check_sq',{ans:st.ans,bad});
   if(!bad){st.phase='near';say('All six right. Which pot does each card print from?','good');}else say(plural(bad,'sum')+(bad===1?' is':' are')+' not right yet.','warn');},
  near(arg){const st=cur.st,I=cur.inst,[a,j]=arg.split(',').map(Number),ci=I.hand[a],want=nearest(I.data[ci],st.pots);log('pick_near',{card:CARDN[ci],pot:j,want});
   if(j!==want){say('The press takes '+POTNAME[want]+' for card '+CARDN[ci]+': its ruler is '+f1(dist(I.data[ci],st.pots[want]))+', against '+f1(dist(I.data[ci],st.pots[j]))+'.','warn');st.picked[a]=want;}
   else{st.picked[a]=j;say('Card '+CARDN[ci]+' prints from '+POTNAME[j]+'.','good');}
   if(st.picked.every(x=>x!==null))st.phase='print';},
  checkcoord(){const st=cur.st,I=cur.inst,v=$('#coord').value;log('check_coord',{v});
   if(v!==''&&+v===I.coord.value){st.phase='move';say('Right: '+v+'.','good');}else say('Not that. Add the '+plural(I.coord.count,'height')+' and divide by '+I.coord.count+'.','warn');},
  repaint(){doRepaint(cur.inst.data,()=>{cur.st.phase='end';say('Nothing changed. The loop has stopped.','good');complete([],'L8',{rounds:cur.st.rounds});});},
  reavg(){doReavg(cur.inst.data);}
 },
 go:c=>c.st.phase==='print'?'Print every card from its nearest pot':c.st.phase==='move'?'Move every pot to its cards’ average':null,
 goAct(c){const st=c.st,D=c.inst.data;
  if(st.phase==='print'){st.lab=assign(D,st.pots);st.hist.push({kind:'assign',err:labelError(D,st.pots,st.lab)});st.phase='coord';st.next='move';log('repaint',{});say('Each card’s frame shows its pot. One height of a new pot, by hand.');}
  else{st.pots=moveCenters(D,st.pots,st.lab);st.hist.push({kind:'move',err:labelError(D,st.pots,st.lab)});st.phase='free';st.next='assign';st.rounds=1;log('reaverage',{});say('The buttons take it from here. Until a print changes nothing.');}}
};

/* ===== level 9: family tree ===== */
MODES.tree={
 init(c){c.inst=makeLevel(lseed(9),9);c.st={groups:c.inst.D.map((_,i)=>[i]),merges:[],phase:'merge',hint:null};say('Click the cell for the two closest groups.');},
 rule:()=>'Join the two closest groups · distance between groups = average over pairs',
 gname:g=>g.map(i=>CARDN[i]).join(''),
 stage(c){
  const st=c.st,I=c.inst,G=st.groups,D=I.D;
  let h='<div class="deck">'+I.cards.map((cd,i)=>cardHtml(cd.v,CARDN[i],{border:st.cut?PILECOL[st.cut.findIndex(g=>g.includes(i))]:null})).join('')+'</div>';
  if(st.phase!=='cut'&&st.phase!=='done'){
   h+='<div class="work"><p class="cap">Distances between groups</p><div class="scroll"><table class="matrix"><tr><th></th>'+G.map(g=>'<th>'+MODES.tree.gname(g)+'</th>').join('')+'</tr>'+
    G.map((a,i)=>'<tr><th>'+MODES.tree.gname(a)+'</th>'+G.map((b,j)=>{
     if(j<=i)return '<td></td>';
     const hand=st.phase==='hand'&&((a===st.newG&&b.length===1&&b[0]===I.hand.other)||(b===st.newG&&a.length===1&&a[0]===I.hand.other));
     if(hand)return '<td><input type="number" step="0.5" id="hand" aria-label="average distance" style="width:4em"></td>';
     if(st.phase==='hand'&&(a===st.newG||b===st.newG))return '<td><button disabled aria-label="not yet worked out">?</button></td>';
     const d=groupDist(D,a,b);
     return '<td><button data-act="merge" data-arg="'+i+','+j+'"'+(st.hint===i+','+j?' class="min"':'')+(st.phase==='hand'?' disabled':'')+'>'+(Number.isInteger(d)?d:f2(d))+'</button></td>';}).join('')+'</tr>').join('')+'</table></div>';
   if(st.phase==='hand')h+='<p>Group '+MODES.tree.gname(st.newG)+' to card '+CARDN[I.hand.other]+': the average of '+CARDN[st.newG[0]]+'–'+CARDN[I.hand.other]+' ('+D[st.newG[0]][I.hand.other]+') and '+CARDN[st.newG[1]]+'–'+CARDN[I.hand.other]+' ('+D[st.newG[1]][I.hand.other]+'). Type it. <button data-act="checkhand">Check</button></p>';
   h+='</div>';
  }
  h+='<div class="work"><p class="cap">The tree your joins draw'+(st.phase==='cut'?' · click a height to cut it':'')+'</p>'+MODES.tree.dendro(c)+'</div>';
  return h;
 },
 dendro(c){
  const st=c.st,I=c.inst,M=st.merges,n=8;
  // leaf order: the order members appear in the last group list
  const order=[];const walk=g=>g.forEach(i=>{if(!order.includes(i))order.push(i);});
  (M.length?[M[M.length-1].members]:[]).forEach(walk);st.groups.forEach(walk);
  const maxD=Math.max(...I.merges.map(m=>m.d)),W=340,H=170,X=i=>20+order.indexOf(i)*(300/7),Y=d=>H-24-d/maxD*(H-44);
  let h='<div class="scroll"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:520px;min-width:300px" role="img" aria-label="tree of joins"><rect width="'+W+'" height="'+H+'" rx="6" fill="#fbf8f1"/>';
  const pos={};for(let i=0;i<n;i++)pos[i]={x:X(i),y:Y(0)};
  const key=g=>g.slice().sort((a,b)=>a-b).join(',');
  M.forEach(m=>{const a=pos[key(m.a)]||pos[m.a[0]],b=pos[key(m.b)]||pos[m.b[0]],y=Y(m.d);
   h+='<path d="M'+f1(a.x)+','+f1(a.y)+'V'+f1(y)+'H'+f1(b.x)+'V'+f1(b.y)+'" fill="none" stroke="#2a2416" stroke-width="2"/><text x="'+f1(Math.min(a.x,b.x)+4)+'" y="'+f1(y-4)+'" font-size="10" text-anchor="start" fill="#4b4f56" stroke="#fbf8f1" stroke-width="3" paint-order="stroke">'+f1(m.d)+'</text>';
   pos[key(m.members)]={x:(a.x+b.x)/2,y};});
  for(let i=0;i<n;i++)h+='<text x="'+f1(X(i))+'" y="'+(H-8)+'" font-size="12" font-weight="700" text-anchor="middle" fill="'+(st.cut?PILECOL[st.cut.findIndex(g=>g.includes(i))]:'#2a2416')+'">'+CARDN[i]+'</text>';
  if(st.phase==='cut'){
   // a band between successive join heights leaves k groups
   const hs=[0].concat(I.merges.map(m=>m.d));
   for(let t=0;t<hs.length-1;t++){const k=n-t-1,y0=Y(hs[t+1]),y1=Y(hs[t]);
    h+='<rect x="10" y="'+f1(y0)+'" width="320" height="'+f1(Math.max(4,y1-y0))+'" fill="rgba(194,65,12,'+(t%2?.05:.1)+')" data-act="cut" data-arg="'+(k)+'" style="cursor:pointer"><title>cut here: '+k+' groups</title></rect>';}
  }
  if(st.cut){const y=Y((I.merges[4].d+I.merges[5].d)/2);h+='<line x1="10" x2="330" y1="'+f1(y)+'" y2="'+f1(y)+'" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 3"/>';}
  return h+'</svg></div>';
 },
 act:{
  merge(arg){const st=cur.st,I=cur.inst,G=st.groups,[i,j]=arg.split(',').map(Number);
   if(st.phase!=='merge')return;
   let bi=0,bj=1,bd=Infinity;for(let a=0;a<G.length;a++)for(let b=a+1;b<G.length;b++){const d=groupDist(I.D,G[a],G[b]);if(d<bd){bd=d;bi=a;bj=b;}}
   log('merge_try',{a:MODES.tree.gname(G[i]),b:MODES.tree.gname(G[j]),ok:i===bi&&j===bj});
   if(i!==bi||j!==bj){st.hint=bi+','+bj;say(MODES.tree.gname(G[i])+' and '+MODES.tree.gname(G[j])+' are '+f2(groupDist(I.D,G[i],G[j]))+' apart, but the marked pair is closer.','warn');return;}
   st.hint=null;const g=G[i].concat(G[j]);st.merges.push({a:G[i],b:G[j],d:bd,members:g});st.groups=G.filter((_,k)=>k!==i&&k!==j).concat([g]);
   if(st.merges.length===1){st.phase='hand';st.newG=g;say('Joined. The new group needs its distances to the others: work one out yourself.');}
   else if(st.groups.length===1){st.phase='cut';say('One group left. Now cut the tree so that it falls into three groups.');}
   else say('Joined at '+f2(bd)+'. '+plural(st.groups.length,'group')+' left.');},
  checkhand(){const st=cur.st,v=$('#hand').value;log('hand_avg',{v});
   if(v!==''&&Math.abs(+v-cur.inst.hand.value)<1e-9){st.phase='merge';say('Right. The game fills in the rest of the table from now on.','good');}
   else say('Add the two distances and halve the sum.','warn');},
  cut(k){const st=cur.st;k=+k;log('cut',{k});
   if(k!==3){say('That cut leaves '+plural(k,'group')+'. Find the height that leaves three.','warn');return;}
   st.cut=cutTree(8,cur.inst.merges,3);st.phase='done';say('Three groups, coloured on the cards.','good');complete(['hier'],'L9');}
 }
};

/* ===== level 10: the shift ===== */
MODES.shift={
 init(c){c.inst=makeLevel(lseed(10),10);c.st={pots:c.inst.ff.centers.map(p=>p.slice()),lab:null,hist:[],next:'assign',rounds:0,phase:'free'};say('Press the buttons in turn until a print changes nothing.');},
 rule:()=>'Each gene goes to its nearest pot',
 stage(c){
  const st=c.st,I=c.inst,D=I.data;
  let h='<p class="cap">Twenty-four genes <span class="illus">illustrative data</span></p><div class="deck">'+D.map((v,i)=>cardHtml(v,'gene '+(i+1),{border:st.lab?PILECOL[st.lab[i]]:null,tag:I.ff.idx.includes(i)?'pot '+(I.ff.idx.indexOf(i)+1)+'’s start':''})).join('')+'</div>';
  if(st.phase==='free')h+=loopButtons(st,'gene');
  else h+=MODES.shift.big(c);
  return h;
 },
 big(c){
  const st=c.st,D=c.inst.data,X=i=>40+i*60,Y=y=>190-y*16;
  let h='<div class="work"><p class="cap">The three pots: each is the average of its genes</p><svg viewBox="0 0 440 230" style="width:100%;max-width:560px" role="img" aria-label="average of each group over time"><rect width="440" height="230" rx="6" fill="#fbf8f1"/>';
  [0,5,10].forEach(y=>{h+='<line x1="30" x2="420" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="#e0d8c6"/><text x="24" y="'+(Y(y)+4)+'" font-size="11" text-anchor="end" fill="#6b7078">'+y+'</text>';});
  for(let t=0;t<7;t++)h+='<text x="'+X(t)+'" y="212" font-size="11" text-anchor="middle" fill="#6b7078">'+(t*2-6)+' h</text>';
  h+='<line x1="'+X(3)+'" x2="'+X(3)+'" y1="20" y2="196" stroke="#b4541a" stroke-dasharray="4 3"/><text x="'+(X(3)+4)+'" y="16" font-size="11" fill="#b4541a">sugar runs out</text>';
  D.forEach((v,i)=>{h+='<polyline fill="none" stroke="'+PILECOL[st.lab[i]]+'" stroke-opacity=".22" stroke-width="1.2" points="'+v.map((y,t)=>X(t)+','+Y(y)).join(' ')+'"/>';});
  st.pots.forEach((p,j)=>{h+='<polyline fill="none" stroke="'+PILECOL[j]+'" stroke-width="4" points="'+p.map((y,t)=>X(t)+','+f1(Y(y))).join(' ')+'"/>';});
  return h+'</svg></div>';
 },
 act:{
  repaint(){doRepaint(cur.inst.data,()=>{cur.st.phase='end';say('Nothing changed. The genes have sorted themselves into three sets.','good');
   complete(sweepTerms(),'L10',{rounds:cur.st.rounds});});},
  reavg(){doReavg(cur.inst.data);}
 }
};

/* ---------- what the game says when a level is done ---------- */
const BLOCKS={
 L1:()=>'<div class="called"><p>A card’s seven heights are the gene’s '+term('expvec','expression vector')+'. Sorting genes into groups of look-alikes is '+term('clustering')+'. Both you and the other student sorted by eye. Deciding which sorting is better requires a measure.</p></div>'+srcCard('derisi'),
 L2:()=>{const c=cur,i=c.inst.strip[7],p=c.pic.px[i],q=c.st.pots[nearest(p,c.st.pots)];
  return '<div class="called"><p>Each pixel is a '+term('point','data point')+': a point whose coordinates are its two ink amounts. Each pot is a '+term('center')+', and the pixels printed from one pot are its '+term('cluster')+'. The ruler measures '+term('euclid','Euclidean distance')+': for your last pixel, √(('+p[0]+' − '+f1(q[0])+')² + ('+p[1]+' − '+f1(q[1])+')²) = '+f1(dist(p,q))+'. <b>We will use those words from now on.</b></p></div>';},
 L3:()=>{const c=cur,D=c.pic.px;
  return '<div class="called"><p>Choosing k centers so that the worst data point is as close as possible to its center is '+term('kcenter','k-center clustering')+'. No fast algorithm is known for finding the best answer. The move the meter points at, each new center on the data point farthest from every center so far, is '+term('fft','farthest-first traversal')+'.</p></div>'+
   '<div class="row two" style="margin:8px 0">'+c.inst.decoys.map(d=>'<div class="fig"><p class="cap">Pots on '+d.name+': worst '+f1(d.max)+'</p>'+sheetSvg(c.pic,i=>inkOf(d.centers[nearest(D[i],d.centers)]),{label:d.name})+'</div>').join('')+
   '<div class="fig"><p class="cap">Farthest-first: worst '+f1(c.inst.best)+'</p>'+sheetSvg(c.pic,i=>inkOf(c.inst.ff.centers[nearest(D[i],c.inst.ff.centers)]),{label:'farthest-first'})+'</div></div>'+srcCard('gonzalez');},
 L4:()=>'<div class="called"><p>The meter that only watches the worst point lets one stray steal a center. The new meter, the average of the squared distances from each data point to its center, is the '+term('distortion','squared error distortion')+'. Choosing k centers, anywhere, to make it as small as possible is '+term('kmeans','k-means clustering')+'.</p></div>',
 L5:()=>'<div class="called"><p>The best pot sits at the average of its pixels’ inks, one coordinate at a time. That point is the cluster’s '+term('gravity','center of gravity')+'.</p></div>',
 L6:()=>'<div class="called"><p>Print from the nearest center, move each center to its cluster’s center of gravity, repeat until nothing changes: that is the '+term('lloyd','Lloyd algorithm')+'. Neither step can raise the error, and 144 pixels can be split in only finitely many ways, so the loop must stop.</p></div>'+srcCard('lloyd'),
 L7:()=>'<div class="called"><p>The Lloyd algorithm stopped twice, at two different errors. Stopping does not mean best: where it ends depends on where the centers start. Farthest-first traversal is a cheap way to spread them out. Real software usually picks starts at random, weighted toward far-off points (k-means++), and keeps the best of many runs.</p></div>',
 L8:()=>'<div class="called"><p>With seven numbers a gene there was no picture to judge by. The arithmetic was the same as for two inks, and the error now answers level 1’s question.</p></div>',
 L9:()=>'<div class="called"><p>Joining the closest groups and drawing the joins as a tree is '+term('hier','hierarchical clustering')+'. Averaging the distance over every pair of members is the same rule as UPGMA: this is level 7 of Hollow Mountain, with genes in place of species. Cutting the tree at one height gives the clusters.</p></div>'+srcCard('eisen'),
 L10:()=>'<div class="called"><p>When the sugar runs out, the yeast changes how it lives: the '+term('diauxic','diauxic shift')+'. One set of genes switches on, another switches off, and many hardly change. These cards are illustrative; DeRisi, Iyer and Brown measured nearly every yeast gene through the real shift.</p></div>'+srcCard('derisi')
};
function srcCard(id){const s=SRC[id];
 return '<div class="src"><span class="tag">Primary source</span><a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+': “'+s.title+'”</a> <span class="gmeta">'+s.where+'.</span><br>'+s.look+'</div>';}
/* ---------- loading and drawing ---------- */
function loadLevel(id){
 const L=LEVELS[id-1];
 cur={L,mode:L.mode,M:MODES[L.mode],done:false,msg:{text:'',kind:''},t0:Date.now(),hist:[],pic:null,k:3};
 cur.M.init(cur);
 log('load',{mode:L.mode});
 hoverKey=null;render();
}
function renderHeader(){
 $('#pips').innerHTML=LEVELS.map(l=>'<button data-lvl="'+l.id+'"'+' class="'+(l.id===cur.L.id?'on':'')+(S.done.includes(l.id)?' fin':'')+'"'+(l.id===cur.L.id?' aria-current="true"':'')+
  ' aria-label="Level '+l.id+(S.done.includes(l.id)?' (finished)':'')+'">'+l.id+'</button>').join('');
 const got=VOCAB.filter(v=>S.badges.includes(v.id)).length;
 $('#count').innerHTML='Puzzle code <b class="mono">'+esc(S.seed)+'</b> · <b>'+got+' of '+VOCAB.length+' terms</b>';
 $('#badges').innerHTML=VOCAB.map(x=>S.badges.includes(x.id)
  ?'<span class="badge got term" tabindex="0">'+x.name+'<span class="tip" role="tooltip"><b>'+x.name+'</b>'+x.def+'</span></span>'
  :'<span class="badge">? ? ?</span>').join('');
}
function renderGuide(){
 const got=VOCAB.filter(v=>S.badges.includes(v.id));
 $('#gcount').textContent=got.length+' of '+VOCAB.length+' terms';
 $('#guideBody').innerHTML='<p class="gmeta">Paint by k field guide · puzzle code '+esc(S.seed)+' · '+got.length+' of '+VOCAB.length+' terms earned</p>'+
  got.map(v=>{const s=v.src&&SRC[v.src];
   return '<div class="gentry"><h4>'+v.name+'</h4><p>'+v.def+'</p><p class="gmeta">Met in level '+(S.earnedAt[v.id]||'?')+
    (s?' · Source: <a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+', “'+s.title+'”</a>':'')+
    (v.code?' · Code it: <a href="https://rosalind.info/problems/'+v.code.toLowerCase()+'/" target="_blank" rel="noopener">Rosalind '+v.code+'</a>':'')+'</p></div>';}).join('')+
  (S.badges.includes('lloyd')?'<div class="gentry"><h4>A note on starting the loop</h4><p>Real k-means software usually chooses its starting centers at random, each new one with probability proportional to its squared distance from the centers already chosen (k-means++), and keeps the best of several runs.</p></div>':'')+
  (got.length?'<p style="margin-top:10px"><button id="printGuide">Print field guide</button></p>':'<p class="gmeta">Nothing yet. Finish level 1.</p>');
}
function renderPanel(){
 if(!cur.done){$('#panel').innerHTML='';return;}
 let h='<div class="reveal"><h3>Level '+cur.L.id+' complete</h3>'+(BLOCKS[cur.block]?BLOCKS[cur.block]():'');
 const missing=VOCAB.filter(x=>!S.badges.includes(x.id)).length;
 if(cur.L.id<LEVELS.length)h+='<button class="primary advance" id="next">Next level →</button>';
 else h+='<p>'+(missing?missing+' vocabulary term'+(missing===1?'':'s')+' still hidden. Finish the levels without a ✓ to earn them.':'You have earned every term. The field guide below lists each one with its source.')+'</p>';
 $('#panel').innerHTML=h+'</div>';
}
function renderStage(){$('#stage').innerHTML=cur.M.stage(cur);cur.justPrinted=false;}
function render(){
 renderHeader();
 $('#title').textContent='Level '+cur.L.id+': '+cur.L.title;
 $('#brief').textContent=cur.L.brief;
 $('#rule').textContent=cur.M.rule(cur);
 renderStage();
 $('#status').textContent=cur.msg.text;$('#status').className='status '+cur.msg.kind;
 const g=!cur.done&&cur.M.go?cur.M.go(cur):null,go=$('#go');go.hidden=!g;go.textContent=g||'';
 $('#undo').disabled=cur.done||!cur.hist.length;$('#restart').disabled=false;
 const keep=cur.L.id===8;$('#fresh').disabled=keep;$('#fresh').title=keep?'These are your level 1 cards; a new puzzle would change them':'';
 renderPanel();renderGuide();
 const hs=$('#hov');if(hs)hs.textContent='';hoverKey=null;
}
function act(name,arg){
 if(cur.done&&name!=='noop')return;
 const fn=cur.M.act&&cur.M.act[name];if(!fn)return;
 cur.hist.push(JSON.stringify(cur.st));if(cur.hist.length>200)cur.hist.shift();
 fn(arg);render();
}
function goNext(){if(cur.done||!cur.M.go||!cur.M.go(cur))return;cur.hist.push(JSON.stringify(cur.st));cur.M.goAct(cur);render();}
function undo(){if(cur.done||!cur.hist.length)return;cur.st=JSON.parse(cur.hist.pop());log('undo');say('Undone.');render();}

/* ---------- the workbench (?bench=1): paste points, run both methods ---------- */
function renderBench(){
 $('#game').hidden=true;$('#bench').hidden=false;$('#pips').innerHTML='';$('#count').textContent='Workbench';
 $('#bench').innerHTML='<h2>Workbench</h2><p>Paste points, one per line, numbers separated by spaces or commas, in any number of dimensions. Choose k. Optionally paste k starting points for the Lloyd algorithm; otherwise it starts from the first k points.</p>'+
  '<div class="row"><div style="flex:1 1 260px"><label class="cap" for="bpts">Points</label><textarea id="bpts" rows="10" style="width:100%;font:14px ui-monospace,Menlo,monospace">0 0\n5 5\n0 5\n1 1\n2 2\n3 3\n1 2</textarea></div>'+
  '<div style="flex:1 1 200px"><label class="cap" for="bstart">Starting points (optional)</label><textarea id="bstart" rows="4" style="width:100%;font:14px ui-monospace,Menlo,monospace"></textarea>'+
  '<p><label>k <input type="number" id="bk" min="1" value="3"></label> <button class="primary" id="brun">Run both</button></p></div></div><div id="bout"></div>';
 const fmt=c=>'('+c.map(x=>Math.round(x*1000)/1000).join(', ')+')';
 const run=()=>{
  const P=parsePoints($('#bpts').value),k=+$('#bk').value,st=parsePoints($('#bstart').value);
  if(!P.length||!(k>=1)||k>P.length||P.some(p=>p.length!==P[0].length)){$('#bout').innerHTML='<p class="status warn">Need at least k points, all with the same number of coordinates.</p>';return;}
  const r=bench(P,k,st.length===k&&st.every(p=>p.length===P[0].length)?st:null);
  let h='<div class="compare"><div class="reveal"><h3>Farthest-first traversal</h3><p>Centers: '+r.ff.centers.map(fmt).join(' ')+'</p><p>MaxDistance '+f2(r.ff.max)+' · squared error distortion '+f2(r.ff.err)+'</p></div>'+
   '<div class="reveal"><h3>Lloyd algorithm</h3><p>Start: '+r.lloyd.start.map(fmt).join(' ')+'</p><table class="work">'+
   r.lloyd.steps.filter(s=>s.kind==='move').map((s,i)=>'<tr><td>round '+(i+1)+'</td><td>'+s.centers.map(fmt).join(' ')+'</td><td>'+f2(s.err)+'</td></tr>').join('')+
   '</table><p>Final centers '+r.lloyd.centers.map(fmt).join(' ')+' after '+plural(r.lloyd.rounds,'round')+'</p><p>MaxDistance '+f2(r.lloyd.max)+' · squared error distortion '+f2(r.lloyd.err)+'</p></div></div>'+
   '<p><b>Final squared error distortion:</b> farthest-first '+f2(r.ff.err)+', Lloyd '+f2(r.lloyd.err)+'.</p>';
  $('#bout').innerHTML=h;
 };
 $('#brun').onclick=run;run();
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
 const t=ev.target.closest&&ev.target.closest('[data-act],[data-lvl],#next,#printGuide');
 if(!t)return;
 if(t.id==='next'){loadLevel(cur.L.id+1);if(typeof window.scrollTo==='function')window.scrollTo(0,0);return;}
 if(t.id==='printGuide'){$('#guide').open=true;window.print();return;}
 if(t.dataset.lvl!==undefined)return loadLevel(+t.dataset.lvl);
 if(t.disabled)return;
 act(t.dataset.act,t.dataset.arg);
});
document.addEventListener('keydown',ev=>{
 const t=ev.target.closest&&ev.target.closest('[data-act]');
 if(t&&t.tagName!=='BUTTON'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();act(t.dataset.act,t.dataset.arg);}
});
document.addEventListener('mouseover',ev=>{
 if(!cur||!ev.target.closest)return;
 const t=ev.target.closest('[data-ink]');setHover(t?t.dataset.ink:null);
 const px=ev.target.closest('[data-px]'),pi=px?+px.dataset.px:null;
 if(cur.mode==='loop'&&cur.st.phase==='row'&&pi!==cur.hoverPx){cur.hoverPx=pi;const m=$('#mapfig');if(m){const all=cur.M.stage(cur);const s=all.indexOf('<div id="mapfig">');
   const e=all.indexOf('</div></div></div>',s);m.innerHTML=all.slice(s+17,e);}}
});
$('#go').onclick=goNext;
$('#undo').onclick=undo;
$('#restart').onclick=()=>{log('restart');loadLevel(cur.L.id);};
$('#fresh').onclick=()=>{if(cur.L.id===8)return;S.variants[cur.L.id]=(S.variants[cur.L.id]||0)+1;log('new_puzzle');save();loadLevel(cur.L.id);};
/* progress link: the box, the copy buttons, and a pasted link in a tab that is already open */
if(TRANSIENT)$('#savebar').hidden=true;
else{
  if(linkNote)topNote(linkNote,false);
  /* the link has been read: take it (and any ?seed= it overrode) out of the address */
  if(linkText){try{const q=new URLSearchParams(location.search);q.delete('seed');const qs=q.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));}catch(e){}}
  linkLive=true;
  $('#saveLink').onclick=()=>{const b=$('#saveLink');if(b.select)b.select();};
  $('#copyLink').onclick=$('#copyLinkTop').onclick=()=>{
    const b=$('#saveLink'),tell=(text,again)=>{$('#saveNote').textContent=text;topNote(text,again);},
      ok=()=>tell('Copied. The link changes when you earn a term, so copy it again before you leave.',false),
      byHand=()=>{if(b.select)b.select();let done=false;try{done=document.execCommand('copy');}catch(e){}
        if(done)ok();else tell('Could not copy. Select the link in the box at the bottom of this page and copy it by hand.',true);};
    if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(b.value).then(ok,byHand);else byHand();
  };
  window.addEventListener&&window.addEventListener('hashchange',()=>{if(/^#save=/.test(location.hash))location.reload();});
}
$('#seed').value=S.seed;
$('#setSeed').onclick=()=>{const v=$('#seed').value.trim();if(!v||v===S.seed)return;S=freshState(v);save();cur=null;loadLevel(previewLevel||1);};
$('#dl').onclick=()=>{
 const blob=new Blob([JSON.stringify({game:'paint-by-k',version:1,seed:S.seed,exported:new Date().toISOString(),
  unlocked:S.unlocked,finished:S.done,vocabulary:S.badges,earnedAt:S.earnedAt,events:S.log},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paint-by-k-'+S.seed.replace(/[^\w-]/g,'_')+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
if(params.get('bench'))renderBench();
else loadLevel(previewLevel||resumeLevel());
/* Test handle, only with ?debug=1 in the address. */
if(params.get('debug'))window.__pk={state:()=>cur,saved:()=>S,loadLevel,levels:()=>LEVELS.map(l=>({id:l.id,title:l.title})),
 vocab:()=>VOCAB.map(v=>({id:v.id,name:v.name})),earned:()=>S.badges.slice(),log:()=>S.log.slice(),act,go:goNext,undo,preview:()=>previewLevel};
})();
</script>
<script src="../book/chapters.js"></script>
<script src="../book/book.js"></script>
