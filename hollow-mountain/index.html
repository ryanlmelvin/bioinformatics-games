/* ---------- charts and hand-filled cells ---------- */
function chartHTML(D,names,o){o=o||{};const n=names.length;
  let h='<div class="chartwrap"><table class="chart"'+(o.label?' aria-label="'+esc(o.label)+'"':'')+'><tr><th>'+(o.corner||'')+'</th>'+names.map(x=>'<th>'+esc(x)+'</th>').join('')+(o.extraHead||'')+'</tr>';
  for(let i=0;i<n;i++){h+='<tr><th>'+esc(names[i])+'</th>';
    for(let j=0;j<n;j++){let c=o.cell?o.cell(i,j):null;
      if(!c)c=i===j?{html:'0',cls:'diag'}:{html:D&&D[i]&&D[i][j]!==null&&D[i][j]!==undefined?fmt(D[i][j]):''};
      const hot=cur&&cur.hotCells&&cur.hotCells.some(x=>(x[0]===i&&x[1]===j)||(x[0]===j&&x[1]===i));
      h+='<td class="'+(c.cls||'')+(hot?' hot':'')+'"'+(c.attr||'')+'>'+c.html+'</td>';}
    h+=(o.extraCol?o.extraCol(i):'')+'</tr>';}
  return h+'</table></div>';}
function setHand(id,want,ops,label){if(!cur.hand[id])cur.hand[id]={want,ok:false,tries:0,val:'',ops:ops||[],label:label||id};}
function handCell(id){const c=cur.hand[id];if(!c)return '';if(c.ok)return '<span class="fixed">'+fmt(c.want)+'</span>';
  return '<input class="num'+(c.bad?' bad':'')+'" data-in="'+id+'" inputmode="numeric" autocomplete="off" aria-label="'+esc(c.label)+'" value="'+esc(c.val)+'">';}
const handOK=ids=>ids.every(id=>cur.hand[id]&&cur.hand[id].ok);
function firstOpen(ids){return ids.find(id=>cur.hand[id]&&!cur.hand[id].ok);}

/* ---------- what the game says when vocabulary is earned ---------- */
const BLOCKS={
  dmat:{html:()=>'Your chart of counts is a '+term('dmat','distance matrix')+': zero down the diagonal, the same read across as read down, and never negative. Fewer differences means a closer relative. But a chart is only a list of pairs, and the question was a history: who passed it to whom, and through whom.'},
  tree:{html:()=>'In biology this cave is a '+term('tree','tree')+'. Its entrances are '+term('leaf','leaves')+' (the viruses we sampled), its junctions are '+term('inode','internal nodes')+' (ancestors nobody sampled), and the number on each tunnel is its '+term('blen','branch length')+'. You counted '+cur.lit.nodes+' nodes and '+cur.lit.edges+' tunnels: one fewer tunnel than nodes. A loop would need one more, and there are no loops. <b>We will use these words from now on.</b>'},
  limb:{html:()=>{const d=cur.D,f=(i,j)=>d[i][j];return 'The tunnel from a leaf to its internal node is the leaf’s limb, and you found all three '+term('limb','limb lengths')+'. For A: the ropes from A to B and from A to C both run along A’s limb, and the rope from B to C runs along neither, so A’s limb is ('+f(0,1)+' + '+f(0,2)+' − '+f(1,2)+') / 2 = '+fmt((f(0,1)+f(0,2)-f(1,2))/2)+'.';}},
  additive:{html:()=>'Your four-leaf map reproduces every rope reading. A chart that some tree fits exactly is an '+term('additive','additive matrix')+'. Of the three values you worked out, the smallest was D’s limb. For a pair whose path D does not branch off, both ropes from D take a detour along that path before coming back, so the value can only come out larger.'},
  addphylo:{html:()=>'Splitting a tunnel and hanging one leaf at a time, until the map reproduces the chart, is '+term('addphylo','additive phylogeny')+' (AdditivePhylogeny). The textbook writes it the other way round: trim the last leaf’s limb off the chart, solve the smaller chart, then hang the leaf back where it belongs.'},
  fourpoint:{src:['buneman'],html:()=>'In a real tree, of the three ways to pair four leaves, two pairings send both of their ropes along the middle tunnel, so those two sums are equal and the largest. That is the '+term('fourpoint','four-point condition')+', and a chart is additive exactly when every foursome meets it. In this chart the two largest sums differ by '+cur.gap+'. Look back at the new letters: the same change turns up in two viruses that are not each other’s closest relatives. It happened twice, independently, and a count of differences cannot tell that from shared descent.'},
  clock:{src:['zuck'],html:()=>'Steady digging is the '+term('clock','molecular clock')+': if a sequence changes at a constant rate, every present-day leaf is equally far from the common ancestor. That first chamber is the root, and a tree with one is a '+term('rooted','rooted tree')+'. Joining the closest pair under a node at half their distance, and averaging their rows, is '+term('upgma','UPGMA')+'. Its map reproduces this chart exactly.'},
  nj:{src:['saitou'],html:()=>'The real mountain has no first chamber to start from: it is an '+term('unrooted','unrooted tree')+'. Two leaves that share an internal node are '+term('neighbors','neighbors')+'. The closest pair here were not neighbors; the smallest entry of the discounted chart, the '+term('njm','neighbor-joining matrix')+', was. Joining that pair, replacing it by its internal node, and repeating is '+term('nj','neighbor joining')+'. The game did not prove the guarantee, and neither did the 1987 paper; the proof came later.'},
  join5:{html:()=>'On an exact chart, neighbor joining rebuilt the mountain. On level 6’s chart, where no tree fits, it still returned a tree: its best compromise, with ropes that do not all agree. Real data are like level 6, which is why neighbor joining, and not additive phylogeny, is the method in use.'},
  nni:{html:()=>'Re-hanging two of the four groups across one inner tunnel is a '+term('nni','nearest neighbor interchange')+'. Each inner tunnel gives a tree two nearest neighbors. The textbook uses interchanges to search for trees with a low parsimony score; this level scored trees with the chart alone.'},
  finale:{src:['guan','li'],html:()=>'In this illustrative chart, the human viruses’ closest relative is the civet virus, and the bat viruses branch off further in. That is the shape of the real finding: in 2003 viruses almost identical to the human SARS virus were found in palm civets at a market in Guangdong, and in 2005 bats were shown to carry a wider family of related viruses, with the human and civet viruses nested inside it. The civet was the go-between; bats were the reservoir.'}
};

/* ---------- shared pieces ---------- */
function seqRows(seqs,names,o){o=o||{};
  return '<div class="seqscroll">'+seqs.map((s,i)=>'<div class="seqrow"><span class="seqname">'+esc(names[i])+'</span><span class="seq">'+
    [...s].map((ch,c)=>{const cls='b '+ch+(o.newFrom!==undefined&&c>=o.newFrom?' new':'')+(o.mark&&o.mark(i,c)?' mark':'')+(o.nod===c&&o.rows&&o.rows.includes(i)?' same':'');
      return o.click&&o.rows.includes(i)?'<button class="'+cls+'" data-col="'+c+'" aria-label="Column '+(c+1)+'">'+ch+'</button>':'<span class="'+cls+'">'+ch+'</span>';}).join('')+
    '</span></div>').join('')+'</div>';}
const cross=(i,j)=>[i,j];
/* compare a built map with the chart among the leaves it holds */
function walkCompare(t,D){const B=leafDist(t),pl=presentLeaves(t),bad=[];
  pl.forEach(i=>pl.forEach(j=>{if(i<j&&!near(B[i][j],D[i][j]))bad.push([i,j]);}));return {B,bad,ok:!bad.length,leaves:pl};}
function walkChart(c,names){const r=c.walkRes,n=c.D.length;
  return chartHTML(c.D,names.slice(0,n),{label:'Walk result',cell:(i,j)=>{if(i===j)return null;
    if(!r||!r.leaves.includes(i)||!r.leaves.includes(j))return null;
    const bad=r.bad.some(x=>(x[0]===i&&x[1]===j)||(x[0]===j&&x[1]===i));
    return {html:fmt(c.D[i][j])+(bad?'<small>map '+fmt(r.B[i][j])+'</small>':''),cls:bad?'bad':'ok'};}});}
function walkSay(c,r){if(r.ok)return;const [i,j]=r.bad[0];
  say('The surveyor walked the map: '+plural(r.bad.length,'rope')+' disagree'+(r.bad.length===1?'s':'')+'. Between '+LET[i]+' and '+LET[j]+' the map says '+fmt(r.B[i][j])+' and the rope reads '+fmt(c.D[i][j])+'.'+(c.walkLeft?'':' The lamp oil is spent: Restart to try again.'),'warn');}
function names4(n){return LET.slice(0,n).split('');}

/* ---------- level 1: count the differences ---------- */
const HANDLERS={};
HANDLERS.count={
  init(c){c.v=makeViruses(keyFor(1));c.stage=0;c.marks=[new Set(),new Set()];c.D=range(4).map(i=>range(4).map(j=>i===j?0:null));c.nod=null;
    say('Patients '+LET[c.v.hand[0][0]]+' and '+LET[c.v.hand[0][1]]+' first. Click each column where their letters differ.');},
  rule:()=>'Count the letters that differ',
  scene:()=>({hide:true}),
  diffs(c,k){const [a,b]=c.v.hand[k];return range(12).filter(x=>c.v.short[a][x]!==c.v.short[b][x]);},
  work(c){const v=c.v,names=['Patient A','Patient B','Patient C','Patient D'];let h='';
    if(c.stage<2){const [a,b]=v.hand[c.stage],m=c.marks[c.stage];
      h+='<div class="sub">All four viruses</div>'+seqRows(v.short,names)+
        '<div class="sub">Compare '+LET[a]+' and '+LET[b]+': '+plural(m.size,'difference')+' found</div>'+
        seqRows([v.short[a],v.short[b]],[names[a],names[b]],{click:true,rows:[0,1],mark:(i,col)=>m.has(col),nod:c.nod});}
    else h+='<div class="sub">All four viruses</div>'+seqRows(v.short,names);
    h+='<div class="sub">Differences between each pair</div>'+chartHTML(c.D,names4(4),{label:'Differences chart'});
    if(c.stage===2)h+='<p>Who caught it from whom? Pair the four patients up.</p><div class="choice">'+[1,2,3].map(p=>{const o=[1,2,3].filter(x=>x!==p);
      return '<button data-act="pick" data-v="'+p+'">A with '+LET[p]+', '+LET[o[0]]+' with '+LET[o[1]]+'</button>';}).join('')+'</div>';
    return h;},
  act(c,type,d){
    if(type==='col'&&c.stage<2){const [a,b]=c.v.hand[c.stage],col=d.c;
      if(c.v.short[a][col]===c.v.short[b][col]){c.nod=col;say('Column '+(col+1)+': both read '+c.v.short[a][col]+'.');log('same_col',{col});return;}
      c.nod=null;if(c.marks[c.stage].has(col))return;c.marks[c.stage].add(col);log('diff_col',{col});
      const all=this.diffs(c,c.stage);
      if(c.marks[c.stage].size===all.length){c.D[a][b]=c.D[b][a]=all.length;
        if(c.stage===0){c.stage=1;const [x,y]=c.v.hand[1];say(LET[a]+' and '+LET[b]+' differ in '+plural(all.length,'letter')+'. Now '+LET[x]+' and '+LET[y]+'.');}
        else{c.stage=2;c.D=c.v.D1.map(r=>r.slice());say(LET[a]+' and '+LET[b]+' differ in '+plural(all.length,'letter')+'. The surveyor counted the other four pairs the same way.');}}
      else say(plural(c.marks[c.stage].size,'difference')+' so far.');return;}
    if(type==='pick'&&c.stage===2){const p=+d.v,want=c.v.pairs.find(x=>x[0]===0)[1],o=[1,2,3].filter(x=>x!==p);log('pair_guess',{with:LET[p],ok:p===want});
      if(p!==want){c.wrong++;const D=c.D;say('A and '+LET[p]+' differ in '+D[0][p]+' letters, '+LET[o[0]]+' and '+LET[o[1]]+' in '+D[o[0]][o[1]]+'. Another pairing needs fewer changes in all.','warn');return;}
      const q=[1,2,3].filter(x=>x!==p);complete(['dmat'],'dmat','A and '+LET[p]+' are close, and so are '+LET[q[0]]+' and '+LET[q[1]]+'.');return;}
    return false;}
};

/* ---------- level 2: the mountain, lights on ---------- */
HANDLERS.lit={
  init(c){const L=makeLit(keyFor(2));c.t=L.tree;c.D=range(4).map(i=>range(4).map(j=>i===j?0:null));c.true=L.D;c.pos=caveLayout(c.t);
    c.sel=null;c.byHand=0;c.pending=null;c.stage='rope';c.lit={nodes:c.t.N,edges:c.t.edges.length};
    say('Click an entrance to tie the rope there.');},
  rule:()=>'Lamps lit · the rope runs the only way through',
  scene(c){const ropes=c.rope?[{path:pathNodes(c.t,c.rope[0],c.rope[1]),draw:true}]:[];
    return {lit:true,svg:caveSVG(c.t,c.pos,{style:'lit',click:c.stage==='rope',ropes,selLeaf:c.sel,hot:new Set(c.rope||[])}),
      surveyor:c.sel!==null?c.pos.angles[c.sel]:c.rope?c.pos.angles[c.rope[0]]:c.pos.angles[0],label:'The mountain with the lamps lit'};},
  work(c){let h='<div class="sub">Rope readings</div>'+chartHTML(c.D,names4(4),{label:'Rope chart',cell:(i,j)=>{
      const p=c.pending;if(p&&((p[0]===i&&p[1]===j)||(p[0]===j&&p[1]===i)))return {html:handCell('r'),cls:'newrow'};return null;}});
    if(c.pending)h+='<p>The rope ran from '+LET[c.pending[0]]+' to '+LET[c.pending[1]]+'. Add up the tunnels it ran along and type the reading.</p>';
    if(c.stage==='count')h+='<div class="rows"><div class="rowline"><span class="lab">Entrances and junctions, in all:</span>'+handCell('nodes')+'</div>'+
      '<div class="rowline"><span class="lab">Tunnels:</span>'+handCell('tunnels')+'</div></div>';
    return h;},
  act(c,type,d){
    if(type!=='node'||c.stage!=='rope')return false;const v=d.v;
    if(c.pending){say('Type the reading for '+LET[c.pending[0]]+' to '+LET[c.pending[1]]+' first.','warn');return;}
    if(c.sel===null){c.sel=v;c.rope=null;say('Rope tied at '+LET[v]+'. Click the entrance to stretch it to.');return;}
    if(v===c.sel){c.sel=null;say('Rope untied. Click an entrance to tie it there.');return;}
    const a=Math.min(v,c.sel),b=Math.max(v,c.sel);c.sel=null;c.rope=[a,b];log('rope',{a:LET[a],b:LET[b]});
    if(c.D[a][b]!==null){say('The rope already read '+c.D[a][b]+' between '+LET[a]+' and '+LET[b]+'.');return;}
    if(c.byHand<2){c.pending=[a,b];delete c.hand.r;setHand('r',c.true[a][b],[],'Rope reading '+LET[a]+' to '+LET[b]);c.focus='r';
      say('Add the tunnel lengths along the rope.');return;}
    c.D[a][b]=c.D[b][a]=c.true[a][b];say('The rope reads '+c.true[a][b]+'.');this.check(c);},
  onWrong(c,id){if(id==='r')say('Not quite. Follow the orange rope and add the number on every tunnel it runs along.','warn');
    else say('Count again: every entrance and every junction is one; every tunnel between two of them is one.','warn');},
  onHand(c,id){if(id==='r'){const [a,b]=c.pending;c.D[a][b]=c.D[b][a]=c.true[a][b];c.pending=null;c.byHand++;
      say(c.byHand<2?'Right. One more by hand.':'Right. From now on the rope reads itself.','good');this.check(c);}
    else if(handOK(['nodes','tunnels']))complete(['tree','leaf','inode','blen'],'tree',c.t.N+' places, '+c.t.edges.length+' tunnels.');
    else c.focus=firstOpen(['nodes','tunnels']);},
  check(c){if(c.D.every((r,i)=>r.every(x=>x!==null))){c.stage='count';setHand('nodes',c.t.N,[],'Entrances and junctions');setHand('tunnels',c.t.edges.length,[],'Tunnels');
    c.focus='nodes';say('The chart is full. Now count the inside of the mountain.');}}
};

/* ---------- level 3: lights out, three leaves ---------- */
HANDLERS.y={
  init(c){const s=makeStar(keyFor(3));c.D=s.D;c.vals=['','',''];c.walkRes=null;c.walkLeft=3;
    c.map={n:3,N:4,edges:[0,1,2].map(i=>({a:i,b:3,w:0}))};c.pos=caveLayout(c.map);
    say('Type a length for each tunnel, then walk the map.');},
  rule:()=>'Lamps out · the rope is the only instrument · no loops',
  scene(c){const hidden=new Set([0,1,2].filter(i=>!(+c.vals[i]>0)));
    return {svg:caveSVG(c.map,c.pos,{style:'chalk',hidden,edgeText:i=>c.vals[i]}),surveyor:c.pos.angles[0],label:'Your map of three tunnels'};},
  work(c){return '<div class="sub">Rope readings</div>'+(c.walkRes?walkChart(c,names4(3)):chartHTML(c.D,names4(3),{label:'Rope chart'}))+
    '<div class="rows">'+[0,1,2].map(i=>'<div class="rowline"><span class="lab">Tunnel to '+LET[i]+':</span><input class="num" data-in="y'+i+'" inputmode="numeric" autocomplete="off" aria-label="Tunnel to '+LET[i]+'" value="'+esc(c.vals[i])+'"></div>').join('')+'</div>';},
  input(c,d){const k=+d.id.slice(1);c.vals[k]=String(d.value).trim();c.walkRes=null;log('y_len',{leaf:LET[k],value:c.vals[k]});
    const nxt=[0,1,2].find(i=>c.vals[i]==='');c.focus=nxt===undefined?null:'y'+nxt;
    say(nxt===undefined?'Three lengths typed. Walk the map to compare it with the ropes.':'Tunnel to '+LET[k]+': '+c.vals[k]+'.');},
  walk:true,canWalk:c=>c.vals.every(v=>v!==''&&isFinite(+v)),
  walk(c){c.map.edges.forEach((e,i)=>e.w=+c.vals[i]);const r=walkCompare(c.map,c.D);c.walkRes=r;log('walk',{ok:r.ok,bad:r.bad.length});
    if(r.ok)complete(['limb'],'limb','Every rope agrees with your map.');else walkSay(c,r);}
};

/* ---------- levels 4 and 5: the one building move ---------- */
function digForm(c){const t=c.cave,e=t.edges[c.sel];if(!e)return '';
  const dr=c.draft||{},nm=v=>nodeName(t,v),opt=v=>'<option value="'+v+'"'+(String(dr.from)===String(v)?' selected':'')+'>'+nm(v)+'</option>';
  return '<div class="dig" role="group" aria-label="Building move"><b>Tunnel '+esc(edgeName(t,c.sel))+'</b> <span>(length '+fmt(e.w)+')</span>'+
    '<label>Split it <input class="num" id="digX" inputmode="numeric" autocomplete="off" aria-label="Distance along the tunnel" value="'+esc(dr.x||'')+'"></label>'+
    '<label>from <select id="digFrom" aria-label="Measured from">'+opt(e.a)+opt(e.b)+'</select>,</label>'+
    '<label>and hang '+LET[c.next]+' on a limb of <input class="num" id="digL" inputmode="numeric" autocomplete="off" aria-label="Limb length" value="'+esc(dr.L||'')+'"></label>'+
    '<button class="primary" data-act="dig">Dig</button></div>';}
function growRows(c){if(c.next>=c.n)return '';const j=c.next,nj=LET[j];
  if(!c.calc)return '<div class="sub">'+nj+'’s limb, three ways</div><p>Pretend only '+nj+' and two of the others exist: then the map is a Y, as in level 3. What would '+nj+'’s limb be?</p><div class="rows">'+
    c.rowList.map(r=>'<div class="rowline"><span class="lab">'+nj+' with '+LET[r.i]+' and '+LET[r.k]+':</span>'+handCell('h'+r.i+r.k)+'</div>').join('')+'</div>';
  return '<div class="sub">Limb calculator for '+nj+'</div><div class="rows">'+c.rowList.map(r=>'<div class="rowline"><span class="lab">'+nj+' with '+LET[r.i]+' and '+LET[r.k]+':</span><b>'+fmt(r.v)+'</b></div>').join('')+'</div>';}
HANDLERS.grow={
  init(c){const n=c.L.n,g=makeGrow(keyFor(c.L.id),n);c.n=n;c.D=g.D;c.cave=cloneT(g.start);this.common(c,n===4?3:4,n>4);
    say(n===4?'Work out D’s limb three ways first.':'Click the tunnel C’s limb branches off.');},
  common(c,walks,calc){c.next=presentLeaves(c.cave).length;c.hist=[];c.sel=null;c.walkRes=null;c.walkLeft=walks;c.calc=calc;HANDLERS.grow.rows(c);},
  rows(c){if(c.next>=c.n)return;const j=c.next;c.rowList=limbRows(c.D,j,presentLeaves(c.cave));
    if(!c.calc)c.rowList.forEach(r=>setHand('h'+r.i+r.k,r.v,[[j,r.i],[j,r.k],[r.i,r.k]],LET[j]+' with '+LET[r.i]+' and '+LET[r.k]));
    if(!c.calc)c.focus=firstOpen(c.rowList.map(r=>'h'+r.i+r.k));},
  rule:()=>'Lamps out · one move: split a tunnel, hang a limb',
  scene(c){const pos=caveLayout(c.cave);
    return {svg:caveSVG(c.cave,pos,{style:'chalk',pick:!c.done&&c.next<c.n,sel:c.sel,jlabels:true}),surveyor:pos.angles[0],label:'Your map'};},
  chartView(c){const pl=presentLeaves(c.cave),n=c.D.length;
    if(c.walkRes)return walkChart(c,names4(n));
    return chartHTML(c.D,names4(n),{label:'Rope chart',cell:(i,j)=>{const inMap=x=>pl.includes(x),row=x=>x===c.next;
      if(i===j)return null;if((inMap(i)||row(i))&&(inMap(j)||row(j)))return row(i)||row(j)?{html:fmt(c.D[i][j]),cls:'newrow'}:null;return {html:'·',cls:'diag'};}});},
  work(c){let h=this.chartView(c);h+=growRows(c);
    if(c.sel!==null&&!c.done)h+=digForm(c);
    else if(c.next<c.n&&(c.calc||handOK(c.rowList.map(r=>'h'+r.i+r.k))))h+='<p>Click the tunnel '+LET[c.next]+'’s limb branches off.</p>';
    return h;},
  onHand(c){const ids=c.rowList.map(r=>'h'+r.i+r.k);c.focus=firstOpen(ids);
    if(handOK(ids))say('Three values. Which one is '+LET[c.next]+'’s limb? Click the tunnel it branches off, and dig it in.','good');},
  onWrong(c){say('Not what level 3’s Y gives for those three. The ropes it comes from are lit.','warn');},
  act(c,type,d){
    if(type==='tunnel'){if(c.next>=c.n){say('Every leaf is in. Walk the map.');return;}
      if(!c.calc&&!handOK(c.rowList.map(r=>'h'+r.i+r.k))){say('Work out the three values first.','warn');return;}
      c.sel=c.sel===d.e?null:d.e;c.draft=null;if(c.sel!==null)say('Where along '+edgeName(c.cave,c.sel)+' does '+LET[c.next]+' branch off, and how long is its limb?');return;}
    if(type==='dig'){const t=c.cave,e=t.edges[d.e];if(!e)return;c.draft={x:d.x,from:d.from,L:d.L};const x=Number(d.x),from=Number(d.from),L=Number(d.L);
      if(String(d.x).trim()===''||String(d.L).trim()===''){say('Type both lengths.','warn');return;}
      if(!whole(x)||!whole(L)||x<0||L<0){say('The rope is marked in whole lengths: type whole numbers.','warn');return;}
      if(x>=e.w||x===0){say('This tunnel is '+fmt(e.w)+' long. A split '+x+' from '+nodeName(t,from)+' is '+(x===0?'at its very end':'past its far end')+', not inside it.','warn');log('dig_reject',{x,w:e.w});return;}
      if(L===0){say('A limb of length 0 would put '+LET[c.next]+' inside the mountain.','warn');return;}
      c.hist.push({cave:cloneT(c.cave),next:c.next});
      c.cave=hang(t,d.e,x,from,c.next,L);c.draft=null;log('dig',{leaf:LET[c.next],tunnel:edgeName(t,d.e),x,from:nodeName(t,from),L});
      const j=c.next;c.next++;c.sel=null;c.walkRes=null;HANDLERS.grow.rows(c);
      say(LET[j]+' is dug in.'+(c.next<c.n?' Next: '+LET[c.next]+'.':' Walk the map to check it.'));return;}
    return false;},
  undo(c){const h=c.hist.pop();c.cave=h.cave;c.next=h.next;c.sel=null;c.walkRes=null;HANDLERS.grow.rows(c);say('Undone.');},
  canUndo:c=>c.hist&&c.hist.length>0,
  walk:true,
  walk(c){const r=walkCompare(c.cave,c.D);c.walkRes=r;log('walk',{ok:r.ok,bad:r.bad.length,leaves:r.leaves.length});
    if(r.ok&&c.next>=c.n)return complete(c.n===4?['additive']:['addphylo'],c.n===4?'additive':'addphylo','Every rope agrees with your map.');
    if(r.ok){say('Every rope so far agrees with the map. Next: '+LET[c.next]+'.','good');return;}
    walkSay(c,r);}
};

/* ---------- level 6: a chart no map fits ---------- */
HANDLERS.lie=Object.assign({},HANDLERS.grow,{
  init(c){const v=makeViruses(keyFor(1));c.v=v;c.n=4;c.D=v.D6;c.cave=cloneT(v.Y);HANDLERS.grow.common(c,2,true);c.stage='build';
    c.gap=fourPointGap(v.D6,[0,1,2,3]);c.failed=false;say('The Y for A, B and C is already on the map. Dig in D.');},
  rule:c=>c.stage==='sums'?'Three ways to pair four leaves':'Lamps out · one move: split a tunnel, hang a limb',
  canWalk:c=>c.stage==='build'&&c.next>=c.n,
  walk(c){const r=walkCompare(c.cave,c.D);c.walkRes=r;log('walk',{ok:r.ok,bad:r.bad.length});if(!r.ok)c.failed=true;walkSay(c,r);},
  skip:c=>c.stage==='build'&&c.failed&&!c.done?'Is there any map these ropes fit? →':null,
  skipAct(c){c.stage='sums';c.lit=makeLit(keyFor(2));c.walkRes=null;c.sel=null;
    const s=fourSums(c.lit.D,[0,1,2,3]),l=fourSums(c.D,[0,1,2,3]),P4=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
    P4.forEach((p,k)=>{setHand('s'+k,s[k],[],'Level 2, pairing '+(k+1));setHand('l'+k,l[k],[p[0],p[1]],'This chart, pairing '+(k+1));});
    c.focus='s0';log('sums_open');say('Back to level 2’s mountain, where every rope came from a real cave. For each way of pairing its four leaves, add the two rope readings.');},
  scene(c){if(c.stage!=='sums')return HANDLERS.grow.scene(c);const pos=caveLayout(c.lit.tree);
    return {lit:true,svg:caveSVG(c.lit.tree,pos,{style:'lit'}),label:'Level 2’s mountain, lamps lit'};},
  work(c){const names=['Patient A','Patient B','Patient C','Patient D'];
    let h='<div class="sub">The four viruses, 20 letters (the last 8 are new)</div>'+seqRows(c.v.seqs,names,{newFrom:12});
    if(c.stage!=='sums')return h+HANDLERS.grow.work.call(HANDLERS.grow,c);
    const P4=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],t=c.lit.tree,pos=caveLayout(t),pn=p=>LET[p[0]]+LET[p[1]];
    h+='<div class="sub">Level 2’s mountain: '+chartHTML(c.lit.D,names4(4),{label:'Level 2 chart'}).replace('<div class="chartwrap">','<div class="chartwrap" style="display:inline-block;vertical-align:top">')+'</div>';
    h+='<div class="pairings">'+P4.map((p,k)=>'<div class="pairing">'+miniSVG(t,pos,{style:'lit',label:pn(p[0])+' and '+pn(p[1]),
      ropes:[{path:pathNodes(t,p[0][0],p[0][1])},{path:pathNodes(t,p[1][0],p[1][1]),cls:'b',off:5}]})+
      '<div class="rowline">d('+pn(p[0])+') + d('+pn(p[1])+') = '+handCell('s'+k)+'</div></div>').join('')+'</div>';
    if(handOK(['s0','s1','s2'])){const sorted=fourSums(c.lit.D,[0,1,2,3]).slice().sort((a,b)=>b-a);
      h+='<p>Two of the three sums are equal, and they are the two largest ('+sorted[0]+' and '+sorted[1]+'). Now the patients’ chart:</p>'+
        chartHTML(c.D,names4(4),{label:'Patients chart'})+'<div class="rows">'+P4.map((p,k)=>'<div class="rowline">d('+pn(p[0])+') + d('+pn(p[1])+') = '+handCell('l'+k)+'</div>').join('')+'</div>';}
    return h;},
  onHand(c,id){if(c.stage!=='sums')return HANDLERS.grow.onHand(c,id);
    const S3=['s0','s1','s2'],L3=['l0','l1','l2'];c.focus=firstOpen(S3)||firstOpen(L3);
    if(handOK(S3)&&handOK(L3)){const l=fourSums(c.D,[0,1,2,3]).slice().sort((a,b)=>b-a);
      complete(['fourpoint'],'fourpoint','The two largest sums are '+l[0]+' and '+l[1]+'. No cave gives ropes like these.');}
    else if(handOK(S3)&&id[0]==='s')say('Look at the pictures: in two of the pairings both ropes run along the middle tunnel.','good');},
  onWrong(c,id){if(c.stage!=='sums')return HANDLERS.grow.onWrong(c,id);say(id[0]==='s'?'Add the two readings: the orange rope and the blue rope.':'Add the two chart entries that are lit.','warn');}
});

/* ---------- level 7: the steady-digging story ---------- */
function leafOrderOf(t,root){const A=adjOf(t),out=[];(function d(v,p){if(v<t.n){out.push(v);return;}A[v].filter(x=>x.v!==p).map(x=>x.v).sort((a,b)=>a-b).forEach(x=>d(x,v));})(root,-1);return out;}
HANDLERS.clock={
  init(c){const k=makeClock(keyFor(7));c.k=k;c.D=k.D;c.up=k.up;c.j=0;c.stage='pick';c.picked=null;
    c.cl=range(4).map(i=>({id:i,name:LET[i],members:[i],h:0}));c.forest={n:4,N:4,edges:[],H:[0,0,0,0]};
    c.order=leafOrderOf(k.tree,k.tree.root);c.Hroot=k.tree.H[k.tree.root];c.dist={};
    for(let i=0;i<4;i++)for(let j=0;j<4;j++)c.dist[i+','+j]=k.D[i][j];
    say('Click the chart entry for the two leaves whose crews split last.');},
  rule:()=>'Steady digging · every leaf equally far from the first chamber',
  dd(c,a,b){return a===b?0:c.dist[a+','+b];},
  pos(c){const pos=Array(c.forest.N).fill(null),ang={};c.order.forEach((v,i)=>{ang[v]=148-i*116/3;pos[v]=polar(RS,ang[v]);});
    for(let m=4;m<c.forest.N;m++){const kids=c.forest.edges.filter(e=>e.a===m).map(e=>e.b);ang[m]=kids.reduce((s,x)=>s+ang[x],0)/kids.length;
      pos[m]=polar(RS-(RS-72)*(c.forest.H[m]/c.Hroot),ang[m]);}
    pos.angles=ang;return pos;},
  scene(c){const pos=this.pos(c);let ghost='';
    if(c.ghost){const g=c.ghost,ang=(pos.angles[g.a]+pos.angles[g.b])/2,q=polar(RS-(RS-72)*(g.h/c.Hroot),ang);
      [g.a,g.b].forEach(v=>{ghost+='<path d="M'+P(pos[v])+' L'+P(q)+'" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="6 6"/>';});
      ghost+='<circle cx="'+f1(q.x)+'" cy="'+f1(q.y)+'" r="11" fill="#2a1d12" stroke="#ff6b6b" stroke-width="3"/><text class="capsvg" x="'+f1(q.x+16)+'" y="'+f1(q.y+6)+'">'+fmt(g.h)+' deep?</text>';
      if(g.x!==undefined)ghost+='<path class="rope" d="M'+P(pos[g.x])+' L'+P(q)+' L'+P(pos[g.z])+'"/>';}
    return {svg:ghost+caveSVG(c.forest,pos,{style:'chalk',extraLeaves:range(4).filter(v=>!presentLeaves(c.forest).includes(v)),root:c.done?c.forest.N-1:undefined,
      edgeText:i=>fmt(c.forest.edges[i].w)}),surveyor:pos.angles[c.order[0]],label:'Your map, dug from the first chamber'};},
  work(c){if(c.done)return '<div class="sub">Rope readings</div>'+chartHTML(c.D,names4(4),{label:'Rope chart'});const names=c.cl.map(x=>x.name);
    let h='<div class="sub">'+(c.j?'The chart, with joined groups':'Rope readings')+'</div>'+chartHTML(null,names,{label:'Current chart',cell:(i,j)=>{
      if(i===j)return null;const pk=c.picked&&((c.picked[0]===i&&c.picked[1]===j)||(c.picked[0]===j&&c.picked[1]===i));
      return {html:fmt(this.dd(c,c.cl[i].id,c.cl[j].id)),cls:(c.stage==='pick'&&!c.done?'pick':'')+(pk?' chosen':''),attr:c.stage==='pick'&&!c.done?' data-cell="'+i+','+j+'"':''};}});
    if(c.stage==='fill'){const [i,j]=c.picked,A=c.cl[i],B=c.cl[j],rest=c.cl.filter((_,x)=>x!==i&&x!==j);
      h+='<div class="rows"><div class="rowline"><span class="lab">Depth of the junction where '+A.name+' and '+B.name+' split:</span>'+handCell('h')+'</div>'+
        rest.map(r=>'<div class="rowline"><span class="lab">'+A.name+'·'+B.name+' to '+r.name+(A.members.length+B.members.length>2?' (average over the leaves)':' (average)')+':</span>'+handCell('a'+r.id)+'</div>').join('')+'</div>';}
    return h;},
  act(c,type,d){if(type!=='cell'||c.stage!=='pick')return false;
    const A=c.cl[d.i],B=c.cl[d.j],J=c.up.joins[c.j],ok=(J.a===A.id&&J.b===B.id)||(J.a===B.id&&J.b===A.id),dAB=this.dd(c,A.id,B.id);
    log('join_pick',{a:A.name,b:B.name,ok});
    if(!ok){c.wrong++;
      const closer=[];[A,B].forEach(X=>c.cl.forEach(Z=>{if(Z!==A&&Z!==B&&this.dd(c,X.id,Z.id)<dAB)closer.push([X,Z]);}));
      c.ghost={a:A.id,b:B.id,h:dAB/2};
      if(closer.length){const [X,Z]=closer[0];if(X.members.length===1&&Z.members.length===1){c.ghost.x=X.id;c.ghost.z=Z.id;}say('If the crews to '+A.name+' and '+B.name+' were the last to split, at a junction '+fmt(dAB/2)+' deep, every other rope from '+X.name+' would climb at least that deep and back: '+fmt(dAB)+' or more. The rope from '+X.name+' to '+Z.name+' reads '+fmt(this.dd(c,X.id,Z.id))+'.','warn');}
      else{const Ja=c.cl.find(x=>x.id===J.a),Jb=c.cl.find(x=>x.id===J.b);say(A.name+' and '+B.name+' split '+fmt(dAB/2)+' deep, but the crews to '+Ja.name+' and '+Jb.name+' split only '+fmt(J.d/2)+' deep: later.','warn');}
      return;}
    c.ghost=null;c.picked=[d.i,d.j];c.stage='fill';c.hotCells=[];
    setHand('h',J.h,[[d.i,d.j]],'Depth of the junction');
    c.cl.forEach((r,x)=>{if(x!==d.i&&x!==d.j)setHand('a'+r.id,J.row[r.id],[[d.i,x],[d.j,x]],'Distance to '+r.name);});
    c.focus='h';say('Both crews dug at the same rate from that junction to the surface. How deep is it?');},
  onWrong(c,id){say(id==='h'?'The rope from one leaf to the other runs up one crew’s tunnel and down the other’s, and the two are the same length.':'Average the lit readings.','warn');},
  onHand(c,id){const ids=Object.keys(c.hand);c.focus=firstOpen(ids);if(!handOK(ids))return;this.join(c);
    if(c.j===2){this.join(c);complete(['rooted','clock','upgma'],'clock','The last two groups meet in the first chamber, '+fmt(c.forest.H[c.forest.N-1])+' deep. Walked, the map reproduces every rope.');}
    else say('Joined. Now the next pair whose crews split last.','good');},
  join(c){const J=c.up.joins[c.j],A=c.cl.find(x=>x.id===J.a),B=c.cl.find(x=>x.id===J.b),m=c.forest.N++;c.forest.H[m]=J.h;
    c.forest.edges.push({a:m,b:A.id,w:J.h-A.h},{a:m,b:B.id,w:J.h-B.h});
    const C={id:m,name:A.name+'·'+B.name,members:A.members.concat(B.members),h:J.h};
    J.rest.forEach(r=>{c.dist[m+','+r]=c.dist[r+','+m]=J.row[r];});
    c.cl=c.cl.filter(x=>x!==A&&x!==B).concat([C]);c.j++;c.hand={};c.picked=null;c.stage='pick';log('join',{a:A.name,b:B.name,h:J.h});}
};

/* ---------- neighbor joining, by hand ---------- */
function labelName(t,v,names){return v<t.n?(names||LET)[v]:'J'+(v-t.n+1);}
function totalsCol(R,names,hand){return i=>'<td class="'+(hand?'':'diag')+'">'+(hand?handCell('t'+i):fmt(R.total[i]))+'</td>';}
function dstarChart(c,R,names,o){o=o||{};const m=R.labels.length;
  return chartHTML(null,names,{label:'Discounted chart',corner:'D*',cell:(i,j)=>{
    if(i===j)return {html:'0',cls:'diag'};
    const chosen=c.chosen&&((c.chosen[0]===i&&c.chosen[1]===j)||(c.chosen[0]===j&&c.chosen[1]===i));
    if(o.hand&&i<j)return {html:handCell('d'+i+'_'+j),cls:''};
    if(o.hand&&i>j){const h=c.hand['d'+j+'_'+i];return {html:h&&h.ok?fmt(h.want):'',cls:'diag'};}
    return {html:fmt(R.Dstar[i][j]),cls:(o.pick?'pick':'')+(chosen?' chosen':''),attr:o.pick?' data-cell="'+i+','+j+'"':''};}});}
function njLimbs(R,i,j){const m=R.labels.length,delta=(R.total[i]-R.total[j])/(m-2);return [(R.D[i][j]+delta)/2,(R.D[i][j]-delta)/2];}
const HAND_TOT='<p><b>Handed over</b> (Saitou and Nei, 1987): do not trust the smallest entry of the chart. Discount every entry by how far its two leaves are from everybody else. First each leaf’s <b>TotalDistance</b>, the sum of its row.</p>';
const HAND_DS=n=>'<p>Then the discounted chart, <span class="formula">D*(i, j) = (n − 2) · D(i, j) − TotalDistance(i) − TotalDistance(j)</span>, with n = '+n+'.</p>';
const HAND_PICK='<p>The guarantee: when a chart fits a tree exactly, the smallest entry of D* is always two leaves that share an internal node. (It was proved after 1987; this game does not prove it.) Click the smallest entry.</p>';
const HAND_LIMB='<p>Their limbs: <span class="formula">Δ = (TotalDistance(i) − TotalDistance(j)) / (n − 2)</span>, <span class="formula">limb(i) = (D(i, j) + Δ) / 2</span>, <span class="formula">limb(j) = (D(i, j) − Δ) / 2</span>.</p>';
const HAND_MERGE='<p>Then the pair is replaced by their internal node m, with <span class="formula">D(k, m) = (D(k, i) + D(k, j) − D(i, j)) / 2</span> for every other leaf k, and the same steps repeat on the smaller chart.</p>';
function setTotals(c,R){R.labels.forEach((_,i)=>setHand('t'+i,R.total[i],R.labels.map((_,j)=>[i,j]),'Row total '+(i+1)));}
function setDstar(c,R){const m=R.labels.length;for(let i=0;i<m;i++)for(let j=i+1;j<m;j++)setHand('d'+i+'_'+j,R.Dstar[i][j],[[i,j]],'D* '+(i+1)+','+(j+1));}
function dsIds(R){const m=R.labels.length,o=[];for(let i=0;i<m;i++)for(let j=i+1;j<m;j++)o.push('d'+i+'_'+j);return o;}
function isMinPair(R,i,j){const a=R.labels[i],b=R.labels[j];return R.mins.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));}

HANDLERS.fast={
  init(c){const f=makeFast(keyFor(8));c.f=f;c.D=f.D;c.R=f.nj.rounds[0];c.stage='try';c.walkLeft=1;c.chosen=null;
    say('Try the level 7 method first.');},
  rule:c=>c.stage==='try'||c.stage==='upgma'?'Lamps out · closest pair first?':'Lamps out · discount, then join',
  skip:c=>c.stage==='try'?'Join the closest pairs, as in level 7':null,
  skipAct(c){c.stage='upgma';log('upgma_run');say('Closest-pair joining built this map. Walk it.');},
  canWalk:c=>c.stage==='upgma',walk:true,
  walk(c){const r=walkCompare(unroot(c.f.up.tree),c.D);c.walkRes=r;log('walk',{ok:r.ok,bad:r.bad.length});
    c.stage='totals';setTotals(c,c.R);c.focus='t0';
    const fast=this.fastLeaf(c);say('The map fails: '+plural(r.bad.length,'rope')+' disagree. With the lamps lit, the real mountain shows why: the crew to '+LET[fast]+' dug fast, so '+LET[fast]+' looks far from everyone.','warn');},
  fastLeaf(c){const t=c.f.tree;let best=-1,leaf=0;t.edges.forEach(e=>{const l=e.a<4?e.a:e.b<4?e.b:-1;if(l>=0&&e.w>best){best=e.w;leaf=l;}});return leaf;},
  scene(c){const f=c.f;
    if(c.stage==='try')return {svg:caveSVG({n:4,N:4,edges:[]},caveLayout(f.tree),{extraLeaves:[0,1,2,3]}),surveyor:90,label:'Four leaves, lamps out'};
    if(c.stage==='upgma'){const u=f.up.tree,pos=caveLayout(u,{root:u.root,H:u.H});return {svg:caveSVG(u,pos,{style:'chalk',root:u.root,jlabels:false}),surveyor:pos.angles[0],label:'Closest-pair map'};}
    if(c.done){const t=f.nj.tree,pos=caveLayout(t);return {svg:caveSVG(t,pos,{style:'chalk'}),surveyor:pos.angles[0],label:'Neighbor-joining map'};}
    const pos=caveLayout(f.tree);return {lit:true,svg:caveSVG(f.tree,pos,{style:'lit'}),label:'The real mountain, lamps lit'};},
  work(c){const R=c.R,names=names4(4);let h='';
    if(c.stage==='try'||c.stage==='upgma')return '<div class="sub">Rope readings</div>'+chartHTML(c.D,names,{label:'Rope chart'});
    const u=c.f.up.tree,up=unroot(u);
    h+='<div class="side"><div>'+miniSVG(u,caveLayout(u,{root:u.root,H:u.H}),{style:'chalk',root:u.root,label:'Closest-pair map'})+'<div class="cap">Closest-pair map: fails the walk</div></div>'+
      '<div><div class="sub">Walk of the closest-pair map</div>'+walkChart(c,names)+'</div></div>';
    h+='<div class="handover">'+HAND_TOT;
    h+=chartHTML(c.D,names,{label:'Rope chart with totals',extraHead:'<th>Total</th>',extraCol:totalsCol(R,names,true)});
    if(['dstar','pick','limbs'].includes(c.stage)||c.done){h+=HAND_DS(4)+dstarChart(c,R,names,{hand:c.stage==='dstar',pick:c.stage==='pick'});}
    if(c.stage==='pick'||c.stage==='limbs'||c.done)h+=HAND_PICK;
    if(c.stage==='limbs'||c.done){const [i,j]=c.chosen;h+=HAND_LIMB+'<div class="rows"><div class="rowline"><span class="lab">limb('+names[i]+'):</span>'+handCell('li')+'</div>'+
      '<div class="rowline"><span class="lab">limb('+names[j]+'):</span>'+handCell('lj')+'</div></div>';}
    if(c.done)h+=HAND_MERGE;
    return h+'</div>';},
  onHand(c){const R=c.R;
    if(c.stage==='totals'){const ids=R.labels.map((_,i)=>'t'+i);c.focus=firstOpen(ids);if(handOK(ids)){c.stage='dstar';setDstar(c,R);c.focus='d0_1';say('Totals done. Now the discounted chart.','good');}return;}
    if(c.stage==='dstar'){const ids=dsIds(R);c.focus=firstOpen(ids);if(handOK(ids)){c.stage='pick';say('Click the smallest entry of D*.','good');}return;}
    if(c.stage==='limbs'&&handOK(['li','lj'])){log('nj_done');complete(['unrooted','neighbors','njm','nj'],'nj','The rest of the joins follow the same steps. The finished map reproduces every rope.');}
    else c.focus=firstOpen(['li','lj']);},
  onWrong(c,id){say(id[0]==='t'?'Add up the whole lit row.':id[0]==='d'?'(n − 2) times the chart entry, minus both totals. The entry is lit.':'Work out Δ first, then halve D(i, j) plus or minus it.','warn');},
  act(c,type,d){if(type!=='cell'||c.stage!=='pick')return false;const R=c.R;log('dstar_pick',{i:d.i,j:d.j,ok:isMinPair(R,d.i,d.j)});
    if(!isMinPair(R,d.i,d.j)){c.wrong++;say('D* has a smaller entry than '+fmt(R.Dstar[d.i][d.j])+'.','warn');return;}
    c.chosen=[Math.min(d.i,d.j),Math.max(d.i,d.j)];const [li,lj]=njLimbs(R,c.chosen[0],c.chosen[1]);c.stage='limbs';
    setHand('li',li,[[c.chosen[0],c.chosen[1]]],'limb '+LET[c.chosen[0]]);setHand('lj',lj,[[c.chosen[0],c.chosen[1]]],'limb '+LET[c.chosen[1]]);c.focus='li';
    say(LET[c.chosen[0]]+' and '+LET[c.chosen[1]]+'. Now their limbs.');}
};

HANDLERS.join5={
  init(c){const j=makeJoin5(keyFor(9));c.j5=j;c.D=j.D;c.R=j.nj.rounds[0];c.stage='dstar';c.chosen=null;setDstar(c,c.R);c.focus='d0_1';
    say('The row totals are calculated. Fill in the discounted chart.');},
  rule:c=>c.stage==='lie'?'A chart no tree fits':'Discount, join, repeat',
  names:()=>names4(5),
  scene(c){const t=c.j5.nj.tree,pos=caveLayout(t);
    if(c.stage==='lie'){const L=c.lie,p=caveLayout(L);return {svg:caveSVG(L,p,{style:'chalk'}),surveyor:p.angles[0],label:'Neighbor joining on level 6’s chart'};}
    if(c.stage==='built')return {svg:caveSVG(t,pos,{style:'chalk'}),surveyor:pos.angles[0],label:'Neighbor-joining map'};
    let part={n:5,N:t.N,edges:[]};if(c.stage==='merge'){const R=c.R;part.edges=t.edges.slice(0,2);}
    return {svg:caveSVG(part,pos,{style:'chalk',extraLeaves:range(5).filter(v=>!presentLeaves(part).includes(v))}),surveyor:90,label:'Your map so far'};},
  work(c){const R=c.R,names=names4(5);let h='';
    if(c.stage==='lie'){return '<div class="sub">Level 6’s patients: the walk of the neighbor-joining map</div>'+walkChart(c,names4(4));}
    h+=chartHTML(c.D,names,{label:'Rope chart with totals',extraHead:'<th>Total</th>',extraCol:totalsCol(R,names,false)});
    h+=dstarChart(c,R,names,{hand:c.stage==='dstar',pick:c.stage==='pick'});
    if(c.chosen){const [i,j]=c.chosen;h+='<div class="rows"><div class="rowline"><span class="lab">limb('+names[i]+'):</span>'+handCell('li')+'</div><div class="rowline"><span class="lab">limb('+names[j]+'):</span>'+handCell('lj')+'</div></div>';}
    if(c.stage==='merge'||c.stage==='built'){const [i,j]=c.chosen;h+='<div class="sub">The merged row: distances from their internal node m</div><div class="rows">'+
      range(5).filter(k=>k!==i&&k!==j).map(k=>'<div class="rowline"><span class="lab">D('+names[k]+', m):</span>'+handCell('m'+k)+'</div>').join('')+'</div>';}
    if(c.stage==='built')h+='<div class="sub">Walk of the finished map</div>'+walkChart(c,names);
    return h;},
  onWrong(c,id){say(id[0]==='d'?'(n − 2) times the chart entry, minus both totals. n = 5.':id[0]==='m'?'(D(k, i) + D(k, j) − D(i, j)) / 2. The entries are lit.':'Δ = (TotalDistance(i) − TotalDistance(j)) / (n − 2), then halve D(i, j) plus or minus Δ.','warn');},
  onHand(c){const R=c.R;
    if(c.stage==='dstar'){const ids=dsIds(R);c.focus=firstOpen(ids);if(handOK(ids)){c.stage='pick';say('Click the smallest entry of D*.','good');}return;}
    if(c.stage==='limbs'){c.focus=firstOpen(['li','lj']);if(handOK(['li','lj'])){c.stage='merge';const [i,j]=c.chosen;
      range(5).filter(k=>k!==i&&k!==j).forEach(k=>setHand('m'+k,(R.D[k][i]+R.D[k][j]-R.D[i][j])/2,[[k,i],[k,j],[i,j]],'D('+LET[k]+', m)'));c.focus=firstOpen(Object.keys(c.hand).filter(x=>x[0]==='m'));
      say('Now the merged row.','good');}return;}
    if(c.stage==='merge'){const ids=Object.keys(c.hand).filter(x=>x[0]==='m');c.focus=firstOpen(ids);
      if(handOK(ids)){c.stage='built';c.walkRes=walkCompare(c.j5.nj.tree,c.D);log('nj_done');say('The game ran the later rounds the same way. Walked, the map reproduces every rope.','good');}}},
  skip:c=>c.stage==='built'&&!c.done?'Now try it on level 6’s chart →':null,
  skipAct(c){const v=makeViruses(keyFor(1));c.lie=nj(v.D6).tree;c.D=v.D6;c.walkRes=walkCompare(c.lie,v.D6);c.stage='lie';log('nj_lie');
    complete([],'join5','Neighbor joining still returns a tree, with '+plural(c.walkRes.bad.length,'rope')+' that disagree.');},
  act(c,type,d){if(type!=='cell'||c.stage!=='pick')return false;const R=c.R;log('dstar_pick',{i:d.i,j:d.j,ok:isMinPair(R,d.i,d.j)});
    if(!isMinPair(R,d.i,d.j)){c.wrong++;say('D* has a smaller entry than '+fmt(R.Dstar[d.i][d.j])+'.','warn');return;}
    c.chosen=[R.i,R.j];c.stage='limbs';setHand('li',R.li,[[R.i,R.j]],'limb '+LET[R.i]);setHand('lj',R.lj,[[R.i,R.j]],'limb '+LET[R.j]);c.focus='li';
    say(LET[R.i]+' and '+LET[R.j]+' are joined first. Their limbs?');}
};

/* ---------- level 10: one swap ---------- */
function subEdges(t,from,avoid){const A=adjOf(t),out=[],seen=new Set([avoid,from]),st=[from];
  out.push(edgeIndex(t,avoid,from));while(st.length){const u=st.pop();A[u].forEach(y=>{if(!seen.has(y.v)){seen.add(y.v);out.push(y.i);st.push(y.v);}});}return out;}
HANDLERS.swap={
  init(c){const w=makeSwap(keyFor(10));c.w=w;c.D=w.D;c.t=cloneT(w.start);c.hist=[];c.selE=null;say('Click an inner tunnel.');},
  rule:()=>'Score: foursomes the map pairs the way the chart does',
  score:c=>quartetScore(c.t,c.D),
  groups(c){if(c.selE===null)return null;const t=c.t,e=t.edges[c.selE],A=adjOf(t),u=e.a,v=e.b;
    const nu=A[u].filter(x=>x.v!==v).map(x=>x.v),nv=A[v].filter(x=>x.v!==u).map(x=>x.v);
    return [[nu[0],u],[nu[1],u],[nv[0],v],[nv[1],v]].map(([r,p])=>({root:r,parent:p,leaves:subLeaves(t,r,p),edges:subEdges(t,r,p)}));},
  scene(c){const t=c.t,pos=caveLayout(t,{order:range(6)}),g=this.groups(c),subs={};
    if(g)g.forEach((x,k)=>x.edges.forEach(i=>subs[i]='tn-sub'+k));
    return {svg:caveSVG(t,pos,{style:'chalk',lengths:false,pick:!c.done,sel:c.selE,subs,pickable:i=>t.edges[i].a>=t.n&&t.edges[i].b>=t.n}),surveyor:pos.angles[0],label:'The map to repair'};},
  work(c){const s=this.score(c),qs=quads(6),sp=splitsOf(c.t),pr=(q,k)=>k<0?'?':k===0?LET[q[0]]+LET[q[1]]+'|'+LET[q[2]]+LET[q[3]]:k===1?LET[q[0]]+LET[q[2]]+'|'+LET[q[1]]+LET[q[3]]:LET[q[0]]+LET[q[3]]+'|'+LET[q[1]]+LET[q[2]];
    let h='<p><b>Score: '+s+' of '+c.w.max+'</b> foursomes.</p>';
    const g=this.groups(c);
    if(g&&!c.done){const nm=x=>'{'+x.leaves.map(l=>LET[l]).join(' ')+'}';
      h+='<p>Off this tunnel hang four groups: <span style="color:#d6336c">'+nm(g[0])+'</span>, <span style="color:#1c7ed6">'+nm(g[1])+'</span> on one side; <span style="color:#5c940d">'+nm(g[2])+'</span>, <span style="color:#b08900">'+nm(g[3])+'</span> on the other. The two other ways to hang them:</p>'+
        '<div class="choice"><button data-act="swap" data-k="0">Swap '+nm(g[1])+' and '+nm(g[2])+'</button><button data-act="swap" data-k="1">Swap '+nm(g[1])+' and '+nm(g[3])+'</button></div>';}
    h+='<div class="sub">The fifteen foursomes</div><div class="quads">'+qs.map(q=>{const ch=chartPairing(c.D,q),mp=shapePairing(sp,q),ok=ch===mp;
      return '<span class="'+(ok?'ok':'no')+'">'+(ok?'✓ ':'✗ ')+'chart '+pr(q,ch)+(ok?'':' · map '+pr(q,mp))+'</span>';}).join('')+'</div>';
    h+=chartHTML(c.D,names4(6),{label:'Rope chart'});
    return h;},
  act(c,type,d){const t=c.t;
    if(type==='tunnel'){const e=t.edges[d.e];if(!e||e.a<t.n||e.b<t.n){say('That tunnel ends at a leaf: there is nothing to swap across it.','warn');return;}
      c.selE=c.selE===d.e?null:d.e;say(c.selE===null?'Click an inner tunnel.':'Choose a swap, or click another inner tunnel.');return;}
    if(type==='swap'&&c.selE!==null){const o=nniOptions(t).filter(x=>x.edge===c.selE)[+d.k];if(!o)return;const before=this.score(c);
      c.hist.push(cloneT(t));c.t=o.tree;c.selE=null;const s=this.score(c);log('swap',{edge:c.selE,k:+d.k,score:s});
      if(s===c.w.max)return complete(['nni'],'nni','Score '+s+' of '+c.w.max+': every foursome agrees with the chart.');
      say('Score '+before+' → '+s+'.'+(s<=before?' Undo, and try another swap.':''),s>before?'good':'warn');return;}
    return false;},
  undo(c){c.t=c.hist.pop();c.selE=null;say('Undone. Score '+this.score(c)+'.');},canUndo:c=>c.hist.length>0
};

/* ---------- level 11: whose virus? ---------- */
HANDLERS.final={
  init(c){c.D=SARS.D;c.r=nj(SARS.D);c.round=0;c.stage='join';c.names=SARS.short;c.pos=caveLayout(c.r.tree);
    say('Round 1: click the smallest entry of the discounted chart.');},
  rule:c=>c.stage==='ask'?'Find the human viruses’ closest relative':'Neighbor joining · the calculator does the arithmetic',
  scene(c){const t=c.r.tree,n=Math.min(c.round,c.r.rounds.length),part={n:6,N:t.N,edges:c.stage==='join'?t.edges.slice(0,2*n):t.edges};
    return {svg:caveSVG(part,c.pos,{style:'chalk',names:c.names,click:c.stage==='ask'&&!c.done,extraLeaves:range(6).filter(v=>!presentLeaves(part).includes(v)),hot:new Set(c.stage==='ask'?[0,1]:[])}),
      surveyor:c.pos.angles[0],label:'The coronavirus tree'};},
  work(c){const lab='<p><span class="illus">Illustrative</span> These distances were made up to have the shape of the published trees; they are not measurements.</p>';
    if(c.stage==='ask'||c.done){return lab+'<p>Which virus shares an internal node with the two human viruses? Click its entrance.</p>'+chartHTML(c.D,c.names,{label:'Chart'});}
    const R=c.r.rounds[c.round],nm=R.labels.map(v=>labelName(c.r.tree,v,c.names));
    return lab+'<div class="sub">Round '+(c.round+1)+': the chart</div>'+chartHTML(R.D,nm,{label:'Chart',extraHead:'<th>Total</th>',extraCol:totalsCol(R,nm,false)})+
      '<div class="sub">The discounted chart</div>'+dstarChart(c,R,nm,{pick:true});},
  act(c,type,d){
    if(type==='cell'&&c.stage==='join'){const R=c.r.rounds[c.round];log('dstar_pick',{i:d.i,j:d.j,ok:isMinPair(R,d.i,d.j)});
      if(!isMinPair(R,d.i,d.j)){c.wrong++;say('D* has a smaller entry than '+fmt(R.Dstar[d.i][d.j])+'.','warn');return;}
      c.round++;const nm=v=>labelName(c.r.tree,v,c.names);
      if(c.r.rounds[c.round]&&c.r.rounds[c.round].labels.length===3){c.round=c.r.rounds.length;c.stage='ask';
        say('Joined '+nm(R.labels[d.i])+' and '+nm(R.labels[d.j])+'. The last three are joined at one internal node. The tree is built.','good');}
      else say('Joined '+nm(R.labels[d.i])+' and '+nm(R.labels[d.j])+'. Round '+(c.round+1)+'.','good');return;}
    if(type==='node'&&c.stage==='ask'){log('answer',{leaf:c.names[d.v]});
      if(d.v===2){const missing=VOCAB.filter(x=>!knows(x.id)).map(x=>x.id);return complete(missing,'finale','The civet virus hangs from the internal node next to the human pair.');}
      if(d.v<2){say('That is one of the human viruses. Which other leaf hangs nearest to them?','warn');return;}
      c.wrong++;say(c.names[d.v]+' branches off further in: follow the tunnels from the human pair’s internal node.','warn');return;}
    return false;}
};

/* ---------- the workbench (?bench=1) ---------- */
function bench(){
  document.title='Hollow Mountain workbench';
  const ex='A 0 11 10 9\nB 11 0 3 8\nC 10 3 0 7\nD 9 8 7 0';
  $('#app').innerHTML='<div class="bench"><h1>Hollow Mountain workbench</h1><p>Paste a distance chart, one row per line: a name, then its distances. Two methods run on it side by side.</p>'+
    '<textarea id="bIn" aria-label="Distance chart" spellcheck="false">'+ex+'</textarea><p><button class="primary" id="bRun">Run both methods</button> <a href="./">Back to the game</a></p><div id="bOut"></div></div>';
  const run=()=>{const p=parseChart($('#bIn').value||ex),out=$('#bOut');if(p.error){out.innerHTML='<p class="status warn">'+esc(p.error)+'</p>';return;}
    const {names,D}=p,nmOf=(t,v)=>v<t.n?names[v]:'J'+(v-t.n+1),total=quads(D.length).length;
    const show=(title,t)=>{const fits=sameMatrix(leafDist(t),D);
      return '<div><h2>'+title+'</h2><pre>'+t.edges.map(e=>nmOf(t,e.a)+' – '+nmOf(t,e.b)+': '+fmt(e.w)).join('\n')+'</pre><p>Reproduces the chart: <b>'+(fits?'yes':'no')+'</b><br>Foursome score: <b>'+quartetScore(t,D)+' of '+total+'</b></p></div>';};
    let h='<div class="side">'+show('Closest-pair joining (UPGMA)',upgma(D).tree)+show('Neighbor joining',nj(D).tree)+'</div>';
    h+=additiveCheck(D)?show('Additive phylogeny (the chart fits a tree exactly)',additivePhylogeny(D)):'<p>No tree fits this chart exactly: some foursome breaks the four-point condition, so there is no additive phylogeny.</p>';
    out.innerHTML=h;};
  $('#bRun').onclick=run;run();
}


/* ---------- level loading, completion ---------- */
function loadLevel(id){
  const L=LEVELS[id-1],variant=S.variants[id]||0;
  cur={L,variant,key:S.seed+'|'+id+'|'+variant,mode:L.mode,done:false,blocks:[],hand:{},hotCells:[],msg:{text:'',kind:''},t0:Date.now(),
       walkLeft:3,walks:0,wrong:0,rope:null,focus:null};
  HANDLERS[L.mode].init(cur);
  log('load',{mode:L.mode});
  render();
}
function grant(ids){let fresh=false;ids.forEach(id=>{if(!S.badges.includes(id)){S.badges.push(id);S.earnedAt[id]=cur.L.id;fresh=true;}});return fresh;}
function complete(ids,block,text){
  cur.done=true;cur.focus=null;
  if(ids&&ids.length)grant(ids);
  if(block)cur.blocks.push(block);
  if(cur.L.id<LEVELS.length)S.unlocked=Math.max(S.unlocked,cur.L.id+1);
  say(text||'Level complete.','good');
  log('complete',{ms:Date.now()-cur.t0,wrong:cur.wrong,walks:cur.walks,earned:ids||[]});
}
function srcCard(id){const s=SRC[id];
  return '<div class="src"><span class="tag">Primary source</span><a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+': “'+s.title+'”</a> <span class="gmeta">'+s.where+'.</span><br>'+s.look+'</div>';}
function renderPanel(){
  if(!cur.done){$('#panel').innerHTML='';return;}
  let h='<div class="reveal"><h3>Level '+cur.L.id+' complete</h3>';
  cur.blocks.forEach(id=>{const B=BLOCKS[id];h+='<div class="called"><p>'+(typeof B.html==='function'?B.html():B.html)+'</p></div>';(B.src||[]).forEach(s=>h+=srcCard(s));});
  const missing=VOCAB.filter(x=>!knows(x.id)).length;
  if(cur.L.id<LEVELS.length)h+='<button class="primary advance" id="next">Next level →</button>';
  else h+='<p>'+(missing?plural(missing,'vocabulary term')+' still hidden: replay the levels whose dots are open.':'You have earned the whole vocabulary. Your field guide, below, lists every term with its source.')+'</p>';
  $('#panel').innerHTML=h+'</div>';
}
function renderHeader(){
  $('#pips').innerHTML=LEVELS.map(l=>'<button data-lvl="'+l.id+'"'+(!previewLevel&&l.id>S.unlocked?' disabled':'')+
    (l.id===cur.L.id?' class="on" aria-current="true"':'')+' aria-label="Level '+l.id+'">'+l.id+'</button>').join('');
  $('#badges').innerHTML=VOCAB.map(x=>knows(x.id)
    ?'<span class="badge got term" tabindex="0">'+x.name+'<span class="tip" role="tooltip"><b>'+x.name+'</b>'+x.def+'</span></span>'
    :'<span class="badge">? ? ?</span>').join('');
}
function renderGuide(){
  const got=VOCAB.filter(v=>knows(v.id));
  $('#gcount').textContent=got.length+' of '+VOCAB.length+' terms';
  const rows=TRANSLATE.filter(r=>r[3].every(knows));
  $('#guideBody').innerHTML='<p class="gmeta">Hollow Mountain field guide · puzzle code '+esc(S.seed)+' · '+got.length+' of '+VOCAB.length+' terms earned</p>'+
    (rows.length?'<table class="tt"><tr><th>In the game</th><th>Technical term</th><th>In biology</th></tr>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</table>':'')+
    got.map(v=>{const s=v.src&&SRC[v.src];
      return '<div class="gentry"><h4>'+v.name+'</h4><p>'+v.def+'</p><p class="gmeta">Met in level '+(S.earnedAt[v.id]||'?')+
        (s?' · Source: <a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+', “'+s.title+'”</a>':'')+
        (v.code?' · Code it: <a href="https://rosalind.info/problems/'+v.code.toLowerCase()+'/" target="_blank" rel="noopener">Rosalind '+v.code+'</a>':'')+'</p></div>';}).join('')+
    (got.length?'<p style="margin-top:10px"><button id="printGuide">Print field guide</button></p>':'<p class="gmeta">Nothing yet. Finish level 1.</p>');
}
function renderControls(){
  const Hd=HANDLERS[cur.mode],sk=Hd.skip?Hd.skip(cur):null,b=$('#skip');
  b.hidden=!sk;b.textContent=sk?sk:'';
  const w=$('#walk');w.hidden=!Hd.walk||cur.done||!(Hd.canWalk?Hd.canWalk(cur):true);
  w.textContent='Walk it ('+cur.walkLeft+' left)';w.disabled=cur.walkLeft<=0;
  $('#undo').hidden=!Hd.undo;$('#undo').disabled=cur.done||!(Hd.canUndo&&Hd.canUndo(cur));
  $('#restart').disabled=false;
}
function render(){
  renderHeader();
  $('#title').textContent='Level '+cur.L.id+': '+cur.L.title;
  $('#brief').textContent=typeof cur.L.brief==='function'?cur.L.brief():cur.L.brief;
  const Hd=HANDLERS[cur.mode];
  $('#rule').textContent=Hd.rule(cur);
  const sc=Hd.scene(cur);$('#cave').style.display=sc.hide?'none':'';shade(sc.lit?'lit':'dark');$('#scene').innerHTML=sc.svg||'';
  if(sc.surveyor!==undefined&&sc.surveyor!==null)setSurveyor(true,sc.surveyor);else setSurveyor(null);
  $('#cave').setAttribute('aria-label',sc.label||'The mountain');
  $('#work').innerHTML=Hd.work(cur)||'';
  $('#status').textContent=cur.msg.text;$('#status').className='status '+cur.msg.kind;
  renderControls();renderPanel();renderGuide();
  if(cur.focus){const el=document.querySelector('[data-in="'+cur.focus+'"]');if(el&&el.focus)el.focus();}
}

/* ---------- one entry point for every move ---------- */
function act(type,d){
  d=d||{};
  if(type==='level')return loadLevel(d.id);
  if(type==='next')return loadLevel(Math.min(LEVELS.length,cur.L.id+1));
  if(type==='restart'){log('restart');return loadLevel(cur.L.id);}
  if(type==='fresh'){S.variants[cur.L.id]=(S.variants[cur.L.id]||0)+1;log('new_puzzle');save();return loadLevel(cur.L.id);}
  const Hd=HANDLERS[cur.mode];
  if(cur.done&&type!=='hover')return;
  if(type==='in'){
    if(Hd.input&&!cur.hand[d.id]){Hd.input(cur,d);return render();}
    const c=cur.hand[d.id];if(!c||c.ok)return;
    const raw=String(d.value).trim().replace(',','.');c.val=raw;if(raw==='')return render();
    const v=Number(raw);
    if(isFinite(v)&&near(v,c.want)){c.ok=true;c.bad=false;cur.hotCells=[];log('hand',{id:d.id,value:v,ok:true});
      if(Hd.onHand)Hd.onHand(cur,d.id);}
    else{c.bad=true;c.tries++;cur.wrong++;cur.hotCells=c.ops;log('hand',{id:d.id,value:raw,ok:false});
      if(Hd.onWrong)Hd.onWrong(cur,d.id,v);else say('That number does not come out of the chart. The cells it comes from are lit.','warn');
      cur.focus=d.id;}
    return render();
  }
  if(type==='walk'){if(!Hd.walk||cur.walkLeft<=0)return;cur.walkLeft--;cur.walks++;Hd.walk(cur);return render();}
  if(type==='undo'){if(Hd.undo&&Hd.canUndo&&Hd.canUndo(cur)){Hd.undo(cur);log('undo');}return render();}
  if(type==='skip'){if(Hd.skipAct)Hd.skipAct(cur);return render();}
  if(Hd.act&&Hd.act(cur,type,d)!==false)render();
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest&&ev.target.closest('[data-act],[data-n],[data-e],[data-lvl],[data-cell],[data-col],#next,#printGuide');
  if(!t)return;const d=t.dataset;
  if(d.act==='dig')act('dig',{e:cur.sel,x:$('#digX').value,from:$('#digFrom').value,L:$('#digL').value});
  else if(d.act)act(d.act,Object.assign({},d));
  else if(d.lvl!==undefined)act('level',{id:+d.lvl});
  else if(d.cell!==undefined){const [i,j]=d.cell.split(',').map(Number);act('cell',{i,j});}
  else if(d.col!==undefined)act('col',{c:+d.col});
  else if(d.e!==undefined)act('tunnel',{e:+d.e});
  else if(d.n!==undefined)act('node',{v:+d.n});
  else if(t.id==='next')act('next');
  else if(t.id==='printGuide'){$('#guide').open=true;window.print();}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t&&t.dataset&&t.dataset.in!==undefined)act('in',{id:t.dataset.in,value:t.value});});
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(t&&t.dataset&&t.dataset.in!==undefined&&ev.key==='Enter'){ev.preventDefault();act('in',{id:t.dataset.in,value:t.value});return;}
  if(t&&t.id==='digX'&&ev.key==='Enter'){ev.preventDefault();$('#digL').focus();return;}
  if(t&&t.id==='digL'&&ev.key==='Enter'){ev.preventDefault();act('dig',{e:cur.sel,x:$('#digX').value,from:$('#digFrom').value,L:$('#digL').value});return;}
  const g=t&&t.closest&&t.closest('g[data-n]');
  if(g&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();act('node',{v:+g.dataset.n});}
});
$('#undo').onclick=()=>act('undo');
$('#restart').onclick=()=>act('restart');
$('#fresh').onclick=()=>act('fresh');
$('#walk').onclick=()=>act('walk');
$('#skip').onclick=()=>act('skip');
$('#seed').value=S.seed;
$('#setSeed').onclick=()=>{const v=$('#seed').value.trim();if(!v||v===S.seed)return;S=freshState(v);save();cur=null;loadLevel(previewLevel||1);};
$('#dl').onclick=()=>{
  const blob=new Blob([JSON.stringify({game:'hollow-mountain',version:1,seed:S.seed,exported:new Date().toISOString(),
    unlocked:S.unlocked,vocabulary:S.badges,earnedAt:S.earnedAt,events:S.log},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hollow-mountain-'+S.seed.replace(/[^\w-]/g,'_')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

if(BENCH)bench();else loadLevel(previewLevel||Math.min(S.unlocked,LEVELS.length));
/* Test handle, only with ?debug=1 in the address. */
if(params.get('debug'))window.__hm={state:()=>cur,saved:()=>S,loadLevel,act,levels:()=>LEVELS.map(l=>({id:l.id,title:l.title})),
  vocab:()=>VOCAB.map(v=>({id:v.id,name:v.name})),earned:()=>S.badges.slice(),log:()=>S.log.slice(),render};
})();
</script>
