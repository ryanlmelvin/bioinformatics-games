<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Mountain</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1f2328; --muted:#6b7078; --line:#d9d4c7;
  --accent:#c2410c; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b4541a; --chip:#efe6d6;
  --bad-bg:#ffd9d6; --bad-ink:#8a1010; --ok-bg:#d9f2e1; --ok-ink:#14532d; --hot:#fff1c7;
  /* the mountain is an illustration: one palette in both themes */
  --rope:#ff8a1f; --chalk:#f4ead0; --lamp:#ffd36b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --muted:#9aa0a8; --line:#343a42;
    --accent:#ff9b5e; --accent-ink:#2b1200; --good:#6fcf97; --warn:#f0a36b; --chip:#2a2620;
    --bad-bg:#5a1f1c; --bad-ink:#ffd2cc; --ok-bg:#1d4a2e; --ok-ink:#c9f5d7; --hot:#4a3f1c;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --muted:#9aa0a8; --line:#343a42;
  --accent:#ff9b5e; --accent-ink:#2b1200; --good:#6fcf97; --warn:#f0a36b; --chip:#2a2620;
  --bad-bg:#5a1f1c; --bad-ink:#ffd2cc; --ok-bg:#1d4a2e; --ok-ink:#c9f5d7; --hot:#4a3f1c;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:40px;height:40px}
h1 a{color:inherit;text-decoration:none}
h2{font-size:1.1rem;margin:18px 0 4px}
p{margin:4px 0 12px}
.mono,.seq,.chart,svg text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.advance{display:block;width:fit-content;max-width:100%;min-height:44px;margin-top:14px;padding:10px 18px;text-align:left}
a{color:var(--accent)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pips button{width:32px;height:32px;padding:0;border-radius:50%}
.pips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vocabhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;position:relative}
.badge{font-size:.8rem;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:2px 10px}
.badge.got{border:1px solid var(--good);color:var(--good);font-weight:600}
.term{cursor:help;position:relative}
span.term:not(.badge){border-bottom:1px dotted currentColor;font-weight:600}
.tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(360px,84vw);padding:9px 11px;border-radius:8px;
  background:var(--ink);color:var(--bg);font:400 .82rem/1.45 system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px;color:inherit}
.term:hover>.tip,.term:focus>.tip{display:block}
.rule{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);margin-bottom:8px}
.stage{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
svg.cave{width:100%;height:auto;display:block;touch-action:manipulation;background:#26314f}
#work{padding:12px 14px 14px;border-top:1px solid var(--line)}
#work:empty{display:none}
.sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 2px}
.status{min-height:1.6em;margin:10px 2px 0;font-weight:500}
.status.warn{color:var(--warn)} .status.good{color:var(--good)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#skip:not([hidden]) + .controls{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
/* sequences */
.seqscroll{overflow-x:auto;padding-bottom:4px}
.seqrow{display:flex;align-items:center;gap:8px;margin:2px 0;width:max-content}
.seqname{width:5.5em;flex:none;font-weight:700;font-size:.9rem}
.seq{display:flex;gap:2px}
.seq .b{width:2em;height:2.5em;display:inline-flex;align-items:center;justify-content:center;font-weight:700;border-radius:4px;background:var(--chip);padding:0;border:1px solid transparent}
button.b:hover{border-color:var(--accent)}
.seq .b.mark{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-ink)}
.seq .b.same{animation:nod .5s}
.seq .b.dim{opacity:.4}
.seq .b.new{box-shadow:inset 0 -3px 0 var(--accent)}
@keyframes nod{30%{transform:translateY(-4px)}60%{transform:translateY(2px)}}
.A{color:#2e7d4f} .C{color:#2b5fb3} .G{color:#9a6b00} .T{color:#b83a4b}
/* charts */
.chartwrap{overflow-x:auto;margin:6px 0 10px}
table.chart{border-collapse:collapse;font-size:.95rem}
.chart th,.chart td{border:1px solid var(--line);min-width:2.7em;height:2.3em;text-align:center;padding:0 4px}
.chart th{background:var(--chip);font-weight:700;font-family:system-ui,sans-serif;white-space:nowrap}
.chart td.diag{color:var(--muted)}
.chart td.hot{background:var(--hot)}
.chart td.newrow{box-shadow:inset 0 0 0 2px var(--accent)}
.chart td.bad{background:var(--bad-bg);color:var(--bad-ink)}
.chart td.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chart td.pick{cursor:pointer}
.chart td.pick:hover{outline:2px solid var(--accent);outline-offset:-2px}
.chart td.chosen{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chart td small{display:block;font-size:.7rem;line-height:1;color:var(--muted)}
.chart td.bad small{color:inherit}
input.num{font:inherit;width:3.6em;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-align:center}
input.num.bad{border-color:var(--bad-ink);background:var(--bad-bg);color:var(--bad-ink);animation:nod .5s}
input.num:focus{outline:2px solid var(--accent);outline-offset:1px}
.fixed{font-weight:700;color:var(--good)}
.rows{display:grid;gap:6px;margin:6px 0 10px}
.rowline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.95rem}
.rowline .lab{min-width:10em}
.choice{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dig{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.dig select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.handover{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:10px 0}
.handover p{margin:4px 0}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:.92rem;background:var(--chip);padding:2px 6px;border-radius:5px;white-space:nowrap}
.quads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;font-size:.85rem;margin:6px 0}
.quads .ok{color:var(--good)} .quads .no{color:var(--warn);font-weight:600}
.pairings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0}
.pairing{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pairing svg{width:100%;height:auto;max-width:180px;display:block;margin:0 auto 4px}
.pairing .rowline{justify-content:center}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side>div{min-width:0}
.side svg{width:100%;height:auto;display:block;border-radius:8px}
.cap{font-size:.85rem;color:var(--muted);text-align:center;margin:2px 0 6px}
@media (max-width:560px){.side{grid-template-columns:1fr}.jlab{font-size:22px}}
.illus{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px}
/* mountain artwork */
.m-rock{fill:url(#gRock)} .m-strata{fill:none;stroke:#5c4c3e;stroke-width:2;opacity:.5}
.m-snow{fill:#f3f1ea} .m-dark{fill:#16110d;opacity:.82} .m-lit{fill:#6b5643;opacity:.55}
.m-ground{fill:#3b4a2f} .m-pine{fill:#2c3a25}
.star{fill:#fff8dc}
.tn-rock{fill:none;stroke:#1b130d;stroke-width:15;stroke-linecap:round}
.tn-lit{fill:none;stroke:#d9a564;stroke-width:6;stroke-linecap:round}
.tn-chalk{fill:none;stroke:var(--chalk);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:9 5}
.tn-sel{fill:none;stroke:var(--lamp);stroke-width:14;stroke-linecap:round;opacity:.55}
.tn-hit{fill:none;stroke:transparent;stroke-width:44;cursor:pointer}
.tn-sub0{stroke:#ff8fb1} .tn-sub1{stroke:#7fd1ff} .tn-sub2{stroke:#b5f27a} .tn-sub3{stroke:#ffd36b}
.rope{fill:none;stroke:var(--rope);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.rope.b{stroke:#61d4ff}
.rope.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ropein .9s ease-out forwards}
@keyframes ropein{to{stroke-dashoffset:0}}
.len{font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#2a1d12;pointer-events:none}
.lenbg{fill:#f4ead0;stroke:#8a6a4a;stroke-width:1.2}
.ent .door{fill:#120c08;stroke:#9c7a52;stroke-width:3}
.ent .lab{font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#fff7e6;font-family:system-ui,sans-serif;pointer-events:none}
.labbg{fill:#16110d;fill-opacity:.82;stroke:#9c7a52;stroke-width:1.5}
.ent.sel .labbg,.ent.hot .labbg{stroke:var(--lamp);stroke-width:3}
.ent .ring{fill:none;stroke:transparent;stroke-width:4}
.ent.sel .ring{stroke:var(--lamp)} .ent.hot .ring{stroke:var(--rope)}
.ent.click{cursor:pointer}
.ent:focus-visible{outline:none} .ent:focus-visible .ring{stroke:#fff}
.jn{fill:#2a1d12;stroke:var(--chalk);stroke-width:2.5}
.jn.lit{stroke:#d9a564}
.jn.root{fill:#3a2414;stroke:var(--lamp);stroke-width:4}
.jlab{font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--chalk);pointer-events:none}
.ghost{opacity:.35}
.capsvg{font-size:18px;font-weight:700;fill:#fff7e6;paint-order:stroke;stroke:#16110d;stroke-width:4px;font-family:system-ui,sans-serif}
#surveyor{pointer-events:none}
.sv-skin{fill:#f0c9a0} .sv-coat{fill:#3c6e8f} .sv-hat{fill:#e8b13a} .sv-lamp{fill:#fff3b0}
.sv-beam{fill:#fff3b0;opacity:.25}
.sv-coil{fill:none;stroke:var(--rope);stroke-width:3}
/* reveals, sources, field guide */
.reveal{border:1px solid var(--good);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel)}
.reveal h3{margin:0 0 8px;font-size:1.05rem}
.called{margin:10px 0 4px;padding-left:12px;border-left:3px solid var(--good)}
.called p{margin:0}
.src{margin:4px 0 10px 15px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:.9rem}
.src .tag{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.src a{font-weight:600}
.guide{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
.guide summary{cursor:pointer;font-weight:600}
.gentry{padding:8px 0;border-top:1px solid var(--line)}
.gentry h4{margin:0;font-size:1rem}
.gentry p{margin:2px 0;font-size:.92rem}
.gmeta{color:var(--muted);font-size:.9rem}
table.tt{border-collapse:collapse;font-size:.88rem;margin:8px 0}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
footer input{font:inherit;width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.bench textarea{width:100%;min-height:150px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.bench pre{font-size:.85rem;background:var(--chip);padding:8px;border-radius:8px;overflow-x:auto}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rope.draw{stroke-dashoffset:0}}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#guide){display:none!important}
  .guide{border:0;padding:0;margin:0}
  .guide summary,#printGuide{display:none}
  .guide a{color:#000}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="12" fill="#26314f"/><path d="M4,52 L22,20 L28,28 L36,12 L56,52Z" fill="#7b6a58"/><path d="M36,12 L41,22 L36,20 L32,23Z" fill="#f3f1ea"/><path d="M24,52 v-7 a6,6 0 0 1 12,0 v7z" fill="#120c08" stroke="#9c7a52" stroke-width="2"/></svg><a href="../" title="All games">Hollow Mountain</a></h1>
    <div class="pips" id="pips" aria-label="Levels"></div>
  </header>
  <div class="vocabhead">Vocabulary you have earned <span style="text-transform:none;letter-spacing:0">(hover for the definition)</span></div>
  <div class="badges" id="badges"></div>

  <h2 id="title"></h2>
  <p id="brief"></p>
  <div class="rule" id="rule"></div>

  <div class="stage">
    <svg class="cave" id="cave" viewBox="0 0 760 460" role="group" aria-label="The mountain">
      <defs>
        <!-- ===== ARTWORK: the mountain, drawn once and reused ===== -->
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2a48"/><stop offset=".7" stop-color="#46507a"/><stop offset="1" stop-color="#c98f6b"/></linearGradient>
        <linearGradient id="gRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d7a66"/><stop offset="1" stop-color="#4d3f33"/></linearGradient>
        <radialGradient id="gLamp"><stop offset="0" stop-color="#fff3b0" stop-opacity=".55"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
        <clipPath id="clipM"><path id="mtnClip"/></clipPath>
        <g id="a-surveyor">
          <path class="sv-beam" d="M2,-30 L40,-46 L40,-14Z"/>
          <ellipse class="sv-coat" cx="0" cy="-8" rx="7" ry="10"/>
          <circle class="sv-skin" cx="0" cy="-23" r="6"/>
          <path class="sv-hat" d="M-7,-25 a7,6 0 0 1 14,0 z"/><circle class="sv-lamp" cx="5" cy="-28" r="2.6"/>
          <circle class="sv-coil" cx="-7" cy="-6" r="5"/>
          <path d="M-4,1 l-2,8 M4,1 l2,8" stroke="#2a1d12" stroke-width="3" stroke-linecap="round"/>
        </g>
      </defs>
      <rect width="760" height="460" fill="url(#gSky)"/>
      <g id="sky"></g>
      <path id="mtn" class="m-rock"/>
      <g clip-path="url(#clipM)"><g id="strata"></g><rect id="shade" width="760" height="460" class="m-dark"/></g>
      <path id="snow" class="m-snow"/>
      <rect y="440" width="760" height="20" class="m-ground"/>
      <g id="pines"></g>
      <g id="scene"></g>
      <g id="surveyor" visibility="hidden"><use href="#a-surveyor"/></g>
    </svg>
    <div id="work"></div>
  </div>

  <div class="status" id="status" role="status"></div>
  <button id="skip" class="primary advance" hidden></button>
  <div class="controls">
    <button id="walk" hidden>Walk it</button>
    <button id="undo">Undo</button>
    <button id="restart">Restart</button>
    <button id="fresh">New puzzle</button>
  </div>

  <div id="panel"></div>

  <details class="guide" id="guide">
    <summary>Field guide: your glossary and sources (<span id="gcount"></span>)</summary>
    <div id="guideBody"></div>
  </details>

  <footer>
    <label for="seed">Puzzle code</label>
    <input id="seed" autocomplete="off" spellcheck="false">
    <button id="setSeed">Use code (resets progress)</button>
    <button id="dl">Download move log</button>
    <a href="../">All games</a>
  </footer>
</div>
<script id="engine">
/* Pure puzzle logic: no DOM. A cave is {n, N, edges:[{a,b,w}]}: entrances are nodes 0..n-1, junctions are n..N-1. */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(n,rand){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ri=(rand,lo,hi)=>lo+Math.floor(rand()*(hi-lo+1));
const range=n=>[...Array(n).keys()];
const near=(a,b)=>Math.abs(a-b)<1e-9;
const whole=x=>Number.isInteger(x);

function cloneT(t){const c={n:t.n,N:t.N,edges:t.edges.map(e=>({a:e.a,b:e.b,w:e.w}))};if(t.root!==undefined)c.root=t.root;if(t.H)c.H=t.H.slice();return c;}
function adjOf(t){const A=Array.from({length:t.N},()=>[]);t.edges.forEach((e,i)=>{A[e.a].push({v:e.b,w:e.w,i});A[e.b].push({v:e.a,w:e.w,i});});return A;}
function distFrom(t,s){const A=adjOf(t),d=Array(t.N).fill(null);d[s]=0;const st=[s];
  while(st.length){const u=st.pop();for(const x of A[u])if(d[x.v]===null){d[x.v]=d[u]+x.w;st.push(x.v);}}return d;}
/* the rope: distances between entrances (BA7A). Entrances not yet in the cave read null. */
function leafDist(t){return range(t.n).map(i=>{const d=distFrom(t,i);return range(t.n).map(j=>d[j]);});}
function presentLeaves(t){const s=new Set();t.edges.forEach(e=>{if(e.a<t.n)s.add(e.a);if(e.b<t.n)s.add(e.b);});return [...s].sort((a,b)=>a-b);}
function pathNodes(t,u,v){const A=adjOf(t),par=Array(t.N).fill(-1);par[u]=u;const q=[u];
  while(q.length){const x=q.shift();for(const y of A[x])if(par[y.v]<0){par[y.v]=x;q.push(y.v);}}
  if(par[v]<0)return null;const p=[v];while(p[0]!==u)p.unshift(par[p[0]]);return p;}
function edgeIndex(t,a,b){return t.edges.findIndex(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));}
function pathEdges(t,u,v){const p=pathNodes(t,u,v);return p?p.slice(1).map((x,i)=>edgeIndex(t,p[i],x)):[];}
function compact(t){const used=new Set();t.edges.forEach(e=>{used.add(e.a);used.add(e.b);});const map={};let k=t.n;
  [...used].filter(v=>v>=t.n).sort((a,b)=>a-b).forEach(v=>map[v]=k++);const f=v=>v<t.n?v:map[v];
  const c={n:t.n,N:k,edges:t.edges.map(e=>({a:f(e.a),b:f(e.b),w:e.w}))};if(t.root!==undefined)c.root=f(t.root);return c;}

/* The one building move: split tunnel ei at distance x from its end `from`, hang entrance `leaf` on a dead end of length L. */
function splitEdge(t,ei,x,from){const e=t.edges[ei],other=e.a===from?e.b:e.a,m=t.N++;
  t.edges.splice(ei,1,{a:from,b:m,w:x},{a:m,b:other,w:e.w-x});return m;}
function canHang(t,ei,x,from,L){const e=t.edges[ei];return !!e&&(e.a===from||e.b===from)&&whole(x)&&whole(L)&&x>0&&x<e.w&&L>0;}
function hang(t,ei,x,from,leaf,L){const c=cloneT(t),m=splitEdge(c,ei,x,from);c.edges.push({a:m,b:leaf,w:L});return c;}

/* LimbLength (BA7B) over the entrances `among` (default: all). */
function limbRows(D,j,among){among=(among||range(D.length)).filter(x=>x!==j);const rows=[];

    const p=inq.includes(a)?inq:q.filter(x=>!S.has(x));const o=p.find(x=>x!==a);return o===b?0:o===c?1:2;}

  splitEdge,canHang,hang,limbRows,limbLength,additivePhylogeny,upgma,nj,unroot,induced,splitsOf,sameShape,quads,fourSums,fourPointGap,

/* Vocabulary in the order it is earned. */
const VOCAB=[
  {id:'dmat',name:'Distance matrix',code:'BA7A',def:'An n × n table D in which D(i, j) is the distance between objects i and j. It is symmetric, has zeros on the diagonal, has no negative entries, and obeys the triangle inequality D(i, j) + D(j, k) ≥ D(i, k).'},
  {id:'tree',name:'Tree',def:'A connected graph with no cycles. There is exactly one path between any two nodes, and a tree with N nodes has N − 1 edges.'},
  {id:'leaf',name:'Leaf',def:'A node of degree 1 in a tree. In an evolutionary tree the leaves are the present-day species or sequences.'},
  {id:'inode',name:'Internal node',def:'A node of degree greater than 1 in a tree. In an evolutionary tree the internal nodes are ancestors that were never sampled.'},
  {id:'blen',name:'Branch length',code:'BA7A',def:'The weight of an edge of a tree, measuring the amount of change along that lineage. The distance between two leaves is the sum of the branch lengths on the path between them.'},
  {id:'limb',name:'Limb length',code:'BA7B',def:'The length of the edge from a leaf j to its parent. For an additive matrix it is the smallest value of (D(i, j) + D(j, k) − D(i, k)) / 2 over all pairs of other leaves i and k (the Limb Length Theorem).'},
  {id:'additive',name:'Additive matrix',def:'A distance matrix that some weighted tree fits exactly: the length of the path between every pair of leaves equals their entry in the matrix.'},
  {id:'addphylo',name:'Additive phylogeny',code:'BA7C',def:'AdditivePhylogeny builds the tree of an additive matrix one leaf at a time: compute the leaf’s limb length, find the point on the path from i to k where its limb attaches, split the edge there and hang the limb.'},
  {id:'fourpoint',name:'Four-point condition',src:'buneman',def:'For any four leaves i, j, k, l, of the three sums D(i,j)+D(k,l), D(i,k)+D(j,l) and D(i,l)+D(j,k), the two largest are equal. A distance matrix is additive exactly when every foursome meets it.'},
  {id:'rooted',name:'Rooted tree',def:'A tree with one node, the root, singled out as the common ancestor of every leaf. Its edges are read as pointing away from the root, forward in time.'},
  {id:'clock',name:'Molecular clock',src:'zuck',def:'The hypothesis that sequences change at a constant rate, so every leaf is the same distance from the root. A tree with that property is called ultrametric.'},
  {id:'upgma',name:'UPGMA',code:'BA7D',def:'Unweighted Pair Group Method with Arithmetic Mean: join the two closest clusters under a new node at half their distance, set the new cluster’s distance to every other cluster to the average over their members, and repeat. It builds a rooted, ultrametric tree.'},
  {id:'unrooted',name:'Unrooted tree',def:'A tree with no root. It shows how lineages are related, but not where their common ancestor lies or which way time runs.'},
  {id:'neighbors',name:'Neighbors',def:'Two leaves that share the same parent node.'},
  {id:'njm',name:'Neighbor-joining matrix',def:'D*(i, j) = (n − 2) · D(i, j) − TotalDistance(i) − TotalDistance(j) for i ≠ j, and 0 on the diagonal, where TotalDistance(i) is the sum of row i of D. For an additive matrix, its smallest entry is a pair of neighbors.'},
  {id:'nj',name:'Neighbor joining',src:'saitou',code:'BA7E',def:'Find the smallest entry D*(i, j); join i and j under a new node m with limb lengths (D(i, j) + Δ)/2 and (D(i, j) − Δ)/2, where Δ = (TotalDistance(i) − TotalDistance(j)) / (n − 2); replace i and j by m with D(k, m) = (D(k, i) + D(k, j) − D(i, j)) / 2; repeat. It rebuilds the tree of an additive matrix exactly.'},
  {id:'nni',name:'Nearest neighbor interchange',def:'Removing an internal edge leaves four subtrees W, X, Y and Z. The tree WX|YZ has two nearest neighbors for that edge, WY|XZ and WZ|XY; a nearest neighbor interchange replaces the tree by one of them.'}
];

/* ---------- laying out a cave ----------
   Leaves sit on the mountain's surface in the order a walk around the cave meets them; internal nodes sit inside,
   under the leaves they lead to. opt.root: a rooted cave, internal nodes placed by depth (opt.H). opt.order: fixed leaf order. */
function caveLayout(t,opt){
  opt=opt||{};const A=adjOf(t),leaves=presentLeaves(t),pos=Array(t.N).fill(null);
  const lo=32,hi=148,ang=(i,k)=>k===1?90:hi-i*(hi-lo)/(k-1);
  const internal=range(t.N).filter(v=>v>=t.n&&A[v].length);
  if(!internal.length){leaves.forEach((v,i)=>pos[v]=polar(RS,ang(i,leaves.length)));pos.angles={};leaves.forEach((v,i)=>pos.angles[v]=ang(i,leaves.length));return pos;}
  let c=opt.root;
  if(c===undefined){let best=Infinity;internal.forEach(v=>{const d=hopDepth(A,v),m=Math.max(...leaves.map(l=>d[l]));if(m<best-1e-9||(m===best&&v<c)){best=m;c=v;}});}
  const order=[],par={},depth={};
  (function dfs(v,p,d){par[v]=p;depth[v]=d;const kids=A[v].filter(x=>x.v!==p).map(x=>x.v);
    if(v<t.n){order.push(v);return;}
    const rank=x=>opt.order?Math.min(...subLeaves(t,x,v).map(l=>opt.order.indexOf(l))):x;
    kids.sort((a,b)=>rank(a)-rank(b)).forEach(k=>dfs(k,v,d+1));})(c,-1,0);
  const angle={};order.forEach((v,i)=>angle[v]=ang(i,order.length));
  (function fill(v){if(v<t.n)return angle[v];const kids=A[v].filter(x=>x.v!==par[v]).map(x=>fill(x.v));angle[v]=v===c&&opt.root===undefined?90:kids.reduce((a,b)=>a+b,0)/kids.length;return angle[v];})(c);
  const maxD=Math.max(...internal.map(v=>depth[v]));
  range(t.N).forEach(v=>{if(!(v in depth))return;
    let r;if(v<t.n)r=RS;else if(opt.root!==undefined)r=RS-(RS-72)*(opt.H[v]/opt.H[c]);else r=120+(RS-150)*depth[v]/(maxD+1);
    pos[v]=polar(r,angle[v]);});
  pos.angles=angle;return pos;
}
function hopDepth(A,s){const d={};d[s]=0;const q=[s];while(q.length){const u=q.shift();A[u].forEach(x=>{if(!(x.v in d)){d[x.v]=d[u]+1;q.push(x.v);}});}return d;}

/* ---------- drawing a cave ----------
   o: {style:'lit'|'chalk', names, lengths (bool), hidden (lengths shown as ?), pick (tunnels clickable), sel (edge index),
       click (entrances clickable), hot (set of leaves), ropes: [{path:[nodes], cls}], root, subs: {edgeIdx:class}, jlabels} */
function caveSVG(t,pos,o){
  o=o||{};const names=o.names||LET,A=adjOf(t);let h='';
  t.edges.forEach((e,i)=>{const a=pos[e.a],b=pos[e.b];if(!a||!b)return;const d='M'+P(a)+' L'+P(b);
    if(o.sel===i)h+='<path class="tn-sel" d="'+d+'"/>';
    if(o.style==='lit')h+='<path class="tn-rock" d="'+d+'"/><path class="tn-lit'+(o.subs&&o.subs[i]?' '+o.subs[i]:'')+'" d="'+d+'"/>';
    else h+='<path class="tn-chalk'+(o.subs&&o.subs[i]?' '+o.subs[i]:'')+'" d="'+d+'"'+(o.subs&&o.subs[i]?' style="stroke-dasharray:none;stroke-width:5"':'')+'/>';
  });
  (o.ropes||[]).forEach(r=>{const pts=r.path.map(v=>pos[v]);let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    h+='<path class="rope'+(r.cls?' '+r.cls:'')+(r.draw&&!reduced()?' draw':'')+'" style="--len:'+Math.ceil(len)+'" d="M'+pts.map(p=>P({x:p.x+(r.off||0),y:p.y+(r.off||0)})).join(' L')+'"/>';});
  if(o.lengths!==false)t.edges.forEach((e,i)=>{const a=pos[e.a],b=pos[e.b];if(!a||!b)return;
    const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},txt=o.hidden&&o.hidden.has(i)?'?':o.edgeText?o.edgeText(i):fmt(e.w);if(txt==='')return;
    const wd=Math.max(34,15*String(txt).length+14);
    h+='<rect class="lenbg" x="'+f1(m.x-wd/2)+'" y="'+f1(m.y-16)+'" width="'+wd+'" height="32" rx="6"/><text class="len" x="'+f1(m.x)+'" y="'+f1(m.y+1)+'">'+esc(txt)+'</text>';});
  if(o.pick)t.edges.forEach((e,i)=>{const a=pos[e.a],b=pos[e.b];if(!a||!b||(o.pickable&&!o.pickable(i)))return;
    h+='<path class="tn-hit" data-e="'+i+'" d="M'+P(a)+' L'+P(b)+'"><title>'+esc(edgeName(t,i,names))+'</title></path>';});
  let jn=0;
  range(t.N).forEach(v=>{const p=pos[v];if(!p||v<t.n||!A[v].length)return;jn++;
    const root=o.root===v;h+='<circle class="jn'+(o.style==='lit'?' lit':'')+(root?' root':'')+'" cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" r="'+(root?15:10)+'"/>';
    if(o.jlabels)h+='<text class="jlab" x="'+f1(p.x)+'" y="'+f1(p.y+(root?30:24))+'">'+esc(jName(t,v))+'</text>';});
  presentLeaves(t).forEach(v=>h+=entranceSVG(v,pos,names,o));
  (o.extraLeaves||[]).forEach(v=>h+=entranceSVG(v,pos,names,o));
  return h;
}
function entranceSVG(v,pos,names,o){const p=pos[v];if(!p)return '';const ang=pos.angles?pos.angles[v]:90,rot=90-ang,lab=polar(RS+38,ang);
  const cls='ent'+(o.click?' click':'')+(o.hot&&o.hot.has(v)?' hot':'')+(o.selLeaf===v?' sel':'');
  const hc=polar(RS+18,ang);
  return '<g class="'+cls+'" data-n="'+v+'"'+(o.click?' tabindex="0" role="button" aria-label="Entrance '+esc(names[v])+'"':'')+'>'+
    (o.click?'<circle cx="'+f1(hc.x)+'" cy="'+f1(hc.y)+'" r="38" fill="transparent"/>':'')+
    '<g transform="translate('+P(p)+') rotate('+f1(rot)+')"><circle class="ring" r="19"/><path class="door" d="M-11,9 v-9 a11,11 0 0 1 22,0 v9 z"/></g>'+
    labelSVG(names[v],lab)+'</g>';}
/* An entrance's name on a dark plate, kept wholly inside the picture. */
function labelSVG(name,at){const s=String(name),fs=s.length>2?22:28,w=Math.ceil(s.length*fs*0.62+16),h=fs+12;
  const x=Math.min(W-4-w/2,Math.max(4+w/2,at.x)),y=Math.min(H-24-h/2,Math.max(4+h/2,at.y));
  return '<rect class="labbg" x="'+f1(x-w/2)+'" y="'+f1(y-h/2)+'" width="'+w+'" height="'+h+'" rx="7"/>'+
    '<text class="lab" x="'+f1(x)+'" y="'+f1(y+1)+'" style="font-size:'+fs+'px">'+esc(s)+'</text>';}
function jName(t,v){return 'J'+(v-t.n+1);}
function nodeName(t,v,names){return v<t.n?(names||LET)[v]:jName(t,v);}
function edgeName(t,i,names){const e=t.edges[i];return nodeName(t,e.a,names)+'–'+nodeName(t,e.b,names);}
function setSurveyor(p,ang){const g=$('#surveyor');if(!p){g.setAttribute('visibility','hidden');return;}
  /* The surveyor waits on the ground at the mountain's foot, on the side of the entrance in use, clear of every label. */
  const right=Math.cos((ang===undefined?90:ang)*Math.PI/180)<-0.01?false:Math.cos((ang===undefined?90:ang)*Math.PI/180)>0.01;
  g.setAttribute('visibility','visible');g.setAttribute('transform','translate('+(right?684:76)+',441) scale('+(right?'-1.3,1.3':'1.3')+')');}
function shade(kind){$('#shade').setAttribute('class',kind==='lit'?'m-lit':'m-dark');}

function miniSVG(t,pos,o){return '<svg viewBox="0 30 760 440" role="img" aria-label="'+esc(o.label||'cave')+'"><rect width="760" height="500" fill="#26314f"/>'+
