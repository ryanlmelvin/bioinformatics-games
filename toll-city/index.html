<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toll City</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1f2328; --muted:#6b7078; --line:#d9d4c7;
  --accent:#c2410c; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b4541a;
  --A:#2e7d4f; --C:#2b5fb3; --G:#9a6b00; --T:#b83a4b; --chip:#e3f0f3;
  /* the city is an illustration: one palette in both themes */
  --m-ground:#e8e1d0; --m-block:#d9cdb3; --m-roof:#b5553a; --m-street:#8d8577; --m-street2:#f4efe4;
  --m-ink:#1f2328; --m-gold:#f2a900; --m-accent:#e8590c; --m-trail:#2b5fb3; --m-pencil:#3a3a3a; --m-toll:#b83a4b; --m-park:#9cc489;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --muted:#9aa0a8; --line:#343a42;
    --accent:#ff9b5e; --accent-ink:#2b1200; --good:#6fcf97; --warn:#f0a36b;
    --A:#6fcf97; --C:#7fb0ff; --G:#e6bd4f; --T:#ff8a98; --chip:#1d3a44;
  }
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:40px;height:40px}
h1 a{color:inherit;text-decoration:none}
h2{font-size:1.1rem;margin:18px 0 4px}
p{margin:4px 0 12px}
.mono,.strand,.tcard,svg text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.advance{display:block;width:fit-content;max-width:100%;min-height:44px;margin-top:14px;padding:10px 18px;text-align:left}
a{color:var(--accent)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pips button{width:32px;height:32px;padding:0;border-radius:50%}
.pips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hdrinfo{font-size:.85rem;color:var(--muted)}
.hdrinfo b{color:var(--ink)}

/* vocabulary */
.vocabhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;position:relative}
.badge{font-size:.8rem;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:2px 10px}
.badge.got{border:1px solid var(--good);color:var(--good);font-weight:600}
.term{cursor:help}
span.term:not(.badge){border-bottom:1px dotted currentColor;font-weight:600}
.tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(360px,84vw);padding:9px 11px;border-radius:8px;
  background:var(--ink);color:var(--bg);font:400 .82rem/1.45 system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px;color:inherit}
.term:hover>.tip,.term:focus>.tip{display:block}

.rule{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);margin-bottom:8px;max-width:100%}
.stage{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.stagemsg{padding:6px 14px 8px;font-weight:600;font-size:.95rem;border-top:1px solid var(--line)}
.stagemsg.warn{color:var(--warn)} .stagemsg.good{color:var(--good)}
.sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.status{min-height:1.6em;margin:10px 2px 0;font-weight:500}
.status.warn{color:var(--warn)} .status.good{color:var(--good)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#skip:not([hidden]) + .controls{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.controls label{font-size:.92rem;display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:8px}
.pad{padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bA{color:var(--A)} .bC{color:var(--C)} .bG{color:var(--G)} .bT{color:var(--T)}
.nudge{outline:2px solid var(--m-gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}

/* level 1: two strands */
.strands{overflow-x:auto;padding:16px 14px 6px}
.strand{display:flex;width:max-content;gap:3px;margin:3px 0}
.strand button,.strand span{width:2.1em;height:2.4em;padding:0;border-radius:6px;font:700 1.15rem/2.4em ui-monospace,Menlo,monospace;text-align:center;flex:none}
.strand button.let{background:#fffaf0;border:1px solid #cdbf9a;color:#2a2416}
.strand button.gap{background:transparent;border:1.5px dashed var(--muted);color:var(--muted);font-weight:400}
.strand span.tail{border:1.5px dotted var(--line);color:var(--line);font-weight:400}
.strand .hit{background:#d9f2e1!important;border-color:var(--good)!important;color:#14532d!important}
.strand .let .bA,.tcard .bA{color:#2e7d4f} .strand .let .bC,.tcard .bC{color:#2b5fb3} .strand .let .bG,.tcard .bG{color:#9a6b00} .strand .let .bT,.tcard .bT{color:#b83a4b}
.strandlab{font-size:.75rem;color:var(--muted);margin:6px 0 0}
.tally{font-size:1rem;font-weight:600;padding:4px 14px 12px}

/* cards */
.table{padding:14px;background:radial-gradient(circle at 30% 20%,#2f7a55,#1f5a3d);color:#f4efe4}
.table .sub{color:#cfe6d6}
.deckrow{display:flex;align-items:center;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.decklab{width:4.6em;font-size:.8rem;color:#cfe6d6;flex:none}
.cards{display:flex;gap:4px;flex-wrap:wrap;min-height:3.2em;align-items:center}
.tcard{width:2.3em;height:3.1em;border-radius:6px;background:#fffdf6;border:1px solid #c8bfa6;color:#2a2416;font-weight:700;font-size:1.1rem;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.35);padding:0;flex:none}
.tcard.top{outline:3px solid var(--m-gold);outline-offset:1px}
button.tcard:hover{transform:translateY(-3px)}
.tcard.gone{opacity:.25;box-shadow:none}
.tcard.back{background:repeating-linear-gradient(45deg,#7d2c22 0 4px,#a5432f 4px 8px);border-color:#5e1f17;color:transparent}
.pairs{display:flex;gap:6px;flex-wrap:wrap;min-height:4.2em}
.pair{display:flex;flex-direction:column;gap:2px}
.pair .tcard{height:2.2em;width:2em;font-size:1rem}
.pair.match .tcard{background:#fff3c4;border-color:var(--m-gold)}
.pair.miss .tcard{opacity:.6}
.moves{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.moves button{background:#f4efe4;color:#1f2328;border-color:#cdbf9a;min-height:44px}
.moves button.take{background:var(--m-gold);border-color:#b07a00;font-weight:700}
.spell{font:700 1.15rem ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#fff3c4}
.games{font-size:.85rem;color:#cfe6d6;margin-top:6px}
.twotables{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twotables .table{border-radius:10px}
.hist{font-size:.82rem;color:#e8f3ec;min-height:3.2em}
.hist span{display:inline-block;margin:1px 3px 1px 0;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.12)}
.choices{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.choices button{text-align:left;min-height:44px}
.choices button.struck{text-decoration:line-through;opacity:.55}
@media (max-width:560px){.twotables{grid-template-columns:1fr}}

/* the city */
.cityscroll{overflow-x:auto}
svg.city{display:block;width:100%;height:auto;touch-action:manipulation;background:var(--m-ground)}
.blk{fill:var(--m-block)}
.roof{fill:var(--m-roof);opacity:.85}
.roof2{fill:#8a6a4a;opacity:.6}
.tree{fill:var(--m-park)}
.st{stroke:var(--m-street);stroke-linecap:round;fill:none}
.st-dash{stroke:var(--m-street2);stroke-dasharray:4 6;fill:none}
.st.gold{stroke:var(--m-gold)}
.st.faint{stroke:#bdb3a0}
.st.trail{stroke:var(--m-trail);opacity:.55}
.st.route{stroke:var(--m-accent)}
.st.ghost{stroke:#7f8ea3;stroke-dasharray:6 5}
.st.avail{stroke:var(--m-accent)}
.st.flash{stroke:var(--m-gold);animation:pulse 1s ease-in-out 2}
.hitst{stroke:transparent;fill:none;cursor:pointer;pointer-events:stroke}
.price{font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--m-ink);paint-order:stroke;stroke:var(--m-ground);stroke-width:4px;pointer-events:none}
.price.neg{fill:var(--m-toll)}
.corner{fill:#fffdf6;stroke:var(--m-street);stroke-width:2}
.cn{cursor:pointer}
.cn.ready .corner{stroke:var(--m-accent);stroke-width:3.5}
.cn.done .corner{fill:#fff3c4}
.cn.here .corner{stroke:var(--m-ink);stroke-width:3.5}
.cn.dim{opacity:.35;cursor:default}
.cn.pick .corner{fill:var(--m-gold)}
.cn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.cnum{font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--m-pencil);pointer-events:none}
.cnum.big{font-size:15px}
.axis{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.axis.dA{fill:#2e7d4f}.axis.dC{fill:#2b5fb3}.axis.dG{fill:#9a6b00}.axis.dT{fill:#b83a4b}.axis.dP{fill:#3b3b3b}
.axlab{font-size:12px;fill:#5a5448;font-family:system-ui,sans-serif}
.arrow{stroke:var(--m-pencil);stroke-width:2.2;fill:none}
.arrowhead{fill:var(--m-pencil)}
.sight{pointer-events:none}
#tourist{pointer-events:none}
.walking .leg1{animation:legA .25s linear infinite alternate}
.walking .leg2{animation:legA .25s linear infinite alternate-reverse}
@keyframes legA{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.leg1,.leg2{transform-box:fill-box;transform-origin:top center}
.bot{padding:12px 14px;border-top:1px solid var(--line)}
.bot .count{font:700 1.4rem ui-monospace,Menlo,monospace}
.bot .meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.bot .meter i{display:block;height:100%;background:var(--accent);width:0}
.bot table{border-collapse:collapse;font-size:.92rem;margin-top:8px}
.bot td,.bot th{padding:3px 10px 3px 0;text-align:left}
.bot td.n{font-family:ui-monospace,Menlo,monospace;text-align:right}
.alignout{padding:10px 14px;overflow-x:auto}
.alignout .strand span{width:1.6em;height:1.9em;font-size:1rem;line-height:1.9em;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.alignout .strand span.hit{font-weight:700}
.alignout .strand span.mis{background:#ffe3d6;color:#8a2a10;border-color:#e3a58a}
.alignout .strand span.gp{color:var(--muted);border-style:dashed}
.alignout .strand span.off{opacity:.35}
.entry{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.entry input{font:inherit;width:5em;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.mat{border-collapse:collapse;font:.85rem ui-monospace,Menlo,monospace;margin:6px 0}
.mat td,.mat th{border:1px solid var(--line);padding:2px 7px;text-align:right}

/* reveals, sources, field guide */
.reveal{border:1px solid var(--good);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel)}
.reveal h3{margin:0 0 8px;font-size:1.05rem}
.called{margin:10px 0 4px;padding-left:12px;border-left:3px solid var(--good)}
.called p{margin:0;position:relative}
.called b{color:var(--good)}
.src{margin:4px 0 10px 15px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:.9rem}
.src .tag{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.src a{font-weight:600}
.guide{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
.guide summary{cursor:pointer;font-weight:600}
.gentry{padding:8px 0;border-top:1px solid var(--line)}
.gentry h4{margin:0;font-size:1rem}
.gentry p{margin:2px 0;font-size:.92rem}
.gmeta{color:var(--muted);font-size:.9rem}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
footer input{font:inherit;width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
/* workbench */
.benchform{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;max-width:560px}
.benchform input,.benchform select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;width:100%}
.btable{border-collapse:collapse;font:.85rem ui-monospace,Menlo,monospace;margin:10px 0}
.btable td,.btable th{border:1px solid var(--line);padding:2px 6px;text-align:right;min-width:2.4em}
.btable td.on{background:#fff3c4;color:#1f2328;font-weight:700}
.benchout{overflow-x:auto}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#guide){display:none!important}
  .guide{border:0;padding:0;margin:0}
  .guide summary,#printGuide{display:none}
}
</style>

<script id="engine">
/* Pure puzzle logic: no DOM. Orientation, fixed everywhere: rows i = cards gone from deck 1 (string v),
   columns j = cards gone from deck 2 (string w). A step south (S) discards from deck 1, a step east (E)
   discards from deck 2, a step south-east (D) takes both cards. */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const DNA='ACGT';
function randStr(rand,n,alpha){let s='';for(let i=0;i<n;i++)s+=(alpha||DNA)[Math.floor(rand()*(alpha||DNA).length)];return s;}

/* Scoring matrices, as printed on Rosalind's glossary pages (rows and columns in AA order). */
const AA='ACDEFGHIKLMNPQRSTVWY';
const MATRIX_TEXT={

const MATRICES={};

/* A scheme is {match, mismatch, indel} (signed: what a street adds) or {matrix:'BLOSUM62', indel}. */
const TOLLS={match:1,mismatch:-1,indel:-2};

function pairScore(sc,a,b){
  if(sc.matrix){const v=MATRICES[sc.matrix][a+b];if(v===undefined)throw new Error('No score for '+a+b);return v;}
  return a===b?sc.match:sc.mismatch;

/* The grid of best arrivals. mode: global | local (free taxi from the start to anywhere and from anywhere to the end)
   | overlap (free taxi down the left edge and off the bottom edge). Returns the table s, the ways each corner's value
   can come (arrows), the number of best routes, and one best route. */
function align(v,w,sc,mode){
  mode=mode||'global';
  const n=v.length,m=w.length,ind=sc.indel;
  const s=[],cnt=[],from=[];
  const taxiIn=(i,j)=>mode==='local'||(mode==='overlap'&&j===0);
  for(let i=0;i<=n;i++){s.push([]);cnt.push([]);from.push([]);
    for(let j=0;j<=m;j++){
      const c=[];
      if(i>0)c.push({d:'S',val:s[i-1][j]+ind,k:cnt[i-1][j]});
      if(j>0)c.push({d:'E',val:s[i][j-1]+ind,k:cnt[i][j-1]});
      if(i>0&&j>0)c.push({d:'D',val:s[i-1][j-1]+pairScore(sc,v[i-1],w[j-1]),k:cnt[i-1][j-1]});
      if((i===0&&j===0)||taxiIn(i,j))c.push({d:'T',val:0,k:1});
      const best=Math.max(...c.map(x=>x.val)),win=c.filter(x=>x.val===best);
      s[i][j]=best;cnt[i][j]=win.reduce((a,x)=>a+x.k,0);from[i][j]=win.map(x=>x.d);
    }}
  const ends=[];
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++)
    if(mode==='local'||(mode==='overlap'&&i===n)||(i===n&&j===m))ends.push([i,j]);
  const best=Math.max(...ends.map(([i,j])=>s[i][j]));
  const bestEnds=ends.filter(([i,j])=>s[i][j]===best);
  const count=bestEnds.reduce((a,[i,j])=>a+cnt[i][j],0);
  const end=bestEnds[bestEnds.length-1];
  const route=backtrack(from,end,['D','S','E','T']);
  return {v,w,sc,mode,s,cnt,from,best,count,end,start:route.start,moves:route.moves,
    top:alignRows(v,w,route.start,route.moves)[0],bottom:alignRows(v,w,route.start,route.moves)[1]};
}
/* Follow the arrows back from a corner. pref sets which arrow to take on a tie. */
function backtrack(from,end,pref){

  }

function alignRows(v,w,start,moves){
  let [i,j]=start,top='',bot='';

    if(d==='D'){top+=v[i++];bot+=w[j++];}
    else if(d==='S'){top+=v[i++];bot+='-';}
    else{top+='-';bot+=w[j++];}
  }

}
function routeCorners(start,moves){
  let [i,j]=start;const c=[[i,j]];
  for(const d of moves){if(d!=='E')i++;if(d!=='S')j++;c.push([i,j]);}
  return c;
}
function routeScore(v,w,sc,start,moves){
  let [i,j]=start,t=0;
  for(const d of moves){
    if(d==='D'){t+=pairScore(sc,v[i],w[j]);i++;j++;}
    else{t+=sc.indel;if(d==='S')i++;else j++;}
  }

}

/* Every longest common subsequence, as a set of strings. */
function allLCS(v,w){
  const n=v.length,m=w.length,L=[],A=[];
  for(let i=0;i<=n;i++){L.push(Array(m+1).fill(0));A.push(Array.from({length:m+1},()=>new Set([''])));}
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    if(v[i-1]===w[j-1]){L[i][j]=L[i-1][j-1]+1;A[i][j]=new Set([...A[i-1][j-1]].map(x=>x+v[i-1]));}
    else{L[i][j]=Math.max(L[i-1][j],L[i][j-1]);const s=new Set();
      if(L[i-1][j]===L[i][j])A[i-1][j].forEach(x=>s.add(x));
      if(L[i][j-1]===L[i][j])A[i][j-1].forEach(x=>s.add(x));A[i][j]=s;}

/* The greedy card player: take both whenever the top cards match; otherwise discard from the deck with more cards
   left (deck 1 on a tie); once a deck is empty, discard the rest. */
function greedy(v,w){
  let i=0,j=0,score=0;const moves=[];
  while(i<v.length||j<w.length){
    if(i<v.length&&j<w.length&&v[i]===w[j]){moves.push('D');score++;i++;j++;}
    else if(j>=w.length||(i<v.length&&v.length-i>=w.length-j)){moves.push('S');i++;}
    else{moves.push('E');j++;}
  }
  return {score,moves};

/* Number of complete games (routes with south, east and south-east steps) from (0,0) to (n,m). */
function countGames(n,m){
  const D=[];for(let i=0;i<=n;i++){D.push([]);for(let j=0;j<=m;j++)
    D[i][j]=i===0||j===0?1:D[i-1][j]+D[i][j-1]+D[i-1][j-1];}
  return D[n][m];
}
/* How many digits the number of games has, for decks too big to count with ordinary numbers. */
function countGamesDigits(n,m){
  let row=Array(m+1).fill(1n);
  for(let i=1;i<=n;i++){const nx=[1n];for(let j=1;j<=m;j++)nx.push(row[j]+nx[j-1]+row[j-1]);row=nx;}
  return row[m].toString().length;

function binom(a,b){let r=1;for(let k=1;k<=b;k++)r=r*(a-b+k)/k;return Math.round(r);}

/* Manhattan: down is n x (m+1) (street from (i,j) south), right is (n+1) x m (street from (i,j) east). */
function manhattan(down,right){

  for(let i=0;i<=n;i++){s.push([]);cnt.push([]);from.push([]);for(let j=0;j<=m;j++){
    const c=[];
    if(i>0)c.push({d:'S',val:s[i-1][j]+down[i-1][j],k:cnt[i-1][j]});
    if(j>0)c.push({d:'E',val:s[i][j-1]+right[i][j-1],k:cnt[i][j-1]});
    if(!c.length){s[i][j]=0;cnt[i][j]=1;from[i][j]=[];continue;}
    const b=Math.max(...c.map(x=>x.val)),win=c.filter(x=>x.val===b);
    s[i][j]=b;cnt[i][j]=win.reduce((a,x)=>a+x.k,0);from[i][j]=win.map(x=>x.d);
  }}

/* Walk the richer of the two streets ahead at every corner (south on a tie). */
function manhattanGreedy(down,right){
  const n=down.length,m=right[0].length;let i=0,j=0,t=0;const moves=[];
  while(i<n||j<m){
    const sd=i<n?down[i][j]:-Infinity,se=j<m?right[i][j]:-Infinity;
    if(sd>=se){t+=sd;i++;moves.push('S');}else{t+=se;j++;moves.push('E');}

function routeSights(down,right,moves){let i=0,j=0,t=0;for(const d of moves){if(d==='S'){t+=down[i][j];i++;}else{t+=right[i][j];j++;}}return t;}

/* ---------- generators: every instance is a function of the puzzle code and the level ---------- */
/* Levels 1, 2, 7 and 8 share one pair of strings. */
function checkDecks(v,w){
  const l=allLCS(v,w),g=greedy(v,w);
  if(l.length<4||l.strings.length!==1||g.score>=l.length)return null;
  const t=align(v,w,TOLLS,'global');
  if(t.count!==1||matchesOn(v,w,t.start,t.moves)>=l.length)return null;
  return {v,w,lcs:l.strings[0],par:l.length,greedy:g.score,greedyMoves:g.moves,tolls:t};
}
function makeDecks(key){
  const rand=rng(hashStr(key+'|decks'));

  return checkDecks('AGTCACG','GTACTGAC');

/* Level 3: a corner part-way through, a best way of getting there (history A) and all discards (history B). */
function tablePuzzle(d){
  const {v,w}=d,full=align(v,w,PAIRS,'global');

  for(let i=2;i<v.length-1;i++)for(let j=2;j<w.length-1;j++){
    const before=full.s[i][j],after=allLCS(v.slice(i),w.slice(j)).length;
    if(before>=1&&after>=2&&(!pick||before>pick.before||(before===pick.before&&i+j<pick.i+pick.j)))pick={i,j,before,after};
  }
  if(!pick)pick={i:3,j:3,before:full.s[3][3],after:allLCS(v.slice(3),w.slice(3)).length};
  const sub=align(v.slice(0,pick.i),w.slice(0,pick.j),PAIRS,'global');
  const rest=align(v.slice(pick.i),w.slice(pick.j),PAIRS,'global');
  return {i:pick.i,j:pick.j,histA:sub.moves,scoreA:sub.best,histB:'S'.repeat(pick.i).split('').concat('E'.repeat(pick.j).split('')),scoreB:0,
    finish:rest.moves,finishScore:rest.best};

function makeTwelve(key){const rand=rng(hashStr(key+'|twelve'));return {v:randStr(rand,12),w:randStr(rand,12)};}
/* Level 5: a 2 x 2 practice city and a 4 x 4 city with one best route that the richer-street walker misses. */
function makeCity(key){
  const rand=rng(hashStr(key+'|city')),cell=()=>Math.floor(rand()*5);
  const grid=(n,m)=>({down:Array.from({length:n},()=>Array.from({length:m+1},cell)),right:Array.from({length:n+1},()=>Array.from({length:m},cell))});
  let small=null,big=null;
  for(let t=0;t<100000&&!small;t++){const g=grid(2,2),r=manhattan(g.down,g.right);if(r.count===1)small=Object.assign(g,{best:r.best});}
  for(let t=0;t<100000&&!big;t++){const g=grid(4,4),r=manhattan(g.down,g.right),gr=manhattanGreedy(g.down,g.right);
    if(r.count===1&&gr.score<r.best)big=Object.assign(g,{best:r.best,greedy:gr.score});}

/* Level 9: two strings that share one short stretch and little else. */
function makeLocal(key){
  const rand=rng(hashStr(key+'|local'));
  for(let t=0;t<200000;t++){
    const core=randStr(rand,5+Math.floor(rand()*2)),a=Math.floor(rand()*4),b=Math.floor(rand()*4);
    const v=randStr(rand,a)+core+randStr(rand,10-a-core.length),w=randStr(rand,b+1)+core+randStr(rand,10-b-core.length);
    if(v.length!==10||w.length!==11)continue;

function makeOverlap(key){

    shared[at]=DNA.replace(shared[at],'')[Math.floor(rand()*3)];
    const w=shared.join('')+randStr(rand,10-len);

    const cols=O.top.length,mis=[...O.top].filter((c,k)=>c!==O.bottom[k]).length;
    if(O.moves.some(d=>d!=='D')||(cols!==6&&cols!==7)||mis!==1)continue;

function bench(v,w,sc,mode){
  const r=align(v,w,sc,mode);

/* Brute force: every complete game in a fixed order, one at a time. */
function* everyGame(n,m){
  const p=[];

    if(i===n&&j===m){yield p.join('');return;}
    if(i<n&&j<m){p.push('D');yield* go(i+1,j+1);p.pop();}
    if(i<n){p.push('S');yield* go(i+1,j);p.pop();}

/* Vocabulary, in the order it is earned. */
const VOCAB=[
  {id:'alignment',name:'Alignment',def:'An alignment of two strings is a two-row table: each string is written in order in one row, with space symbols (–) inserted so that no column holds two spaces. A column can be a match, a mismatch or an indel.'},
  {id:'indel',name:'Indel',def:'An insertion or deletion: an alignment column with a letter in one row and a space in the other. Read one way a letter was inserted; read the other way it was deleted.'},
  {id:'lcs',name:'Longest common subsequence',code:'BA5C',def:'A longest string whose letters appear in order, though not necessarily side by side, in both strings. Its length is the largest number of matching columns any alignment of the two strings can have.'},
  {id:'graph',name:'Alignment graph',def:'For strings v and w: a node (i, j) for every 0 ≤ i ≤ |v| and 0 ≤ j ≤ |w|, with directed edges south (i, j)→(i+1, j), east (i, j)→(i, j+1) and diagonal (i, j)→(i+1, j+1). Every alignment of v and w is a path from (0, 0) to (|v|, |w|).'},
  {id:'path',name:'Path',def:'A sequence of nodes in which each node is joined to the next by an edge, followed in the edge’s direction.'},
  {id:'mtp',name:'Manhattan Tourist Problem',code:'BA5B',def:'Find a path of largest total weight from the source (0, 0) to the sink (n, m) of a rectangular grid whose edges run only south and east, each weighted by the number of attractions along it.'},
  {id:'dp',name:'Dynamic programming',src:'bellman',def:'Solving a problem by solving each of its smaller subproblems once, in an order where every subproblem’s parts are already solved, and storing the answers in a table instead of recomputing them. In a grid: s(i, j) is the best of the values arriving from the neighbouring corners.'},
  {id:'backtrack',name:'Backtracking',def:'Recovering the best path itself, not only its score, by following stored pointers back from the sink. Each pointer records which incoming edge gave its node the best value.'},
  {id:'global',name:'Global alignment',src:'nw',code:'BA5E',def:'A highest-scoring alignment of the whole of v against the whole of w, under a given scoring of matches, mismatches and indels: a highest-weight path from (0, 0) to (|v|, |w|).'},
  {id:'matrix',name:'Scoring matrix',src:'henikoff',def:'A table giving the score of aligning every pair of symbols. BLOSUM62 and PAM250 are scoring matrices for the twenty amino acids.'},
  {id:'indelpen',name:'Indel penalty',def:'The amount σ subtracted from an alignment’s score for every indel: in the alignment graph, the weight −σ on every south and east edge.'},
  {id:'local',name:'Local alignment',src:'sw',code:'BA5F',def:'A highest-scoring global alignment of a substring of v with a substring of w. In the alignment graph: free (weight 0) edges from the source to every node and from every node to the sink.'},
  {id:'overlap',name:'Overlap alignment',code:'BA5I',def:'A highest-scoring global alignment of a suffix of v with a prefix of w. In the alignment graph: free edges from the source to every node of the left column and from every node of the bottom row to the sink.'}

let cur=null;

/* timed show: steps 1..n, every ms; skipped entirely under reduced motion */
let showTimer=0;
function show(n,ms,onStep,onDone){
  clearInterval(showTimer);const mine=cur;
  if(RM()||n<=0){onDone();return;}
  let k=0;
  showTimer=setInterval(()=>{
    if(cur!==mine){clearInterval(showTimer);return;}
    k++;if(k>=n){clearInterval(showTimer);onDone();return;}
    onStep(k);render();
  },ms);
}

const MODES={};
function loadLevel(id){
  clearInterval(showTimer);if(cur&&cur.timer)clearInterval(cur.timer);
  const L=LEVELS[id-1];
  cur={L,mode:L.mode,phase:'play',done:false,reveal:[],msg:{text:'',kind:''},stage:null,t0:Date.now(),hand:0};
  if(L.inst)cur.inst=inst(L.inst);
  MODES[L.mode].init(cur);
  log('load',{mode:L.mode,key:L.inst?instKey(L.inst):''});
  render();
}
function grant(ids){
  const fresh=[];
  ids.forEach(id=>{if(!S.badges.includes(id)){S.badges.push(id);S.earnedAt[id]=cur.L.id;fresh.push(id);}});
  return fresh;
}
/* finish the level: blocks are {html, src} shown in the reveal */
function complete(ids,blocks,data){
  cur.done=true;const fresh=grant(ids||[]);
  cur.reveal=blocks||[];
  if(cur.L.id<LEVELS.length)S.unlocked=Math.max(S.unlocked,cur.L.id+1);
  log('complete',Object.assign({ms:Date.now()-cur.t0,earned:fresh},data||{}));
  render();
}

/* one dispatcher for every move: real clicks arrive here, and so do the tests */
function act(type,a,b,c){
  if(type==='next')return loadLevel(cur.L.id+1);
  if(type==='lvl'){const n=+a;if(previewLevel||n<=S.unlocked)loadLevel(n);return;}
  if(type==='print'){$('#guide').open=true;window.print();return;}
  if(type==='skip'){if(cur.skipAct)return act(cur.skipAct[0],cur.skipAct[1],cur.skipAct[2]);return;}
  const M=MODES[cur.mode];
  if(M.act)M.act(cur,type,a,b,c);
}

/* ---------- the city grid: corner (i, j) has i cards gone from deck 1 (rows) and j from deck 2 (columns) ---------- */
const STEP={S:[-1,0],E:[0,-1],D:[-1,-1]};          /* where a street arriving by d comes from */
function fromOf(i,j,d){const s=STEP[d];return [i+s[0],j+s[1]];}
function gridSvg(o){
  const n=o.n,m=o.m,P=o.P||56,x0=o.rows!==undefined?38:22,y0=o.cols!==undefined?38:22;
  const X=j=>x0+j*P,Y=i=>y0+i*P,W=X(m)+(o.tourist?40:22),H=Y(n)+(o.tourist?46:22);
  let h='<svg class="city" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="'+esc(o.label||'City map')+'"'+(o.maxw?' style="max-width:'+o.maxw+'px;margin:0 auto'+(o.minw?';min-width:'+o.minw+'px':'')+'"':'')+'>';
  /* blocks */
  for(let i=0;i<n;i++)for(let j=0;j<m;j++){
    const x=X(j),y=Y(i),k=(i*7+j*3)%5;
    h+='<rect class="blk" x="'+(x+8)+'" y="'+(y+8)+'" width="'+(P-16)+'" height="'+(P-16)+'" rx="4"/>';
    if(P>=44){
      if(k<3)h+='<use href="#a-house" transform="translate('+(x+P*.3)+','+(y+P*.7)+') scale('+(P/80)+')"/>';
      if(k!==1)h+='<use href="#a-tree" transform="translate('+(x+P*.72)+','+(y+P*.3)+') scale('+(P/70)+')"/>';
    }
  }
  /* axis letters */
  if(o.cols!==undefined)[...o.cols].forEach((ch,j)=>{h+='<text class="axis d'+(o.prot?'P':ch)+'" x="'+(X(j)+P/2)+'" y="16">'+ch+'</text>';});
  if(o.rows!==undefined)[...o.rows].forEach((ch,i)=>{h+='<text class="axis d'+(o.prot?'P':ch)+'" x="15" y="'+(Y(i)+P/2)+'">'+ch+'</text>';});
  /* streets */
  const streets=[],hits=[],labels=[];
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++)for(const d of ['S','E','D']){
    const [a,b]=fromOf(i,j,d);if(a<0||b<0)continue;
    if(d==='D'&&!o.diag)continue;
    const st=o.street?o.street(i,j,d):{};if(st===null)continue;
    const x1=X(b),y1=Y(a),x2=X(j),y2=Y(i),wd=d==='D'?(st.w||5):(st.w||8);
    streets.push({z:st.z||0,s:'<line class="st '+(st.cls||'')+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke-width="'+wd+'"/>'+
      (d!=='D'&&!st.cls?'<line class="st-dash" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke-width="1.2"/>':'')});
    if(st.price!==undefined&&st.price!==null){
      const mx=d==='D'?x1+(x2-x1)*.62:x1+(x2-x1)*.34,my=d==='D'?y1+(y2-y1)*.38:y1+(y2-y1)*.34;
      labels.push('<text class="price'+(String(st.price).startsWith('−')||st.price<0?' neg':'')+'" x="'+mx+'" y="'+my+'">'+st.price+'</text>');
    }
    if(st.icon){const mx=(x1+x2)/2,my=(y1+y2)/2;labels.push('<use href="#'+st.icon+'" transform="translate('+(mx+(d==='S'?11:0))+','+(my+(d==='E'?-10:0))+') scale(.7)"/>');}
    if(st.arrow){const f=st.price!==undefined&&st.price!==null?.52:.3,ax1=x1+(x2-x1)*f,ay1=y1+(y2-y1)*f,ax2=x1+(x2-x1)*.76,ay2=y1+(y2-y1)*.76;
      labels.push('<line class="arrow" x1="'+ax1+'" y1="'+ay1+'" x2="'+ax2+'" y2="'+ay2+'" marker-end="url(#mArrow)"/>');}
    if(st.hit)hits.push('<line class="hitst" data-act="street" data-a="'+i+'" data-b="'+j+'" data-c="'+d+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke-width="'+Math.max(18,P*.5)+'"><title>'+esc(st.hit)+'</title></line>');
  }
  streets.sort((p,q)=>p.z-q.z).forEach(s=>h+=s.s);
  /* overlays: trails and routes, as lists of corners */
  (o.overlays||[]).forEach((ov,k)=>{
    const off=ov.off||0;
    h+='<polyline class="st '+ov.cls+'" fill="none" stroke-width="'+(ov.w||6)+'" stroke-linejoin="round" points="'+
      ov.corners.map(([i,j])=>(X(j)+off)+','+(Y(i)+off)).join(' ')+'"/>';
  });
  h+=labels.join('');
  h+=hits.join('');
  /* corners */
  const r=o.r||Math.min(15,P*.27);
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    const c=o.corner?o.corner(i,j):{};if(c===null)continue;
    const x=X(j),y=Y(i),hit=c.hit;
    h+='<g class="cn '+(c.cls||'')+'"'+(hit?' data-act="corner" data-a="'+i+'" data-b="'+j+'" tabindex="0" role="button" aria-label="'+esc(hit)+'"':'')+'>'+
      (hit?'<circle cx="'+x+'" cy="'+y+'" r="'+(P*.42)+'" fill="transparent"/>':'')+
      '<circle class="corner"'+(c.fill?' style="fill:'+c.fill+'"':'')+' cx="'+x+'" cy="'+y+'" r="'+(c.num!==undefined&&c.num!==''?r:r*.55)+'"/>'+
      (c.num!==undefined&&c.num!==''?'<text class="cnum" x="'+x+'" y="'+(y+.5)+'">'+c.num+'</text>':'')+
      (hit?'<title>'+esc(hit)+'</title>':'')+'</g>';
  }
  if(o.taxi)o.taxi.forEach(([i,j])=>{h+='<use pointer-events="none" href="#a-taxi" transform="translate('+(X(j)-P*.05)+','+(Y(i)-P*.38)+') scale('+(P/62)+')"/>';});
  if(o.tourist){const [i,j]=o.tourist;h+='<g id="tourist" transform="translate('+(X(j)+P*.3)+','+(Y(i)+P*.3)+') scale('+(P/44)+')"><use href="#a-tourist"/></g>';}
  return h+'</svg>';
}
/* An alignment drawn as two rows of tiles, deck 1 on top. */
function alignTiles(top,bot,opts){
  opts=opts||{};
  const cls=k=>top[k]==='-'||bot[k]==='-'?'gp':top[k]===bot[k]?'hit':opts.near&&opts.near(top[k],bot[k])?'':'mis';
  const row=s=>'<div class="strand">'+[...s].map((ch,k)=>'<span class="'+cls(k)+(opts.dim&&opts.dim(k)?' off':'')+'">'+(ch==='-'?'–':ch)+'</span>').join('')+'</div>';
  return '<div class="alignout">'+(opts.label?'<div class="sub">'+opts.label+'</div>':'')+row(top)+row(bot)+'</div>';
}
/* ---------- pencilling a grid: shared by levels 5, 7 and 8 ---------- */
/* g = {n, m, weight(i,j,d) -> number, s:[][] values or undefined, arrow:[][] chosen street} */
function penInit(n,m,weight){
  const s=[],arrow=[];for(let i=0;i<=n;i++){s.push(Array(m+1).fill(undefined));arrow.push(Array(m+1).fill(null));}
  s[0][0]=0;return {n,m,weight,s,arrow,byHand:0};
}
function penArrivals(g,i,j){
  const out=[];
  for(const d of ['S','E','D']){const [a,b]=fromOf(i,j,d);if(a<0||b<0)continue;const w=g.weight(i,j,d);if(w===null)continue;
    out.push({d,from:[a,b],val:g.s[a][b]===undefined?undefined:g.s[a][b]+w,w});}
  return out;
}
function penReady(g,i,j){
  if(g.s[i][j]!==undefined)return false;
  const ar=penArrivals(g,i,j);return ar.length>0&&ar.every(x=>x.val!==undefined);
}
function penBest(g,i,j){return Math.max(...penArrivals(g,i,j).map(x=>x.val));}
function penSet(g,i,j,d){const ar=penArrivals(g,i,j),x=ar.find(y=>y.d===d);g.s[i][j]=x.val;g.arrow[i][j]=d;}
/* fill every ready corner, in reading order, with the best arrival (diagonal, then south, then east on a tie) */
function penAuto(g){
  const order=[];
  for(let i=0;i<=g.n;i++)for(let j=0;j<=g.m;j++)if(g.s[i][j]===undefined){
    const ar=penArrivals(g,i,j),b=Math.max(...ar.map(x=>x.val));
    const d=['D','S','E'].find(d=>ar.some(x=>x.d===d&&x.val===b));penSet(g,i,j,d);order.push([i,j]);
  }
  return order;
}
function penFull(g){for(let i=0;i<=g.n;i++)for(let j=0;j<=g.m;j++)if(g.s[i][j]===undefined)return false;return true;}
/* the route the arrows give, from the far corner back to the start */
function penRoute(g,end){
  let [i,j]=end||[g.n,g.m];const c=[[i,j]];
  while(i>0||j>0){const d=g.arrow[i][j];if(!d)break;[i,j]=fromOf(i,j,d);c.push([i,j]);}
  return c.reverse();
}
function cornersToMoves(c){const m=[];for(let k=1;k<c.length;k++){const di=c[k][0]-c[k-1][0],dj=c[k][1]-c[k-1][1];m.push(di&&dj?'D':di?'S':'E');}return m;}

/* ---------- level 1: two strands ---------- */
function strandCols(c){
  const a=c.a,b=c.b,L=Math.max(a.length,b.length);
  return Array.from({length:L},(_,k)=>[k<a.length?a[k]:null,k<b.length?b[k]:null]);
}
function strandHits(c){return strandCols(c).filter(([x,y])=>x&&y&&x!=='-'&&x===y).length;}
function strandTidy(c){
  for(let k=Math.min(c.a.length,c.b.length)-1;k>=0;k--)if(c.a[k]==='-'&&c.b[k]==='-'){c.a.splice(k,1);c.b.splice(k,1);}
  while(c.a.length&&c.a[c.a.length-1]==='-')c.a.pop();
  while(c.b.length&&c.b[c.b.length-1]==='-')c.b.pop();
}
MODES.strands={
  init(c){c.a=[...c.inst.v];c.b=[...c.inst.w];c.hist=[];say('Click a letter to push a gap in front of it.');},
  rule:()=>'Letters keep their order · a gap pushes a letter to the right',
  view(c){
    const cols=strandCols(c),row=(arr,r)=>'<div class="strand">'+cols.map(([x,y],k)=>{
      const ch=r?y:x,hit=x&&y&&x!=='-'&&x===y;
      if(ch===null)return '<span class="tail" aria-hidden="true">·</span>';
      if(ch==='-')return '<button class="gap" data-act="gap" data-a="'+r+'" data-b="'+k+'" aria-label="Gap, click to remove">–</button>';
      return '<button class="let'+(hit?' hit':'')+'" data-act="gap" data-a="'+r+'" data-b="'+k+'" aria-label="'+ch+', click to push a gap in front">'+letters(ch)+'</button>';
    }).join('')+'</div>';
    return '<div class="strands"><div class="strandlab">Strand 1</div>'+row(c.a,0)+row(c.b,1)+'<div class="strandlab">Strand 2</div></div>'+
      '<div class="tally">Matching letters lined up: '+strandHits(c)+'</div>';
  },
  act(c,type,r,k){
    if(c.done)return;
    if(type==='gap'){
      r=+r;k=+k;const arr=r?c.b:c.a;if(k>=arr.length)return;
      c.hist.push(JSON.stringify([c.a,c.b]));
      if(arr[k]==='-'){arr.splice(k,1);log('gap_remove',{row:r+1,at:k});}
      else{if(arr.length>=c.inst.v.length+c.inst.w.length)return;arr.splice(k,0,'-');log('gap_add',{row:r+1,at:k});}
      strandTidy(c);say(strandHits(c)+' matching letters lined up.');render();
    }else if(type==='lock'){
      const k=strandHits(c),par=c.inst.par,top=strandCols(c).map(([x])=>x===null?'-':x).join(''),bot=strandCols(c).map(([,y])=>y===null?'-':y).join('');
      log('lock',{hits:k,top,bottom:bot});
      say(k<par?'You lined up '+k+'. A better line-up exists: '+par+' matching letters are possible.':'You lined up '+k+'. Nobody can line up more.',k<par?'warn':'good');
      c.final={top,bot,k};
      complete(['alignment','indel'],[
        {html:()=>alignTiles(top,bot,{label:'Your line-up'})+'What you built is an '+term('alignment','alignment')+': the two strands one above the other, each kept in order, with gaps (–) put in so that letters stand in columns. A column with a gap marks a letter that one strand gained or the other lost: an '+term('indel','indel')+' (insertion or deletion).'},
        {html:()=>k<par?'You found '+k+' matching columns. <b>'+par+' is possible.</b> Finding the best line-up by sliding gaps is guesswork. The next level turns it into a game.':'You found the most matching columns possible, '+par+'. Could you prove nobody can beat it? The next level turns the job into a game.'}
      ],{hits:k,par});
    }
  },
  undo(c){if(!c.hist.length)return;[c.a,c.b]=JSON.parse(c.hist.pop());log('undo');say(strandHits(c)+' matching letters lined up.');},
  canUndo:c=>c.hist.length>0,
  skip:c=>({label:'Lock it in: '+strandHits(c)+' lined up',act:['lock']})
};

/* ---------- the card table, shared by levels 2, 3 and 4 ---------- */
function newGame(){return {i:0,j:0,moves:[],score:0};}
function applyMove(g,v,w,d){
  if(d==='D'){if(g.i>=v.length||g.j>=w.length)return false;if(v[g.i]===w[g.j])g.score++;g.i++;g.j++;}
  else if(d==='S'){if(g.i>=v.length)return false;g.i++;}
  else{if(g.j>=w.length)return false;g.j++;}
  g.moves.push(d);
  /* once a deck is empty the rest of the other deck is thrown away */
  if(g.i>=v.length)while(g.j<w.length){g.j++;g.moves.push('E');}
  else if(g.j>=w.length)while(g.i<v.length){g.i++;g.moves.push('S');}
  return true;
}
function gameOver(g,v,w){return g.i>=v.length&&g.j>=w.length;}
function deckRow(label,s,k,live){
  return '<div class="deckrow"><span class="decklab">'+label+'</span><div class="cards">'+[...s].map((ch,x)=>{
    if(x<k)return '';
    const top=x===k;
    return top&&live?'<button class="tcard top" data-act="move" data-a="'+(label==='Deck 1'?'S':'E')+'" aria-label="Top card '+ch+': throw it away">'+letters(ch)+'</button>'
      :'<span class="tcard'+(top?' top':'')+'">'+letters(ch)+'</span>';
  }).join('')+(k>=s.length?'<span class="sub">empty</span>':'')+'</div></div>';
}
function pairsTaken(g,v,w){
  let i=0,j=0;const out=[];
  g.moves.forEach(d=>{if(d==='D'){out.push([v[i],w[j]]);i++;j++;}else if(d==='S')i++;else j++;});
  return out;
}
function spelled(g,v,w){return pairsTaken(g,v,w).filter(([a,b])=>a===b).map(p=>p[0]).join('');}
function deckTable(v,w,g,live,title){
  const pairs=pairsTaken(g,v,w);
  let h='<div class="table">'+(title?'<div class="sub">'+title+'</div>':'')+
    deckRow('Deck 1',v,g.i,live)+deckRow('Deck 2',w,g.j,live);
  if(live&&!gameOver(g,v,w)){
    const same=v[g.i]===w[g.j];
    h+='<div class="moves"><button class="take" data-act="move" data-a="D">Take both'+(same?' (a pair: +1)':' (no point)')+'</button>'+
      '<button data-act="move" data-a="S">Throw away deck 1’s top card</button><button data-act="move" data-a="E">Throw away deck 2’s top card</button></div>';
  }
  h+='<div class="sub" style="margin-top:10px">Taken · '+plural(g.score,'point')+'</div><div class="pairs">'+
    pairs.map(([a,b])=>'<div class="pair '+(a===b?'match':'miss')+'"><span class="tcard">'+letters(a)+'</span><span class="tcard">'+letters(b)+'</span></div>').join('')+'</div>'+
    '<div>Pairs spell: <span class="spell">'+(spelled(g,v,w)||'&nbsp;')+'</span></div>';
  return h+'</div>';
}

/* ---------- level 2: two decks ---------- */
MODES.decks={
  init(c){c.g=newGame();c.games=0;c.best=0;S.games[instKey('decks')]=S.games[instKey('decks')]||[];
    say('Take both top cards, or throw one away.');},
  rule:c=>'Take both top cards, or throw one away · nothing comes back'+(c.games||(S.games[instKey('decks')]||[]).length?' · par '+c.inst.par:''),
  view(c){
    const list=S.games[instKey('decks')]||[];
    return deckTable(c.inst.v,c.inst.w,c.g,!c.done&&!gameOver(c.g,c.inst.v,c.inst.w))+
      (list.length?'<div class="pad games" style="color:var(--muted)">Your games so far: '+list.map(m=>matchesOn(c.inst.v,c.inst.w,[0,0],m.split(''))).join(', ')+' points · par '+c.inst.par+'</div>':'');
  },
  act(c,type,d){
    if(c.done)return;
    const {v,w}=c.inst;
    if(type==='deal'){c.g=newGame();log('deal');say('A fresh deal of the same two decks.');render();return;}
    if(type!=='move'||gameOver(c.g,v,w))return;
    const before=[c.g.i,c.g.j];
    if(!applyMove(c.g,v,w,d))return;
    log('card',{move:d,at:before,pair:d==='D'?v[before[0]]+w[before[1]]:undefined});
    if(gameOver(c.g,v,w)){
      const k=c.g.score,list=S.games[instKey('decks')];list.push(c.g.moves.join(''));if(list.length>12)list.shift();
      c.games++;log('game',{moves:c.g.moves.join(''),score:k,par:c.inst.par});
      if(k>=c.inst.par){
        say('Par: '+k+' points. Your pairs spell '+spelled(c.g,v,w)+'.','good');
        const [top,bot]=alignRows(v,w,[0,0],c.g.moves);
        complete(['lcs'],[{html:()=>'Your pairs spell <b class="mono">'+c.inst.lcs+'</b>. Its letters appear in order in deck 1 and in deck 2, though not side by side. A longest string like that is a '+term('lcs','longest common subsequence')+'; for these decks there is only one.'},
          {html:()=>alignTiles(top,bot,{label:'Your game, written as a line-up'})+'Every game is also a line-up like the one in level 1: a pair taken is a column of two letters, and a card thrown away is a column with a gap.'}],{games:c.games});
        return;
      }
      say('Game over: '+plural(k,'point')+'. Par for these decks is '+c.inst.par+'.','warn');
    }else say(plural(c.g.score,'point')+' so far.');
    render();
  },
  skip:c=>gameOver(c.g,c.inst.v,c.inst.w)?{label:'Deal the same decks again',act:['deal']}:null
};

/* ---------- level 3: what does the table remember? ---------- */
const CHOICES=['Every move made so far','The score so far','Only how many cards have gone from each deck'];
function histChips(v,w,moves,start){
  let [i,j]=start||[0,0];
  return moves.map(d=>{const s=d==='D'?'pair '+v[i]+'·'+w[j]+(v[i]===w[j]?' +1':''):d==='S'?'threw away '+v[i]+' (deck 1)':'threw away '+w[j]+' (deck 2)';
    if(d!=='E')i++;if(d!=='S')j++;return '<span>'+s+'</span>';}).join('');
}
function trailList(c){
  const saved=(S.games[instKey('decks')]||[]).map(s=>s.split(''));
  if(saved.length)return {mine:true,list:saved.slice(-6)};
  return {mine:false,list:[greedy(c.inst.v,c.inst.w).moves,align(c.inst.v,c.inst.w,PAIRS,'global').moves]};
}
MODES.table={
  init(c){c.tp=tablePuzzle(c.inst);c.phase='ask';c.struck=[];c.shown=false;c.drawn=0;
    say('To finish as well as possible from here, what do you need to know?');},
  rule:c=>c.phase==='ask'?'Same cards left on both tables':'One dot for every way the table can look',
  view(c){
    const {v,w}=c.inst,tp=c.tp;
    if(c.phase==='ask'){
      const one=(name,hist,score)=>{const g={i:tp.i,j:tp.j,moves:[],score:0};
        return '<div class="table"><div class="sub">Table '+name+' · '+plural(score,'point')+' so far</div><div class="hist">'+histChips(v,w,hist)+'</div>'+
          deckRow('Deck 1',v,tp.i,false)+deckRow('Deck 2',w,tp.j,false)+
          (c.shown?'<div class="sub">Best finish from here</div><div class="hist">'+histChips(v,w,tp.finish,[tp.i,tp.j])+'</div><div class="spell">'+signed(tp.finishScore)+' → '+plural(score+tp.finishScore,'point')+'</div>':'')+'</div>';};
      return '<div class="twotables pad">'+one('A',tp.histA,tp.scoreA)+one('B',tp.histB,tp.scoreB)+'</div>'+
        '<div class="choices"><div class="sub">To finish as well as possible from here, you need to know…</div>'+
        CHOICES.map((t,k)=>'<button data-act="answer" data-a="'+k+'"'+(c.struck.includes(k)?' class="struck" disabled':'')+'>'+t+'</button>').join('')+'</div>';
    }
    /* the dots */
    const tr=trailList(c),n=v.length,m=w.length;
    const ov=tr.list.map((mv,k)=>({corners:routeCorners([0,0],mv).slice(0,c.phase==='dots'&&!c.done?Math.max(1,c.drawn+1):99),cls:'trail',off:(k%3-1)*3,w:4}));
    const cornerTitle=(i,j)=>'Deck 1: '+(n-i)+' left'+(i<n?' ('+v.slice(i)+')':'')+'; deck 2: '+(m-j)+' left'+(j<m?' ('+w.slice(j)+')':'');
    return '<div class="pad sub">'+(tr.mine?'Your level 2 games':'Two sample games')+' as trails · rows: cards gone from deck 1 · columns: cards gone from deck 2</div>'+
      '<div class="cityscroll">'+gridSvg({n,m,rows:v,cols:w,diag:true,P:58,maxw:620,minw:480,label:'Every position of the two decks',
      street:()=>({cls:'faint',w:3}),overlays:ov,
      corner:(i,j)=>({cls:(c.done&&i===tp.i&&j===tp.j?'pick':'')+(c.miss&&c.miss[0]===i&&c.miss[1]===j?' shake':''),hit:cornerTitle(i,j)}),
      tourist:c.done?[tp.i,tp.j]:null})+'</div>';
  },
  act(c,type,a,b){
    if(c.done)return;
    if(type==='answer'&&c.phase==='ask'){
      const k=+a;log('answer',{choice:CHOICES[k],right:k===2});
      if(k!==2){
        c.struck.push(k);c.shown=true;
        stage(k===0?'The two tables were reached by different moves, yet the best finish is the same on both.':'The two tables have different scores, yet the best finish is the same on both: '+signed(c.tp.finishScore)+'.','warn');
        say('Choose again.');render();return;
      }
      c.phase='dots';c.stage=null;c.drawn=0;
      say('Every way the table can look is one dot. Watch your games walk across them.');
      const len=Math.max(...trailList(c).list.map(x=>x.length));
      show(len+1,260,k2=>{c.drawn=k2;},()=>{c.drawn=99;say('Click the dot where tables A and B both stand.');render();});
      render();return;
    }
    if(type==='corner'&&c.phase==='dots'){
      const i=+a,j=+b,tp=c.tp;log('dot',{at:[i,j],right:i===tp.i&&j===tp.j});
      if(i!==tp.i||j!==tp.j){c.miss=[i,j];stage('That dot leaves '+(c.inst.v.length-i)+' cards in deck 1 and '+(c.inst.w.length-j)+' in deck 2. The tables have '+(c.inst.v.length-tp.i)+' and '+(c.inst.w.length-tp.j)+'.','warn');render();c.miss=null;return;}
      c.stage=null;say('Both tables stand on this dot: '+tp.i+' cards gone from deck 1, '+tp.j+' from deck 2.','good');
      complete(['graph','path'],[{html:'Each dot stands for one way the table can look: how many cards have gone from each deck, nothing more. In Bridge Walker you called dots like these <b>nodes</b> and the steps between them <b>edges</b>; the same words apply here. This grid of nodes and edges is the '+term('graph','alignment graph')+' of the two decks. A step south throws away from deck 1, a step east from deck 2, a step south-east takes both.'},
        {html:'One complete game is a '+term('path','path')+' from the top-left node to the bottom-right one, and every path is a game.'}]);
    }
  },
  skip:c=>c.phase==='dots'&&c.drawn<99?{label:'Skip the replay',act:['fastdots']}:null
};
const _tableAct=MODES.table.act;
MODES.table.act=function(c,type,a,b){if(type==='fastdots'){clearInterval(showTimer);c.drawn=99;say('Click the dot where tables A and B both stand.');render();return;}_tableAct(c,type,a,b);};

/* ---------- level 4: too many games ---------- */
const BOT_RATE=400;      /* games a second, so each one can be dealt on screen */
MODES.wall={
  init(c){c.g=newGame();c.total=countGames(12,12);c.bot={on:false,played:0,best:0,last:''};c.it=null;say('Start the bot.');},
  rule:c=>'12 cards a deck · '+fmt(c.total)+' possible games',
  view(c){
    const {v,w}=c.inst,b=c.bot,secs=(c.total-b.played)/BOT_RATE,days=secs/86400;
    return deckTable(v,w,c.g,!c.done&&!gameOver(c.g,v,w),'Your table')+
      '<div class="bot"><div class="sub">The bot’s table</div>'+
      '<div class="count">'+fmt(b.played)+' <span style="font-size:.9rem;font-weight:400">of '+fmt(c.total)+' games played</span></div>'+
      '<div class="meter"><i style="width:'+Math.max(.2,100*b.played/c.total)+'%"></i></div>'+
      '<div>Best so far: '+plural(b.best,'point')+(b.last?' · last game: <span class="mono">'+b.last+'</span>':'')+'</div>'+
      (b.on?'<div>At '+BOT_RATE+' games a second it needs about <b>'+(days>=1?days.toFixed(1)+' days':Math.round(secs/60)+' minutes')+'</b> more. Two genes of a thousand letters would give a count of games '+c.bigDigits+' digits long.</div>'
        :'<button class="primary" data-act="bot" style="margin-top:8px">Start the bot</button>')+'</div>';
  },
  act(c,type,d){
    if(c.done)return;
    const {v,w}=c.inst;
    if(type==='bot'&&!c.bot.on){
      c.bot.on=true;c.it=everyGame(12,12);c.bigDigits=countGamesDigits(1000,1000);log('bot_start');
      const mine=c;
      c.timer=setInterval(()=>{
        if(cur!==mine||mine.done){clearInterval(mine.timer);return;}
        for(let k=0;k<BOT_RATE/10;k++){const r=mine.it.next();if(r.done)break;const s=matchesOn(v,w,[0,0],r.value.split(''));mine.bot.played++;mine.bot.last=r.value;if(s>mine.bot.best)mine.bot.best=s;}
        render();
      },100);
      say('The bot is playing every game in turn.');render();return;
    }
    if(type==='giveup'){log('gave_up',{played:c.bot.played});clearInterval(c.timer);c.title='Stuck is the right answer';
      say('The bot would still be dealing next week.');
      complete([],[{html:()=>'Twelve cards a deck already make '+fmt(c.total)+' different games, and the count roughly multiplies by six for every card added to both decks. Playing them all is hopeless. Something smarter has to look at fewer things.'}],{played:c.bot.played});return;}
    if(type==='deal'){c.g=newGame();render();return;}
    if(type==='move'&&!gameOver(c.g,v,w)){applyMove(c.g,v,w,d);log('card',{move:d});
      if(gameOver(c.g,v,w))say('Your game: '+plural(c.g.score,'point')+'. One game of '+fmt(c.total)+'.');render();}
  },
  skip:c=>c.bot.on&&(RM()||c.bot.played>=1200)?{label:'Stop the bot: trying every game is hopeless',act:['giveup']}:gameOver(c.g,c.inst.v,c.inst.w)?{label:'Deal again',act:['deal']}:null
};

/* ---------- level 5: the tourist ---------- */
function cityWeight(city){return (i,j,d)=>d==='S'?city.down[i-1][j]:d==='E'?city.right[i][j-1]:null;}
const HAND_CAP=15;
function routeText(m){return m.split('').map(d=>d==='S'?'S':'E').join(' ');}
MODES.tourist={
  init(c){c.phase='small';c.walk={i:0,j:0,moves:'',t:0};c.found={};c.botRuns={off:null,on:null};c.memo=false;
    say('Click a street leaving the tourist’s corner.');},
  rule:c=>c.phase==='small'?'East or south only · count the sights':c.phase==='big'?'Pencil: the most sights on arrival · '+c.g.byHand+' of '+HAND_CAP+' corners by hand':'A bot that can remember',
  view(c){
    if(c.phase==='small'){
      const city=c.inst.small,wt=cityWeight(city),w=c.walk,trail=routeCorners([0,0],w.moves.split(''));
      const routes=Object.keys(c.found);
      return '<div class="cityscroll">'+gridSvg({n:2,m:2,P:92,maxw:360,label:'A two by two city',
        street:(i,j,d)=>{const [a,b]=fromOf(i,j,d),next=a===w.i&&b===w.j&&!c.done;return {price:wt(i,j,d),cls:next?'avail':'',hit:next?'Walk this street':undefined};},
        overlays:[{corners:trail,cls:'route',w:7}],corner:(i,j)=>({cls:i===2&&j===2?'pick':''}),tourist:[w.i,w.j]})+'</div>'+
        '<div class="pad"><div class="sub">Routes walked · '+routes.length+' of 6 · sights so far on this walk: '+w.t+'</div>'+
        (routes.length?routes.map(r=>'<div class="mono">'+routeText(r)+' → '+plural(c.found[r],'sight')+'</div>').join(''):'<div class="gmeta">None yet.</div>')+'</div>';
    }
    const g=c.g,city=c.inst.big,wt=cityWeight(city);
    const route=c.phase==='bot'?penRoute(g):null;
    let h='<div class="pad sub">This city has '+binom(8,4)+' routes from corner to corner. '+(c.phase==='big'?'Pencil each corner with the most sights the tourist can have seen on arrival: click the street that best arrival comes along.':'Your pencilled city.')+'</div>'+
      '<div class="cityscroll">'+gridSvg({n:4,m:4,P:72,maxw:430,minw:330,label:'A four by four city',
      street:(i,j,d)=>{
        const ready=c.phase==='big'&&penReady(g,i,j),fl=c.flash&&c.flash[0]===i&&c.flash[1]===j&&c.flash[2]===d;
        return {price:wt(i,j,d),arrow:g.arrow[i][j]===d,cls:fl?'flash':ready?'avail':'',hit:ready?'Pencil this corner from this street':undefined};},
      overlays:route?[{corners:route,cls:'route',w:5}]:[],
      corner:(i,j)=>({num:g.s[i][j]===undefined?'':g.s[i][j],cls:g.s[i][j]!==undefined?'done':penReady(g,i,j)&&c.phase==='big'?'ready':''}),
      tourist:[0,0]})+'</div>';
    if(c.phase==='bot'){
      const b=c.botRuns;
      h+='<div class="bot"><div class="sub">The brute-force bot, back again</div>'+
        '<label><input type="checkbox" data-change="memo"'+(c.memo?' checked':'')+(b.off===null||c.done?' disabled':'')+'> Remember answers (write the best arrival at each corner, and never work a corner out twice)</label>'+
        '<div style="margin-top:8px"><button class="primary" data-act="run"'+(c.done?' disabled':'')+'>Run the bot</button></div>'+
        '<table><tr><th></th><th>Switch off</th><th>Switch on</th></tr>'+
        '<tr><td>Works through</td><td class="n">'+(b.off?b.off.routes+' routes':'—')+'</td><td class="n">'+(b.on?b.on.corners+' corners':'—')+'</td></tr>'+
        '<tr><td>Streets looked at</td><td class="n">'+(b.off?b.off.streets:'—')+'</td><td class="n">'+(b.on?b.on.streets:'—')+'</td></tr>'+

  },
  act(c,type,a,b,d){

      w.t+=cityWeight(c.inst.small)(i,j,d);w.i=i;w.j=j;w.moves+=d;log('walk',{to:[i,j]});
      if(i===2&&j===2){

  },

  },

function r24(){return 'it worked out 24 corners and looked at each of the 40 streets once';}

/* ---------- level 6: follow your arrows ---------- */

/* ---------- shared: walking back along arrows on a deck city ---------- */
function backAct(c,i,j,onHome){

  c.pos=[i,j];c.back.push([i,j]);c.stage=null;log('back',{to:[i,j]});

const matchW=v=>w=>(i,j,d)=>d==='D'?(v[i-1]===w[j-1]?1:0):0;

/* ---------- levels 9 and 10: the free taxi ---------- */

}

    rule:()=>overlapMode?'Free taxi: down the left edge, and off the bottom edge':'Free taxi: from the start to any corner, and from any corner to the end',

      const lab=overlapMode?['Read 1','Read 2']:['Strand 1','Strand 2'];
      let h='<div class="pad sub">'+lab[0]+' down the side · '+lab[1]+' across the top · dashed grey: the best route from corner to corner, score '+c.glob.best+'</div>'+
        '<div class="cityscroll">'+gridSvg({n,m,rows:v,cols:w,diag:true,P:48,maxw:700,minw:560,label:'Two strands as a city',
        street:(i,j,d)=>{const gold=d==='D'&&v[i-1]===w[j-1];return {cls:gold?'gold':d==='D'?'faint':'',w:d==='D'?(gold?6:3):6,z:gold?1:0};},
        overlays:ov,
        corner:(i,j)=>{const isOn=c.on&&c.on[0]===i&&c.on[1]===j,isOff=c.off&&c.off[0]===i&&c.off[1]===j;
          const ok=c.done?false:(!c.on||c.off)?canOn(c,i,j):canOff(c,i,j);
          return {cls:(isOn||isOff?'pick':'')+(!ok&&!isOn&&!isOff&&!c.done?' dim':''),hit:ok?((!c.on||c.off)?'Get out of the taxi here':'Call the taxi here'):undefined};},
        taxi:[c.on,c.off].filter(Boolean),tourist:c.off||c.on||[0,0]})+'</div>';
      h+='<div class="pad">'+(cur2?'This ride: '+(overlapMode?'skip '+c.on[0]+' letters of read 1, ':'get out at '+c.on[0]+','+c.on[1]+', ')+(overlapMode?'leave '+(m-c.off[1])+' letters of read 2':'call the taxi at '+c.off[0]+','+c.off[1])+' · the walk between scores <b>'+cur2.score+'</b>':'')+
        (c.bestTry!==null?'<div class="gmeta">Best walk so far: '+c.bestTry+' · rides tried: '+c.tries.length+'</div>':'')+'</div>';
      if(cur2)h+=alignTiles(...alignRows(v,w,c.on,cur2.moves),{label:'The walk between, as a line-up'});
      return h;
    },
    act(c,type,a,b){
      if(c.done||type!=='corner')return;
      const i=+a,j=+b;
      if(!c.on||c.off){if(!canOn(c,i,j))return;c.on=[i,j];c.off=null;log('taxi_on',{at:[i,j]});
        say(overlapMode?'Now click a corner on the bottom edge where the taxi picks the tourist up.':'Now click a corner further on where the taxi picks the tourist up.');render();return;}
      if(!canOff(c,i,j))return;
      c.off=[i,j];const r=taxiRoute(c.inst,c.on,c.off);c.tries.push(r.score);c.bestTry=Math.max(c.bestTry===null?-Infinity:c.bestTry,r.score);
      log('taxi_off',{on:c.on,off:c.off,score:r.score});
      const A=ans(c);
      if(r.score===A.best&&c.on[0]===A.start[0]&&c.on[1]===A.start[1]&&c.off[0]===A.end[0]&&c.off[1]===A.end[1]){
        const [top,bot]=alignRows(c.inst.v,c.inst.w,c.on,r.moves);
        say('That walk scores '+r.score+'. No other ride does as well.','good');
        if(overlapMode){
          const v=c.inst.v,w=c.inst.w,sh=c.on[0],L=top.length;
          const pad=' '.repeat(sh);
          complete(['overlap'],[{html:()=>'<div class="alignout"><div class="sub">The two reads, overlapped</div><div class="strand">'+[...v].map((ch,k)=>'<span class="'+(k>=sh?(w[k-sh]===ch?'hit':'mis'):'off')+'">'+ch+'</span>').join('')+'</div><div class="strand">'+[...pad].map(()=>'<span style="visibility:hidden">·</span>').join('')+[...w].map((ch,k)=>'<span class="'+(k<L?(v[sh+k]===ch?'hit':'mis'):'off')+'">'+ch+'</span>').join('')+'</div></div>'+
            'The end of read 1 against the start of read 2, '+L+' letters with one misread letter (the orange column). The best walk from the left edge to the bottom edge is an '+term('overlap','overlap alignment')+'. An assembler working from real, error-prone reads needs exactly this, instead of the perfect matches Bridge Walker assumed.'}],{tries:c.tries.length});
        }else{
          complete(['local'],[{html:()=>'The two strands share one stretch, <b class="mono">'+top+'</b> over <b class="mono">'+bot+'</b>, scoring '+r.score+', while the best route from corner to corner scored '+c.glob.best+'. A best walk between any two corners, with free rides at either end, is a '+term('local','local alignment')+'. For the pencil, the free taxi from the start means a corner never needs a number below 0; the free taxi to the end means the answer is the biggest number anywhere, not the one at the far corner.',src:['sw']}],{tries:c.tries.length});
        }
        return;
      }
      say('This walk scores '+r.score+'.'+(c.tries.length>=3&&r.score<A.best?' Gold diagonals in a row are worth looking at.':''),r.score>=A.best?'':'warn');render();
    }
  };
}
MODES.taxi=taxiMode('local');
MODES.overlap=taxiMode('overlap');

/* ---------- level 11: the code breakers ---------- */
MODES.code={
  init(c){c.r=codeBreakers();c.phase='ready';c.g=null;
    say('Pencil the city with BLOSUM62 and an indel penalty of 5.');},
  rule:()=>'BLOSUM62 · indel penalty 5 · all of one fragment against all of the other',
  view(c){
    const a=PROTEINS.a,b=PROTEINS.b,n=a.seq.length,m=b.seq.length,g=c.g;
    let lo=0,hi=1;if(g)for(const row of g.s)for(const x of row)if(x!==undefined){lo=Math.min(lo,x);hi=Math.max(hi,x);}
    const heat=x=>{if(x===undefined)return '';const t=(x-lo)/(hi-lo||1);return 'hsl('+(220-180*t)+',70%,'+(85-35*t)+'%)';};
    let h='<div class="pad sub">'+a.name+' ('+a.what+', '+a.org+', residues '+a.from+'–'+a.to+') down the side · '+b.name+' ('+b.what+', '+b.org+', residues '+b.from+'–'+b.to+') across the top</div>'+
      '<div class="cityscroll">'+gridSvg({n,m,rows:a.seq,cols:b.seq,prot:true,diag:true,P:30,r:7,maxw:700,label:'Two protein fragments as a city',
      street:(i,j,d)=>{const same=d==='D'&&a.seq[i-1]===b.seq[j-1];return {cls:same?'gold':d==='D'?'faint':'',w:d==='D'?(same?4:1.5):3,z:same?1:0};},
      overlays:c.route?[{corners:c.route,cls:'route',w:5}]:[],
      corner:(i,j)=>({cls:g&&g.s[i][j]!==undefined?'done':'',fill:g?heat(g.s[i][j]):''})})+'</div>';
    if(c.done){
      const near=(x,y)=>MATRICES.BLOSUM62[x+y]>0;
      h+=alignTiles(c.r.top,c.r.bottom,{label:'The alignment · score '+c.r.best+' · green: the same amino acid · plain: a similar one (positive score) · orange: a dissimilar one',near});
    }
    return h;
  },
  act(c,type){
    if(c.done)return;
    if(type==='fill'&&c.phase==='ready'){
      const a=PROTEINS.a.seq,b=PROTEINS.b.seq,sc={matrix:'BLOSUM62',indel:-5};
      c.g=penInit(a.length,b.length,(i,j,d)=>d==='D'?pairScore(sc,a[i-1],b[j-1]):sc.indel);
      const g=c.g,cl={n:g.n,m:g.m,weight:g.weight,s:g.s.map(r=>r.slice()),arrow:g.arrow.map(r=>r.slice())},todo=penAuto(cl);
      c.phase='fill';log('fill');
      show(a.length+2,90,k=>{todo.filter(([i])=>i===k-1||(k>1&&i<k)).forEach(([i,j])=>{g.s[i][j]=cl.s[i][j];g.arrow[i][j]=cl.arrow[i][j];});},()=>{g.s=cl.s;g.arrow=cl.arrow;c.phase='filled';
        say('The far corner says '+g.s[a.length][b.length]+'. Follow the arrows home.');render();});
      render();return;
    }
    if(type==='back'&&c.phase==='filled'){
      c.route=penRoute(c.g);log('back_auto');
      const same=[...c.r.top].filter((x,k)=>x===c.r.bottom[k]).length;
      const missing=VOCAB.filter(x=>!S.badges.includes(x.id)).map(x=>x.id);
      say(same+' of '+c.r.top.length+' columns hold the same amino acid.','good');
      complete(missing,[{html:()=>'The two fragments line up with one indel at each end, and '+same+' of their '+c.r.top.length+' columns hold the same amino acid. These are stretches of two adenylation domains, the parts of two antibiotic-building enzymes that choose which amino acid to add; both choose phenylalanine. Lining up domains like these, position by position, is how the “code” that predicts a domain’s choice from its sequence was worked out.',src:['stach']},
        {html:'Sequences: UniProt '+PROTEINS.a.acc+' ('+PROTEINS.a.name+') and UniProt '+PROTEINS.b.acc+' ('+PROTEINS.b.name+'), residue numbers as in UniProt.'+(missing.length?' Terms named here because no earlier level named them for you: '+missing.map(x=>term(x)).join(', ')+'.':'')}],{same});
    }
  },
  skip:c=>c.phase==='ready'?{label:'Pencil the city',act:['fill']}:c.phase==='filled'?{label:'Follow the arrows home',act:['back']}:null
};

/* ---------- the workbench (?bench=1): paste two strings, run the pencil and the greedy card player ---------- */
function renderBench(){
  document.title='Toll City workbench';
  ['#pips','#badges','#rule','#skip','.controls','#guide','.vocabhead','#hdrinfo','footer'].forEach(s=>{const e=$(s);if(e)e.hidden=true;});
  $('#title').textContent='Workbench';
  $('#brief').innerHTML='Paste two strings, set the prices, and pick where the free taxi runs. The pencil fills the table and follows the arrows; the greedy card player (take both whenever the top cards match, otherwise throw away from the deck with more cards left, deck 1 on a tie) plays the same two strings as decks. Nothing here is saved. <a href="./">Back to the game</a>.';
  const q=new URLSearchParams(location.search);
  $('#view').innerHTML='<div class="pad"><div class="benchform">'+
    '<label for="bv">String v (deck 1, rows)</label><input id="bv" value="'+esc(q.get('v')||'AGACTG')+'" spellcheck="false">'+
    '<label for="bw">String w (deck 2, columns)</label><input id="bw" value="'+esc(q.get('w')||'GTACGA')+'" spellcheck="false">'+
    '<label for="bscore">Scoring</label><select id="bscore"><option value="prices">Match / mismatch / indel prices</option><option value="BLOSUM62">BLOSUM62 matrix</option><option value="PAM250">PAM250 matrix</option></select>'+
    '<label for="bm">Match</label><input id="bm" type="number" value="1">'+
    '<label for="bx">Mismatch</label><input id="bx" type="number" value="0">'+
    '<label for="bi">Indel</label><input id="bi" type="number" value="0">'+
    '<label for="bmode">Mode</label><select id="bmode"><option value="global">global (corner to corner)</option><option value="local">local (free taxi anywhere)</option><option value="overlap">overlap (taxi down the left edge, off the bottom edge)</option></select>'+
    '</div><p class="gmeta">Prices are what a street adds: use negative numbers for a penalty (the tolls of level 8 are 1, −1, −2). With match 1, mismatch 0, indel 0 the best score is the length of a longest common subsequence.</p>'+
    '<button class="primary" id="brun">Run</button></div><div class="pad benchout" id="bout"></div>';
  const run=()=>{
    const v=$('#bv').value.trim().toUpperCase().replace(/[^A-Z]/g,''),w=$('#bw').value.trim().toUpperCase().replace(/[^A-Z]/g,'');
    const kind=$('#bscore').value,ind=Number($('#bi').value);
    if(!v||!w||v.length>60||w.length>60){$('#bout').innerHTML='<p class="status warn">Enter two strings of 1 to 60 letters.</p>';return;}
    const sc=kind==='prices'?{match:Number($('#bm').value),mismatch:Number($('#bx').value),indel:ind}:{matrix:kind,indel:ind};
    let r;try{r=bench(v,w,sc,$('#bmode').value);}catch(e){$('#bout').innerHTML='<p class="status warn">'+esc(e.message)+' (a matrix needs amino-acid letters).</p>';return;}
    const on=new Set(routeCorners(r.start,r.moves).map(x=>x.join(',')));
    let t='<table class="btable"><tr><th></th><th></th>'+[...w].map(c=>'<th>'+c+'</th>').join('')+'</tr>';
    for(let i=0;i<=v.length;i++)t+='<tr><th>'+(i?v[i-1]:'')+'</th>'+r.s[i].map((x,j)=>'<td class="'+(on.has(i+','+j)?'on':'')+'">'+x+'</td>').join('')+'</tr>';
    t+='</table>';
    $('#bout').innerHTML='<p><b>Best score: '+r.best+'</b> · best routes: '+r.count+' · route from ('+r.start+') to ('+r.end+')</p>'+
      alignTiles(r.top,r.bottom,{label:'Best alignment (one of them if there are ties)'})+t+
      '<p>Decks: the greedy player scores <b>'+r.greedy+'</b> pairs; par (longest common subsequence) is <b>'+r.lcs.length+'</b>'+(!r.lcs.strings.length?'':r.lcs.strings.length<=12?' ('+r.lcs.strings.join(', ')+')':' ('+r.lcs.strings.length+' different strings)')+'.</p>';
  };
  $('#brun').onclick=run;run();
}

/* ---------- wiring ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest&&ev.target.closest('[data-act]');
  if(!t)return;
  const d=t.dataset;
  act(d.act,d.a,d.b,d.c);
});
document.addEventListener('keydown',ev=>{
  const t=ev.target.closest&&ev.target.closest('g[data-act]');
  if(t&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();const d=t.dataset;act(d.act,d.a,d.b,d.c);}
  if(ev.target.id==='entry'&&ev.key==='Enter'){ev.preventDefault();act('type',ev.target.value);}
});
document.addEventListener('change',ev=>{
  const d=ev.target.dataset||{};
  if(d.change)act(d.change,ev.target.type==='checkbox'?ev.target.checked:ev.target.value);
});
$('#skip').onclick=()=>act('skip');
$('#undo').onclick=()=>{const M=MODES[cur.mode];if(M.undo&&!cur.done){M.undo(cur);render();}};
$('#restart').onclick=()=>{log('restart');loadLevel(cur.L.id);};
$('#fresh').onclick=()=>{const k=cur.L.inst;if(!k)return;S.variants[k]=(S.variants[k]||0)+1;log('new_puzzle',{kind:k});save();loadLevel(cur.L.id);};
$('#seed').value=S.seed;
$('#setSeed').onclick=()=>{const v=$('#seed').value.trim();if(!v||v===S.seed)return;S=freshState(v);save();cur=null;loadLevel(previewLevel||1);};
$('#dl').onclick=()=>{
  const blob=new Blob([JSON.stringify({game:'toll-city',version:1,seed:S.seed,exported:new Date().toISOString(),
    unlocked:S.unlocked,vocabulary:S.badges,earnedAt:S.earnedAt,events:S.log},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='toll-city-'+S.seed.replace(/[^\w-]/g,'_')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

if(BENCH)renderBench();
else loadLevel(previewLevel||Math.min(S.unlocked,LEVELS.length));
/* Test handle, only with ?debug=1 in the address. */
if(params.get('debug'))window.__tc={state:()=>cur,saved:()=>S,loadLevel,act,render,
  levels:()=>LEVELS.map(l=>({id:l.id,title:l.title})),vocab:()=>VOCAB.map(v=>({id:v.id,name:v.name})),
  earned:()=>S.badges.slice(),log:()=>S.log.slice(),inst,instKey,termsAt:()=>TERMS_AT};
})();
</script>
