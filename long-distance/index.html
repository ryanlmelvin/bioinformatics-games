<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:40px;height:40px}
h1 a{color:inherit;text-decoration:none}
h2{font-size:1.1rem;margin:18px 0 4px}
p{margin:4px 0 12px}
.mono,.strip,.cell,svg text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.advance{display:block;width:fit-content;max-width:100%;min-height:44px;margin-top:14px;padding:10px 18px;text-align:left}
a{color:var(--accent)}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pips button{width:32px;height:32px;padding:0;border-radius:50%}
.pips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vocabhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;position:relative}
.badge{font-size:.8rem;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:2px 10px}
.badge.got{border:1px solid var(--good);color:var(--good);font-weight:600}
.term{cursor:help;position:relative}
span.term:not(.badge){border-bottom:1px dotted currentColor;font-weight:600}
.tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(360px,84vw);padding:9px 11px;border-radius:8px;
  background:var(--ink);color:var(--bg);font:400 .82rem/1.45 system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px;color:inherit}
.term:hover>.tip,.term:focus>.tip{display:block}
.rule{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);margin-bottom:8px}
.stage{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--cloth);color:#1f2328;padding:12px 14px}
.stage .sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#6b6250;margin:10px 0 3px}
.stage .sub:first-child{margin-top:0}
.stage p{font-size:.95rem}
.stage button{background:#fffdf8;color:#1f2328;border-color:#cdbf9a}
.stage button.primary{background:#c2410c;color:#fff;border-color:#c2410c}
.stage input{background:#fffdf8;color:#1f2328;border-color:#cdbf9a}
svg.loom{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.status{min-height:1.6em;margin:10px 2px 0;font-weight:500}
.status.warn{color:var(--warn)} .status.good{color:var(--good)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#skip:not([hidden]) + .controls{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.L-A{color:#2e7d4f}.L-C{color:#2b5fb3}.L-G{color:#9a6b00}.L-T{color:#b83a4b}.L-\${color:#6b7078}
.text{display:flex;flex-wrap:wrap;gap:2px 0;font:700 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.cell{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.45em;min-height:1.9em;padding:2px 0;border:0;border-radius:4px;background:transparent;font:inherit;cursor:pointer}
.cell small{font-size:.55em;font-weight:400;color:#857b66;line-height:1}
.cell.hit{background:#ffe2a8}.cell.bad{background:#ffd3cf;color:#8a1010}.cell.ok{background:#cfeedd}.cell.done{background:#e6dcc0}
.cell.sel{outline:2px solid #c2410c}
button.cell:hover{background:#fff3d6}
.cell.gap{width:.6em;cursor:default}
.rowbreak{flex-basis:100%;height:6px}
.mini{border-collapse:collapse;font:700 .95rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0}
.mini td{padding:2px 5px;text-align:center}
.mini th{padding:2px 4px}
.mini th button{font-size:.75rem;padding:2px 6px}
.tscroll{overflow-x:auto}
.reveal{border:1px solid var(--good);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel)}
.reveal h3{margin:0 0 8px;font-size:1.05rem}
.called{margin:10px 0 4px;padding-left:12px;border-left:3px solid var(--good)}
.called p{margin:0;position:relative}
.called b{color:var(--good)}
.src{margin:4px 0 10px 15px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:.9rem}
.src .tag{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.src a{font-weight:600}
.wild{margin:12px 0 10px;padding:10px 14px;border-radius:8px;border:1px dashed var(--line)}

.guide summary{cursor:pointer;font-weight:600}
.gentry{padding:8px 0;border-top:1px solid var(--line)}
.gentry h4{margin:0;font-size:1rem}
.gentry p{margin:2px 0;font-size:.92rem}
.gmeta{color:var(--muted);font-size:.9rem}

footer input{font:inherit;width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}

.bench table{border-collapse:collapse;font-family:ui-monospace,Menlo,monospace}
.bench td,.bench th{border:1px solid var(--line);padding:2px 6px;text-align:center}

  body{background:#fff;color:#000}

}

.pips button.fin::after{content:'✓';position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--good);color:var(--bg);font-size:10px;line-height:14px;font-weight:700;text-align:center}

.savebar{margin-top:26px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.92rem}
.savebar p{margin:0 0 8px}
.savebar .saverow{display:flex;flex-wrap:wrap;gap:8px}
.savebar input{flex:1 1 16em;min-width:0;font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.savebar .savenote{margin:8px 0 0;color:var(--muted)}
.savebar .savenote:empty{display:none}
.linknote[hidden]{display:none}
@media print{.savebar,.linknote{display:none}}

.hint{font-size:.85rem;color:#6b6250}

<script id="engine">
/* Pure puzzle logic: no DOM. A board is a row of jacks, each with a four-letter plate. The gene's jack sits to the right of the last one,
   so on a board of n jacks the gene asks from index n and jack j is n - j places from it. */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=(arr,rand)=>arr[Math.floor(rand()*arr.length)];
const between=(lo,hi,rand)=>lo+Math.floor(rand()*(hi-lo+1));
/* A generator that runs out of tries builds the puzzle for a key from its pool instead. TRIES.limit is for tests only. */
const TRIES={limit:null,strict:false},maxTries=n=>TRIES.limit===null?n:TRIES.limit;
function fallback(name,key,pool,make){
  if(TRIES.strict)throw new Error(name+' ran out of tries for '+key);
  TRIES.fell=(TRIES.fell||0)+1;
  const t=TRIES.limit;TRIES.strict=true;TRIES.limit=null;
  try{return make(pool[hashStr(key)%pool.length]);}finally{TRIES.strict=false;TRIES.limit=t;}
}
const F4=['fallback-0','fallback-1','fallback-2','fallback-3'],POOLS={makeL1:F4,makeL5:F4,makeL10:F4};
function keyOf(code,id,variant){return code+'|'+id+'|'+(variant||0);}

/* The words that matter. ACT is the site in the enhancer, SIL a silencer site, BOX the box beside the gene's start,
   PAR the partner site that must sit next to ACT, WEAK a one-letter-off copy of ACT. */
const ACT='GATA',SIL='CTCC',BOX='TATA',PAR='CAGC',WEAK='GATT',SPECIAL=[ACT,SIL,BOX,PAR,WEAK],N=10;
/* the score of a plate against a wanted word: letters that agree, place by place */
function same(a,b){let n=0;for(let i=0;i<4;i++)if(a[i]===b[i])n++;return n;}
function word(rand){let w='';for(let i=0;i<4;i++)w+='ACGT'[Math.floor(rand()*4)];return w;}
/* a plate that cannot be mistaken for a site: at least two letters different from every special word, and not one letter four times */
function plain(rand,used){for(;;){const w=word(rand);if(new Set(w).size<2||used.includes(w)||SPECIAL.some(s=>same(w,s)>2))continue;used.push(w);return w;}}
/* a plate with an exact score against ACT (level 5) */
function scored(rand,s,used){for(;;){const w=word(rand);if(new Set(w).size<2||used.includes(w)||SPECIAL.includes(w)||same(w,ACT)!==s)continue;used.push(w);return w;}}
function makeBoard(rand,places,used,n){const labels=Array(n||N).fill(null);Object.keys(places).forEach(i=>labels[i]=places[i]);
  for(let i=0;i<labels.length;i++)if(!labels[i])labels[i]=plain(rand,used);return labels;}
function swapped(labels,i,j){const a=labels.slice();[a[i],a[j]]=[a[j],a[i]];return a;}
function count4(s,w){let c=0;for(let i=0;i+4<=s.length;i++)if(s.startsWith(w,i))c++;return c;}
function kset(s){const o=new Set();for(let i=0;i+4<=s.length;i++)o.add(s.slice(i,i+4));return o;}
function tokens(s){const o=[];for(let i=0;i+4<=s.length;i+=4)o.push(s.slice(i,i+4));return o;}

/* ---------- the exchange ---------- */
/* Exact matching. A slip is {want:[plates], dist:null or a number of places}. Returns the jacks that answer the asker. */
function answers(labels,asker,slip){
  const o=[];if(!slip||!slip.want)return o;
  for(let j=0;j<labels.length;j++){
    if(j===asker||!slip.want.includes(labels[j]))continue;
    if(slip.dist!=null&&Math.abs(asker-j)!==slip.dist)continue;
    o.push(j);
  }
  return o;
}
/* The asker's current is shared equally among the jacks that answer; each sends its value (1 unless a card says otherwise). */
function headOut(labels,asker,slip,values){
  const a=answers(labels,asker,slip);let out=0;
  a.forEach(j=>{out+=(values&&labels[j] in values?values[labels[j]]:1)/a.length;});
  return {cords:a,out};
}
/* Every jack pulls: one unit, doubled for each letter that agrees with the wanted word. Shares are pull over total. */
function soft(labels,want){
  const sc=labels.map(l=>same(l,want)),pull=sc.map(s=>Math.pow(2,s)),tot=pull.reduce((a,b)=>a+b,0);
  return {sc,pull,tot,w:pull.map(p=>p/tot)};
}
function softOut(labels,want,values){const s=soft(labels,want);return s.w.reduce((a,w,j)=>a+w*(values[labels[j]]||0),0);}
/* Round 1 of a two-round exchange: each jack with plate r.who asks for r.want at r.dist; a jack that is answered gains a rivet ('+'). */
function round1(labels,r){
  const links=[];
  const out=labels.map((l,i)=>{
    if(!r||!r.who||l!==r.who)return l;
    const a=answers(labels,i,{want:[r.want],dist:r.dist});if(!a.length)return l;
    a.forEach(j=>links.push([i,j]));return l+'+';
  });
  return {labels:out,links};
}
/* The finished exchange of levels 8 and 10: round 1 rivets a GATA next to a CAGC; in round 2 the gene asks two questions. */
function runFull(labels){
  const r=round1(labels,{who:ACT,want:PAR,dist:1}),n=labels.length;
  const h1=answers(r.labels,n,{want:[BOX],dist:1}),h2=answers(r.labels,n,{want:[ACT+'+'],dist:null});
  return {labels:r.labels,links:r.links,h1,h2,on:h1.length>0&&h2.length>0};
}
function applyVar(labels,v){const s=labels.join('');return tokens(s.slice(0,v.pos)+v.alt+s.slice(v.pos+1));}
/* For every letter: how many of its three possible changes switch the gene off. */
function scan(labels){
  const s=labels.join(''),base=runFull(labels).on,out=[];
  for(let p=0;p<s.length;p++){let c=0;for(const a of 'ACGT'){if(a===s[p])continue;if(runFull(applyVar(labels,{pos:p,alt:a})).on!==base)c++;}out.push(c);}
  return out;
}

/* ---------- levels ---------- */
/* Level 1: seven strands of 40 letters. Four hold GATA once, at a plate boundary, each at a different distance from the gene.
   No other four-letter word is shared by the three strands whose lamps are shown lit. */
function makeL1(key){
  const rand=rng(hashStr(key));
  for(let tr=0;tr<maxTries(6000);tr++){
    const at=shuffled([1,2,3,4,5,6,7],rand).slice(0,4);
    const mk=t=>{let labels;do{labels=makeBoard(rand,t==null?{}:{[t]:ACT},[]);}while(count4(labels.join(''),ACT)!==(t==null?0:1));
      return {labels,seq:labels.join(''),on:t!=null,at:t==null?null:t*4,tok:t};};
    const known=[mk(at[0]),mk(null),mk(at[1]),mk(null),mk(at[2])],unknown=shuffled([mk(at[3]),mk(null)],rand);
        const on=known.filter(x=>x.on).map(x=>kset(x.seq));
    if([...on[0]].filter(w=>on[1].has(w)&&on[2].has(w)).length!==1)continue;
    return {known,unknown};
  }
  return fallback('makeL1',key,POOLS.makeL1,makeL1);
}
/* Level 2: a 12-letter strand whose GATA is three rounds from the gene, then the first lit strand of level 1. */

    const p=spots(rand,set.length,0,N-2),places={};set.forEach((w,i)=>places[p[i]]=w);

/* Level 6: A and B hold the same plates in a different order; only a TATA one place from the gene switches it on. */
function makeL6(key){

/* Level 7: on only with a TATA one place from the gene and a GATA anywhere. */

}
/* Level 8: on only when a GATA and a CAGC sit side by side. Boards 1 and 3 hold the same plates. */
function makeL8(key){
  const rand=rng(hashStr(key)),used=[];
  const p=between(1,N-3,rand),one=makeBoard(rand,{[p]:ACT,[p+1]:PAR},used);
  const far=shuffled([...Array(N).keys()].filter(i=>Math.abs(i-p)>=2&&i!==p+1),rand)[0],three=swapped(one,p+1,far);

/* Level 9: one plate is covered on each board. On two boards a run of three plates occurs twice and the covered plate is in the second copy. */
function makeL9(key){

    for(let i=0;i<3;i++)labels[q+i]=labels[p+i];return {labels,cover:q+off,src:p+off};};

/* Level 10: a lit board with a riveted pair, a lone GATA and three variants. Only the variant in the partner plate switches the gene off. */
function makeL10(key){

    const used=[],p=between(0,3,rand),flip=rand()<.5,d=between(p+3,N-3,rand);
    const labels=makeBoard(rand,{[N-1]:BOX,[p]:flip?PAR:ACT,[p+1]:flip?ACT:PAR,[d]:ACT},used);
    const par=flip?p:p+1,bgs=[...Array(N).keys()].filter(i=>!SPECIAL.includes(labels[i])),bg=pick(bgs,rand);
    const mk=(tok,kind)=>{const pos=tok*4+between(0,3,rand),ref=labels[tok][pos%4];return {pos,ref,alt:pick('ACGT'.replace(ref,''),rand),kind};};
    const vars=[mk(par,'partner'),mk(d,'lone'),mk(bg,'plain')].sort((a,b)=>a.pos-b.pos);

/* the workbench: cut a strand into plates and share one unit of current among them for a wanted word */

    h+=o.act&&!cov?'<g data-act="'+o.act+'" data-b="'+(o.b||0)+'" data-i="'+j+'" tabindex="0" role="button" aria-label="Board '+(o.tag||'')+', jack '+(j+1)+', plate '+w+'">'+g+'</g>':g;
    h+='<circle cx="'+x.toFixed(1)+'" cy="'+RY+'" r="7.5" fill="url(#gBrass)" stroke="#5a3d10" stroke-width="1"/><circle cx="'+x.toFixed(1)+'" cy="'+RY+'" r="3.2" fill="#2a1c10"/>';

  if(o.track)o.track.forEach((c,p)=>{if(c)h+='<rect x="'+(jx(Math.floor(p/4),n)-16.5+(p%4)*8.6).toFixed(1)+'" y="'+(PY+13)+'" width="7.6" height="'+(c*3.5)+'" fill="#b83a4b"/>';});

const boardsHtml=(list,cap)=>(cap===false?'':'<div class="sub">'+(cap||'Each lamp shows what the exchange predicts')+'</div>')+'<div class="tscroll"><div class="boards">'+list.join('')+'</div></div>';

function strandHtml(x,s,o){

LV[1]={
  init(){return {found:{},wrong:null,misses:0,ans:{},phase:'find'};},
  view(){
    const st=cur.st,x=cur.inst;
    let h='<div class="sub">Five measured genes. The gene is at the right end of each strand</div>';
    x.known.forEach((k,s)=>{h+=strandHtml(k,s,{tag:TAGS[s],lamp:k.on,act:st.phase==='find'&&k.on&&!st.found[s]?'at':null,
      cls:i=>st.found[s]&&i>=k.at&&i<k.at+4?'ok':st.wrong&&st.wrong.s===s&&i>=st.wrong.i&&i<st.wrong.i+4?'bad':''});});
    if(st.phase!=='find'){
      h+='<div class="sub">Two genes nobody has measured</div>';
      x.unknown.forEach((k,u)=>{const a=st.ans[u];
        h+=strandHtml(k,u,{tag:TAGS[5+u],lamp:a?k.on:null,cls:i=>a&&k.on&&i>=k.at&&i<k.at+4?'ok':''})+
          (a?'':'<p class="ask">Gene '+TAGS[5+u]+' is '+chip('on','guess',' data-u="'+u+'" data-v="on"')+' '+chip('off','guess',' data-u="'+u+'" data-v="off"')+'</p>');});
    }
    return h;
  },
  act(a,d){
    const st=cur.st,x=cur.inst;
    if(a==='at'&&st.phase==='find'){
      const s=+d.s,i=+d.i,k=x.known[s];snap();
      if(i===k.at){st.found[s]=true;st.wrong=null;log('found',{s});
        if(Object.keys(st.found).length===3){st.phase='ask';say('GATA is in every lit strand and in no unlit one. Two more genes were never measured. Decide whether each is on or off.','good');}
        else say('That is GATA. Find it in the other lit strands.','good');
      }else{st.wrong={s,i};st.misses++;log('miss',{s,i});
        const w=k.seq.slice(i,i+4);
        say(w.length<4?'Four nucleotides do not fit there.':st.misses>=5?w+' starts there. The shared sequence begins with G in every lit strand.':w+' starts there. It is not in all three lit strands.','warn');}
      return render();
    }
    if(a==='guess'&&st.phase==='ask'){
      const u=+d.u,k=x.unknown[u];snap();
      if((d.v==='on')===k.on){st.ans[u]=d.v;log('guess',{u,ok:true});

        else say(k.on?'Yes. It holds a GATA.':'Yes. It has no GATA.','good');
      }else{log('guess',{u,ok:false});say('Search strand '+TAGS[5+u]+' for GATA before you decide.','warn');}
      return render();
    }
  }
};

      log('run',{r1:Object.assign({},st.r1),r2:Object.assign({},st.r2),ok:w<0});
      if(w<0){say('Every lamp agrees.','good');complete(['layer','embedding','transformer'],'l8');}
      else say('Board '+TAGS[w]+' is predicted '+onOff(pred[w])+' and was measured '+onOff(x.boards[w].on)+'.'+(w===2||w===0?' The gene cannot see from its own jack whether two other jacks are neighbors.':''),'warn');
    }else return;
    render();
  }
};
BLOCKS.l8={src:['vaswani8','avsec'],html:()=>'In round 1 the jacks ask each other, and the gene is not involved. In round 2 the gene reads what round 1 wrote. '+
  '<b>A round of attention followed by an update of every jack is a '+term('layer','layer')+'.</b> '+
  '<b>What a jack carries from one layer to the next is its '+term('embedding','embedding')+'.</b> Here it is four nucleotides, a distance and perhaps a rivet. In a real model it is a vector with several hundred dimensions. '+
  '<b>A model made of tokens, embeddings with positional encoding, several heads in each layer and layers one after another is a '+term('transformer','transformer')+'.</b>'};

/* ---------- level 9: covered plates ---------- */
LV[9]={
  init(){return {b:0,got:{},shown:false};},
  skipLabel(){return cur.st.b<3?'Nothing on board '+TAGS[cur.st.b]+' tells me':'';},
  skip(){
    const st=cur.st,x=cur.inst,b=x.boards[st.b];snap();
    if(b.src===null){st.got[st.b]=-1;st.b=3;log('cannot',{ok:true});
      say('Correct. The plate was '+b.labels[b.cover]+', and nothing else on the board says so.','good');complete(['mlm','param'],'l9');}
    else{log('cannot',{ok:false});say('Look again. A run of plates on this board occurs twice.','warn');}
    render();
  },
  view(){
    const st=cur.st,x=cur.inst;
    return boardsHtml(x.boards.map((b,i)=>{const open=st.got[i]!==undefined,act=i===st.b;
      return i>st.b?'':boardSvg({labels:b.labels,b:i,tag:TAGS[i],cover:open?undefined:b.cover,act:act?'src':null,
        hl:open?{[b.cover]:'good',[st.got[i]]:'good'}:null,sets:open&&st.got[i]>=0?[{cords:[{from:b.cover,to:st.got[i],w:.6}]}]:[]});}),false);
  },
  act(a,d){
    const st=cur.st,x=cur.inst;if(a!=='src'||+d.b!==st.b)return;
    const b=x.boards[st.b],i=+d.i;snap();
    if(b.src===i){st.got[st.b]=i;log('src',{b:st.b,ok:true});st.b++;
      say('Under the cover is '+b.labels[b.cover]+', the plate that came down the cord.'+(st.b===1?' Now board B.':' Now board C.'),'good');}
    else{log('src',{b:st.b,ok:false});
      say('That jack sends '+b.labels[i]+'. Under the cover is something else.'+(b.src!==null?' Compare the plates beside the cover with the rest of the board.':''),'warn');}
    render();
  }
};
BLOCKS.l9={src:['devlin','dalla'],html:()=>'On boards A and B a run of plates occurred twice, and the covered jack found its place in the earlier copy and took the plate from there. Nearly half of the human genome is made of repeats, and models trained on DNA fill them in this way. '+
  '<b>A model trained by covering tokens and asking for them back is a '+term('mlm','masked language model')+'.</b> The sequence is its own answer key, so no gene has to be measured. '+
  'In levels 3 to 8 you set each query and value by comparing lamps with measurements and changing something after every miss. Training does the same thing by arithmetic, many millions of times. '+
  '<b>The numbers it sets are the model’s '+term('param','parameters')+'.</b> The largest model in the second paper below has 2.5 billion.'};

/* ---------- level 10: variants and in silico mutagenesis ---------- */
function fullSets(labels){const r=runFull(labels),n=labels.length;
  return {r,sets:[{cords:fromGene(r.h2,n)},{cords:r.links.map(l=>({from:l[0],to:l[1],w:.5}))},{cords:fromGene(r.h1,n)}]};}
LV[10]={
  init(){return {phase:'test',on:null,tried:{},scan:false};},
  view(){
    const st=cur.st,x=cur.inst,v=st.on===null?null:x.vars[st.on],labels=v?applyVar(x.labels,v):x.labels,f=fullSets(labels);
    let h=boardsHtml([boardSvg({labels:f.r.labels,title:v?'Reference with nucleotide '+(v.pos+1)+' changed':'Reference sequence',lamp:f.r.on,sets:f.sets,marks:st.scan?null:x.vars.map(q=>q.pos),track:st.scan?x.track:null,
      aria:'The exchange run on the '+(v?'changed':'reference')+' sequence'})]);
    if(st.phase==='test')h+='<div class="sub">The patient’s three variants. Apply one at a time</div>'+x.vars.map((q,i)=>'<div class="slip'+(st.on===i?' on':'')+'">Nucleotide '+(q.pos+1)+', in plate '+colour(x.labels[Math.floor(q.pos/4)])+': '+lt(q.ref)+' → '+lt(q.alt)+' '+
      chip(st.on===i?'Undo':'Apply','apply',' data-v="'+i+'"',st.on===i?'sel':'')+(st.on===i?' '+chip('This variant predicts loss of expression','blame',' data-v="'+i+'"'):'')+'</div>').join('');
    else if(!st.scan)h+='<p><button class="primary" data-act="scan">Change every nucleotide in turn, three ways each</button></p>';
    else h+='<p class="hint">A bar under a nucleotide shows how many of its three possible changes switch the gene off.</p>';
    return h;
  },
  act(a,d){
    const st=cur.st,x=cur.inst;
    if(a==='apply'&&st.phase==='test'){snap();const i=+d.v;st.on=st.on===i?null:i;
      if(st.on!==null){st.tried[i]=true;const on=runFull(applyVar(x.labels,x.vars[i])).on;log('apply',{v:i,on});say('With nucleotide '+(x.vars[i].pos+1)+' changed, the exchange predicts the gene is '+onOff(on)+'.',on?'':'good');}
      else say('Back to the reference.');}
    else if(a==='blame'&&st.phase==='test'){snap();const i=+d.v,ok=x.vars[i].kind==='partner';log('blame',{v:i,ok});
      if(ok){st.phase='scan';st.on=null;say('Correct. The other two changes leave the prediction as it was, and one of them is inside a GATA. Three of the board’s forty nucleotides have been tested.','good');}
      else say('With that change alone the exchange still predicts on.','warn');}
    else if(a==='scan'&&st.phase==='scan'){snap();st.scan=true;log('scan');say('That was 120 changes and 120 runs of the exchange.','good');complete(['ism'].concat(sweepTerms()),'l10');}
    else return;
    render();
  }
};
BLOCKS.l10={src:['canver','karollus','frangoul'],html:()=>{const x=cur.inst;
  return 'The twelve nucleotides that matter are the TATA beside the gene and the CAGC and GATA that sit together. The GATA at plate '+(x.lone+1)+' has no partner, so its nucleotides can change freely. '+
    '<b>Changing an input one nucleotide at a time and recording the prediction is '+term('ism','in silico mutagenesis')+'.</b> It is how a sequence model is used to score a variant that nobody has studied. '+
    'The score is a statement about the model. It says something about the patient only as far as the model has learned how real enhancers work, and the second paper below tests that.';},
  wild:()=>'<span class="sub">In the wild</span><p>An enhancer of the gene BCL11A is active only in erythroid cells, and common variants inside it change how much fetal hemoglobin a person makes. '+
    'Canver and colleagues cut that enhancer with Cas9 at every place they could and measured the effect of each cut, which is this level done in living cells. '+
    'A treatment for sickle cell disease that edits the same enhancer was approved in 2023.</p>'};

/* ---------- the workbench ---------- */
function renderBench(){
  document.title='Long Distance: workbench';
  $('.wrap').innerHTML='<header><h1><a href="./">Long Distance</a>: workbench</h1></header><div class="bench">'+
    '<p>Type a DNA sequence and a four-nucleotide query. The strand is cut into plates of four nucleotides, and one unit of current is shared among them: a plate’s pull is 1, doubled for each nucleotide that agrees with the query.</p>'+
    '<p><label>Strand<br><textarea id="bs">TTGGGATACAGCGATTACGTTATA</textarea></label></p><p><label>Query <input type="text" id="bq" value="GATA" maxlength="4" size="6"></label></p><div id="bo"></div></div>';
  const draw=()=>{const r=benchReport($('#bs').value,$('#bq').value);
    $('#bo').innerHTML=r.labels.length?'<table><tr><th>Plate</th><th>Nucleotides that agree</th><th>Pull</th><th>Weight</th></tr>'+r.labels.map((l,j)=>'<tr><td>'+l+'</td><td>'+r.sc[j]+'</td><td>'+r.pull[j]+'</td><td>'+r.pull[j]+'/'+r.tot+' = '+r.w[j].toFixed(3)+'</td></tr>').join('')+'</table>':'<p>The strand needs at least four nucleotides.</p>';};
  $('#bs').oninput=$('#bq').oninput=draw;draw();
}
