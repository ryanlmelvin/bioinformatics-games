<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motif Slots</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1f2328; --muted:#6b7078; --line:#d9d4c7;
  --accent:#c2410c; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b4541a; --chip:#e3f0f3;
  --A:#2e7d4f; --C:#2b5fb3; --G:#9a6b00; --T:#b83a4b;
  /* the machine is an illustration: one palette in both themes */
  --m-cab:#6e1d2a; --m-cab2:#9b2c3c; --m-trim:#e9b949; --m-reel:#fbf6e8; --m-slot:#2a1a1f; --m-ink:#1f2328;
  --m-clamp:#6d3fb5; --m-clamp2:#a27be0; --m-lit:#ffd34d; --m-bad:#e0424f; --m-lamp:#ffe066; --m-off:#5b4a4f;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --muted:#9aa0a8; --line:#343a42;
    --accent:#ff9b5e; --accent-ink:#2b1200; --good:#6fcf97; --warn:#f0a36b; --chip:#1d3a44;
    --A:#6fcf97; --C:#7fb0ff; --G:#e6bd4f; --T:#ff8a98;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:40px;height:40px}
h1 a{color:inherit;text-decoration:none}
.hmeta{font-size:.85rem;color:var(--muted)}
h2{font-size:1.1rem;margin:18px 0 4px}
p{margin:4px 0 12px}
.mono,svg text,.word,.tile,.vt td,.vt th{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.advance{display:block;width:fit-content;max-width:100%;min-height:44px;margin-top:14px;padding:10px 18px;text-align:left}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a{color:var(--accent)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pips button{width:32px;height:32px;min-height:0;padding:0;border-radius:50%}
.pips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vocabhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;position:relative}
.badge{font-size:.8rem;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:2px 10px}
.badge.got{border:1px solid var(--good);color:var(--good);font-weight:600}
.term{cursor:help}
span.term:not(.badge){border-bottom:1px dotted currentColor;font-weight:600}
.tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(360px,84vw);padding:9px 11px;border-radius:8px;
  background:var(--ink);color:var(--bg);font:400 .82rem/1.45 system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px;color:inherit}
.term:hover>.tip,.term:focus>.tip{display:block}
.rule{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);margin-bottom:8px}
.stage{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
svg#machine{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tools{padding:10px 14px 12px;border-top:1px solid var(--line)}
.tools:empty{display:none}
.sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.bA{color:var(--A)} .bC{color:var(--C)} .bG{color:var(--G)} .bT{color:var(--T)}
.word{font-weight:700;letter-spacing:.12em;font-size:1.1rem}
.tile{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;font-size:1.1rem;border:1px solid var(--line);border-radius:6px;padding:2px 0;margin-right:3px;background:var(--panel)}
.tile.bad{background:#ffd9d6;color:#8a1010;border-color:#e0424f}
.tile.ok{background:#d9f2e1;color:#14532d}
.tile.blank{color:var(--muted)}
.tile.roll{animation:roll var(--roll,140ms) ease-out}
@keyframes roll{from{transform:translateY(-55%);opacity:.2}to{transform:none;opacity:1}}
.board.live button{cursor:default;opacity:1}
button.tile{cursor:pointer;min-height:40px;min-width:2.2em;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:4px 12px;margin:6px 0;max-height:220px;overflow:auto}
.board button{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:ui-monospace,Menlo,monospace;min-height:40px;padding:3px 9px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board button.top{border:2px solid var(--m-trim)}
.board button[aria-pressed="true"]{border-color:var(--accent);background:var(--chip);box-shadow:inset 0 0 0 1px var(--accent)}
.board b{white-space:nowrap}
.vt{border-collapse:collapse;margin:4px 0;font-size:.95rem}
.vt th,.vt td{border:1px solid var(--line);padding:2px 6px;text-align:center;min-width:2.6em}
.vt th{color:var(--muted);font-weight:600}
.vt td.zero{background:#ffd9d6;color:#8a1010;font-weight:700}
.vt td.zero span{color:#8a1010}
.vt td.hot{outline:2px solid var(--m-trim)}
.vt button{min-height:36px;padding:1px 6px;font:inherit}
.vt select{font:inherit}
.tscroll{overflow-x:auto;max-width:100%}
.meter{display:inline-flex;align-items:baseline;gap:6px;font-weight:700;font-size:1.05rem}
.meter b{font-size:1.6rem;font-family:ui-monospace,Menlo,monospace}
input.num{font:inherit;width:5.5em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.status{min-height:1.6em;margin:10px 2px 0;font-weight:500}
.status.warn{color:var(--warn)} .status.good{color:var(--good)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#skip:not([hidden]) + .controls{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.hand{margin:8px 0;padding:10px 12px;border-radius:10px;border:1px dashed var(--m-clamp);background:color-mix(in srgb,var(--m-clamp) 7%,var(--panel))}
.hand h3{margin:0 0 4px;font-size:1rem}
.comparison-row{display:grid;grid-template-columns:4.25rem repeat(5,2.5rem) auto;gap:8px;align-items:center;width:max-content;margin:6px 0}
.comparison-row .sub{margin:0}
.comparison-row .tile{display:flex;align-items:center;justify-content:center;width:2.5rem;min-width:0;height:2.5rem;margin:0;padding:0;font:700 1.1rem/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* machine art */
.cab{fill:url(#gCab);stroke:#3b0d16;stroke-width:2}
.trim{fill:none;stroke:var(--m-trim);stroke-width:3}
.bulb{fill:#ffe9a0;stroke:#b8860b;stroke-width:1}
.bulb.off{fill:#8a6a3a}
.marquee .bulb{animation:twinkle 1.6s ease-in-out infinite}
.marquee .bulb:nth-child(2n){animation-delay:.8s}
@keyframes twinkle{50%{fill:#b8862b}}
.slot{fill:var(--m-slot)}
.reelbg{fill:var(--m-reel)}
.reelshade{fill:url(#gShade);pointer-events:none}
.ch{font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.chA{fill:#2e7d4f}.chC{fill:#2b5fb3}.chG{fill:#9a6b00}.chT{fill:#b83a4b}
.ch.dim{opacity:.35}
.ch.bad{fill:#fff}
.badcell{fill:var(--m-bad)}
.litcell{fill:var(--m-lit);opacity:.85}
.lit2{fill:#9fd9ff;opacity:.85}
.readcell{fill:#9fd9ff;stroke:#2b5fb3;stroke-width:1.5;pointer-events:none}
.readcell.next{stroke:#1f2328;stroke-width:3}
.miss{fill:none;stroke:#6b7078;stroke-width:2;stroke-dasharray:4 3}
.cell{fill:transparent;cursor:pointer}
.cell:focus-visible{outline:2px solid var(--m-clamp);outline-offset:-2px}
.cell:hover{fill:rgba(109,63,181,.14)}
.payline{fill:var(--m-lit);opacity:.22;pointer-events:none}
.paybar{fill:none;stroke:var(--m-trim);stroke-width:3;pointer-events:none}
.jaw{fill:var(--m-clamp);stroke:#3c1d70;stroke-width:1.2}
.jaw2{fill:var(--m-clamp2)}
.tooth{fill:#efe6ff}
.tooth.bad{fill:var(--m-bad)}
.clampg{pointer-events:none}
.clampg.slip{animation:slip .5s ease-out}
@keyframes slip{30%{transform:translateY(-9px)}60%{transform:translateY(3px)}}
.arrow{cursor:pointer}
.arrow rect{fill:#3b0d16;stroke:var(--m-trim);stroke-width:1.5}
.arrow path{fill:var(--m-trim)}
.arrow:hover rect{fill:#5a1622}
.lamp{stroke:#3b0d16;stroke-width:1.5;fill:var(--m-off)}
.lamp.on{fill:var(--m-lamp);filter:url(#fGlow)}
.lever{cursor:pointer}
.lever .rod{stroke:#c9c9c9;stroke-width:7;stroke-linecap:round}
.lever .knob{fill:#d62839;stroke:#6b0f1a;stroke-width:2}
.lever.idle .knob{fill:#7b6a6d}
.lever.pulled .arm{transform:rotate(55deg)}
.lever .arm{transform-box:view-box;transition:transform .25s}
.lab{font-size:13px;fill:#f5e6c8;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif;font-weight:600}
.labd{font-size:13px;fill:var(--m-ink);font-family:system-ui,sans-serif}
.strand{stroke:#8a7a68;stroke-width:2;fill:none}
.lift{transition:transform .2s}
.wheel path{stroke:#fff;stroke-width:1}
.wheel .hub{fill:#3b0d16}
.wheel .ptr{fill:var(--m-trim);stroke:#3b0d16}
.spinning .ch{animation:blur .35s linear}
@keyframes blur{from{opacity:.1;transform:translateY(-12px)}to{opacity:1}}
.rowhl .reelbg{fill:#fff1b8}
tr.rowhl td{background:#fff1b8;color:#1f2328}
/* reveals, sources, field guide */
.reveal{border:1px solid var(--good);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel)}
.reveal h3{margin:0 0 8px;font-size:1.05rem}
.called{margin:10px 0 4px;padding-left:12px;border-left:3px solid var(--good);position:relative}
.called p{margin:0;position:relative}
.handover{border-left-color:var(--m-clamp)}
.src{margin:4px 0 10px 15px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:.9rem}
.src .tag{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.src a{font-weight:600}
.guide{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
.guide summary{cursor:pointer;font-weight:600}
.gentry{padding:8px 0;border-top:1px solid var(--line)}
.gentry h4{margin:0;font-size:1rem}
.gentry p{margin:2px 0;font-size:.92rem}
.gmeta{color:var(--muted);font-size:.9rem}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
footer input{font:inherit;width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
textarea{font:14px/1.4 ui-monospace,Menlo,monospace;width:100%;min-height:9em;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#guide){display:none!important}
  .guide{border:0;padding:0;margin:0}
  .guide summary,#printGuide{display:none}
  .guide a{color:#000}
}
.pips button.fin{position:relative;border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.pips button.fin::after{content:'✓';position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--good);color:var(--bg);font-size:10px;line-height:14px;font-weight:700;text-align:center}
.linknote{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0 0;padding:8px 12px;border:1px solid var(--good);border-radius:8px;background:var(--panel);font-size:.92rem}
.savebar{margin-top:26px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.92rem}
.savebar p{margin:0 0 8px}
.savebar .saverow{display:flex;flex-wrap:wrap;gap:8px}
.savebar input{flex:1 1 16em;min-width:0;font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.savebar .savenote{margin:8px 0 0;color:var(--muted)}
.savebar .savenote:empty{display:none}
.linknote[hidden]{display:none}
@media print{.savebar,.linknote{display:none}}
</style>

<script id="engine">
/* Pure puzzle logic: no DOM. Every puzzle is a function of the puzzle code and the level. */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(n,rand){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const BASES='ACGT',COMP={A:'T',C:'G',G:'C',T:'A'};
const DNAA='TTATCCACA',EVENING='AAAATATCT',SWITCH6='AATATC';
const DNAA5=[0,1,2,3,4].map(i=>DNAA.slice(i,i+5));
function randSeq(n,rand){let s='';for(let i=0;i<n;i++)s+=BASES[Math.floor(rand()*4)];return s;}
function hamming(a,b){let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d;}
function revcomp(s){let o='';for(let i=s.length-1;i>=0;i--)o+=COMP[s[i]];return o;}
function kmersOf(text,k){const o=[];for(let i=0;i+k<=text.length;i++)o.push(text.slice(i,i+k));return o;}
function mutate(word,positions,rand){const a=[...word];positions.forEach(p=>{const alt=BASES.replace(a[p],'');a[p]=alt[Math.floor(rand()*3)];});return a.join('');}
function put(s,p,w){return s.slice(0,p)+w+s.slice(p+w.length);}
/* A generator that runs out of tries builds the puzzle for a key from its pool instead. TRIES.limit is for tests only. */
const TRIES={limit:null,strict:false},maxTries=n=>TRIES.limit===null?n:TRIES.limit;
function fallback(name,key,pool,make){
  if(TRIES.strict)throw new Error(name+' ran out of tries for '+key);
  TRIES.fell=(TRIES.fell||0)+1;
  const t=TRIES.limit;TRIES.strict=true;TRIES.limit=null;
  try{return make(pool[hashStr(key)%pool.length]);}finally{TRIES.strict=false;TRIES.limit=t;}
}
// genL4, genL5 and genL11 share one pool, so levels 5 and 11 still use the level 4 strips when all three fall back.
const F4=['fallback-0','fallback-1','fallback-2','fallback-3'];
const POOLS={genL1:F4,genL2:F4,genL3:F4,genL4:F4,genL5:F4,genL6:F4,genL7:F4,genL9:F4,genL11:F4};
/* every k-mer within d mismatches of p (BA1N) */
function neighbors(p,d){
  if(d===0)return [p];
  if(p.length===1)return BASES.split('');
  const out=[],tail=p.slice(1);
  for(const s of neighbors(tail,d)){if(hamming(tail,s)<d)for(const c of BASES)out.push(c+s);else out.push(p[0]+s);}
  return out;
}
/* windows of text within d of pat */
function litPositions(text,pat,d){const o=[];for(let i=0;i+pat.length<=text.length;i++)if(hamming(text.substr(i,pat.length),pat)<=d)o.push(i);return o;}
function countD(text,pat,d){return litPositions(text,pat,d).length;}
/* lit windows of every word over several texts: Map word -> count. rc adds the count of the word's reverse complement (the other strand). */
const RCT={};
function rcTable(k){if(!RCT[k]){const N=1<<(2*k),t=new Int32Array(N);for(let x=0;x<N;x++){let y=0,v=x;for(let j=0;j<k;j++){y=y*4+(3-(v&3));v>>=2;}t[x]=y;}RCT[k]=t;}return RCT[k];}
function litCounts(texts,k,d,rc){
  const N=1<<(2*k),cnt=new Int32Array(N);
  const spray=(x,from,left)=>{cnt[x]++;if(!left)return;for(let j=from;j<k;j++)for(let c=1;c<4;c++)spray(x^(c<<(2*j)),j+1,left-1);};
  for(const t of texts)for(const w of kmersOf(t,k))spray(enc(w),0,d);
  const m=new Map(),R=rc?rcTable(k):null;
  for(let x=0;x<N;x++){const n=cnt[x]+(rc?cnt[R[x]]:0);if(n)m.set(dec(x,k),n);}
  return m;
}
/* BA1J (rc) and its plain form: the words with the most lit windows, alphabetical */
function frequentWords(text,k,d,rc){
  const m=litCounts([text],k,d,rc);let best=0;for(const c of m.values())if(c>best)best=c;
  return {count:best,words:[...m.keys()].filter(w=>m.get(w)===best).sort()};
}
/* ranked tally: [{word,lit,exact,strips}] sorted by lit windows, then by exact copies, then alphabetically */
function tally(texts,k,d,rc){
  const m=litCounts(texts,k,d,rc),ex=litCounts(texts,k,0,rc);
  return [...m.entries()].map(([word,lit])=>({word,lit,exact:ex.get(word)||0}))
    .sort((a,b)=>b.lit-a.lit||b.exact-a.exact||(a.word<b.word?-1:1));
}
function stripsLit(texts,pat,d){return texts.filter(t=>countD(t,pat,d)>0).length;}
/* words that light a window on every text */
function onEvery(texts,k,d){
  let common=null;
  for(const t of texts){const s=new Set();for(const w of kmersOf(t,k))for(const n of neighbors(w,d))s.add(n);
    common=common?new Set([...common].filter(x=>s.has(x))):s;}
  return [...common].sort();
}

/* ---- median string (BA2B) with words packed into integers ---- */
const enc=w=>{let x=0;for(const c of w)x=x*4+BASES.indexOf(c);return x;};
const dec=(x,k)=>{let s='';for(let i=0;i<k;i++){s=BASES[x&3]+s;x>>=2;}return s;};
function popcnt(v){v=v-((v>>>1)&0x55555555);v=(v&0x33333333)+((v>>>2)&0x33333333);return (((v+(v>>>4))&0xF0F0F0F)*0x1010101)>>>24;}
function hamEnc(a,b){const x=a^b;return popcnt((x|(x>>>1))&0x55555555);}
/* distance from every one of the 4^k words to its closest window in s: a breadth-first search over one-letter changes */
function stripDist(s,k){
  const N=1<<(2*k),d=new Uint8Array(N).fill(255),q=new Int32Array(N);let qh=0,qt=0;
  for(const w of kmersOf(s,k)){const x=enc(w);if(d[x]){d[x]=0;q[qt++]=x;}}
  while(qh<qt){const x=q[qh++],nd=d[x]+1;for(let j=0;j<k;j++)for(let c=1;c<4;c++){const y=x^(c<<(2*j));if(d[y]>nd){d[y]=nd;q[qt++]=y;}}}
  return d;
}
/* d(Pattern, Dna) for every one of the 4^k patterns */
function distTable(dna,k){const tot=new Int32Array(1<<(2*k));for(const s of dna){const d=stripDist(s,k);for(let p=0;p<tot.length;p++)tot[p]+=d[p];}return tot;}
/* is T the only word whose total distance is as small as its own? */
function uniqueMedian(dna,k,T){const t=distTable(dna,k),me=enc(T);for(let p=0;p<t.length;p++)if(p!==me&&t[p]<=t[me])return false;return true;}
function medianString(dna,k){const t=distTable(dna,k);let b=0;for(let p=1;p<t.length;p++)if(t[p]<t[b])b=p;return dec(b,k);}
function closestPos(pat,text){let b=0,bd=99;for(let i=0;i+pat.length<=text.length;i++){const h=hamming(pat,text.substr(i,pat.length));if(h<bd){bd=h;b=i;}}return b;}
function distToText(pat,text){return hamming(pat,text.substr(closestPos(pat,text),pat.length));}
function distToDna(pat,dna){return dna.reduce((s,t)=>s+distToText(pat,t),0);}

/* ---- motifs, profiles, greedy, randomized, Gibbs ---- */
const motifsAt=(dna,pos,k)=>dna.map((s,i)=>s.substr(pos[i],k));
function countsOf(motifs){const k=motifs[0].length,c=[0,1,2,3].map(()=>Array(k).fill(0));motifs.forEach(m=>{for(let j=0;j<k;j++)c[BASES.indexOf(m[j])][j]++;});return c;}
function profileOf(motifs,pseudo){const c=countsOf(motifs),n=motifs.length+(pseudo?4:0);return c.map(r=>r.map(x=>(x+(pseudo?1:0))/n));}
function prob(w,P){let p=1;for(let j=0;j<w.length;j++)p*=P[BASES.indexOf(w[j])][j];return p;}
/* first window of highest probability (BA2C) */
function mostProbablePos(text,k,P){let b=0,bp=-1;for(let i=0;i+k<=text.length;i++){const p=prob(text.substr(i,k),P);if(p>bp*(1+1e-9)&&p>0||bp<0){bp=p;b=i;}}return b;}
function mostProbable(text,k,P){return text.substr(mostProbablePos(text,k,P),k);}
function consensusOf(motifs){const c=countsOf(motifs);return c[0].map((_,j)=>{let b=0;for(let r=1;r<4;r++)if(c[r][j]>c[b][j])b=r;return BASES[b];}).join('');}
function scoreOf(motifs){const c=countsOf(motifs),t=motifs.length;return c[0].reduce((s,_,j)=>s+t-Math.max(c[0][j],c[1][j],c[2][j],c[3][j]),0);}
const scoreAt=(dna,pos,k)=>scoreOf(motifsAt(dna,pos,k));
/* going down the reels from a first window: each reel takes its most probable window given the reels above */
function greedyFrom(dna,k,p0,pseudo){const pos=[p0];for(let i=1;i<dna.length;i++)pos.push(mostProbablePos(dna[i],k,profileOf(motifsAt(dna.slice(0,i),pos,k),pseudo)));return pos;}
/* BA2D / BA2E: positions of BestMotifs */
function greedy(dna,k,pseudo){
  let best=dna.map(()=>0),bs=scoreAt(dna,best,k);
  for(let p=0;p+k<=dna[0].length;p++){const pos=greedyFrom(dna,k,p,pseudo),s=scoreAt(dna,pos,k);if(s<bs){bs=s;best=pos;}}
  return best;
}
/* re-stop every reel at its most probable window, the profile (with pseudocounts) taken from all reels */
function restop(dna,k,pos){const P=profileOf(motifsAt(dna,pos,k),true);return dna.map(s=>mostProbablePos(s,k,P));}
function randomStart(dna,k,rand){return dna.map(s=>Math.floor(rand()*(s.length-k+1)));}
/* one run of RandomizedMotifSearch from a start; trace ends with the re-stop that did not improve */
function randomizedRun(dna,k,start){
  let cur=start.slice(),cs=scoreAt(dna,cur,k);const trace=[cur.slice()];
  for(let g=0;g<200;g++){const nx=restop(dna,k,cur),ns=scoreAt(dna,nx,k);trace.push(nx);if(ns<cs){cur=nx;cs=ns;}else break;}
  return {best:cur,score:cs,trace};
}
/* BA2F */
function randomizedSearch(dna,k,N,rand){let best=null;for(let r=0;r<N;r++){const x=randomizedRun(dna,k,randomStart(dna,k,rand));if(!best||x.score<best.score)best=x;}return best;}
/* odds of every window of reel i from the other reels (with pseudocounts) */
function leaveOneOut(dna,k,pos,i){const P=profileOf(motifsAt(dna,pos,k).filter((_,j)=>j!==i),true);return kmersOf(dna[i],k).map(w=>prob(w,P));}
function drawIndex(w,u){const tot=w.reduce((a,b)=>a+b,0);let x=u*tot;for(let i=0;i<w.length;i++){x-=w[i];if(x<0)return i;}return w.length-1;}
function gibbsStep(dna,k,pos,rand){const i=Math.floor(rand()*dna.length),w=leaveOneOut(dna,k,pos,i),at=drawIndex(w,rand()),nx=pos.slice();nx[i]=at;return {i,at,w,pos:nx};}
function gibbsRun(dna,k,start,N,rand){
  let pos=start.slice(),best=pos.slice(),bs=scoreAt(dna,pos,k);const steps=[];
  for(let j=0;j<N;j++){const st=gibbsStep(dna,k,pos,rand);pos=st.pos;st.score=scoreAt(dna,pos,k);steps.push(st);if(st.score<bs){bs=st.score;best=pos.slice();}}
  return {best,score:bs,steps};
}
/* BA2G */
function gibbsSearch(dna,k,N,starts,rand){let best=null;for(let r=0;r<starts;r++){const x=gibbsRun(dna,k,randomStart(dna,k,rand),N,rand);if(!best||x.score<best.score)best=x;}return best;}
/* a stall for Gibbs: every reel, re-stopped at its most probable window given the others, stays put */
function looStall(dna,k,start){
  const pos=start.slice();
  for(let g=0;g<60;g++){let moved=false;for(let i=0;i<dna.length;i++){const w=leaveOneOut(dna,k,pos,i);let b=0;w.forEach((x,j)=>{if(x>w[b]+1e-15)b=j;});if(b!==pos[i]){pos[i]=b;moved=true;}}if(!moved)return pos;}
  return null;
}
/* strict: each reel's own window is more probable than every other, with no near-tie */
function isLooStall(dna,k,pos){return dna.every((_,i)=>{const w=leaveOneOut(dna,k,pos,i);return w.every((x,j)=>j===pos[i]||x<w[pos[i]]*(1-1e-9));});}

/* ---------- the levels' instances ---------- */
function spread(rand,n,count,k,gap){
  for(let t=0;t<1000;t++){const p=[];for(let i=0;i<count;i++)p.push(Math.floor(rand()*(n-k+1)));p.sort((a,b)=>a-b);
    if(p.every((x,i)=>!i||x-p[i-1]>=k+gap))return p;}
  return null;
}
/* Level 1: one 80-letter strip; one 5-mer occurs four times, no other more than twice. */
function genL1(code){
  const rand=rng(hashStr(code+'|L1')),word=DNAA5[Math.floor(rand()*5)];
  for(let attempt=0;attempt<maxTries(10000);attempt++){
    let s=randSeq(80,rand);const at=spread(rand,80,4,5,3);if(!at)continue;
    at.forEach(p=>s=put(s,p,word));
    const t=tally([s],5,0,false);
    if(t[0].word!==word||t[0].lit!==4||t[1].lit>2)continue;
    return {k:5,text:s,word,sites:at};
  }
  return fallback('genL1',code,POOLS.genL1,genL1);
}
/* Level 2: five copies, each with one nucleotide substitution (a different letter each time); nothing repeats. */
function genL2(code){
  const rand=rng(hashStr(code+'|L2')),word=DNAA5[Math.floor(rand()*5)];
  for(let attempt=0;attempt<maxTries(5000);attempt++){
    let s=randSeq(80,rand);const at=spread(rand,80,5,5,2);if(!at)continue;
    const order=shuffled(5,rand);at.forEach((p,i)=>s=put(s,p,mutate(word,[order[i]],rand)));
    if(countD(s,word,0))continue;
    const t=tally([s],5,1,false),ex=tally([s],5,0,false);
    if(t[0].word!==word||t[1].lit>t[0].lit-2||ex[0].lit>2)continue;
    const cmp=shuffled(5,rand).slice(0,3).map(i=>at[i]).sort((a,b)=>a-b);
    return {k:5,text:s,word,sites:at,compare:cmp,exactTop:ex[0].lit};
  }
  return fallback('genL2',code,POOLS.genL2,genL2);
}
/* Level 3: three changed copies on this strand and three on the partner strand. */
function genL3(code){
  const rand=rng(hashStr(code+'|L3')),word=DNAA5[Math.floor(rand()*5)],rc=revcomp(word);
  for(let attempt=0;attempt<maxTries(5000);attempt++){
    let s=randSeq(80,rand);const at=spread(rand,80,6,5,2);if(!at)continue;
    const order=shuffled(6,rand),mpos=shuffled(5,rand).concat(shuffled(5,rand));
    const rev=order.slice(0,3).sort((a,b)=>a-b);
    at.forEach((p,i)=>{const v=mutate(word,[mpos[i]],rand);s=put(s,p,rev.includes(i)?revcomp(v):v);});
    if(countD(s,word,0)||countD(s,rc,0))continue;
    const t=tally([s],5,1,true);
    const top=new Set([t[0].word,t[1].word]);
    if(!top.has(word)||!top.has(rc)||t[1].lit!==t[0].lit||t[2].lit>t[0].lit-2)continue;
    const fwd=tally([s],5,1,false).find(x=>x.word===word).lit;
    return {k:5,text:s,word,rc,sites:at,reverse:rev.map(i=>at[i]),handAt:at[rev[0]],forwardLit:fwd,bothLit:t[0].lit};
  }
  return fallback('genL3',code,POOLS.genL3,genL3);
}
/* Level 4: ten 24-letter strips; AATATC with one change on four of them and two on the rest, and a decoy copied eight times on three strips. */
const L4CACHE=new Map();
function genL4(code){if(!L4CACHE.has(code))L4CACHE.set(code,makeL4(code));return L4CACHE.get(code);}
function makeL4(code){
  const rand=rng(hashStr(code+'|L4')),T=SWITCH6,k=6;
  for(let attempt=0;attempt<maxTries(1000);attempt++){
    let D;do D=randSeq(6,rand);while(hamming(D,T)<5||kmersOf(D+D,6).slice(1,6).includes(D));
    const decoyStrips=shuffled(10,rand).slice(0,3).sort((a,b)=>a-b),copies=[3,3,2],light=new Set(shuffled(10,rand).slice(0,4));
    const strips=[],sites=[];
    for(let i=0;i<10;i++){
      const site=mutate(T,shuffled(6,rand).slice(0,light.has(i)?1:2),rand),di=decoyStrips.indexOf(i);
      if(di<0){const p=Math.floor(rand()*19);let s,tries=0;do s=put(randSeq(24,rand),p,site);while(countD(s,D,2)&&++tries<60);strips.push(s);sites.push(p);continue;}
      const segs=[site];for(let c=0;c<copies[di];c++)segs.push(D);
      if(copies[di]===2)segs.push(mutate(D,[Math.floor(rand()*6)],rand));
      const ord=shuffled(segs.length,rand);let s='',p=0;
      ord.forEach(j=>{if(j===0)p=s.length;s+=segs[j];});
      strips.push(s);sites.push(p);
    }
    if(strips.some(s=>countD(s,T,0)))continue;
    const t=tally(strips,k,1,false);
    const win=t[0].word;
    if(stripsLit(strips,win,1)>3||stripsLit(strips,D,0)!==3)continue;
    const tLit=t.find(x=>x.word===T),tl=tLit?tLit.lit:0;
    if(t[0].lit<=tl)continue;
    const md=distToDna(T,strips);
    if(!uniqueMedian(strips,k,T))continue;
    return {k,strips,sites,word:T,decoy:win,planted:D,decoyStrips,decoyLit:t[0].lit,wordLit:tl,
      allTen:onEvery(strips,k,2),medianDist:md};
  }
  return fallback('genL4',code,POOLS.genL4,genL4);
}
/* Level 5: four of the level 4 strips (none with the decoy) become reels. */
function genL5(code){
  const L4=genL4(code),rand=rng(hashStr(code+'|L5'));
  const idx=[...Array(10).keys()].filter(i=>!L4.decoyStrips.includes(i)).slice(0,4);
  const reels=idx.map(i=>L4.strips[i]),sites=idx.map(i=>L4.sites[i]);
  const target=scoreAt(reels,sites,6);
  let start,draws=0;
  do{start=randomStart(reels,6,rand);if(++draws>maxTries(100000))return fallback('genL5',code,POOLS.genL5,genL5);}while(scoreAt(reels,start,6)<target+6);
  return {k:6,reels,sites,idx,target,start};
}
/* Level 6, by hand: three 6-letter reels, k = 3, two words to try. */
function genL6(code){
  const rand=rng(hashStr(code+'|L6'));
  for(let attempt=0;attempt<maxTries(10000);attempt++){
    const reels=[0,1,2].map(()=>randSeq(6,rand)),words=[randSeq(3,rand),randSeq(3,rand)];
    const tot=words.map(w=>distToDna(w,reels));
    if(words[0]===words[1]||tot[0]===tot[1]||Math.min(...tot)<2||Math.max(...tot)>6)continue;
    if(reels.some(r=>words.every(w=>distToText(w,r)===0)))continue;
    return {k:3,reels,words,totals:tot};
  }
  return fallback('genL6',code,POOLS.genL6,genL6);
}
/* Levels 7 and 8: five reels of nine letters, k = 4. */
function genL7(code){
  const rand=rng(hashStr(code+'|L7')),k=4,n=9,t=5;
  for(let attempt=0;attempt<maxTries(5000);attempt++){
    const M=randSeq(k,rand),sites=[],dna=[];
    for(let i=0;i<t;i++){const v=rand()<.6?mutate(M,[Math.floor(rand()*k)],rand):M,p=Math.floor(rand()*(n-k+1));dna.push(put(randSeq(n,rand),p,v));sites.push(p);}
    const planted=scoreAt(dna,sites,k),mot=motifsAt(dna,sites,k);
    if(mot[0]===mot[1])continue;
    // (a) four reels on the payline vote; reel 5's own site is the clear favourite
    const P4=profileOf(mot.slice(0,4),false),pr=kmersOf(dna[4],k).map(w=>prob(w,P4));
    if(!(pr[sites[4]]>0)||pr.some((x,j)=>j!==sites[4]&&x>=pr[sites[4]]))continue;
    // (b),(c) going down without pseudocounts falls short; with them it finds the planted sites
    const g0=greedy(dna,k,false),g1=greedy(dna,k,true);
    if(scoreAt(dna,g0,k)<=planted||g1.join()!==sites.join())continue;
    // (d),(e) from reel 1's own site: a zero throws out reel 2's site; pseudocounts recover every site
    const f0=greedyFrom(dna,k,sites[0],false),f1=greedyFrom(dna,k,sites[0],true);
    if(f0[1]===sites[1]||scoreAt(dna,f0,k)<=planted||f1.join()!==sites.join())continue;
    // pick a column with at least three different letters for the hand count
    const cnt=countsOf(mot.slice(0,4));let col=-1;
    for(let j=0;j<k;j++)if(cnt.filter(r=>r[j]>0).length>=2&&(col<0||cnt.filter(r=>r[j]>0).length>cnt.filter(r=>r[col]>0).length))col=j;
    if(col<0)continue;
    return {k,dna,sites,planted,motif:M,handCol:col,greedyNo:g0,greedyNoScore:scoreAt(dna,g0,k),fromNo:f0,fromNoScore:scoreAt(dna,f0,k)};
  }
  return fallback('genL7',code,POOLS.genL7,genL7);
}
/* Levels 9 and 10: six reels of fifteen letters, k = 5. */
function genL9(code){
  const rand=rng(hashStr(code+'|L9')),k=5,n=15,t=6;
  for(let attempt=0;attempt<maxTries(1000);attempt++){
    const M=randSeq(k,rand),sites=[],dna=[];
    for(let i=0;i<t;i++){const v=rand()<.7?mutate(M,[Math.floor(rand()*k)],rand):M,p=Math.floor(rand()*(n-k+1));dna.push(put(randSeq(n,rand),p,v));sites.push(p);}
    const planted=scoreAt(dna,sites,k);
    if(planted<3)continue;
    let starts=[];for(let r=0;r<20;r++)starts.push(randomStart(dna,k,rand));
    const runs=starts.map(s=>randomizedRun(dna,k,s));
    const stall=runs.findIndex(r=>r.score>planted&&r.trace.length>=3);
    if(stall<0||!runs.some(r=>r.score<=planted))continue;
    starts=starts.slice(stall).concat(starts.slice(0,stall));
    // level 10: a scripted stall and a seeded Gibbs run out of it
    let gstall=null;
    for(let r=0;r<40&&!gstall;r++){const p=looStall(dna,k,randomStart(dna,k,rand));if(p&&scoreAt(dna,p,k)>planted+1&&isLooStall(dna,k,p))gstall=p;}
    if(!gstall)continue;
    let gseed=-1;
    for(let g=0;g<30&&gseed<0;g++){
      const run=gibbsRun(dna,k,gstall,40,rng(hashStr(code+'|L10|'+g)));
      const hit=run.steps.findIndex(s=>s.score<=planted);
      if(hit<0)continue;
      let worse=false;for(let j=0;j<=hit;j++){const prev=j?run.steps[j-1].score:scoreAt(dna,gstall,k);if(run.steps[j].score>prev)worse=true;}
      if(worse&&hit>=4)gseed=g;
    }
    if(gseed<0)continue;
    return {k,dna,sites,planted,motif:M,starts,stall:gstall,gseed};
  }
  // gseed only works with the code it was found for, so a fallback puzzle carries that code
  return fallback('genL9',code,POOLS.genL9,k=>Object.assign(genL9(k),{code:k}));
}
/* Level 11: the level 4 strips, each site overwritten by the evening element with one nucleotide substitution (illustrative). */
function genL11(code){
  const L4=genL4(code),rand=rng(hashStr(code+'|L11')),k=9;
  for(let attempt=0;attempt<maxTries(200);attempt++){
    const sites=[],strips=L4.strips.map((s,i)=>{const q=Math.max(0,Math.min(24-k,L4.sites[i]-2));sites.push(q);return put(s,q,mutate(EVENING,[Math.floor(rand()*k)],rand));});
    const sub=rng(hashStr(code+'|L11run')),run=randomizedSearch(strips,k,60,sub);
    if(consensusOf(motifsAt(strips,run.best,k))!==EVENING)continue;
    return {k,strips,sites,run};
  }
  return fallback('genL11',code,POOLS.genL11,genL11);
}
const GEN={1:genL1,2:genL2,3:genL3,4:genL4,5:genL5,6:genL6,7:genL7,8:genL7,9:genL9,10:genL9,11:genL11};
/* Workbench: four methods on pasted strings */
function benchRun(dna,k,seed){
  const out=[],row=(name,pos)=>{const m=motifsAt(dna,pos,k);out.push({name,sites:m,consensus:consensusOf(m),misses:scoreOf(m)});};
  row('Going down the reels, no pseudocounts',greedy(dna,k,false));
  row('Going down the reels, with pseudocounts',greedy(dna,k,true));
  if(k<=6){const w=medianString(dna,k);row('Median string '+w+' (closest windows)',dna.map(s=>closestPos(w,s)));}
  else out.push({name:'Median string',skip:'k must be 6 or less'});

    g+='<text class="lab" x="'+(o.arrows?13:L/2)+'" y="'+(y+rh/2)+'" style="font-size:'+(small?10:12)+'px">'+(i+1)+'</text>';
    const lit=o.lit&&o.lit[i]||[];
    if(o.mode==='strips')lit.forEach(p=>{g+='<rect class="litcell" x="'+(colX(p)+1)+'" y="'+(y+2)+'" width="'+(k*cw-2)+'" height="'+(rh-4)+'" rx="4"/>';});

function boardHtml(list,fmt,opt){

function sweepRun(o){

  const fast=Math.max(12,Math.min(40,2400/wins.length));let n=0;

  const step=()=>{
    if(n>=wins.length){cur.sweep=null;o.done();render();return;}
    const [i,p]=wins[n++],pre=o.texts.slice(0,i).concat([o.texts[i].slice(0,p+k)]),board=o.tallyOf(pre);

    '<label for="bdna" class="sub">DNA sequences</label><textarea id="bdna" spellcheck="false">'+sample.join('\n')+'</textarea>'+
    '<div class="row"><label for="bk">k</label><input id="bk" class="num" value="3" inputmode="numeric"><button class="primary" id="brun">Run</button></div><div id="bout"></div>';
  const run=()=>{
    const dna=$('#bdna').value.toUpperCase().split(/\s+/).filter(Boolean),k=Number($('#bk').value),out=$('#bout');
    if(!dna.length||dna.some(s=>/[^ACGT]/.test(s))){out.innerHTML='<p class="status warn">Use only A, C, G and T nucleotide symbols, one sequence per line.</p>';return;}
    if(!Number.isInteger(k)||k<1||dna.some(s=>s.length<k)){out.innerHTML='<p class="status warn">Enter a whole number from 1 to the length of the shortest sequence.</p>';return;}
    out.innerHTML='<div class="tscroll"><table class="vt" style="text-align:left"><thead><tr><th>Method</th><th>Sites</th><th>Consensus</th><th>Misses</th></tr></thead><tbody>'+
      benchRun(dna,k,dna.join('|')).map(r=>'<tr><td style="text-align:left">'+r.name+'</td>'+(r.skip?'<td colspan="3">'+r.skip+'</td>':'<td>'+r.sites.join('<br>')+'</td><td>'+r.consensus+'</td><td><b>'+r.misses+'</b></td>')+'</tr>').join('')+'</tbody></table></div>';
  };
  $('#brun').onclick=run;run();
}

    got.map(v=>{
      const s=v.src&&SRC[v.src];
      return '<div class="gentry"><h4>'+v.name+'</h4><p>'+v.def+'</p><p class="gmeta">Met in level '+(S.earnedAt[v.id]||'?')+
        (s?' · Source: <a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+', “'+s.title+'”</a>':'')+
        (v.code?' · Code it: <a href="https://rosalind.info/problems/'+v.code.toLowerCase()+'/" target="_blank" rel="noopener">Rosalind '+v.code+'</a>':'')+'</p></div>';
    }).join('')+
    (got.length?'<p style="margin-top:10px"><button id="printGuide">Print field guide</button></p>':'<p class="gmeta">Definitions appear here as you earn terms.</p>');
}
function render(){
  const M=LV[cur.L.id];
  renderHeader();
  $('#title').textContent='Level '+cur.L.id+': '+cur.L.title;
  $('#brief').textContent=cur.L.brief;
  $('#rule').textContent=M.rule();
  const d=M.draw(),m=$('#machine');
  m.setAttribute('viewBox','0 0 '+d.svg.W+' '+d.svg.H);m.style.maxWidth=Math.round(d.svg.W*1.15)+'px';m.style.margin='0 auto';m.style.minWidth=d.svg.minW?d.svg.minW+'px':'';
  $('#scene').innerHTML=d.svg.svg;
  /* a typed answer survives a redraw (a reel clicked, a wrong check) until the question changes */
  const kept=['total','pin'].map(id=>{const e=$('#'+id);return e&&[id,e.value,e.dataset.k];}).filter(Boolean);
  $('#tools').innerHTML=cur.sweep&&cur.sweep.html?cur.sweep.html():(d.tools||'');
  kept.forEach(([id,v,k])=>{const e=$('#'+id);if(e&&e.dataset.k===k)e.value=v;});
  $('#status').textContent=cur.msg.text;$('#status').className='status '+cur.msg.kind;
  const sk=$('#skip'),label=M.skip&&!cur.done?M.skip():'';
  sk.hidden=!label;sk.textContent=label;
  $('#restart').disabled=cur.done;
  renderPanel();renderGuide();
  if(M.after)M.after();
}
function act(a,arg){
  if(a==='cell')cur.focusCell=arg;
  if(cur.sweep){if(a==='sweepnow'){timers.forEach(clearTimeout);timers=[];const f=cur.sweep.done;cur.sweep=null;f();render();}return;}
  if(cur.done&&a!=='pick')return;
  cur.moves++;
  LV[cur.L.id].act(a,arg);
  render();
}
/* the sweep redraws its Skip button many times a second, so a click could land between press and release: skip on press */

document.addEventListener('pointerdown',ev=>{
  if(cur&&cur.sweep&&ev.target.closest&&ev.target.closest('[data-act="sweepnow"]')){act('sweepnow');}
});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],[data-lvl],#next,#printGuide');
  if(!t)return;
  const d=t.dataset;
  if(d.act!==undefined)act(d.act,d.arg);
  else if(d.lvl!==undefined)loadLevel(+d.lvl);
  else if(t.id==='next'){loadLevel(cur.L.id+1);$('#title').focus();$('#title').scrollIntoView({block:'start'});}
  else if(t.id==='printGuide'){$('#guide').open=true;window.print();}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('#total,#pin')){const b=ev.target.parentNode.querySelector('button[data-act]');if(b){ev.preventDefault();act(b.dataset.act,b.dataset.arg);}return;}
  const t=ev.target.closest&&ev.target.closest('svg [data-act]');
  if(!t)return;
  if(t.dataset.act==='cell'&&ev.key.startsWith('Arrow')){
    ev.preventDefault();
    const parts=t.dataset.arg.split(':').map(Number),vertical=ev.key==='ArrowUp'||ev.key==='ArrowDown';
    const dir=ev.key==='ArrowLeft'||ev.key==='ArrowUp'?-1:1;
    if(parts.length===2&&vertical)parts[0]+=dir;
    else parts[parts.length-1]+=dir*(vertical?(narrow()?10:20):1);
    const next=$('[data-act="cell"][data-arg="'+parts.join(':')+'"]');
    if(next){t.setAttribute('tabindex','-1');next.setAttribute('tabindex','0');cur.focusCell=next.dataset.arg;next.focus();}
  }else if(ev.key==='Enter'||ev.key===' '){
    ev.preventDefault();const {act:action,arg}=t.dataset;act(action,arg);
    const next=$('[data-act="'+action+'"]'+(arg===undefined?'':'[data-arg="'+arg+'"]'));
    if(next)next.focus();
  }
});
/* hovering a row of the stack lights the reel it came from, and the other way round */
document.addEventListener('mouseover',ev=>{
  const t=ev.target.closest&&ev.target.closest('[data-row]');
  document.querySelectorAll('.rowhl').forEach(e=>e.classList.remove('rowhl'));
  if(t)document.querySelectorAll('[data-row="'+t.dataset.row+'"]').forEach(e=>e.classList.add('rowhl'));
});
$('#restart').onclick=()=>{log('restart');loadLevel(cur.L.id);};
$('#fresh').onclick=()=>{S.variants[cur.L.id]=(S.variants[cur.L.id]||0)+1;log('new_puzzle');save();loadLevel(cur.L.id);};
$('#skip').onclick=()=>{const M=LV[cur.L.id];if(M.onSkip&&!cur.done){cur.moves++;M.onSkip();render();}};
/* progress link: the box, the copy buttons, and a pasted link in a tab that is already open */
if(TRANSIENT)$('#savebar').hidden=true;
else{
  if(linkNote)topNote(linkNote,false);
  /* the link has been read: take it (and any ?seed= it overrode) out of the address */
  if(linkText){try{const q=new URLSearchParams(location.search);q.delete('seed');const qs=q.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));}catch(e){}}
  linkLive=true;
  $('#saveLink').onclick=()=>{const b=$('#saveLink');if(b.select)b.select();};
  $('#copyLink').onclick=$('#copyLinkTop').onclick=()=>{
    const b=$('#saveLink'),tell=(text,again)=>{$('#saveNote').textContent=text;topNote(text,again);},
      ok=()=>tell('Copied. The link changes when you earn a term, so copy it again before you leave.',false),
      byHand=()=>{if(b.select)b.select();let done=false;try{done=document.execCommand('copy');}catch(e){}
        if(done)ok();else tell('Could not copy. Select the link in the box at the bottom of this page and copy it by hand.',true);};
    if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(b.value).then(ok,byHand);else byHand();
  };
  window.addEventListener&&window.addEventListener('hashchange',()=>{if(/^#save=/.test(location.hash))location.reload();});
}
$('#dl').onclick=()=>{
  const blob=new Blob([JSON.stringify({game:'motif-slots',version:1,seed:S.seed,exported:new Date().toISOString(),
    unlocked:S.unlocked,finished:S.done,vocabulary:S.badges,earnedAt:S.earnedAt,events:S.log},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='motif-slots-'+S.seed.replace(/[^\w-]/g,'_')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
window.addEventListener&&window.addEventListener('resize',()=>{clearTimeout(window.__msr);window.__msr=setTimeout(()=>cur&&render(),150);});

if(params.get('bench'))bench();
else loadLevel(previewLevel||resumeLevel());
/* Test handle, only with ?debug=1 in the address. */
if(params.get('debug'))window.__ms={state:()=>cur,saved:()=>S,codes:()=>CODES.slice(),fell:()=>TRIES.fell||0,loadLevel,act,skip:()=>$('#skip').click(),
  levels:()=>LEVELS.map(l=>({id:l.id,title:l.title})),vocab:()=>VOCAB.map(v=>({id:v.id,name:v.name})),
  earned:()=>S.badges.slice(),log:()=>S.log.slice()};
})();

</script>
<script src="../book/chapters.js"></script>
<script src="../book/book.js"></script>
