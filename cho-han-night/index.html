      h+='<g'+anim+'><circle cx="'+lastX.toFixed(1)+'" cy="'+(top+46)+'" r="14" fill="'+(opts.col||'#2e7d4f')+'"/><text x="'+lastX.toFixed(1)+'" y="'+(top+51)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">'+st.letter+'</text></g>';}
    else if(kind==='D'){lastX=X(j);lastY=bot+18;pts.push([lastX,lastY]);
      h+='<g'+anim+'><path d="M'+lastX.toFixed(1)+','+(bot-4)+'v18" stroke="#b3261e" stroke-width="3"/><path d="M'+(lastX-6).toFixed(1)+','+(bot+8)+'l6,8l6,-8" fill="none" stroke="#b3261e" stroke-width="3"/></g>';}
    else if(kind==='I'){lastX=j===0?X(1)-rw/2-15:X(j)+slot/2;lastY=45;pts.push([lastX,lastY]);
      h+='<g'+anim+'><circle cx="'+lastX.toFixed(1)+'" cy="45" r="11" fill="#6e8a5a"/><text x="'+lastX.toFixed(1)+'" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">'+st.letter+'</text></g>';}
  });
  if(opts.out)pts.push([W-pad-8,top+50]);
  if(pts.length>1)h+='<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+(opts.col||'#2e7d4f')+'" stroke-width="2" stroke-dasharray="3 4" opacity=".8"/>';
  const end=pts[pts.length-1];
  if(opts.walker!==false)h+='<use href="#a-walker" transform="translate('+end[0].toFixed(1)+','+(end[1]+(end[1]<60?-8:28)).toFixed(1)+')" style="color:'+(opts.col||'#2e7d4f')+'"/>';
  return h+'<style>@keyframes fadein{from{opacity:0}to{opacity:1}}</style></svg>';
}
const roomNo=(isRoom,col)=>isRoom.slice(0,col+1).filter(Boolean).length;
const stName=(s,letter)=>{const j=s.slice(1);return s==='E'?'out the back door':s[0]==='M'?'into room '+j+(letter?' and say '+letter:''):s[0]==='D'?'down the trapdoor past room '+j:'into the corridor after '+(j==='0'?'the door':'room '+j)+(letter?' and say '+letter:'');};

/* ================= Level 8: rooms ================= */
MODES.rooms={
  init(){cur.f=family();cur.r={gaps:4,member:null,mv:{},lt:{},bad:null};say('');},
  rule(){return 'A room for each column most members fill · trapdoor for a gap · corridor for the rest';},
  isRoom(){return roomsOf(cur.f.aln,cur.r.gaps);},
  R(){return roomNo(this.isRoom(),cur.f.gappy-1);},
  ok(){return cur.r.gaps<=2;},
  scene(){
    const r=cur.r,isR=this.isRoom(),k=isR.filter(Boolean).length;
    const trail=r.member!==null&&this.ok()?memberWalk(cur.f.aln[r.member],isR).map(s=>({state:s.kind+s.room,letter:s.letter})):[];
    return houseSvg(k,{mark:this.R(),trail,out:trail.length>0,walker:trail.length>0});
  },
  moves(){const k=this.isRoom().filter(Boolean).length;return allowedNext('M'+this.R(),k);},
  work(){
    const r=cur.r,f=cur.f,isR=this.isRoom(),R=this.R(),ok=this.ok(),k=isR.filter(Boolean).length;
    const most=[...Array(f.n).keys()].filter(j=>f.aln.filter(s=>s[j]==='-').length>2);
    let h='<div class="slider"><label for="gaps">A column may have at most <b>'+r.gaps+'</b> gap'+(r.gaps===1?'':'s')+' and still be a room</label>'+
      '<input type="range" id="gaps" min="0" max="4" step="1" value="'+r.gaps+'" data-slide="gaps"> <span class="gmeta">'+k+' rooms</span></div>';
    h+=famRows(f,{isRoom:isR,hot:f.gappy-1});
    if(!ok){h+='<p class="status warn">With this setting, room '+roomNo(isR,most[0])+' is a column where three of the five members have a gap. The bookkeeper does not build a room that most members skip.</p>';return h;}
    h+='<div class="row"><span class="sub">Send through:</span>'+f.aln.map((_,i)=>'<button id="mem'+i+'" data-act="member" data-arg="'+i+'" class="'+(r.member===i?'primary':'')+'">member '+(i+1)+'</button>').join('')+'</div>';
    h+='<div class="sub" style="margin-top:10px">Your tally for room '+R+' (outlined): where each member goes next</div><div class="moveset">'+
      this.moves().map(s=>'<div class="mv'+(r.bad&&r.bad.includes(s)?' bad':'')+'"><span>'+stName(s)+'</span><button data-act="mv" data-arg="'+s+',-1" aria-label="one fewer">−</button><b id="mv'+s+'">'+(r.mv[s]||0)+'</b><button data-act="mv" data-arg="'+s+',1" id="mvp'+s+'" aria-label="one more">+</button></div>').join('')+'</div>';
    h+='<div class="sub" style="margin-top:10px">Residues emitted in room '+R+' (click to add one; '+'<button data-act="clearlt" style="padding:0 8px">clear</button>)</div><div class="board">'+
      AMINO.map(x=>'<button class="lkey'+(r.bad&&r.bad.includes(x)?' bad':'')+'" id="lt'+x+'" data-act="lt" data-arg="'+x+'">'+x+'<small>'+(r.lt[x]||0)+'</small></button>').join('')+'</div>'+
      '<button class="primary" id="pin" data-act="pin">Pin the tally on room '+R+'’s door</button>';
    if(cur.done)h+=this.table();
    return h;
  },
  table(){
    const f=cur.f,isR=this.isRoom(),C=profileCounts(f.aln,isR,AMINO),k=C.k;
    let h='<div class="sub" style="margin-top:12px">The bookkeeper tallies every room the same way</div><div class="hscroll"><table class="gmeta" style="border-collapse:collapse"><tr><th></th>';
    for(let j=1;j<=k;j++)h+='<th style="padding:2px 8px">room '+j+'</th>';
    h+='</tr><tr><td>residues</td>';
    for(let j=1;j<=k;j++){const e=C.E['M'+j],tot=AMINO.reduce((a,x)=>a+e[x],0);h+='<td style="padding:2px 8px;vertical-align:top">'+AMINO.filter(x=>e[x]).map(x=>x+' '+e[x]+'/'+tot).join('<br>')+'</td>';}
    h+='</tr><tr><td>moves out</td>';
    for(let j=1;j<=k;j++){const t=C.T['M'+j],nx=allowedNext('M'+j,k),tot=nx.reduce((a,s)=>a+t[s],0);
      h+='<td style="padding:2px 8px;vertical-align:top">'+nx.filter(s=>t[s]).map(s=>(s==='E'?'out':s[0]==='M'?'room':s[0]==='D'?'trapdoor':'corridor')+' '+t[s]+'/'+tot).join('<br>')+'</td>';}
    return h+'</tr></table></div>';
  },
  reveal(){
    return [{html:'The house is a '+term('phmm','profile HMM')+' of the family. Each room is a '+term('match','match state')+', which emits residues with its column’s tally. The corridor is an '+term('insert','insert state')+', for extra residues between rooms. The trapdoor is a '+term('delete','delete state')+', a silent state that lets a member skip a room. Normalised counts of moves out of each room give its transition probabilities; normalised residue counts give its emission probabilities. Counting the traffic of the aligned members is how the model is built.',src:['krogh','eddy']}];
  }
};
ACT.gaps=v=>{const r=cur.r;if(cur.done)return;v=+v;if(v===r.gaps)return;r.gaps=v;r.mv={};r.lt={};r.bad=null;r.member=null;log('gaps',{v});
  say(MODES.rooms.ok()?'The house has '+roomsOf(cur.f.aln,v).filter(Boolean).length+' rooms. Send the members through.':'');};
ACT.member=i=>{if(!MODES.rooms.ok())return;cur.r.member=+i;log('member',{i:+i});
  const w=memberWalk(cur.f.aln[+i],MODES.rooms.isRoom()),R=MODES.rooms.R();
  say('Member '+(+i+1)+' walks through. Watch room '+R+'.');void w;};
ACT.mv=a=>{const [s,d]=a.split(',');if(cur.done)return;cur.r.mv[s]=Math.max(0,(cur.r.mv[s]||0)+(+d));cur.r.bad=null;};
ACT.lt=x=>{if(cur.done)return;cur.r.lt[x]=(cur.r.lt[x]||0)+1;cur.r.bad=null;};
ACT.clearlt=()=>{if(cur.done)return;cur.r.lt={};};
ACT.pin=()=>{
  const r=cur.r,M=MODES.rooms;if(cur.done||!M.ok())return;
  const C=profileCounts(cur.f.aln,M.isRoom(),AMINO),R=M.R(),bad=[];
  M.moves().forEach(s=>{if((r.mv[s]||0)!==C.T['M'+R][s])bad.push(s);});
  AMINO.forEach(x=>{if((r.lt[x]||0)!==C.E['M'+R][x])bad.push(x);});
  log('pin',{ok:!bad.length,bad});
  if(bad.length){r.bad=bad;say('The tally on the door does not match the traffic. Send the members through again and watch room '+R+'.','warn');jolt('pin');return;}
  const e=C.E['M'+R],t=C.T['M'+R];
  const et=AMINO.reduce((a,x)=>a+e[x],0),tt=M.moves().reduce((a,s)=>a+t[s],0);
  complete(['phmm','match','insert','delete'],null,'Room '+R+': '+AMINO.filter(x=>e[x]).map(x=>x+' '+e[x]+'/'+et).join(', ')+'; moves '+M.moves().filter(s=>t[s]).map(s=>(s==='E'?'out':s[0]==='M'?'room':s[0]==='D'?'trapdoor':'corridor')+' '+t[s]+'/'+tt).join(', ')+'.');
};

/* ================= walking a newcomer (levels 9 and 10) ================= */
function newWalk(text){return {text,steps:[],out:false};}
function walkState(w){return w.steps.length?w.steps[w.steps.length-1]:'S';}
function walkUsed(w){return w.steps.filter(s=>s[0]!=='D').length;}
function stepChance(P,prev,s,letter){
  const C=P.counts,nx=allowedNext(prev,P.k),add=P.add||0;
  const tn=C.T[prev][s]+add,td=nx.reduce((a,x)=>a+C.T[prev][x]+add,0);
  let f=[[tn,td]];
  if(s[0]==='M'||s[0]==='I'){const en=C.E[s][letter]+add,ed=AMINO.reduce((a,x)=>a+C.E[s][x]+add,0);f.push([en,ed]);}
  return f;
}
function walkFactors(w,P){
  const out=[];let prev='S',i=0;
  w.steps.forEach(s=>{const L=s[0]==='D'?null:w.text[i];out.push(...stepChance(P,prev,s,L));if(L)i++;prev=s;});
  if(w.out)out.push(...stepChance(P,prev,'E'));
  return out;
}
const fprod=fs=>fs.reduce((a,[n,d])=>a*(d?n/d:0),1);
function trailOf(w){let i=0;return w.steps.map(s=>({state:s,letter:s[0]==='D'?null:w.text[i++]}));}
function walkPanel(w,P,id){
  const st=walkState(w),k=P.k,used=walkUsed(w),left=w.text.length-used;
  let h='<div class="sub">'+esc(id)+': <span class="mono">'+w.text.split('').map((c,i)=>i<used?'<span style="opacity:.35">'+c+'</span>':i===used?'<b style="color:var(--accent)">'+c+'</b>':c).join('')+'</span></div>';
  if(!w.out){
    h+='<div class="row">'+allowedNext(st,k).map(s=>{
      const emits=s[0]==='M'||s[0]==='I',dis=emits?left===0:s==='E'?left>0:false;
      return '<button id="step'+s+'" data-act="step" data-arg="'+s+'"'+(dis?' disabled':'')+'>'+stName(s,emits?w.text[used]:null)+'</button>';
    }).join('')+(w.steps.length?'<button data-act="unstep" id="unstep">Back one step</button>':'')+'</div>';
  }
  const fs=walkFactors(w,P),p=fprod(fs);
  h+='<div class="prob">Probability so far: '+(fs.length?fs.map(([n,d])=>'<span class="frac">'+n+'/'+d+'</span>').join(' × '):'nothing yet')+(fs.length?' = <b>'+oneIn(p)+'</b>':'')+'</div>';
  return h;
}
ACT.step=s=>{
  const w=cur.walk;if(!w||w.out||cur.done)return;
  const prev=walkState(w),prevZero=fprod(walkFactors(w,cur.P))===0;
  if(s==='E'){if(walkUsed(w)<w.text.length)return;w.out=true;}
  else{const emits=s[0]!=='D';if(emits&&walkUsed(w)>=w.text.length)return;if(!allowedNext(walkState(w),cur.P.k).includes(s))return;w.steps.push(s);}
  const fs=walkFactors(w,cur.P);
  log('step',{s});
  if(fs.length&&!prevZero&&fprod(fs)===0){
    const L=s[0]==='M'||s[0]==='I'?w.text[walkUsed(w)-1]:null,eZero=L&&stepChance(cur.P,prev,s,L)[0][0]!==0;
    say(eZero?'Nobody in the family ever said '+L+' '+(s[0]==='M'?'in room '+s.slice(1):'in that corridor')+'. The walk is now worth nothing.':'No family member ever went that way. The walk is now worth nothing.','warn');
  }else if(w.out)MODES[cur.mode].walked();
  else say('');
};
ACT.unstep=()=>{const w=cur.walk;if(!w||cur.done)return;if(w.out)w.out=false;else w.steps.pop();say('');log('unstep');};

/* ================= Level 9: the bouncer ================= */
MODES.bouncer={
  init(){cur.f=family();cur.P=profileHMM(cur.f.aln,{maxGaps:DEFAULT_GAPS});cur.order=newcomerOrder(cur.f);
    cur.walks=cur.order.map(who=>newWalk(cur.f[who]));cur.best=[null,null];cur.which=0;cur.walk=cur.walks[0];say('Walk newcomer A through, one step at a time.');},
  rule(){return 'Each step multiplies the probability by the relevant transition and emission frequencies';},
  scene(){const w=cur.walk;return houseSvg(cur.P.k,{trail:trailOf(w),out:w.out,col:cur.which?'#b4541a':'#2b5fb3'});},
  walked(){const i=cur.which,b=profileBest(cur.walk.text,cur.P);cur.best[i]=b;log('walked',{who:cur.order[i],mine:fprod(walkFactors(cur.walk,cur.P)),best:b.prob});
    say('Newcomer '+AB[i]+' is out the back door. The best of all possible walks is '+oneIn(b.prob)+'.');},
  work(){
    let h='<div class="row">'+cur.order.map((_,i)=>'<button id="nc'+i+'" data-act="which" data-arg="'+i+'" class="'+(cur.which===i?'primary':'')+'">Newcomer '+AB[i]+(cur.best[i]?' ✓':'')+'</button>').join('')+'</div>';
    h+=walkPanel(cur.walk,cur.P,'Newcomer '+AB[cur.which]);
    const both=cur.best[0]&&cur.best[1];
    h+='<div class="scores">'+cur.order.map((_,i)=>cur.best[i]?'<div class="score"><b>Newcomer '+AB[i]+'</b> best walk: '+oneIn(cur.best[i].prob)+'</div>':'').join('')+'</div>';
    if(both&&!cur.done)h+='<div class="row"><span class="sub">Who gets in?</span>'+cur.order.map((_,i)=>'<button class="primary" id="admit'+i+'" data-act="admit" data-arg="'+i+'">Let in newcomer '+AB[i]+'</button>').join('')+'</div>';
    return h;
  },
  reveal(){
    const b=cur.best,r=cur.order.indexOf('relative'),ratio=b[r].prob/b[1-r].prob;
    return [{html:'The best walk is found the way the bookkeeper found the best story in level 7: keep the better way into each room, then follow it back. Newcomer '+AB[r]+'’s best walk is about '+fmt(Math.round(ratio))+' times likelier than the other’s. Every residue the stranger said had been said in its room by somebody, but mostly by one member out of five, in rooms where the others agree.'}];
  }
};
ACT.which=i=>{if(cur.done)return;cur.which=+i;cur.walk=cur.walks[+i];say('');};
ACT.admit=i=>{
  if(cur.done)return;i=+i;const r=cur.order.indexOf('relative');log('admit',{i,ok:i===r});
  if(i!==r){say('The bookkeeper holds the door. Newcomer '+AB[i]+'’s best walk is '+oneIn(cur.best[i].prob)+', against '+oneIn(cur.best[1-i].prob)+' for newcomer '+AB[1-i]+'.','warn');jolt('admit'+i);return;}
  complete([],null,'Newcomer '+AB[r]+' is let in.');
};

/* ================= Level 10: one unseen letter ================= */
MODES.pebbles={
  init(){cur.f=family();cur.P=profileHMM(cur.f.aln,{maxGaps:DEFAULT_GAPS});cur.walk=newWalk(cur.f.second);cur.which=0;cur.best0=null;
    cur.pb={on:false,letters:{},moves:{},spread:false};say('');},
  rule(){return cur.pb.on?'One pebble on every residue and every move':'Each step multiplies the probability by the relevant transition and emission frequencies';},
  scene(){return houseSvg(cur.P.k,{trail:trailOf(cur.walk),out:cur.walk.out,col:'#2e7d4f',mark:cur.pb.on?cur.f.slipRoom:undefined});},
  walked(){if(cur.pb.spread)return MODES.pebbles.rescored();cur.best0=profileBest(cur.walk.text,cur.P);log('walked',{best:cur.best0.prob});
    say(cur.best0.prob?'Best walk: '+oneIn(cur.best0.prob)+'.':'The bookkeeper checks every possible walk, and each has probability zero. The house turns the cousin away.','warn');},
  moves(){return allowedNext('M'+cur.f.slipRoom,cur.P.k);},
  work(){
    const pb=cur.pb,R=cur.f.slipRoom;
    let h=walkPanel(cur.walk,cur.P,'The cousin');
    if(pb.on&&!pb.spread){
      h+='<div class="sub" style="margin-top:10px">Room '+R+': drop one pebble on each residue (it counts as one more time that residue was observed)</div><div class="board">'+
        AMINO.map(x=>'<button class="lkey" id="pl'+x+'" data-act="peb" data-arg="L'+x+'"'+(pb.letters[x]?' disabled':'')+'>'+x+'<small>'+(cur.P.counts.E['M'+R][x]+(pb.letters[x]?1:0))+'</small></button>').join('')+'</div>'+
        '<div class="sub">and one on each way out of room '+R+'</div><div class="moveset">'+
        this.moves().map(s=>'<button class="mv" id="pm'+s+'" data-act="peb" data-arg="M'+s+'"'+(pb.moves[s]?' disabled':'')+'>'+stName(s)+' <b>'+(cur.P.counts.T['M'+R][s]+(pb.moves[s]?1:0))+'</b></button>').join('')+'</div>';
      const e=AMINO.reduce((a,x)=>a+cur.P.counts.E['M'+R][x]+(pb.letters[x]?1:0),0);
      h+='<p class="prob">Room '+R+' now counts '+e+' residues. '+cur.f.unseen+' has <b class="frac">'+(pb.letters[cur.f.unseen]?1:0)+' / '+e+'</b>.</p>';
    }
    if(pb.spread){
      const s=familyScores(cur.f);
      h+='<div class="scores"><div class="score"><b>The cousin</b> '+oneIn(s.sec1)+'</div><div class="score"><b>Level 9’s family newcomer</b> '+oneIn(s.rel1)+'</div><div class="score str"><b>Level 9’s stranger</b> '+oneIn(s.str1)+'</div></div>';
    }
    return h;
  },
  skip(){const pb=cur.pb;
    if(!pb.on&&cur.best0&&cur.best0.prob===0)return 'Bring the bookkeeper’s pebble bag';
    if(pb.on&&!pb.spread&&AMINO.every(x=>pb.letters[x])&&this.moves().every(s=>pb.moves[s]))return 'Let the bookkeeper drop one on everything else';
    return '';},
  onSkip(){const pb=cur.pb;
    if(!pb.on){pb.on=true;log('pebbles_open');say('One pebble on each residue of room '+cur.f.slipRoom+', and one on each way out.');return;}
    pb.spread=true;cur.P=profileHMM(cur.f.aln,{maxGaps:DEFAULT_GAPS,add:1});cur.walk=newWalk(cur.f.second);log('pebbles_spread');
    say('Every room, corridor and trapdoor has a pebble on every residue and move. Walk the cousin through again.');
  },
  rescored(){const b=profileBest(cur.walk.text,cur.P),s=familyScores(cur.f);log('walked',{best:b.prob});
    complete(['pseudo'],null,'The cousin’s best walk is now '+oneIn(b.prob)+', above the stranger’s '+oneIn(s.str1)+'.');},
  reveal(){return [{html:'A pebble on every residue and every move is a '+term('pseudo','pseudocount')+'. Motif Slots used the same correction, where a profile with an unobserved nucleotide gave a good motif probability zero. Here one residue unobserved in that column excluded the cousin. With the pebbles it only lowers the cousin’s probability.'}];}
};
ACT.peb=a=>{const pb=cur.pb;if(!pb||!pb.on||pb.spread)return;
  if(a[0]==='L')pb.letters[a.slice(1)]=true;else pb.moves[a.slice(1)]=true;log('pebble',{a});
  const left=AMINO.filter(x=>!pb.letters[x]).length+MODES.pebbles.moves().filter(s=>!pb.moves[s]).length;
  say(left?left+(left===1?' pebble':' pebbles')+' to go.':'Room '+cur.f.slipRoom+' is done.');};

/* ================= Level 11: reunion ================= */
MODES.reunion={
  init(){const f=cur.f=family();cur.P=profileHMM(f.aln,{maxGaps:DEFAULT_GAPS,add:1});
    const all=[{s:f.relative,fam:1},{s:f.stranger,fam:0},{s:f.second,fam:1},{s:f.others[0],fam:1},{s:f.others[1],fam:1},{s:f.others[2],fam:0},{s:f.others[3],fam:0}];
    cur.q=shuffled(7,rng(hashStr(f.key+'|queue'))).map(i=>all[i]);cur.sc={};cur.line=null;cur.show=null;say('');},
  rule(){return 'Score everyone · draw the door line';},
  scene(){const i=cur.show;if(i===null)return houseFront();const b=cur.sc[i];return houseSvg(cur.P.k,{trail:b.walk.map(w=>({state:w.state,letter:w.letter})),out:true,col:'#2b5fb3'});},
  work(){
    let h='<div class="row">'+cur.q.map((n,i)=>'<button id="send'+i+'" data-act="send" data-arg="'+i+'"'+(cur.sc[i]?' disabled':'')+'>Send in '+AB[i]+': <span class="mono">'+n.s+'</span></button>').join('')+'</div>';
    const done=Object.keys(cur.sc).length===7;
    const order=Object.keys(cur.sc).map(Number).sort((a,b)=>cur.sc[b].prob-cur.sc[a].prob),top=order.length?Math.log10(cur.sc[order[0]].prob):0;
    h+='<div class="ladder">';
    order.forEach((i,r)=>{
      const lg=Math.log10(cur.sc[i].prob),wpx=Math.max(4,100-(top-lg)*9);
      h+='<div class="score'+(cur.done&&!cur.q[i].fam?' str':'')+'"><b>'+AB[i]+'</b> <span class="mono">'+cur.q[i].s+'</span> '+oneIn(cur.sc[i].prob)+' <span class="bar" style="width:'+wpx.toFixed(0)+'px"></span></div>';
      if(done&&r<6)h+='<button class="line'+(cur.line===r?' on':'')+'" id="line'+r+'" data-act="line" data-arg="'+r+'">'+(cur.line===r?'door line':'draw the door line here')+'</button>';
    });
    return h+'</div>';
  },
  reveal(){
    const f=cur.f;
    return [{html:'In level 1, every residue the stranger said had been said in that column by some member. Where the family agrees, the stranger kept picking the odd one out, and where the family is split it picked the popular residue, which matters little. Counting residues by eye treats every column alike. The house weights each room by how strongly the family agrees there, and the corridor and trapdoors account for insertions and gaps.'},
      {wild:'<p>HIV’s envelope protein mutates so fast that two samples, even from one patient, differ in many places, while some regions remain conserved. In pairwise comparison, distant relatives look unrelated. Models built from whole families, like your house, are how such relatives are found: the Pfam database keeps one for each of thousands of protein families.</p>'+srcCard('starcich')+srcCard('sonnhammer')},
      {html:'What you played, in algorithm terms: the pair in play is a '+term('hstate','hidden state')+'; the night of pairs a '+term('hpath','hidden path')+'; the probabilities of each call '+term('emit','emission probabilities')+'; keeping and swapping '+term('trans','transition probabilities')+'; the adding page the '+term('forward','forward algorithm')+'; the keep-the-better page the '+term('viterbi','Viterbi algorithm')+'; rooms, corridors and trapdoors the '+term('match','match')+', '+term('insert','insert')+' and '+term('delete','delete states')+' of a '+term('phmm','profile HMM')+'. The family in this game is illustrative.'}];
  }
};
ACT.send=i=>{i=+i;if(cur.done||cur.sc[i])return;const b=profileBest(cur.q[i].s,cur.P);cur.sc[i]=b;cur.show=i;log('send',{i,prob:b.prob});
  say('Newcomer '+AB[i]+': best walk '+oneIn(b.prob)+'.'+(Object.keys(cur.sc).length===7?' Everyone is scored. Draw the door line.':''));};
ACT.line=r=>{r=+r;if(cur.done)return;cur.line=r;
  const order=Object.keys(cur.sc).map(Number).sort((a,b)=>cur.sc[b].prob-cur.sc[a].prob),above=order.slice(0,r+1);
  const ok=above.every(i=>cur.q[i].fam)&&order.slice(r+1).every(i=>!cur.q[i].fam);log('line',{r,ok});
  if(!ok){say(above.some(i=>!cur.q[i].fam)?'A stranger slips in above your line.':'A family member is left below your line.','warn');jolt('line'+r);return;}
  cur.headline='Reunion';
  complete(sweepTerms(),null,'The line lets in four family members and keeps out three strangers.');
};

}

  if(cur.done||rendering)return;

}

/* ---------- workbench (?bench=1): no artwork, saves nothing ---------- */
function benchCalls(txt){
  const calls=txt.toUpperCase().replace(/[^SO]/g,'').split('');
  if(!calls.length)return '<p class="gmeta">Type calls as S (seven) and O (other).</p>';
  if(calls.length>12)return '<p class="status warn">At most 12 calls, so the whole-number weights stay exact.</p>';
  const L=sumLedger(calls),B=bestLedger(calls),bs=bestStory(calls),lk=likelierPairs(calls),P=nightProbability(calls);
  const row=(name,f)=>'<tr><th>'+name+'</th>'+calls.map((_,t)=>'<td>'+f(t)+'</td>').join('')+'</tr>';
  const cn=k=>k===-1?'tie':k?'loaded':'fair';
  const differ=bs.story.some((k,i)=>k!==lk[i]);
  return '<div class="hscroll"><table><tr><th></th>'+calls.map((c,t)=>'<th>'+(t+1)+' '+CALL[c]+'</th>').join('')+'</tr>'+
    row('adding: fair',t=>fmt(L[t][0]))+row('adding: loaded',t=>fmt(L[t][1]))+row('likelier this round',t=>cn(lk[t]))+
    row('best: fair',t=>fmt(B.cols[t][0])+(t?' ←'+cn(B.from[t][0]):''))+row('best: loaded',t=>fmt(B.cols[t][1])+(t?' ←'+cn(B.from[t][1]):''))+
    row('most likely story',t=>cn(bs.story[t]))+'</table></div>'+
    '<p>Probability of the calls: '+fmt(P.num)+' / '+fmt(P.den)+' = '+(P.num/P.den).toPrecision(4)+'. Most likely story: '+fmt(bs.value)+' / '+fmt(P.den)+(bs.unique?'':' (not unique: a tie lies on it)')+'.</p>'+
    '<p><b>'+(differ?'They disagree':'They agree')+'</b>: the most likely story and betting round by round on the likelier pair '+(differ?(d=>'part in round'+(d.length>1?'s ':' ')+d.join(', ')+'.')(bs.story.map((k,i)=>k!==lk[i]?i+1:0).filter(Boolean)):'pick the same pairs.')+'</p>';
}
function benchFamily(txt,maxGaps,seq,add){
  const rows=txt.toUpperCase().split(/\s+/).filter(Boolean);
  if(rows.length<2||rows.some(r=>r.length!==rows[0].length||/[^A-Z-]/.test(r)))return '<p class="status warn">Paste at least two rows of equal length, using amino acid one-letter codes and gap symbols (-).</p>';
  const isRoom=roomsOf(rows,maxGaps),k=isRoom.filter(Boolean).length;
  const al=[...new Set(rows.join('').replace(/-/g,'').split('').concat(AMINO))].sort();
  const C=profileCounts(rows,isRoom,al);
  let h='<p>Rooms (columns with at most '+maxGaps+' gaps): '+isRoom.map((r,j)=>r?'col '+(j+1)+'→room '+roomNo(isRoom,j):'col '+(j+1)+'→corridor').join(', ')+'.</p>';
  const tb=a=>{
    const P=profileHMM(rows,{isRoom,alphabet:al,add:a});
    let t='<div class="hscroll"><table><tr><th>state</th><th>residues emitted</th><th>moves out</th></tr>';
    P.states.filter(s=>s!=='E').forEach(s=>{
      const e=al.filter(x=>C.E[s][x]||(a&&(s[0]==='M'||s[0]==='I'))).slice(0,a?6:al.length).map(x=>x+' '+(C.E[s][x]+(s[0]==='D'||s==='S'?0:a))+(a?'':'')).join(' ');
      const nx=allowedNext(s,k).map(x=>x+' '+(C.T[s][x]+a)).join(' ');
      t+='<tr><td>'+s+'</td><td style="text-align:left">'+(s[0]==='M'||s[0]==='I'?e+(a?' … (every residue +'+a+')':''):'')+'</td><td style="text-align:left">'+nx+'</td></tr>';
    });
    t+='</table></div>';
    const sq=seq.toUpperCase().replace(/[^A-Z]/g,'');
    if(sq){const b=profileBest(sq,P);t+='<p>Score of '+sq+': best walk '+oneIn(b.prob)+(b.prob?' via '+b.walk.map(w=>w.state).join(' '):'')+'.</p>';}
    return t;
  };
  return h+'<h3>Tallies</h3>'+tb(0)+'<h3>With '+add+' added to every count</h3>'+tb(add);
}

    '<label for="bseq">Sequence to score</label><textarea id="bseq" rows="1">'+f.relative+'</textarea><div id="ofamily"></div></div>';
  const upd=()=>{$('#ocalls').innerHTML=benchCalls($('#bcalls').value);$('#ofamily').innerHTML=benchFamily($('#baln').value,+$('#bgaps').value||0,$('#bseq').value,Math.max(0,+$('#badd').value||0));};

}
