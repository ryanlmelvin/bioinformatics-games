<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge Walker</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1f2328; --muted:#6b7078; --line:#d9d4c7;
  --accent:#c2410c; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b4541a;
  --A:#2e7d4f; --C:#2b5fb3; --G:#9a6b00; --T:#b83a4b; --chip:#e3f0f3;
  --pre:#b45309; --suf:#1d4ed8;
  /* the map is an illustration: one palette in both themes */
  --m-water:#bfe3ec; --m-ink:#1f2328; --m-accent:#e8590c; --m-gold:#f2a900;
  --m-plank:#7a4b22; --m-plank2:#d2a366; --m-gone:#6fa3b6; --m-shore:#c9a55a; --m-new:#1d6b55;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15181c; --panel:#1d2126; --ink:#e8e6e1; --muted:#9aa0a8; --line:#343a42;
    --accent:#ff9b5e; --accent-ink:#2b1200; --good:#6fcf97; --warn:#f0a36b;
    --A:#6fcf97; --C:#7fb0ff; --G:#e6bd4f; --T:#ff8a98; --chip:#1d3a44;
    --pre:#ffb26b; --suf:#8fb4ff;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:40px;height:40px}
h2{font-size:1.1rem;margin:18px 0 4px}
p{margin:4px 0 12px}
.mono,.asm,.card,.cand,.adj,svg text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.advance{display:block;width:fit-content;max-width:100%;min-height:44px;margin-top:14px;padding:10px 18px;text-align:left}
a{color:var(--accent)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pips button{width:32px;height:32px;padding:0;border-radius:50%}
.pips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* vocabulary */
.vocabhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;position:relative}
.badge{font-size:.8rem;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:2px 10px}
.badge.got{border:1px solid var(--good);color:var(--good);font-weight:600}
.term{cursor:help}
span.term:not(.badge){border-bottom:1px dotted currentColor;font-weight:600}
.tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(360px,84vw);padding:9px 11px;border-radius:8px;
  background:var(--ink);color:var(--bg);font:400 .82rem/1.45 system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px;color:inherit}
.term:hover>.tip,.term:focus>.tip{display:block}

.rule{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);margin-bottom:8px}
.stage{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
svg#map{width:100%;height:auto;display:block;touch-action:manipulation}
svg#map.building{cursor:crosshair}
svg#map.building .pl-base,svg#map.building .pl-top,svg#map.building .mread{pointer-events:none}
.stagemsg{padding:6px 14px 8px;font-weight:600;font-size:.95rem;border-top:1px solid var(--line)}
.stagemsg.warn{color:var(--warn)} .stagemsg.good{color:var(--good)}
.asmrow{padding:10px 14px 12px}
.sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.asm{font-size:1.2rem;font-weight:700;letter-spacing:.14em;word-break:break-all;min-height:1.6em}
.asm .dim{opacity:.28}
.pairwork{--tape-font:clamp(.75rem,3.3vw,1.1rem);padding:12px 14px;border-top:1px solid var(--line)}
.pairwork select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;max-width:100%}
.pairscroll{overflow-x:auto;margin-top:12px}
.tape{width:max-content;min-width:100%;margin-bottom:14px}
.tapeletters,.pairstencil{display:flex;font:700 var(--tape-font)/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}
.tapeletters span,.pairstencil span{display:inline-block;width:1.2em;text-align:center;flex:none}
.pairstencil{margin-left:calc(var(--offset)*1.2em);width:max-content;border-bottom:2px solid var(--ink)}
.pairstencil .gap{color:var(--muted);font-weight:400}
.tape input{display:block;width:calc(var(--letters,18) * 1.2 * var(--tape-font));margin:6px 0 10px;accent-color:var(--accent)}
.pairstencil span.ok{background:#d9f2e1;color:#14532d}
.pairstencil span.bad{background:#ffd9d6;color:#8a1010}
.tape .verdict{font-weight:600;margin:6px 0 0}
.tape .verdict.ok{color:var(--good)} .tape .verdict.bad{color:var(--warn)}
.loop1{background:#d7eaff;color:#174879;border-bottom:3px solid #2168a6}
.loop2{background:#f3def8;color:#67297b;border-bottom:3px dashed #923eaa}
.loopedge1 .pl-base,.loopedge1 .pl-gold,.loopedge1 .pl-gone{stroke:#2168a6}
.loopedge2 .pl-base,.loopedge2 .pl-gold,.loopedge2 .pl-gone{stroke:#923eaa}
.loopedge2 .pl-base{stroke-dasharray:8 3}
.pairlabel{font-size:16px;font-weight:700;text-anchor:middle;fill:#1f2328;paint-order:stroke;stroke:#bfe3ec;stroke-width:3px}
.pairwork p{font-size:.94rem}
.bA{color:var(--A)} .bC{color:var(--C)} .bG{color:var(--G)} .bT{color:var(--T)}
.status{min-height:1.6em;margin:10px 2px 0;font-weight:500}
.status.warn{color:var(--warn)} .status.good{color:var(--good)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#skip:not([hidden]) + .controls{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.controls label{font-size:.92rem;display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:8px}
.nudge{outline:2px solid var(--m-gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}

/* shredded paper */
#cardView{padding:14px 14px 4px}
.cards{display:flex;flex-wrap:wrap;gap:10px;min-height:48px;margin-bottom:12px;align-items:center}
.card{font-size:1.2rem;font-weight:700;letter-spacing:.14em;padding:7px 16px 7px 18px;border:0;border-radius:0;background:#f3e9cf;color:#2a2416;
  clip-path:polygon(5% 0,100% 0,95% 20%,100% 42%,96% 63%,100% 82%,96% 100%,0 100%,4% 78%,0 58%,5% 38%,1% 18%)}
.card:nth-child(3n){transform:rotate(-2.5deg)} .card:nth-child(3n+1){transform:rotate(1.8deg)}
.card.used{visibility:hidden}
.chain .card{transform:none;cursor:default;margin-right:-4px}
.chain .card:last-child{cursor:pointer;background:#ffe2a8}
.card .bA{color:#2e7d4f} .card .bC{color:#2b5fb3} .card .bG{color:#9a6b00} .card .bT{color:#b83a4b}
button.card:hover:not(.used){background:#ffe9bd}
.card.sel,button.card.sel:hover{background:#ffc56e}
.card.still{transform:none;display:inline-block}
.card.pre{background:#ffd3a3;transform:translateY(-7px)}
.card.suf{background:#c9dcff;transform:translateY(7px)}
.card u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:#2a2416}
.cand{font-weight:700;letter-spacing:.1em;padding:3px 11px;border-radius:999px}
.cand.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tally{margin:0 0 10px;font-size:.95rem;min-height:1.5em}
.tally .pre{color:var(--pre);font-weight:600} .tally .suf{color:var(--suf);font-weight:600}
.adj{font-size:1.02rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 18px;padding-top:2px}
.adjrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adjn{font-family:inherit;font-weight:700;padding:0 10px;border-radius:999px}
.adjn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.adjnew{font-family:inherit;font-weight:700;color:var(--good);border:1px dashed var(--good);border-radius:6px;padding:0 6px}

/* artwork */
.a-shallow{fill:#dcf3f4;opacity:.9}
.a-sand{fill:var(--sandc,#f1d98f);stroke:#c9a55a;stroke-width:1.2}
.a-sand2{fill:var(--sandc2,#fbeec2)}
.a-grass{stroke:#5f9a4a;stroke-width:1.7;fill:none;stroke-linecap:round}
.a-dot{fill:#c9a55a}
.a-deep{fill:#86b9ca;opacity:.8}
.a-rip{fill:none;stroke:#e9f8fa;stroke-width:1.3;stroke-dasharray:6 7;opacity:.85}
.ant-legs{stroke:#2a120b;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ant-body{fill:#6a2a16;stroke:#2a120b;stroke-width:.9}
.ant-shine{stroke:#c9794d;stroke-width:1.4;fill:none;stroke-linecap:round}
.ant-eye{fill:#fff}
#ant{pointer-events:none}
#ant.walking .legsA{animation:stepA .15s linear infinite alternate}
#ant.walking .legsB{animation:stepB .15s linear infinite alternate}
@keyframes stepA{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes stepB{from{transform:rotate(10deg)}to{transform:rotate(-10deg)}}
.t-wall{fill:#f7efe0;stroke:#8a6a4a;stroke-width:.8} .t-roof{fill:#b5553a;stroke:#7d3523;stroke-width:.8}
.wv{fill:none;stroke:#e6f6f8;stroke-width:1.6;stroke-linecap:round}
.wv2{fill:none;stroke:#a5d3df;stroke-width:1.4;stroke-linecap:round}
#scene.fadein{animation:fadein .9s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* bridges */
.pl-base{fill:none;stroke:var(--m-plank);stroke-width:7;stroke-linecap:butt}
.pl-top{fill:none;stroke:var(--m-plank2);stroke-width:4.4;stroke-dasharray:3.2 2.2}
.pl-glow{fill:none;stroke:var(--m-accent);stroke-width:13;stroke-linecap:round;opacity:.5}
.pl-gone{fill:none;stroke:var(--m-gone);stroke-width:2.6;stroke-dasharray:2 8;stroke-linecap:round}
.pl-gold{fill:none;stroke:var(--m-gold);stroke-width:6;stroke-linecap:round}
.newb .pl-base{stroke:var(--m-new)} .newb .pl-top{stroke:#c9f0d4}
.kb .pl-base{stroke-width:15} .kb .pl-top{stroke-width:11;stroke-dasharray:4 2.6} .kb .pl-glow{stroke-width:23}
.hit{fill:none;stroke:transparent;stroke-width:24;cursor:pointer}
.ah-p{fill:var(--m-plank)} .ah-a{fill:var(--m-accent)} .ah-g{fill:var(--m-gold)} .ah-n{fill:var(--m-new)}
.num{font-size:11px;font-weight:700;fill:var(--m-ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--m-water);stroke-width:4px;pointer-events:none}

/* islands */
.node{cursor:pointer}
.node .isl{fill:transparent;stroke:none}
.node .lab{font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#2a2416;pointer-events:none}
.node .cnt{font-size:10.5px;font-weight:700;text-anchor:middle;fill:var(--m-ink);paint-order:stroke;stroke:var(--m-water);stroke-width:3.5px;pointer-events:none}
.node.target .isl{stroke:var(--m-accent);stroke-width:3.5}
.node.head .isl{stroke:var(--m-ink);stroke-width:2.2;stroke-dasharray:4 4}
.node.sunk .lab{fill:#3f7386}
.node.goldn{--sandc:#ffc933;--sandc2:#ffe389}
.node.anchor .isl{stroke:var(--m-gold);stroke-width:6;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{stroke-opacity:.15}}
.ripple{fill:none;stroke:#eefafc;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:rip .9s ease-out forwards;pointer-events:none}
@keyframes rip{from{transform:scale(.8);opacity:1}to{transform:scale(2);opacity:0}}
.node:focus-visible{outline:none}
.node:focus-visible .isl{stroke:var(--m-ink);stroke-width:3}
.land .isl{fill:#f1d98f;stroke:var(--m-shore);stroke-width:3;stroke-dasharray:none}
.land.head .isl{stroke:var(--m-ink);stroke-dasharray:none;stroke-width:3}
.land .lab{font-size:15px;font-family:system-ui,sans-serif}
.land .cnt{stroke:#f1d98f;fill:#a8320a;font-size:12px}
.paper{fill:#f3e9cf;stroke:#cdbf9a;stroke-width:1}
.mlabel{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#2a2416;pointer-events:none}
.mread{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--m-ink);paint-order:stroke;stroke:var(--m-water);stroke-width:4px}

/* reveals, sources, field guide */
.reveal{border:1px solid var(--good);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel)}
.reveal h3{margin:0 0 8px;font-size:1.05rem}
.called{display:flex;gap:14px;align-items:center;margin:10px 0 4px;padding-left:12px;border-left:3px solid var(--good)}
.called p{margin:0;position:relative}
.called b{color:var(--good)}
.src{margin:4px 0 10px 15px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:.9rem}
.src .tag{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.src a{font-weight:600}
.wild{margin:12px 0 10px;padding:10px 14px;border-radius:8px;border:1px dashed var(--line)}
.wild p{margin:2px 0 6px}
.picto{flex:none;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.2}
.picto svg{display:block;width:120px;height:44px}
.picto .pl{stroke:var(--muted);stroke-width:2}
.picto .pn{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.picto .hot{stroke:var(--m-gold)} .picto .pn.hot{fill:var(--m-gold)}
.picto .pl.hot{stroke-width:4}
.equiv{flex:none;display:grid;grid-template-columns:auto auto auto;gap:2px 8px;align-items:center;font-size:.85rem}
.equiv svg{width:50px;height:34px;display:block;border-radius:6px;background:var(--m-water)}
.equiv b{color:var(--good)}
.guide{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
.guide summary{cursor:pointer;font-weight:600}
.gentry{padding:8px 0;border-top:1px solid var(--line)}
.gentry h4{margin:0;font-size:1rem}
.gentry p{margin:2px 0;font-size:.92rem}
.gmeta{color:var(--muted);font-size:.9rem}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
footer input{font:inherit;width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
[hidden]{display:none!important}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#guide){display:none!important}
  .guide{border:0;padding:0;margin:0}
  .guide summary,#printGuide{display:none}
  .guide a{color:#000}
  .gmeta{color:#333}
}
.pips button.fin{position:relative;border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.pips button.fin::after{content:'✓';position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--good);color:var(--bg);font-size:10px;line-height:14px;font-weight:700;text-align:center}
.linknote{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0 0;padding:8px 12px;border:1px solid var(--good);border-radius:8px;background:var(--panel);font-size:.92rem}
.savebar{margin-top:26px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.92rem}
.savebar p{margin:0 0 8px}
.savebar .saverow{display:flex;flex-wrap:wrap;gap:8px}
.savebar input{flex:1 1 16em;min-width:0;font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.savebar .savenote{margin:8px 0 0;color:var(--muted)}
.savebar .savenote:empty{display:none}
.linknote[hidden]{display:none}
@media print{.savebar,.linknote{display:none}}
/* ambient life in the scenery; never needed to play */
#decor .boat{transform:translate(120px,0)}
@media (prefers-reduced-motion:no-preference){#decor .boat{animation:sail 90s linear infinite}@keyframes sail{from{transform:translate(-40px,0)}to{transform:translate(800px,0)}}#decor .reeds use{transform-box:fill-box;transform-origin:50% 100%}#decor .reeds{animation:sway 4.5s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}@keyframes sway{from{transform:skewX(-1.5deg)}to{transform:skewX(1.5deg)}}.wv{animation:swell 5s ease-in-out infinite alternate}.wv2{animation:swell 3.6s ease-in-out -1.5s infinite alternate}@keyframes swell{from{transform:translate(-5px,1px)}to{transform:translate(6px,-2px)}}}
</style>
<link rel="icon" href="../book/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../book/book.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1d2a3a">
<link rel="apple-touch-icon" href="../book/icon-180.png">
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="30" fill="#bfe3ec"/><use href="#a-island" transform="translate(-4,8) scale(.75)"/><use href="#a-ant" transform="translate(2,-6) rotate(-18) scale(.95)"/></svg>Bridge Walker</h1>
    <div class="pips" id="pips" aria-label="Levels"></div>
  </header>
  <p class="linknote" id="linkNote" role="status" hidden><span id="linkNoteText"></span> <button id="copyLinkTop" hidden>Copy progress link</button></p>
  <div class="vocabhead">Vocabulary you have earned <span style="text-transform:none;letter-spacing:0">(hover for the definition)</span></div>
  <div class="badges" id="badges"></div>

  <h2 id="title"></h2>
  <p id="brief"></p>
  <div class="rule" id="rule"></div>

  <div class="stage">
    <div id="cardView" hidden>
      <div id="chainWrap">
        <div class="sub" id="chainLabel">Your chain</div>
        <div class="cards chain" id="chain"></div>
      </div>
      <div class="sub" id="poolLabel">Shredded reads</div>
      <div class="cards" id="pool"></div>
      <div class="tally" id="tally" hidden></div>
    </div>
    <div class="stagemsg" id="stagemsg" role="status" hidden></div>
    <svg id="map" viewBox="0 0 760 500" role="group" aria-label="Map">
      <defs>
        <!-- ===== ARTWORK: edit these shapes to restyle the game ===== -->
        <pattern id="pWater" width="140" height="90" patternUnits="userSpaceOnUse">
          <rect width="140" height="90" fill="#bfe3ec"/>
          <path class="wv" d="M10,22 q7,-6 14,0 t14,0"/><path class="wv" d="M84,58 q7,-6 14,0 t14,0"/>
          <path class="wv2" d="M52,78 q6,-5 12,0"/><path class="wv2" d="M108,16 q6,-5 12,0"/><path class="wv2" d="M22,54 q5,-4 10,0"/>
        </pattern>
        <g id="a-island">
          <path class="a-shallow" transform="scale(1.3)" d="M0,-23C10,-24 21,-17 23,-6C25,5 20,18 9,22C-1,25 -15,23 -21,13C-26,3 -23,-12 -14,-19C-10,-22 -5,-23 0,-23Z"/>
          <path class="a-sand" d="M0,-23C10,-24 21,-17 23,-6C25,5 20,18 9,22C-1,25 -15,23 -21,13C-26,3 -23,-12 -14,-19C-10,-22 -5,-23 0,-23Z"/>
          <path class="a-sand2" transform="scale(.8)" d="M0,-23C10,-24 21,-17 23,-6C25,5 20,18 9,22C-1,25 -15,23 -21,13C-26,3 -23,-12 -14,-19C-10,-22 -5,-23 0,-23Z"/>
          <path class="a-grass" d="M-17,9l-2,-5M-15,11l0,-6M-13,12l2,-5M16,-11l-1,-5M18,-9l1,-5"/>
          <circle class="a-dot" cx="15" cy="13" r="1.1"/><circle class="a-dot" cx="11" cy="17" r=".9"/><circle class="a-dot" cx="-12" cy="-16" r="1"/>
        </g>
        <g id="a-sunk">
          <ellipse class="a-rip" rx="28" ry="26"/>
          <path class="a-deep" d="M0,-23C10,-24 21,-17 23,-6C25,5 20,18 9,22C-1,25 -15,23 -21,13C-26,3 -23,-12 -14,-19C-10,-22 -5,-23 0,-23Z"/>
        </g>
        <g id="a-ant">
          <g class="legsA"><path class="ant-legs" d="M-3,-3L-9,-10L-15,-12M2,3L4,11L1,16M5,-3L11,-10L17,-11"/></g>

<script id="engine">
/* Pure puzzle logic: no DOM. */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(n,rand){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* A generator that runs out of tries builds the puzzle for a key from its pool instead. TRIES.limit is for tests only. */
const TRIES={limit:null,strict:false},maxTries=n=>TRIES.limit===null?n:TRIES.limit;
function fallback(name,key,pool,make){
  if(TRIES.strict)throw new Error(name+' ran out of tries for '+key);
  const t=TRIES.limit;TRIES.strict=true;TRIES.limit=null;
  try{return make(pool[hashStr(key)%pool.length]);}finally{TRIES.strict=false;TRIES.limit=t;}
}
const POOLS={makeInstance:['fallback-0','fallback-3','fallback-4','fallback-5'],makeBalance:['fallback-1','fallback-2','fallback-3','fallback-4']};

function analyse(genome,k){
  const reads=[];for(let i=0;i+k<=genome.length;i++)reads.push(genome.slice(i,i+k));
  const nodes=[],idx={};
  const nid=s=>{if(!(s in idx)){idx[s]=nodes.length;nodes.push(s);}return idx[s];};
  const edges=reads.map((r,i)=>({id:i,read:r,from:nid(r.slice(0,k-1)),to:nid(r.slice(1))}));
  const out=nodes.map(()=>0),inn=nodes.map(()=>0),succ=nodes.map(()=>new Set()),pairCount={};
  let selfLoops=0,maxPar=0;
  edges.forEach(e=>{
    out[e.from]++;inn[e.to]++;succ[e.from].add(e.to);
    if(e.from===e.to)selfLoops++;
    const key=e.from+'>'+e.to;e.par=pairCount[key]||0;pairCount[key]=e.par+1;
    if(pairCount[key]>maxPar)maxPar=pairCount[key];
  });
  const branching=succ.filter(s=>s.size>=2).length;
  return {genome,k,reads,nodes,edges,out,inn,branching,selfLoops,maxPar,
          start:edges[0].from,end:edges[edges.length-1].to};
}

/* spec: {k, n (number of reads), minB, maxB} */
function makeInstance(key,spec){
  const rand=rng(hashStr(key)),L=spec.n+spec.k-1;
  for(let t=0;t<maxTries(200000);t++){
    let g='';for(let i=0;i<L;i++)g+='ACGT'[Math.floor(rand()*4)];
    const a=analyse(g,spec.k);
    if(a.selfLoops||a.start===a.end||a.maxPar>2)continue;
    if(a.branching<(spec.minB||0))continue;
    if(spec.maxB!==undefined&&a.branching>spec.maxB)continue;
    return a;
  }
  return fallback('makeInstance',key,POOLS.makeInstance,k=>makeInstance(k,spec));
}

/* Overlap graph: a node per read, an edge i -> j wherever read i's suffix is read j's prefix. */
function overlapEdges(inst){
  const r=inst.reads,k=inst.k,E=[];
  for(let i=0;i<r.length;i++)for(let j=0;j<r.length;j++)
    if(i!==j&&r[i].slice(1)===r[j].slice(0,k-1))E.push({id:E.length,from:i,to:j,par:0});
  return E;
}

/* Exhaustive enumeration is deliberately limited to the tiny teaching puzzle. */
function eulerWalks(inst,limit=3){
  const walks=[],used=new Set(),path=[];
  const visit=v=>{
    if(walks.length>=limit)return;
    if(path.length===inst.edges.length){walks.push(path.slice());return;}
    for(const e of inst.edges)if(e.from===v&&!used.has(e.id)){
      used.add(e.id);path.push(e.id);visit(e.to);path.pop();used.delete(e.id);
    }
  };
  visit(inst.start);return walks;
}
function spellWalk(inst,walk){return inst.nodes[inst.start]+walk.map(id=>inst.edges[id].read.slice(-1)).join('');}
/* d is the unsequenced gap, so the right read starts k+d bases after the left. */
function pairPositions(text,pair,k,d){
  const positions=[];
  for(let i=0;i+2*k+d<=text.length;i++)
    if(text.slice(i,i+k)===pair.left&&text.slice(i+k+d,i+2*k+d)===pair.right)positions.push(i);
  return positions;
}
function pairedGraph(pairs,k){
  const nodes=[],idx=new Map(),nid=s=>{if(!idx.has(s)){idx.set(s,nodes.length);nodes.push(s);}return idx.get(s);};
  const edges=pairs.map((p,id)=>({id,read:p.left+'|'+p.right,
    from:nid(p.left.slice(0,k-1)+'|'+p.right.slice(0,k-1)),to:nid(p.left.slice(1)+'|'+p.right.slice(1)),par:0}));
  const out=nodes.map(()=>0),inn=nodes.map(()=>0);edges.forEach(e=>{out[e.from]++;inn[e.to]++;});
  return {nodes,edges,out,inn,start:edges[0].from,end:edges[edges.length-1].to};
}
/* Level 12. One 3-letter repeat occurs three times, so two six-edge loops hang off a single node and
   exactly two walks cross every edge: 1 prefix edge + two loops of 6 + a tail of 7 = 20 reads, 23 letters.
   The two reads of a pair start k+d = 5 reads apart. A pair fits BOTH strings exactly when its two reads
   lie in the same stretch, because swapping the loops then carries the whole pair along: there is one such
   pair inside each loop and two in the tail. The other eleven pairs reach across a join and fit only the
   true string. The bench offers the four that fit both and just one that does not, so the pair that
   settles the question has to be found rather than stumbled on. */
const PAIR_FALLBACK='TGTTCGGGTTGCCGTTACCCTCC';
function makePairs(key){
  const rand=rng(hashStr(key)),base=()=>'ACGT'[Math.floor(rand()*4)],bases=n=>Array.from({length:n},base).join('');
  const k=4,d=1,INNER=3,TAIL=7,LOOP=INNER+3,READS=1+2*LOOP+TAIL,LAST=maxTries(60000);
  for(let attempt=0;attempt<=LAST;attempt++){
    const repeat=bases(3);
    // A validated fallback bounds generation time without relaxing any invariant.
    const genome=attempt===LAST?PAIR_FALLBACK:base()+repeat+bases(INNER)+repeat+bases(INNER)+repeat+bases(TAIL);
    const inst=analyse(genome,k),visits=Array(inst.nodes.length).fill(0);
    visits[inst.start]++;inst.edges.forEach(e=>visits[e.to]++);
    if(inst.selfLoops||inst.maxPar!==1||inst.nodes.length!==READS-1||visits.filter(n=>n===3).length!==1)continue;
    const walks=eulerWalks(inst);
    if(walks.length!==2)continue;
    const strings=walks.map(w=>spellWalk(inst,w));
    if(strings[0]===strings[1])continue;
    const pairs=Array.from({length:READS-k-d},(_,i)=>({left:genome.slice(i,i+k),right:genome.slice(i+k+d,i+2*k+d),index:i}));
    const paired=pairedGraph(pairs,k);
    if(paired.nodes.length!==pairs.length+1||paired.out.some(n=>n>1)||paired.inn.some(n=>n>1))continue;
    const other=strings.find(s=>s!==genome),fitsOther=p=>pairPositions(other,p,k,d).length>0;
    const both=pairs.filter(fitsOther).map(p=>p.index),only=pairs.filter(p=>!fitsOther(p)).map(p=>p.index);
    if(both.length!==4||!only.length)continue;
    // which stretch a read lies in: 0 before the loops, 1 and 2 the loops, 3 after them
    const stretch=i=>i<1?0:i<=LOOP?1:i<=2*LOOP?2:3;
    const candidates=shuffled(2,rand).map(i=>({text:strings[i],walk:walks[i]}));
    const decider=only[Math.floor(rand()*only.length)],plain=shuffled(both.length,rand).map(i=>both[i]);
    // The first pair offered never decides; the one that does hides among the rest.
    const rest=[...plain.slice(1),decider],bench=[plain[0],...shuffled(rest.length,rand).map(i=>rest[i])];
    return Object.assign(inst,{d,pairs,paired,candidates,repeat:genome.slice(1,4),bench,
      pairStretch:pairs.map(p=>stretch(p.index)===stretch(p.index+k+d)?stretch(p.index):-1),
      loopByEdge:inst.edges.map((_,i)=>stretch(i)===1?1:stretch(i)===2?2:0)});
  }
  throw new Error('Could not generate a read-pair puzzle');
}

/* Round-trip puzzle: a connected directed graph on six numbered nodes that needs
   exactly three more edges before every node is balanced, with one node short by two. */
function makeBalance(key){
  const rand=rng(hashStr(key)),n=6;
  for(let t=0;t<maxTries(200000);t++){
    const m=9+Math.floor(rand()*3),edges=[],seen=new Set();let ok=true;
    for(let i=0;i<m;i++){
      const a=Math.floor(rand()*n);let b=Math.floor(rand()*(n-1));if(b>=a)b++;
      if(seen.has(a+'>'+b)){ok=false;break;}
      seen.add(a+'>'+b);edges.push({id:i,from:a,to:b,par:0});
    }
    if(!ok)continue;
    const out=Array(n).fill(0),inn=Array(n).fill(0);
    edges.forEach(e=>{out[e.from]++;inn[e.to]++;});
    if(out.some((o,v)=>o<1||inn[v]<1))continue;
    const diff=out.map((o,v)=>o-inn[v]);
    const need=diff.reduce((s,d)=>s+Math.max(0,d),0);
    if(need!==3||Math.max(...diff.map(Math.abs))!==2)continue;
    const reach=new Set([0]),q=[0];
    while(q.length){const v=q.pop();edges.forEach(e=>{const w=e.from===v?e.to:e.to===v?e.from:-1;if(w>=0&&!reach.has(w)){reach.add(w);q.push(w);}});}
    if(reach.size!==n)continue;
    return {nodes:['1','2','3','4','5','6'],edges,out,inn,need,reads:[],k:0,genome:''};
  }
  return fallback('makeBalance',key,POOLS.makeBalance,makeBalance);
}

/* Hierholzer's algorithm: an Eulerian cycle through edges [{from,to}], as a list of edge indexes.
   Assumes every node is balanced and the graph is connected. */
function eulerCycle(n,edges,startNode){
  const adj=Array.from({length:n},()=>[]);
  edges.forEach((e,i)=>adj[e.from].push(i));
  const stack=[[startNode===undefined?edges[0].from:startNode,-1]],out=[];
  while(stack.length){
    const top=stack[stack.length-1],v=top[0];
    if(adj[v].length){const i=adj[v].pop();stack.push([edges[i].to,i]);}
    else{stack.pop();if(top[1]>=0)out.push(top[1]);}
  }
  return out.reverse();
}

/* Deterministic force layout for n nodes; links are {from,to}. Returns [{x,y}]. */
function layout(n,linkList,rand,W,H,R){
  const p=[];for(let i=0;i<n;i++)p.push({x:rand()*W,y:rand()*H});
  const kk=Math.sqrt(W*H/n)*0.9,pairs=new Set();
  linkList.forEach(e=>{if(e.from!==e.to)pairs.add(Math.min(e.from,e.to)+','+Math.max(e.from,e.to));});
  const links=[...pairs].map(s=>s.split(',').map(Number));
  let t=W/10;
  for(let it=0;it<300;it++){
    const d=p.map(()=>({x:0,y:0}));
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      let dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,dist=Math.max(.01,Math.hypot(dx,dy)),f=kk*kk/dist;
      d[i].x+=dx/dist*f;d[i].y+=dy/dist*f;d[j].x-=dx/dist*f;d[j].y-=dy/dist*f;
    }
    for(const [a,b] of links){
      let dx=p[a].x-p[b].x,dy=p[a].y-p[b].y,dist=Math.max(.01,Math.hypot(dx,dy)),f=dist*dist/kk;
      d[a].x-=dx/dist*f;d[a].y-=dy/dist*f;d[b].x+=dx/dist*f;d[b].y+=dy/dist*f;
    }
    for(let i=0;i<n;i++){
      d[i].x-=(p[i].x-W/2)*.3;d[i].y-=(p[i].y-H/2)*.3;
      const len=Math.max(.01,Math.hypot(d[i].x,d[i].y)),m=Math.min(len,t);
      p[i].x+=d[i].x/len*m;p[i].y+=d[i].y/len*m;
    }
    t*=.98;
  }
  const padX=R+34,padT=R+56,padB=R+38,xs=p.map(q=>q.x),ys=p.map(q=>q.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  p.forEach(q=>{
    q.x=padX+(x1-x0<1?.5:(q.x-x0)/(x1-x0))*(W-2*padX);
    q.y=padT+(y1-y0<1?.5:(q.y-y0)/(y1-y0))*(H-padT-padB);
  });
  const minD=R*3.4;
  for(let it=0;it<300;it++){
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      let dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,dist=Math.hypot(dx,dy);
      if(dist<minD){
        if(dist<.01){dx=1;dy=0;dist=1;}
        const s=(minD-dist)/2;
        p[i].x+=dx/dist*s;p[i].y+=dy/dist*s;p[j].x-=dx/dist*s;p[j].y-=dy/dist*s;
      }
    }
    p.forEach(q=>{q.x=Math.min(W-padX,Math.max(padX,q.x));q.y=Math.min(H-padB,Math.max(padT,q.y));});
  }
  return p;
}
if(typeof module!=='undefined')module.exports={hashStr,rng,shuffled,analyse,makeInstance,overlapEdges,makeBalance,eulerCycle,layout,eulerWalks,spellWalk,pairPositions,pairedGraph,makePairs,TRIES,POOLS};
</script>

/* ---------- saved state ---------- */
const params=new URLSearchParams(location.search),urlSeed=params.get('seed');
const pathLevel=(location.pathname.match(/\/level-(\d+)(?:\/(?:index\.html)?)?$/)||[])[1];
const requestedLevel=Number(pathLevel||params.get('level'));
const previewLevel=Number.isInteger(requestedLevel)&&requestedLevel>=1&&requestedLevel<=LEVELS.length?requestedLevel:0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(){if(previewLevel)return;if(S&&S.done)S.link=encodeProgress(S);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}writeLink();}
function freshState(seed){return {seed,unlocked:1,done:[],badges:[],earnedAt:{},variants:{},clean:[],intros:[],log:[]};}
function randomCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}

// Direct level links are fresh practice sessions, separate from course progress.
/* ---------- progress link ----------
   Every level is open; only the vocabulary is earned. The progress link is this page's address plus
   #save=1.<terms>.<levels>.<check>.<puzzle code>; opening it restores the earned terms and finished levels in any browser.
   The page's own address stays clean, so that sharing the address of the game never hands over someone's progress.
   <terms> has one character per VOCAB entry, in VOCAB order: 0 for not earned, otherwise the level it was earned in (base 36).
   <levels> has one 0 or 1 per level. Old links depend on those orders: add new terms and levels at the end. */
const TRANSIENT=!!(previewLevel||params.get('bench'));
function linkCheck(body){const s=KEY+'|'+body;let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function encodeProgress(st){
  const body='1.'+VOCAB.map(v=>st.badges.includes(v.id)?Math.min(35,Math.max(1,st.earnedAt[v.id]|0)).toString(36):'0').join('')+
    '.'+LEVELS.map(l=>st.done.includes(l.id)?'1':'0').join('');
  return body+'.'+linkCheck(body+'.'+st.seed)+'.'+encodeURIComponent(st.seed);
}
function decodeProgress(text){
  const m=/^1\.([0-9a-z]+)\.([01]+)\.([0-9a-z]+)\.(.+)$/.exec(text||'');
  if(!m||m[1].length>VOCAB.length||m[2].length>LEVELS.length)return null;
  let seed;try{seed=decodeURIComponent(m[4]);}catch(e){return null;}
  if(linkCheck('1.'+m[1]+'.'+m[2]+'.'+seed)!==m[3])return null;
  const earnedAt={},done=[];
  for(let i=0;i<m[1].length;i++){const l=parseInt(m[1][i],36);if(l>LEVELS.length)return null;if(l)earnedAt[VOCAB[i].id]=l;}
  for(let i=0;i<m[2].length;i++)if(m[2][i]==='1')done.push(LEVELS[i].id);
  return {seed,earnedAt,done};
}
/* saves from before every level was open have no list of finished levels: rebuild it */
function withDone(st){
  if(!Array.isArray(st.badges))st.badges=[];
  if(!st.earnedAt)st.earnedAt={};
  if(!Array.isArray(st.log))st.log=[];
  if(!Array.isArray(st.done)){
    st.done=[];
    for(let i=1;i<(st.unlocked||1)&&i<=LEVELS.length;i++)st.done.push(i);
    st.log.forEach(e=>{if(e&&e.ev==='complete'&&e.lvl>=1&&e.lvl<=LEVELS.length&&!st.done.includes(e.lvl))st.done.push(e.lvl);});
    st.done.sort((a,b)=>a-b);
  }
  return st;
}
/* add a link's terms and levels to a save; nothing is ever taken away */
function absorb(st,p){
  const terms=[],levels=[];
  VOCAB.forEach(v=>{if(p.earnedAt[v.id]&&!st.badges.includes(v.id)){st.badges.push(v.id);st.earnedAt[v.id]=p.earnedAt[v.id];terms.push(v.id);}});
  p.done.forEach(id=>{if(!st.done.includes(id)){st.done.push(id);levels.push(id);}});
  st.done.sort((a,b)=>a-b);
  if(st.done.length)st.unlocked=Math.max(st.unlocked||1,Math.min(LEVELS.length,st.done[st.done.length-1]+1));
  return {terms,levels};
}
function markDone(){if(!S.done.includes(cur.L.id)){S.done.push(cur.L.id);S.done.sort((a,b)=>a-b);}}
const linkText=TRANSIENT?'':((String(location.hash||'').match(/^#save=(.+)$/)||[])[1]||'');
let linkNote='',lastLink=null,linkLive=false;
function progressLink(){
  const q=new URLSearchParams(location.search);q.delete('seed');const qs=q.toString();
  return location.pathname+(qs?'?'+qs:'')+'#save='+encodeProgress(S);
}
function writeLink(){
  if(TRANSIENT||!S||!S.done)return;
  const rel=progressLink();if(rel===lastLink)return;lastLink=rel;
  const box=$('#saveLink');if(box)box.value=(location.origin||'')+rel;
  if(linkLive)topNote('Your progress link has changed. Copy it again before you leave.',true);
}
function topNote(text,withButton){$('#linkNoteText').textContent=text;$('#copyLinkTop').hidden=!withButton;$('#linkNote').hidden=false;}
/* where to pick up: the first level not yet finished */
function resumeLevel(){const l=LEVELS.find(l=>!S.done.includes(l.id));return l?l.id:LEVELS.length;}
function useLink(){
  if(TRANSIENT||!linkText)return;
  const p=decodeProgress(linkText);
  if(!p){linkNote='That progress link is incomplete or was altered, so nothing was restored. Copy the whole link and open it again.';return;}
  if(p.seed!==S.seed){
    const mine=S.badges.length+S.done.length;
    if(!mine||typeof confirm!=='function'||confirm('This link carries progress for puzzle code '+p.seed+' ('+Object.keys(p.earnedAt).length+' terms).\n\nThis browser already has progress for puzzle code '+S.seed+' ('+S.badges.length+' terms).\n\nOK: switch to the link. This browser’s progress for '+S.seed+' is replaced.\nCancel: keep this browser’s progress.'))S=withDone(freshState(p.seed));
    else{linkNote='Kept the progress saved in this browser (puzzle code '+S.seed+'). The link you opened was for puzzle code '+p.seed+'.';return;}
  }
  const got=absorb(S,p);
  if(got.terms.length||got.levels.length){
    S.log.push({t:Date.now(),lvl:0,variant:0,ev:'restore',terms:got.terms,levels:got.levels});
    linkNote='Restored from your progress link: '+got.terms.length+' vocabulary term'+(got.terms.length===1?'':'s')+' and '+got.levels.length+' finished level'+(got.levels.length===1?'':'s')+'.';
  }
}
let S=previewLevel?freshState(urlSeed||randomCode()):load();
if(urlSeed&&urlSeed!==S.seed)S=freshState(urlSeed);
if(!S.seed)S=freshState(randomCode());
withDone(S);
useLink();
save();

let cur=null;

  if(S.log.length>8000)S.log.splice(0,S.log.length-8000);

/* ---------- the ant ---------- */
let antRaf=0,antAt=null,antAng=0;
function setAnt(p,ang){
  const a=$('#ant');
  if(!p){cancelAnimationFrame(antRaf);a.classList.remove('walking');a.setAttribute('visibility','hidden');antAt=null;return;}
  if(ang!==undefined)antAng=ang;
  a.setAttribute('visibility','visible');
  a.setAttribute('transform','translate('+f1(p.x)+','+f1(p.y)+') rotate('+f1(antAng)+') scale(1.25)');
  antAt=p;
}
function runAnt(pts){
  cancelAnimationFrame(antRaf);
  const end=pts[pts.length-1];
  if(!antAt||pts.length<2)return setAnt(end);
  const seg=[];let tot=0;
  for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);seg.push(l);tot+=l;}
  if(tot<1)return setAnt(end);
  const dur=Math.min(700,Math.max(300,tot*2.6)),t0=performance.now(),el=$('#ant');
  el.classList.add('walking');
  const finish=()=>{el.classList.remove('walking');setAnt(end,end.x>=pts[0].x?0:180);};  /* settle level so the name stays readable */
  const frame=now=>{
    let u=Math.min(1,(now-t0)/dur);u=u<.5?2*u*u:1-2*(1-u)*(1-u);
    let d=u*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++;}
    const a=pts[i],b=pts[i+1],r=seg[i]?Math.min(1,d/seg[i]):1;
    const ang=seg[i]>2?Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI:antAng;
    setAnt({x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r},ang);
    if(u<1)antRaf=requestAnimationFrame(frame);else finish();
  };
  const raf=antRaf=requestAnimationFrame(frame);
  setTimeout(()=>{if(antRaf===raf&&document.hidden)finish();},dur+50);  /* hidden tabs get no frames */
}
const LIFT=R+11,perch=p=>({x:p.x,y:p.y-LIFT});

/* ---------- geometry ---------- */
function geom(a,c,par){
  const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||1,off=16+par*24;
  const m={x:(a.x+c.x)/2-dy/d*off,y:(a.y+c.y)/2+dx/d*off};
  const toward=(p,q,r)=>{const l=Math.hypot(q.x-p.x,q.y-p.y)||1;return {x:p.x+(q.x-p.x)/l*r,y:p.y+(q.y-p.y)/l*r};};
  const s=toward(a,m,R),t=toward(c,m,R+11);
  return {s,m,t,d:'M'+f1(s.x)+','+f1(s.y)+' Q'+f1(m.x)+','+f1(m.y)+' '+f1(t.x)+','+f1(t.y),
          lx:.25*s.x+.5*m.x+.25*t.x,ly:.25*s.y+.5*m.y+.25*t.y};
}
function curvePts(a,c,par){
  const g=geom(a,c,par),pts=[perch(a)];
  for(let i=1;i<10;i++){const u=i/10,v=1-u;
    pts.push({x:v*v*g.s.x+2*u*v*g.m.x+u*u*g.t.x,y:v*v*g.s.y+2*u*v*g.m.y+u*u*g.t.y-LIFT*Math.abs(2*u-1)});}
  pts.push(perch(c));return pts;
}
function svgPoint(ev){
  const svg=$('#map'),pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:p.x,y:p.y};
}

/* ---------- Königsberg ---------- */
function konigsberg(){
  const names=['North bank','South bank','Kneiphof','Lomse'];
  const spots=[{x:430,y:70},{x:430,y:432},{x:270,y:236},{x:600,y:236}];
  const raw=[[0,2,215,116,215,206],[0,2,325,116,325,206],[1,2,215,384,215,294],[1,2,325,384,325,294],
             [2,3,378,250,492,250],[0,3,615,116,615,196],[1,3,615,384,615,304]];
  const edges=raw.map((a,id)=>({id,from:a[0],to:a[1],und:true,p:{x:a[2],y:a[3]},q:{x:a[4],y:a[5]},read:''}));
  const deg=names.map((_,v)=>edges.filter(e=>e.from===v||e.to===v).length);
  return {nodes:names,edges,spots,deg,reads:[],k:0,genome:''};
}
function inland(e,v){
  const end=v===e.from?e.p:e.q,oth=v===e.from?e.q:e.p,l=Math.hypot(end.x-oth.x,end.y-oth.y)||1;
  return {x:end.x+(end.x-oth.x)/l*20,y:end.y+(end.y-oth.y)/l*20};
}

/* ---------- level loading ---------- */
let lapTimer=0,introRaf=0;
function freshWalk(){return {walk:[],ins:null,anchor:null,start:null,head:null};}
function freshBuild(){return {pos:[],placed:[],sel:null,start:null,hist:[]};}
function loadLevel(id){
  if(cur&&cur.skipTimer)clearTimeout(cur.skipTimer);
  clearInterval(lapTimer);cancelAnimationFrame(introRaf);setAnt(null);
  const L=LEVELS[id-1],src=L.share?LEVELS[L.share-1]:L,variant=S.variants[src.id]||0;
  const key=S.seed+'|'+src.id+'|'+variant;
  cur={L,src,variant,key,mode:L.mode,w:id<=2?{n:'island',e:'bridge'}:{n:'node',e:'edge'},
       undos:0,restarts:0,strands:0,detours:0,buildErrs:0,buildUndos:0,firstPick:null,done:false,blocks:[],
       msg:{text:'',kind:''},t0:Date.now(),skipOK:false,phase:'play',lap:Infinity};
  if(L.mode==='konig'){
    cur.inst=konigsberg();cur.E=cur.inst.edges;
  }else if(L.mode==='balance'){
    cur.inst=makeBalance(key);
    cur.pos=layout(cur.inst.nodes.length,cur.inst.edges,rng(hashStr(key+'|bal')),W,H,R);
    cur.bal={added:[],sel:null};
  }else{
    cur.inst=L.pairs?makePairs(key):makeInstance(key,src);
    cur.order=shuffled(cur.inst.reads.length,rng(hashStr(key+'|cards')));
    cur.hamE=overlapEdges(cur.inst);
    cur.hamPos=layout(cur.inst.reads.length,cur.hamE,rng(hashStr(key+'|ham')),W,H,R);
    if(L.mode==='eul'){
      cur.E=cur.inst.edges;
      cur.pos=layout(cur.inst.nodes.length,cur.E,rng(hashStr(key+'|eul')),W,H,R);
      if(L.pairs){cur.pos=pairMapLayout(cur.inst);cur.pairSel=cur.inst.bench[0];cur.pairOffsets=[0,0];cur.pairKnown={};cur.pairWon=null;cur.pairTries=0;}
    }
  }
  if(L.intro&&!S.intros.includes(L.id))cur.phase='pre';
  if(L.mode==='cards'){cur.chain=[];say('Click a read to start your chain.');}
  else if(L.mode==='ham'){
    cur.path=[];
    say(cur.phase==='pre'?'Your eight shredded reads.':startMsg());
    if(L.id===4)cur.skipTimer=setTimeout(()=>{cur.skipOK=true;renderControls();},45000);
  }else if(L.mode==='balance'){
    say('Click the node a new edge should leave from.');
  }else{
    cur.b=freshWalk();cur.hist=[];
    if(L.build){
      cur.phase='build';cur.bd=freshBuild();cur.pos=cur.bd.pos;
      say('Pick a read from the tray to begin.');
    }else if(L.nomap){
      cur.phase='ask';
      cur.nm={cand:null,misses:0,order:shuffled(cur.inst.nodes.length,rng(hashStr(key+'|cand')))};
      say('Which node must '+ANT+' start on?');
    }else say(cur.phase==='pre'?'Here they are as nodes, the way you have seen them.':startMsg());
    if(L.mode==='konig')cur.skipTimer=setTimeout(()=>{cur.skipOK=true;renderControls();},60000);
  }
  log('load',{mode:L.mode});
  render();
}
function startMsg(){
  if(cur.mode==='konig')return 'Click a piece of land to set '+ANT+' down.';
  return 'Click '+(cur.w.n==='island'?'an island':'a node')+' to set '+ANT+' down.';
}

/* ---------- shredded reads (cards) ---------- */
function fits(prev,next){return prev.slice(1)===next.slice(0,cur.inst.k-1);}
function cardClick(i){
  if(cur.done||cur.mode!=='cards'||cur.chain.includes(i))return;
  const r=cur.inst.reads;
  if(cur.chain.length){
    const last=r[cur.chain[cur.chain.length-1]];
    if(!fits(last,r[i])){
      log('card_reject',{read:r[i],after:last});
      say(r[i]+' can’t follow '+last+': the next read has to start with '+last.slice(1)+'.','warn');
      return render();
    }
  }
  cur.chain.push(i);log('card_add',{read:r[i]});
  settleCards(true);render();
}
function settleCards(moved){
  const r=cur.inst.reads,n=r.length,c=cur.chain;
  if(c.length===n)return complete();
  if(!c.length)return say('Click a read to start your chain.');
  const last=r[c[c.length-1]];
  if(!r.some((x,i)=>!c.includes(i)&&fits(last,x))){
    if(moved){cur.strands++;log('dead_end',{at:last,placed:c.length});}
    say('Dead end: no unused read starts with '+last.slice(1)+'. Undo to back up. ('+c.length+' of '+n+' placed.)','warn');
  }else say(c.length+' of '+n+' reads placed.');
}
function spellCards(){
  const r=cur.inst.reads,c=cur.chain;
  return c.length?r[c[0]]+c.slice(1).map(i=>r[i].slice(-1)).join(''):'';
}
/* a read as coloured letters, optionally underlining letters [a, b) */
function strip(read,range){
  const sp=[...read].map(ch=>'<span class="b'+ch+'">'+ch+'</span>');
  if(range){sp[range[0]]='<u>'+sp[range[0]];sp[range[1]-1]+='</u>';}
  return sp.join('');
}
function renderTray(){
  const r=cur.inst.reads,m=cur.mode,ph=cur.phase,k=cur.inst.k;
  if(m==='cards'){
    $('#chainWrap').hidden=false;$('#tally').hidden=true;
    $('#chainLabel').textContent='Your chain';$('#poolLabel').textContent='Shredded reads';
    $('#chain').innerHTML=cur.chain.map((i,j)=>'<button class="card" data-chain="'+j+'" aria-label="'+r[i]+
      (j===cur.chain.length-1?', click to remove':'')+'">'+strip(r[i])+'</button>').join('')||'<span style="color:var(--muted)">empty</span>';
    $('#pool').innerHTML=cur.order.map(i=>'<button class="card'+(cur.chain.includes(i)?' used':'')+'" data-card="'+i+'">'+strip(r[i])+'</button>').join('');
  }else if(ph==='build'){
    const bd=cur.bd;
    $('#chainWrap').hidden=true;$('#tally').hidden=true;
    $('#poolLabel').textContent='Reads: '+bd.placed.length+' of '+r.length+' drawn. Pick one, then draw its edge';
    $('#pool').innerHTML=cur.order.map(i=>'<button class="card'+(bd.placed.includes(i)?' used':'')+(bd.sel===i?' sel':'')+
      '" data-pick="'+i+'" aria-pressed="'+(bd.sel===i)+'">'+strip(r[i])+'</button>').join('');
  }else{
    const nm=cur.nm,N=cur.inst.nodes,E=cur.inst.edges,c=nm.cand;
    $('#chainWrap').hidden=false;
    $('#chainLabel').textContent='Candidate nodes';$('#poolLabel').textContent='The reads';
    $('#chain').innerHTML=nm.order.map(v=>'<button class="cand'+(v===c?' on':'')+'" data-cand="'+v+'" aria-pressed="'+(v===c)+'">'+N[v]+'</button>').join('');
    $('#pool').innerHTML=cur.order.map(i=>{const e=E[i],pre=c!==null&&e.from===c,suf=c!==null&&e.to===c;
      return '<span class="card still'+(pre?' pre':'')+(suf?' suf':'')+'">'+strip(r[i],pre?[0,k-1]:suf?[1,k]:null)+'</span>';}).join('');
    const t=$('#tally');t.hidden=false;
    t.innerHTML=c===null?'Click a candidate to see which reads touch it.'
      :'<b class="mono">'+N[c]+'</b>: <span class="pre">'+plural(cur.inst.out[c],'read')+' start'+(cur.inst.out[c]===1?'s':'')+' with it</span> · <span class="suf">'+
        plural(cur.inst.inn[c],'read')+' end'+(cur.inst.inn[c]===1?'s':'')+' with it</span>';
  }
}

/* ---------- nodes sink (Hamiltonian) ---------- */
function hamOptions(){
  const p=cur.path,head=p[p.length-1];
  return cur.hamE.filter(e=>e.from===head&&!p.includes(e.to));
}
function hamClick(v){
  const p=cur.path,r=cur.inst.reads,w=cur.w;
  if(!p.length){p.push(v);setAnt(perch(cur.hamPos[v]),0);log('start',{read:r[v]});}
  else{
    const head=p[p.length-1];
    if(v===head)return;
    if(p.includes(v)){say(r[v]+' has already sunk.','warn');return render();}
    const e=cur.hamE.find(x=>x.from===head&&x.to===v);
    if(!e){log('reject',{from:r[head],to:r[v]});
      say('No '+w.e+' from '+r[head]+' to '+r[v]+': the next read has to start with '+r[head].slice(1)+'.','warn');return render();}
    p.push(v);cur.justSunk=head;log('walk',{read:r[v]});
    runAnt(curvePts(cur.hamPos[head],cur.hamPos[v],0));
  }
  settleHam(true);render();cur.justSunk=null;
}
function settleHam(moved){
  const p=cur.path,r=cur.inst.reads,n=r.length,w=cur.w;
  if(!p.length)return say(startMsg());
  if(p.length===n)return complete();
  if(!hamOptions().length){
    if(moved){cur.strands++;log('stranded',{at:r[p[p.length-1]],left:n-p.length});}
    say(ANT+' is stranded on '+r[p[p.length-1]]+' with '+plural(n-p.length,w.n)+' unvisited. Undo to back up.','warn');
  }else say(p.length+' of '+n+' '+w.n+'s visited.');
}
function spellHam(){
  const r=cur.inst.reads,p=cur.path;
  return p.length?r[p[0]]+p.slice(1).map(i=>r[i].slice(-1)).join(''):'';
}

/* ---------- edges fall (Eulerian, Königsberg) ---------- */
function usedSet(){return new Set(cur.b.walk.map(s=>s[0]));}
function moves(v,used){
  used=used||usedSet();const o=[];
  cur.E.forEach(e=>{if(used.has(e.id))return;
    if(e.from===v)o.push({e,to:e.to});else if(e.und&&e.to===v)o.push({e,to:e.from});});
  return o;
}
function stepFrom(i){const s=cur.b.walk[i],e=cur.E[s[0]];return s[1]===e.to?e.from:e.to;}
function anchors(){
  const used=usedSet(),on=new Set(cur.b.walk.map((_,i)=>stepFrom(i)));
  return [...on].filter(v=>moves(v,used).length>0);
}
function chainValid(){
  const b=cur.b;return b.walk.every((s,i)=>stepFrom(i)===(i?b.walk[i-1][1]:b.start));
}
function restSpot(){
  const b=cur.b;
  if(b.head===null)return null;
  if(cur.mode!=='konig')return perch(cur.pos[b.head]);
  const i=b.ins!==null?b.ins-1:b.walk.length-1;
  if(i>=0&&b.walk[i][1]===b.head)return inland(cur.E[b.walk[i][0]],b.head);
  return cur.inst.spots[b.head];
}
function snap(){cur.hist.push(JSON.stringify(cur.b));}
function take(mv){
  const b=cur.b,e=mv.e,from=b.head;
  snap();
  if(b.ins===null)b.walk.push([e.id,mv.to]);else{b.walk.splice(b.ins,0,[e.id,mv.to]);b.ins++;}
  b.head=mv.to;log('walk',{edge:e.read||e.id,detour:b.anchor!==null});
  if(cur.mode==='konig'){
    const near=from===e.from?e.p:e.q,far=from===e.from?e.q:e.p;
    runAnt([antAt||near,near,far,inland(e,mv.to)]);
  }else runAnt(curvePts(cur.pos[e.from],cur.pos[e.to],e.par));
  settleEul(true);render();
}
function eulClick(v,edgeId){
  const b=cur.b,N=cur.inst.nodes;
  if(b.start===null){
    if(v===undefined)return;
    snap();b.start=b.head=v;
    if(cur.firstPick===null)cur.firstPick=(v===cur.inst.start);
    log('start',{node:N[v]});setAnt(restSpot(),0);
    settleEul(true);return render();
  }
  const opts=moves(b.head);
  if(edgeId!==undefined){const mv=opts.find(o=>o.e.id===edgeId);if(mv)take(mv);return;}
  const mv=opts.find(o=>o.to===v);
  if(mv)return take(mv);
  if(!opts.length&&b.ins===null&&anchors().includes(v)){
    snap();b.ins=b.walk.findIndex((_,i)=>stepFrom(i)===v);b.anchor=v;b.head=v;cur.detours++;
    log('detour',{node:N[v]});
    const dest=cur.mode==='konig'?cur.inst.spots[v]:perch(cur.pos[v]);
    runAnt([antAt||dest,dest]);
    settleEul(true);return render();
  }
  if(v!==b.head){say('There is no standing edge from '+N[b.head]+' to '+N[v]+'.','warn');render();}
}
function settleEul(moved){
  const b=cur.b,N=cur.inst.nodes,total=cur.E.length,noU=!!cur.L.noUndo;
  if(b.start===null)return say(startMsg());
  /* A detour closes once it is back where it began with nowhere left to go. */
  if(b.ins!==null&&b.head===b.anchor&&moves(b.head).length===0){
    b.ins=null;b.anchor=null;b.head=b.walk[b.walk.length-1][1];
    if(moved){log('detour_closed',{});const d=restSpot();runAnt([antAt||d,d]);}
  }
  if(b.walk.length===total&&chainValid())return cur.L.pairs?beginPairCheck():complete();
  const left=total-b.walk.length,free=moves(b.head).length;
  if(free>0){
    say((b.anchor!==null?'Detour from '+N[b.anchor]+'. ':'')+b.walk.length+' of '+total+' edges crossed.');
  }else if(b.ins!==null){
    if(moved){cur.strands++;log('stranded',{at:N[b.head],left,detour:true});}
    say('This detour is stranded on '+N[b.head]+' and can’t get back to '+N[b.anchor]+'. '+
      (noU?'Restart, and think about where '+ANT+' should begin.':'Undo to back up.'),'warn');
  }else{
    if(moved){cur.strands++;log('stranded',{at:N[b.head],left});}
    const an=anchors().length,glow='click a glowing '+(cur.mode==='konig'?'piece of land':'node')+' to send '+ANT+' back there for a detour.';
    say(ANT+' is stranded on '+N[b.head]+' with '+plural(left,'edge')+' still standing. '+
      (noU?(an?cap(glow):'Restart.'):'Undo'+(an?', or '+glow:' or restart.')),'warn');
  }
}
function spellEul(){
  const b=cur.b,inst=cur.inst;
  if(cur.mode!=='eul'||b.start===null)return '';
  return inst.nodes[b.start]+b.walk.map(s=>cur.E[s[0]].read.slice(-1)).join('');
}

/* ---------- read-pairs: compare first, then separate paired node labels ---------- */
function pairMapLayout(inst){
  const pos=inst.nodes.map(()=>({x:0,y:0})),R={x:215,y:250};
  // the start, the repeated node, a six-edge loop over the top, a six-edge loop underneath, then the tail
  const path=[{x:70,y:250},R,
    {x:145,y:175},{x:145,y:100},{x:215,y:75},{x:285,y:100},{x:285,y:175},R,
    {x:285,y:325},{x:285,y:400},{x:215,y:425},{x:145,y:400},{x:145,y:325},R,
    {x:360,y:250},{x:440,y:190},{x:530,y:150},{x:625,y:170},{x:690,y:245},{x:650,y:335},{x:555,y:375}];
  pos[inst.start]=path[0];inst.edges.forEach((e,i)=>pos[e.to]=path[i+1]);return pos;
}
function beginPairCheck(){
  cur.phase='pairs';setAnt(null);log('pairs_revealed',{walk:cur.b.walk.map(s=>s[0]),spelled:spellEul(),bench:cur.inst.bench.slice()});
  say('Both walks use all '+numWord(cur.inst.reads.length)+' reads. Which string do the paired measurements support?');
}
const AB=i=>i?'B':'A';
function pairTape(c,i){
  const inst=cur.inst,p=inst.pairs[cur.pairSel],won=cur.pairWon,rightAt=inst.k+inst.d;
  const letters=[...c.text].map((ch,j)=>'<span class="'+(j>=inst.k-1?'loop'+inst.loopByEdge[c.walk[j-inst.k+1]]:'')+'">'+ch+'</span>').join('');
  // Once the question is settled, show the evidence: where the pair fits, and where its right-hand end fails.
  const off=!won?cur.pairOffsets[i]:i===won.cand?won.offset:Math.max(0,c.text.indexOf(p.left));
  const cell=(ch,j,right)=>{
    const cls=!won?'':i===won.cand?'ok':right&&c.text[off+rightAt+j]!==ch?'bad':'';
    return '<span'+(cls?' class="'+cls+'"':'')+'>'+ch+'</span>';
  };
  const stencil=[...p.left].map((ch,j)=>cell(ch,j,false)).join('')+'<span class="gap" aria-label="one unknown letter">·</span>'+[...p.right].map((ch,j)=>cell(ch,j,true)).join('');
  return '<div class="tape" style="--letters:'+c.text.length+'"><b>String '+AB(i)+'</b><div class="tapeletters" aria-label="'+c.text+'">'+letters+'</div>'+
    '<div class="pairstencil" id="stencil'+i+'" style="--offset:'+off+'" aria-label="'+p.left+', one unknown letter, '+p.right+'">'+stencil+'</div>'+
    (won?'<p class="verdict '+(i===won.cand?'ok':'bad')+'">'+(i===won.cand?'Both ends match here.':'The left-hand end sits here, but the right-hand end does not match.')+'</p>'
        :'<input type="range" min="0" max="'+(c.text.length-2*inst.k-inst.d)+'" step="1" value="'+cur.pairOffsets[i]+'" data-slide="'+i+'" aria-label="Slide pair under string '+AB(i)+'">'+
         '<button class="primary" data-answer="'+i+'">Choose string '+AB(i)+'</button>')+'</div>';
}
function renderPairWork(){
  const el=$('#pairwork'),active=cur.L.pairs&&cur.phase==='pairs';el.hidden=!active;
  if(!active){el.innerHTML='';return;}
  const inst=cur.inst,won=cur.pairWon;
  el.innerHTML='<p>The blue and purple stretches come from the two loops, taken in opposite orders. Each measured pair has four letters at each end and one unknown letter between them (k = 4, d = 1).</p>'+
    (won?'<p><b>This pair settles it.</b> It lines up under string '+AB(won.cand)+' and nowhere under string '+AB(1-won.cand)+'.</p>'
        :'<p>'+cap(numWord(inst.bench.length))+' of the '+numWord(inst.pairs.length)+' measured pairs are on the bench. Most of them fit both strings and so cannot distinguish them. Find the pair that lines up under only one string, slide it into place there, and choose that string.</p>')+
    '<label for="pairSelect">Read-pair </label><select id="pairSelect"'+(won?' disabled':'')+'>'+inst.bench.map(i=>{const p=inst.pairs[i];
      return '<option value="'+i+'"'+(i===cur.pairSel?' selected':'')+'>'+p.left+' · '+p.right+(cur.pairKnown[i]?' (fits both)':'')+'</option>';}).join('')+'</select>'+
    '<div class="pairscroll">'+inst.candidates.map(pairTape).join('')+'</div>';
}
function choosePairAnswer(i){
  if(cur.phase!=='pairs'||cur.pairWon)return;
  const inst=cur.inst,p=inst.pairs[cur.pairSel],fits=inst.candidates.map(c=>pairPositions(c.text,p,inst.k,inst.d));
  const lined=fits[i].includes(cur.pairOffsets[i]),decides=!fits[1-i].length;
  cur.pairTries++;
  log('pair_answer',{candidate:i,pair:cur.pairSel,offsets:cur.pairOffsets.slice(),lined,decides:lined&&decides});
  // No verdict is given away until the pair has actually been lined up under the chosen string.
  if(!lined){
    say('That pair is not lined up under string '+AB(i)+'. Slide it until both four-letter ends match the letters above, with one letter between them. If it cannot be lined up anywhere, it does not belong to that string.','warn');
    $('#status').textContent=cur.msg.text;$('#status').className='status '+cur.msg.kind;
    return;
  }
  if(!decides){
    const s=inst.pairStretch[cur.pairSel];
    cur.pairKnown[cur.pairSel]=true;
    say('It lines up here, and under string '+AB(1-i)+' as well: this pair fits both strings, so it cannot decide. Both of its ends come from '+
      (s===1?'the blue loop, and swapping the loops carries the whole pair along.':s===2?'the purple loop, and swapping the loops carries the whole pair along.'
       :'the stretch '+(s===0?'before':'after')+' both loops, which is the same in the two strings.')+' Try another pair.','warn');
  }else{
    cur.pairWon={cand:i,offset:cur.pairOffsets[i],pair:cur.pairSel};
    log('pair_resolved',{pair:cur.pairSel,tries:cur.pairTries});

/* ---------- round trip: balance a graph by adding edges ---------- */
function balEdges(){
  const base=cur.inst.edges,cnt={},all=[];
  base.forEach(e=>{const k=e.from+'>'+e.to;cnt[k]=(cnt[k]||0)+1;all.push({id:e.id,from:e.from,to:e.to,par:0,added:false});});
  cur.bal.added.forEach((e,i)=>{const k=e.from+'>'+e.to,par=cnt[k]||0;cnt[k]=par+1;
    all.push({id:base.length+i,from:e.from,to:e.to,par,added:true,idx:i});});
  return all;
}
function degOf(all){
  const n=cur.inst.nodes.length,out=Array(n).fill(0),inn=Array(n).fill(0);
  all.forEach(e=>{out[e.from]++;inn[e.to]++;});return {out,inn};
}
function balClick(v){
  const b=cur.bal,N=cur.inst.nodes;
  if(b.sel===null){b.sel=v;say('New edge leaving node '+N[v]+'. Click the node it should enter, or click '+N[v]+' again to cancel.');return render();}
  if(b.sel===v){b.sel=null;settleBal(false);return render();}
  b.added.push({from:b.sel,to:v});log('add_edge',{from:N[b.sel],to:N[v]});b.sel=null;
  settleBal(true);render();
}
function balRemove(i){
  const b=cur.bal,N=cur.inst.nodes,e=b.added.splice(i,1)[0];
  if(!e)return;
  log('remove_edge',{from:N[e.from],to:N[e.to]});settleBal(false);render();

function settleBal(moved){

  if(balanced){
    if(moved){cur.over=(cur.over||0)+1;log('balanced_over',{added:n});}

function plank(d,o){

  const t0=performance.now();
  const done=()=>{if(cur!==mine||cur.phase!=='intro')return;cur.phase='play';
    if(!S.intros.includes(cur.L.id)){S.intros.push(cur.L.id);save();}
    say(cards?'Click an island to set '+ANT+' down.':'Same reads, now on the edges. Click a node to set '+ANT+' down.');render();};
  const frame=now=>{if(cur!==mine)return;const t=(now-t0)/dur;if(t>=1)return done();frameFn(t);introRaf=requestAnimationFrame(frame);};
  introRaf=requestAnimationFrame(frame);
  setTimeout(done,dur+400); /* also finishes if the tab is hidden */
}

/* ---------- completion ---------- */
function grant(ids){
  let fresh=false;
  ids.forEach(id=>{if(!S.badges.includes(id)){S.badges.push(id);S.earnedAt[id]=cur.L.id;fresh=true;}});
  return fresh;
}
function award(ids,block){if(grant(ids))cur.blocks.push(block);}
function unlockNext(){markDone();if(cur.L.id<LEVELS.length)S.unlocked=Math.max(S.unlocked,cur.L.id+1);}
function complete(){
  const L=cur.L,m=cur.mode,eul=m==='eul';
  cur.done=true;
  if(L.id===1)award(['kmer','comp','strrec','assembly'],'problem');
  if(L.id===2)award(['node','edge','overlap'],'graph');
  if(L.id===3)award(['ham'],'ham');
  if(L.id===4)award(['np'],'np');
  if(m==='balance'){grant(['balance']);award(['balanced','cycle','adj'],'roundtrip');}
  if(eul){
    award(['euler'],'euler');
    if(L.id===7)award(['inout'],'inout');
    if(L.build)award(['debruijn'],'debruijn');
    if(L.nomap){grant(['balance']);cur.blocks.push('nomap');}
    else if(cur.firstPick){
      const k=cur.src.id+':'+cur.variant;
      if(!S.clean.includes(k))S.clean.push(k);
      if(S.clean.length>=2)award(['balance'],'balance');
    }
    if(cur.detours>=1&&cur.undos===0&&(L.noUndo||cur.restarts===0))award(['hier'],'hier');
    if(L.id===11){
      if(!S.badges.includes('hier'))cur.blocks.push('nohier');
      cur.blocks.push('finale');
    }
  }
  unlockNext();
  say(m==='cards'?'Every read used exactly once.':m==='balance'?'Every node is balanced. Watch '+ANT+' make the round trip.'
     :eul?'Every edge crossed exactly once.':'Every '+cur.w.n+' visited exactly once.','good');
  log('complete',{ms:Date.now()-cur.t0,undos:cur.undos,restarts:cur.restarts,strands:cur.strands,detours:cur.detours,
      firstPick:cur.firstPick,buildErrs:cur.buildErrs,misses:cur.nm?cur.nm.misses:undefined,
      added:cur.bal?cur.bal.added.length:undefined,earned:cur.blocks.slice()});
  if(m==='cards')return;
  /* victory lap: replay the route in gold, one letter per step */
  let route;
  if(m==='ham')route=cur.path.slice(1).map(v=>perch(cur.hamPos[v]));
  else if(m==='balance'){
    cur.E=balEdges();cur.bal.sel=null;
    cur.tour=eulerCycle(cur.inst.nodes.length,cur.E,cur.E[0].from);
    cur.lapOrder={};cur.tour.forEach((id,i)=>cur.lapOrder[id]=i+1);
    setAnt(perch(cur.pos[cur.E[cur.tour[0]].from]),0);
    route=cur.tour.map(id=>perch(cur.pos[cur.E[id].to]));
  }else route=cur.b.walk.map(s=>perch(cur.pos[s[1]]));
  const mine=cur;
  cur.lap=0;clearInterval(lapTimer);
  lapTimer=setInterval(()=>{
    if(cur!==mine)return clearInterval(lapTimer);
    cur.lap++;
    if(route[cur.lap-1])setAnt(route[cur.lap-1]);
    renderScene();renderAsm();
    if(cur.lap>=route.length){clearInterval(lapTimer);cur.lap=Infinity;}
  },m==='balance'?220:Math.max(60,Math.min(160,2600/Math.max(1,route.length))));
}
function giveUp(){           /* level 4: the wall */
  cur.done=true;cur.gave=true;award(['np'],'np');unlockNext();
  log('gave_up',{strands:cur.strands,placed:cur.path.length});
  say(ANT+' needs a different map.');render();
}
function prove(){            /* Königsberg: it cannot be done */
  cur.done=true;cur.proved=true;award(['degree'],'degree');unlockNext();
  log('impossible',{strands:cur.strands,undos:cur.undos,restarts:cur.restarts});
  say('It can’t be done.','good');render();
}
function picto(kind){
  if(kind==='equiv')return '<div class="equiv">'+
    '<svg viewBox="-30 -20 60 40" aria-hidden="true"><use href="#a-island" transform="scale(.62)"/></svg><span>island</span><b>= node</b>'+
    '<svg viewBox="0 0 60 40" aria-hidden="true"><path class="pl-base" d="M6,24Q30,8 50,20"/><path class="pl-top" marker-end="url(#mP)" d="M6,24Q30,8 50,20"/></svg><span>bridge</span><b>= edge</b></div>';
  const pts=[[12,30],[44,12],[76,30],[108,12]],ham=kind==='ham';
  let s='<svg viewBox="0 0 120 44" aria-hidden="true">';
  for(let i=0;i<3;i++)s+='<line class="pl'+(ham?'':' hot')+'" x1="'+pts[i][0]+'" y1="'+pts[i][1]+'" x2="'+pts[i+1][0]+'" y2="'+pts[i+1][1]+'"/>';
  pts.forEach(p=>{s+='<circle class="pn'+(ham?' hot':'')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="7"/>';});
  return '<div class="picto">'+s+'</svg>'+(ham?'every node once':'every edge once')+'</div>';
}
function srcCard(id){
  const s=SRC[id];
  return '<div class="src"><span class="tag">Primary source</span><a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+
    ': “'+s.title+'”</a> <span class="gmeta">'+s.where+'.</span><br>'+s.look+'</div>';
}
function renderPanel(){
  if(!cur.done){$('#panel').innerHTML='';return;}
  const m=cur.mode;
  let h='<div class="reveal"><h3>'+(cur.gave?'Stuck is the right answer':'Level '+cur.L.id+' complete')+'</h3>';
  if(m==='cards')h+='<p>Eight reads took trial and error. A real genome yields millions of reads.</p>';
  cur.blocks.forEach(id=>{
    const B=BLOCKS[id];
    h+='<div class="called">'+(B.pic?picto(B.pic):'')+'<p>'+(typeof B.html==='function'?B.html():B.html)+'</p></div>';
    if(id==='euler')h+='<div class="called">'+picto('ham')+'<p>Compare: before, the reads were the nodes and '+ANT+' had to visit each node once.</p></div>';
    (B.src||[]).forEach(s=>{h+=srcCard(s);});
  });
  if(m!=='konig'&&m!=='balance'&&!cur.gave&&!cur.L.pairs){
    const mine=m==='cards'?spellCards():m==='ham'?spellHam():spellEul();
    if(mine!==cur.inst.genome)h+='<p>The original DNA was <span class="mono">'+cur.inst.genome+'</span>. Yours is different but uses exactly the same reads. Both are valid, and an assembler cannot tell which is real.</p>';
  }
  if(cur.blocks.includes('paired')){
    const s=SRC.t2t;
    h+='<div class="wild"><span class="sub">In the wild</span><p>Repeats also challenged human-genome assembly. In 2022 the Telomere-to-Telomere Consortium used long reads to assemble the roughly 8% missing from the reference, including highly repetitive regions. The CHM13 assembly covered all autosomes and chromosome X; it did not include Y. Long reads and read-pairs provide different ways to connect sequence across repeats.</p>'+
       '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+': “'+s.title+'”</a> <span class="gmeta">'+s.where+'.</span></div>';
  }
  const missing=VOCAB.filter(x=>!S.badges.includes(x.id)).length;
  if(cur.L.id<LEVELS.length)h+='<button class="primary advance" id="next">Next level →</button>';
  else h+='<p>'+(missing?plural(missing,'vocabulary term')+' still hidden. Try a new puzzle on levels 6 to 11.'
     :'You have earned every term. The field guide below lists each one with its source.')+'</p>';
  $('#panel').innerHTML=h+'</div>';
}

/* ---------- chrome ---------- */
function colour(s,lit){return [...s].map((ch,i)=>'<span class="b'+ch+(i>=lit?' dim':'')+'">'+ch+'</span>').join('');}
function renderAsm(){
  const m=cur.mode,ph=cur.phase,bal=m==='balance';
  $('#asmrow').hidden=m==='konig'||ph==='build'||ph==='ask'||ph==='pairs'||ph==='split';
  $('#asm').hidden=bal;$('#adj').hidden=!bal;
  $('#asmlabel').textContent=ph==='paired'?'DNA supported by the pairs':bal?(S.badges.includes('adj')?'Adjacency list':'The same map, written as a list'):'DNA spelled so far';
  if(ph==='paired'){$('#asm').innerHTML=colour(cur.inst.genome,Infinity);return;}
  if(bal){
    const all=cur.done?cur.E:balEdges(),N=cur.inst.nodes;
    $('#adj').innerHTML=N.map((name,v)=>{
      const outs=all.filter(e=>e.from===v).sort((a,b)=>a.to-b.to||a.id-b.id);
      return '<div class="adjrow"><button class="adjn'+(cur.bal.sel===v?' on':'')+'" data-n="'+v+'" aria-label="Node '+name+'">'+name+'</button><span>→</span><span>'+
        outs.map(e=>e.added&&!cur.done?'<button class="adjnew" data-x="'+e.idx+'" title="Remove this new edge">'+N[e.to]+'</button>':'<span'+(e.added?' style="color:var(--good);font-weight:700"':'')+'>'+N[e.to]+'</span>')
            .join(', ')+'</span></div>';
    }).join('');
    return;
  }
  const s=ph!=='play'?'':m==='cards'?spellCards():m==='ham'?spellHam():spellEul();
  $('#asm').innerHTML=colour(s,cur.done&&m!=='cards'?(cur.inst.k-1)+cur.lap+(m==='ham'?1:0):Infinity)||'&nbsp;';
}
function renderScene(){
  const m=cur.mode,ph=cur.phase,tray=m==='cards'||ph==='build'||ph==='ask';
  $('#cardView').hidden=!tray;
  $('#map').style.display=m==='cards'||ph==='ask'?'none':'';
  $('#map').classList.toggle('building',ph==='build');
  if(tray)renderTray();
  if(ph==='paired')return pairSplitFrame(1);
  if(ph==='split')return pairSplitFrame(0);
  if(m==='cards'||ph==='ask'||ph==='intro')return;
  if(ph==='pre')return cur.L.intro==='cards'?cardsFrame(0):drawHam(true);
  if(ph==='build')return drawBuild();
  if(m==='ham')drawHam(false);
  else if(m==='konig')drawKonig();
  else if(m==='balance')drawBalance();
  else drawEul();
}
function renderHeader(){
  $('#pips').innerHTML=LEVELS.map(l=>'<button data-lvl="'+l.id+'"'+' class="'+(l.id===cur.L.id?'on':'')+(S.done.includes(l.id)?' fin':'')+'"'+(l.id===cur.L.id?' aria-current="true"':'')+
    ' aria-label="Level '+l.id+(S.done.includes(l.id)?' (finished)':'')+'">'+l.id+'</button>').join('');
  $('#badges').innerHTML=VOCAB.map(x=>S.badges.includes(x.id)
    ?'<span class="badge got term" tabindex="0">'+x.name+'<span class="tip" role="tooltip"><b>'+x.name+'</b>'+x.def+'</span></span>'
    :'<span class="badge">? ? ?</span>').join('');
}
function renderGuide(){
  const got=VOCAB.filter(v=>S.badges.includes(v.id));
  $('#gcount').textContent=got.length+' of '+VOCAB.length+' terms';
  $('#guideBody').innerHTML='<p class="gmeta">Bridge Walker field guide · puzzle code '+esc(S.seed)+' · '+got.length+' of '+VOCAB.length+' terms earned</p>'+
    got.map(v=>{
      const s=v.src&&SRC[v.src];
      return '<div class="gentry"><h4>'+v.name+'</h4><p>'+v.def+'</p><p class="gmeta">Met in level '+(S.earnedAt[v.id]||'?')+
        (s?' · Source: <a href="'+s.url+'" target="_blank" rel="noopener">'+s.cite+', “'+s.title+'”</a>':'')+
        (v.code?' · Code it: <a href="https://rosalind.info/problems/'+v.code.toLowerCase()+'/" target="_blank" rel="noopener">Rosalind '+v.code+'</a>':'')+'</p></div>';
    }).join('')+
    (got.length?'<p style="margin-top:10px"><button id="printGuide">Print field guide</button></p>':'<p class="gmeta">Nothing yet. Finish level 1.</p>');
}
function ruleText(){
  const m=cur.mode,w=cur.w,ph=cur.phase;
  if(ph==='pairs')return 'Same single reads · two possible strings';
  if(ph==='split'||ph==='paired')return 'Pair of prefixes → pair of suffixes';
  if(m==='cards')return 'Chain the reads · use every read once';
  if(ph==='build')return 'One read, one edge · first three letters → last three';
  if(ph==='ask')return 'No map yet · where must '+ANT+' start?';
  if(ph!=='play')return cur.L.intro==='cards'?'Eight shredded reads':'Reads on the nodes … for now';
  if(m==='ham')return cap(w.n)+'s sink behind '+ANT+' · visit every '+w.n+' once';
  if(m==='balance')return 'Balance every node · add the fewest edges';
  return 'Edges fall behind '+ANT+' · cross every edge once'+(cur.L.noUndo?' · no undo':'');
}
function renderControls(){
  const m=cur.mode,ph=cur.phase,play=ph==='play',noU=!!cur.L.noUndo&&play;
  let nothing=true;
  if(ph==='build')nothing=!cur.bd.hist.length;
  else if(!play)nothing=true;
  else if(m==='cards')nothing=!cur.chain.length;
  else if(m==='ham')nothing=!cur.path.length;
  else if(m==='balance')nothing=!cur.bal.added.length&&cur.bal.sel===null;
  else nothing=!cur.hist.length;
  $('#undo').hidden=noU||['pairs','split','paired'].includes(ph);
  $('#restart').hidden=['pairs','split','paired'].includes(ph);
  $('#undo').disabled=$('#restart').disabled=cur.done||nothing;
  $('#fresh').disabled=m==='konig'||ph==='intro'||ph==='split';
  const cnt=play&&(m==='eul'||m==='konig'||m==='balance');
  $('#countsLabel').hidden=!cnt;
  $('#countsLabel').classList.toggle('nudge',cnt&&m!=='balance'&&!cur.done&&!$('#counts').checked&&(cur.restarts>=2||cur.strands>=2));
  $('#fogLabel').hidden=m!=='balance';
  const sk=$('#skip');let label='';
  if(ph==='pre')label=cur.L.intro==='cards'?'Put the reads on a map':'Turn every node into an edge';
  else if(ph==='ask'&&cur.nm.cand!==null)label='Set '+ANT+' down on '+cur.inst.nodes[cur.nm.cand];
  else if(ph==='pairs'&&cur.pairWon)label='Add each partner’s letters to the node names';
  else if(cur.L.id===4&&!cur.done&&(cur.skipOK||cur.strands>=3))label='This is hopeless. Change the map →';
  else if(m==='konig'&&!cur.done&&(cur.skipOK||cur.strands>=2))label='It can’t be done';
  sk.hidden=!label;sk.textContent=label;
}
function render(){
  renderHeader();
  $('#title').textContent='Level '+cur.L.id+': '+cur.L.title;
  $('#brief').textContent=cur.L.brief;
  $('#rule').textContent=ruleText();
  renderScene();renderAsm();renderPairWork();
  $('#status').textContent=cur.msg.text;$('#status').className='status '+cur.msg.kind;
  /* while drawing the map, repeat the message right above it, where the eyes are */
  const sm=$('#stagemsg');sm.hidden=cur.phase!=='build';sm.textContent=cur.msg.text;sm.className='stagemsg '+cur.msg.kind;
  renderControls();renderPanel();renderGuide();
}

function undo(){
  if(cur.done)return;
  const m=cur.mode,ph=cur.phase;
  if(ph==='build'){
    const bd=cur.bd;if(!bd.hist.length)return;
    const s=JSON.parse(bd.hist.pop());bd.pos=s.pos;bd.placed=s.placed;bd.sel=s.sel;bd.start=s.start;cur.pos=bd.pos;
    cur.buildUndos++;log('build_undo');
    say(bd.sel===null?buildCount():bd.start?cur.inst.reads[bd.sel]+': now click where it ends.':'Drawing '+cur.inst.reads[bd.sel]+': click where its edge starts.');
    return render();
  }
  if(ph!=='play')return;
  if(m==='cards'){if(!cur.chain.length)return;cur.chain.pop();cur.undos++;log('undo');settleCards(false);}
  else if(m==='ham'){
    if(!cur.path.length)return;cur.path.pop();cur.undos++;log('undo');
    const h=cur.path[cur.path.length-1];setAnt(h===undefined?null:perch(cur.hamPos[h]));settleHam(false);
  }else if(m==='balance'){
    const b=cur.bal;
    if(b.sel!==null)b.sel=null;else if(b.added.length){b.added.pop();log('undo');}else return;
    settleBal(false);
  }else{
    if(cur.L.noUndo||!cur.hist.length)return;
    cur.b=JSON.parse(cur.hist.pop());cur.undos++;log('undo');
    setAnt(restSpot());settleEul(false);
  }
  render();
}
function restart(){
  if(cur.done)return;
  const m=cur.mode,ph=cur.phase;
  if(ph==='build'){cur.bd=freshBuild();cur.pos=cur.bd.pos;cur.buildUndos++;log('build_restart');say('Pick a read from the tray to begin.');return render();}
  if(ph!=='play')return;
  cur.restarts++;log('restart');setAnt(null);
  if(m==='cards'){cur.chain=[];settleCards(false);}
  else if(m==='ham'){cur.path=[];settleHam(false);}
  else if(m==='balance'){cur.bal={added:[],sel:null};settleBal(false);}
  else{cur.b=freshWalk();cur.hist=[];settleEul(false);}
  render();
}
function nodeClick(v){
  if(cur.done)return;
  if(cur.phase==='build')return buildClick(v);
  if(cur.phase!=='play'||cur.mode==='cards')return;
  if(cur.mode==='ham')hamClick(v);
  else if(cur.mode==='balance')balClick(v);
  else eulClick(v);
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-answer],[data-card],[data-chain],[data-pick],[data-cand],[data-x],[data-e],[data-n],[data-lvl],[data-water],#next,#printGuide');
  if(!t)return;
  const d=t.dataset;
  if(d.answer!==undefined)choosePairAnswer(+d.answer);
  else if(d.card!==undefined)cardClick(+d.card);
  else if(d.chain!==undefined){if(cur.mode==='cards'&&+d.chain===cur.chain.length-1)undo();}
  else if(d.pick!==undefined)buildPick(+d.pick);
  else if(d.cand!==undefined)candClick(+d.cand);
  else if(d.x!==undefined){if(!cur.done&&cur.mode==='balance')balRemove(+d.x);}
  else if(d.e!==undefined){if(!cur.done&&cur.phase==='play'&&(cur.mode==='eul'||cur.mode==='konig'))eulClick(undefined,+d.e);}
  else if(d.n!==undefined)nodeClick(+d.n);
  else if(d.lvl!==undefined)loadLevel(+d.lvl);
  else if(d.water!==undefined){if(!cur.done&&cur.phase==='build')buildClick(undefined,svgPoint(ev));}
  else if(t.id==='next')loadLevel(cur.L.id+1);
  else if(t.id==='printGuide'){$('#guide').open=true;window.print();}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='pairSelect'&&cur.phase==='pairs'&&!cur.pairWon){
    cur.pairSel=+ev.target.value;renderPairWork();$('#pairSelect').focus();
    say('Compare both ends of this pair on each string.');$('#status').textContent=cur.msg.text;$('#status').className='status';
    log('pair_selected',{pair:cur.pairSel});
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.dataset.slide!==undefined&&cur.phase==='pairs'&&!cur.pairWon){
    const i=+ev.target.dataset.slide;cur.pairOffsets[i]=+ev.target.value;
    $('#stencil'+i).style.setProperty('--offset',cur.pairOffsets[i]);
  }
});
document.addEventListener('keydown',ev=>{
  const t=ev.target.closest&&ev.target.closest('g[data-n]');
  if(t&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();nodeClick(+t.dataset.n);
    const again=document.querySelector('g[data-n="'+t.dataset.n+'"]');if(again)again.focus();}
});
$('#undo').onclick=undo;
$('#restart').onclick=restart;
$('#fresh').onclick=()=>{S.variants[cur.src.id]=(S.variants[cur.src.id]||0)+1;log('new_puzzle');save();loadLevel(cur.L.id);};
$('#counts').onchange=()=>{log('counts',{on:$('#counts').checked});render();};
$('#fog').onchange=()=>{log('fog',{on:$('#fog').checked});render();};
$('#skip').onclick=()=>{
  if(cur.phase==='pre')runIntro();
  else if(cur.phase==='ask')askSubmit();
  else if(cur.phase==='pairs'&&cur.pairWon)runPairSplit();
  else if(cur.L.id===4)giveUp();
  else if(cur.mode==='konig')prove();
};
/* progress link: the box, the copy buttons, and a pasted link in a tab that is already open */
if(TRANSIENT)$('#savebar').hidden=true;
else{
  if(linkNote)topNote(linkNote,false);
  /* the link has been read: take it (and any ?seed= it overrode) out of the address */
  if(linkText){try{const q=new URLSearchParams(location.search);q.delete('seed');const qs=q.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));}catch(e){}}
  linkLive=true;
  $('#saveLink').onclick=()=>{const b=$('#saveLink');if(b.select)b.select();};
  $('#copyLink').onclick=$('#copyLinkTop').onclick=()=>{
    const b=$('#saveLink'),tell=(text,again)=>{$('#saveNote').textContent=text;topNote(text,again);},
      ok=()=>tell('Copied. The link changes when you earn a term, so copy it again before you leave.',false),
      byHand=()=>{if(b.select)b.select();let done=false;try{done=document.execCommand('copy');}catch(e){}
        if(done)ok();else tell('Could not copy. Select the link in the box at the bottom of this page and copy it by hand.',true);};
    if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(b.value).then(ok,byHand);else byHand();
  };
  window.addEventListener&&window.addEventListener('hashchange',()=>{if(/^#save=/.test(location.hash))location.reload();});
}
$('#seed').value=S.seed;
$('#setSeed').onclick=()=>{const v=$('#seed').value.trim();if(!v||v===S.seed)return;S=freshState(v);save();cur=null;loadLevel(previewLevel||1);};
$('#dl').onclick=()=>{
  const blob=new Blob([JSON.stringify({game:'bridge-walker',version:5,seed:S.seed,exported:new Date().toISOString(),
    unlocked:S.unlocked,finished:S.done,vocabulary:S.badges,earnedAt:S.earnedAt,events:S.log},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bridge-walker-'+S.seed.replace(/[^\w-]/g,'_')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

loadLevel(previewLevel||resumeLevel());
/* Test handle, only with ?debug=1 in the address. */
if(params.get('debug'))window.__bw={state:()=>cur,saved:()=>S,nodeClick,cardClick,loadLevel,morphFrame,cardsFrame,
  buildPick,buildClick,candClick,balRemove,choosePairAnswer,pairSplitFrame,skip:()=>$('#skip').click(),
  levels:()=>LEVELS.map(l=>({id:l.id,title:l.title})),vocab:()=>VOCAB.map(v=>({id:v.id,name:v.name}))};
})();
</script>
